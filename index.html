deonun kuralına göre Kur'an'ın kendisi \"bir kopyanın kopyası\" olurdu. İsa'nın da bir kitap bırakmadığını söylemek işe yaramaz: Hristiyanlar hiçbir zaman İsa'nın bir kitap yazdırdığını söylemedi; İncil, O'nun gönderdiği elçilerin tanıklığıdır. Müslümanlar ise Kur'an'ın kelimesi kelimesine gökten inmiş bir kitap olduğunu söyler, buna rağmen Muhammed onu toplanmış olarak bırakmadan öldü.\n• *Gerçek kopyanın kopyası hadislerdir:* İsa ile Markos arasında sadece bir kişi var. Hadislerde ise \"falanca, filancadan duydu, o bir başkasından duydu, o da bir başkasından duydu, o da Muhammed'den duydu\" vardır; Buhari'ninki gibi koleksiyonlardan önce 200 yıldan fazla kuşaktan kuşağa geçen birçok kişilik bir zincir.\n• *Kur'an, Hristiyanların reddettiği kitaplardaki hikâyeleri kullanır:* İsa'nın kilden kuşlar yapıp onlara üfleyerek can vermesi (3:49 ve 5:110), çocuk İsa'ya ait bir hikâye olarak 2. yüzyıldan kalma \"Tomas'ın Çocukluk İncili\"nde zaten vardı; Meryem'in Tapınak'ta büyütülüp gökten yiyecek alması (3:37) da yine 2. yüzyıldan kalma \"Yakup'un İlk İncili\"nde zaten vardı. Bunlar, başta gösterdiklerim gibi Tomas'ın ve Yakup'un adlarını kullanan sahte kitaplardır ve Hristiyanlar onları hiçbir zaman Kutsal Yazı olarak kabul etmedi: Eski kiliselerin, Muhammed'den yüzyıllar önce yaptığı Kutsal Kitap listelerinin hiçbirinde yer almazlar. Bunların doğru gelenekler olduğunu söylemek de işe yaramaz: Bu kitaplar İsa'dan yüz yıldan fazla sonra, hiçbir tanık olmadan yazıldı ve tam da uydurma oldukları için reddedildi. Video Matta'yı bir elçinin anlatımını kullanmakla suçluyor, ama Kur'an Hristiyanların sahte olduğunu bildiği kitapları kullanıyor.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "research", "n": 117, "id": "p117", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Marcos e Pedro", "text": "Os escritores cristãos antigos dizem que o Evangelho de Marcos foi escrito a partir da pregação de Pedro?"}, {"label": "Onde Mateus não estava", "text": "Em alguns momentos, como na Transfiguração, Jesus levou só Pedro, Tiago e João, e deixou os outros apóstolos de fora?"}, {"label": "Dois nomes", "text": "Ter dois nomes era comum entre os judeus do século 1, como José, chamado Barnabé (Atos 4:36), e Simão, chamado Pedro?"}, {"label": "O cobrador de impostos", "text": "No Evangelho de Mateus, o cobrador de impostos que Jesus chama se chama Mateus (Mateus 9:9), e na lista dos apóstolos esse Evangelho chama Mateus de 'o cobrador de impostos' (Mateus 10:3)?"}, {"label": "90%", "text": "É verdade que mais de um terço do Evangelho de Mateus não está em Marcos?"}, {"label": "As vergonhas de Pedro", "text": "Faria sentido os seguidores de Pedro, que o tinham como líder, inventarem que Jesus o chamou de 'Satanás' (Marcos 8:33) e que ele negou Jesus três vezes, jurando que nem O conhecia (Marcos 14:66-72)? Por que os historiadores consideram esse tipo de relato difícil de ter sido inventado?"}, {"label": "Zayd", "text": "Segundo Bukhari 4986, Umar teve medo de que grande parte do Alcorão se perdesse, e Zayd achou o final da surata 9 com Abu Khuzayma e com mais ninguém. Isso é verdade?"}, {"label": "Hadith", "text": "A coleção de hadith de Bukhari foi feita mais de 200 anos depois de Muhammad?"}, {"label": "Pássaros de barro", "text": "É verdade que a história de Jesus dando vida a pássaros de barro (Alcorão 3:49) não existe no século 1, surge no apócrifo 'Evangelho da Infância de Tomé' (século 2), rejeitado pelos cristãos antigos com base em João 2:11, foi traduzida para o siríaco antes do Islã, e que para a maioria dos historiadores a explicação mais provável é que o Alcorão absorveu essa tradição apócrifa que já circulava no Oriente Médio?"}, {"label": "Maria no Templo", "text": "É verdade que a história de Maria vivendo no Templo e recebendo comida do céu (Alcorão 3:37) não existe no século 1, surge no apócrifo 'Protoevangelho de Tiago' (século 2), que tem erros históricos sobre o Templo judaico, circulava em siríaco antes do Islã, e que para a maioria dos historiadores a explicação mais provável é que o Alcorão absorveu essa tradição apócrifa que já circulava no Oriente Médio?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Markos ve Petrus", "text": "Eski Hristiyan yazarlar, Markos İncili'nin Petrus'un vaazından yazıldığını söylüyor mu?"}, {"label": "Matta'nın olmadığı yerler", "text": "Bazı anlarda, örneğin İsa'nın görünümünün değiştiği dağda, İsa sadece Petrus'u, Yakup'u ve Yuhanna'yı yanına alıp diğer elçileri dışarıda bıraktı mı?"}, {"label": "İki ad", "text": "1. yüzyıl Yahudileri arasında, Barnaba denen Yusuf (Elçilerin İşleri 4:36) ve Petrus denen Simun gibi iki ad taşımak yaygın mıydı?"}, {"label": "Vergi görevlisi", "text": "Matta İncili'nde İsa'nın çağırdığı vergi görevlisinin adı Matta mı (Matta 9:9) ve bu İncil elçilerin listesinde Matta'ya 'vergi görevlisi' diyor mu (Matta 10:3)?"}, {"label": "%90", "text": "Matta İncili'nin üçte birinden fazlasının Markos'ta olmadığı doğru mu?"}, {"label": "Petrus'un utançları", "text": "Petrus'u önder olarak gören takipçilerinin, İsa'nın ona 'Şeytan' dediğini (Markos 8:33) ve onun İsa'yı tanımadığına yemin ederek O'nu üç kez inkâr ettiğini (Markos 14:66-72) uydurması mantıklı olur mu? Tarihçiler neden bu tür anlatımların uydurulmuş olmasını zor görür?"}, {"label": "Zeyd", "text": "Buhari 4986'ya göre Ömer, Kur'an'ın büyük bir kısmının kaybolmasından korktu ve Zeyd, Tevbe suresinin sonunu Ebu Huzeyme'de buldu, başka hiç kimsede bulmadı. Bu doğru mu?"}, {"label": "Hadis", "text": "Buhari'nin hadis koleksiyonu Muhammed'den 200 yıldan fazla sonra mı yapıldı?"}, {"label": "Kilden kuşlar", "text": "İsa'nın kilden kuşlara can vermesi hikâyesinin (Kur'an 3:49) 1. yüzyılda bulunmadığı, ilk olarak 2. yüzyıldan kalma apokrif 'Tomas'ın Çocukluk İncili'nde ortaya çıktığı, bu kitabın eski Hristiyanlar tarafından Yuhanna 2:11'e dayanarak reddedildiği, İslam'dan önce Süryaniceye çevrildiği ve tarihçilerin çoğuna göre en olası açıklamanın, Kur'an'ın Orta Doğu'da zaten dolaşan bu apokrif geleneği benimsemesi olduğu doğru mu?"}, {"label": "Tapınak'ta Meryem", "text": "Meryem'in Tapınak'ta yaşayıp gökten yiyecek alması hikâyesinin (Kur'an 3:37) 1. yüzyılda bulunmadığı, ilk olarak 2. yüzyıldan kalma apokrif 'Yakup'un İlk İncili'nde ortaya çıktığı, bu kitabın Yahudi Tapınağı hakkında tarihsel hatalar içerdiği, İslam'dan önce Süryanice dolaştığı ve tarihçilerin çoğuna göre en olası açıklamanın, Kur'an'ın Orta Doğu'da zaten dolaşan bu apokrif geleneği benimsemesi olduğu doğru mu?"}]}}, {"k": "trans", "n": 121, "id": "p121", "pt": "Vamos ao próximo erro.", "tr": "Bir sonraki hataya geçelim.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 122, "id": "p122", "pt": "❌ *O que o vídeo diz:* duas coisas. Primeiro, que não havia escribas ao redor de Jesus anotando os seus sermões palavra por palavra. Segundo, que os 27 livros do Novo Testamento levam nomes de pessoas famosas, mas que, segundo \"a maioria dos estudiosos\", só 7 foram escritos de verdade por quem leva o nome: 7 cartas de Paulo.", "tr": "❌ *Videonun söylediği:* iki şey. Birincisi, İsa'nın etrafında vaazlarını kelimesi kelimesine kaydeden kâtipler olmadığı. İkincisi, Yeni Antlaşma'nın 27 kitabının ünlü kişilerin adlarını taşıdığı, ama \"araştırmacıların çoğuna\" göre bunlardan sadece 7'sinin, yani Pavlus'un 7 mektubunun, gerçekten adını taşıyan kişi tarafından yazıldığı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": true}, {"k": "para", "n": 123, "id": "p123", "pt": "Aqui o vídeo mistura coisas diferentes para enganar quem não conhece o assunto. Ele quer que o senhor pense que ninguém guardou as palavras de Jesus, e que o Novo Testamento está cheio de livros com nome falso. As duas coisas são falsas, e mesmo o pouco que os mais céticos aceitam já destrói o Islã. Vamos às provas:", "tr": "Burada video, konuyu bilmeyenleri kandırmak için farklı şeyleri birbirine karıştırıyor. Kimsenin İsa'nın sözlerini korumadığını ve Yeni Antlaşma'nın sahte isimli kitaplarla dolu olduğunu düşünmenizi istiyor. İkisi de yanlış ve en şüphecilerin kabul ettiği az şey bile İslam'ı yıkıyor. Delillere geçelim:", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 124, "id": "p124", "pt": "✅ *Prova 1: ninguém precisava de um escriba anotando palavra por palavra.*\nNenhum mestre judeu daquela época tinha alguém anotando os seus sermões palavra por palavra. Os ensinos eram guardados de outro jeito, como já mostrei: os discípulos eram treinados para decorar os ensinos do mestre, e Jesus ensinava com frases e parábolas fáceis de guardar. E mesmo assim havia quem soubesse escrever perto de Jesus: Mateus era cobrador de impostos, uma profissão de quem sabia ler, escrever e fazer registros. E Lucas conta que, antes dele, muitos já tinham posto por escrito a história de Jesus.", "tr": "✅ *1. delil: Kelimesi kelimesine yazan bir kâtibe ihtiyaç yoktu.*\nO dönemin hiçbir Yahudi öğretmeninin vaazlarını kelimesi kelimesine yazan biri yoktu. Öğretiler başka bir şekilde korunurdu, daha önce gösterdiğim gibi: Öğrenciler öğretmenlerinin öğretilerini ezberlemek üzere yetiştirilirdi ve İsa akılda kalması kolay cümlelerle ve benzetmelerle öğretirdi. Buna rağmen İsa'nın yanında yazı bilen kişiler de vardı: Matta vergi görevlisiydi; bu, okuma, yazma ve kayıt tutma bilen birinin mesleğiydi. Luka da kendisinden önce birçok kişinin İsa'nın hikâyesini yazıya geçirdiğini anlatır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 125, "id": "p125", "pt": "✅ *Prova 2: os Evangelhos não usam \"nomes de pessoas famosas\" para enganar.*\nO vídeo começa com uma mentira. Como já provei no começo, o nome de cada Evangelho está no título, em todos os manuscritos em que o título sobreviveu, e é sempre o mesmo: Mateus, Marcos, Lucas e João. E se a ideia fosse usar nomes famosos para enganar, por que escolher Marcos e Lucas? Eles nem eram apóstolos: eram ajudantes, que aparecem poucas vezes no Novo Testamento. Quem inventa usa nomes famosos, como fizeram os livros falsos de Pedro, de Tomé e de Judas. Os quatro Evangelhos levam os nomes dos seus autores de verdade.", "tr": "✅ *2. delil: İnciller insanları kandırmak için \"ünlü kişilerin adlarını\" kullanmaz.*\nVideo bir yalanla başlıyor. Başta kanıtladığım gibi, her İncil'in adı, başlığın korunduğu bütün el yazmalarında başlıkta yer alır ve hep aynıdır: Matta, Markos, Luka ve Yuhanna. Amaç kandırmak için ünlü isimler kullanmak olsaydı, neden Markos ve Luka seçilsin? Onlar elçi bile değildi: Yeni Antlaşma'da sadece birkaç kez geçen yardımcılardı. Uyduran kişi ünlü isimler kullanır; Petrus'un, Tomas'ın ve Yahuda'nın adını taşıyan sahte kitapların yaptığı gibi. Dört İncil, gerçek yazarlarının adlarını taşır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 126, "id": "p126", "pt": "✅ *Prova 3: de onde vem esse \"7\", e por que ele não se sustenta.*\nExistem 13 cartas com o nome de Paulo. Os estudiosos mais céticos dividem essas cartas em dois grupos: 7 que eles aceitam e 6 que eles chamam de \"disputadas\", por causa de diferenças de vocabulário, de estilo e de assunto, como a organização das igrejas. Veja por que eles estão errados:\n• *Paulo usava secretários.* Numa carta que todos aceitam, quem segurava a pena se apresenta: \"Eu, Tércio, que escrevi esta carta\" (Romanos 16:22). E Paulo assinava no final com a própria mão (1 Coríntios 16:21 e Gálatas 6:11). Secretários diferentes, palavras diferentes. Pedro fez o mesmo: escreveu \"por meio de Silvano\" (1 Pedro 5:12).\n• *Assuntos diferentes pedem palavras diferentes.* As cartas a Timóteo e a Tito falam de como organizar as igrejas e escolher líderes. É claro que usam palavras que não aparecem numa carta sobre outro assunto. Qualquer pessoa usa palavras diferentes quando muda de assunto: ninguém fala de como escolher líderes com as mesmas palavras que usa para explicar a fé. E Paulo escreveu durante uns 15 anos: o jeito de escrever de qualquer pessoa muda com o tempo.\n• *Até as contagens de palavras se contradizem.* Os estudos que comparam o estilo das cartas por estatística chegam a resultados diferentes, conforme o método usado. Um dos mais conhecidos, feito em Oxford, não achou motivo para separar 12 das 13 cartas.\n• *Essas cartas citam pessoas, viagens e detalhes reais*, e foram mandadas a igrejas que conheciam Paulo pessoalmente, e a Timóteo e a Tito, que trabalhavam com ele. Pense: como alguém enganaria uma igreja inteira com uma carta falsa de um homem que ela conhecia, cheia de nomes de pessoas que ela também conhecia?\n• *A igreja antiga punia quem falsificava.* Tertuliano conta que um presbítero da Ásia que escreveu um livro inventado sobre Paulo foi tirado do cargo por isso, mesmo dizendo que tinha feito \"por amor a Paulo\". Pense: uma igreja que tirava do cargo quem inventava histórias sobre Paulo ia aceitar cartas falsas no nome dele?\n• *E a igreja era honesta quando não sabia.* Com a carta aos Hebreus, as igrejas registraram a dúvida, e Orígenes escreveu que só Deus sabe quem a escreveu. Se a igreja inventasse autores, teria inventado um para Hebreus também.\nOu seja: o \"só 7\" não vem de nenhum manuscrito com outro nome, nem de nenhum escritor antigo que tenha dado outro autor a essas cartas. Vem só de comparações de palavras e de estilo feitas quase 1.800 anos depois, por quem não soube pensar no óbvio: secretários diferentes, assuntos diferentes, anos diferentes, palavras diferentes. Isso não é ciência, é falta de raciocínio.", "tr": "✅ *3. delil: Bu \"7\" nereden geliyor ve neden ayakta durmuyor.*\nPavlus'un adını taşıyan 13 mektup var. En şüpheci araştırmacılar bu mektupları, kelime, üslup ve kiliselerin düzeni gibi konu farkları yüzünden iki gruba ayırır: kabul ettikleri 7 mektup ve \"tartışmalı\" dedikleri 6 mektup. Neden yanıldıklarına bakın:\n• *Pavlus kâtipler kullanırdı.* Herkesin kabul ettiği bir mektupta kalemi tutan kişi kendini tanıtır: \"Bu mektubu yazan ben Tertius\" (Romalılar 16:22). Pavlus da mektubun sonunu kendi eliyle imzalardı (1 Korintliler 16:21 ve Galatyalılar 6:11). Farklı kâtipler, farklı kelimeler. Petrus da aynısını yaptı: \"Silvanus aracılığıyla\" yazdı (1 Petrus 5:12).\n• *Farklı konular farklı kelimeler gerektirir.* Timoteos'a ve Titus'a yazılan mektuplar kiliselerin nasıl düzenleneceğini ve önderlerin nasıl seçileceğini anlatır. Başka bir konudaki mektupta geçmeyen kelimeler kullanmaları çok doğaldır. Konu değişince herkes farklı kelimeler kullanır: Kimse önderlerin nasıl seçileceğini, imanı açıklarken kullandığı kelimelerle anlatmaz. Ayrıca Pavlus yaklaşık 15 yıl boyunca yazdı: Herkesin yazış biçimi zamanla değişir.\n• *Kelime sayımları bile birbiriyle çelişiyor.* Mektupların üslubunu istatistikle karşılaştıran çalışmalar, kullanılan yönteme göre farklı sonuçlara varıyor. Bunların en bilinenlerinden biri, Oxford'da yapılmış olanı, 13 mektuptan 12'sini ayırmak için hiçbir sebep bulmadı.\n• *Bu mektuplar gerçek kişilerden, yolculuklardan ve ayrıntılardan bahseder* ve Pavlus'u şahsen tanıyan kiliselere ve onunla birlikte çalışan Timoteos'a ve Titus'a gönderildi. Düşünün: Biri, bir kiliseyi, tanıdığı bir adam adına yazılmış ve yine tanıdığı kişilerin adlarıyla dolu sahte bir mektupla nasıl kandırabilirdi?\n• *Eski kilise sahtekârları cezalandırırdı.* Tertullianus, Asya'da Pavlus hakkında uydurma bir kitap yazan bir presbiterin, bunu \"Pavlus'a olan sevgisinden\" yaptığını söylemesine rağmen görevinden alındığını anlatır. Düşünün: Pavlus hakkında hikâye uyduranı görevinden alan bir kilise, onun adına yazılmış sahte mektupları kabul eder miydi?\n• *Kilise bilmediğinde de dürüsttü.* İbraniler'e mektup için kiliseler şüphelerini kaydetti ve Origenes, onu kimin yazdığını sadece Tanrı'nın bildiğini yazdı. Kilise yazar uyduruyor olsaydı, İbraniler için de bir yazar uydururdu.\nYani \"sadece 7\", başka bir isim taşıyan hiçbir el yazmasından ya da bu mektupları başka bir yazara veren hiçbir eski yazardan gelmiyor. Sadece neredeyse 1.800 yıl sonra, apaçık olanı düşünemeyenlerin yaptığı kelime ve üslup karşılaştırmalarından geliyor: Farklı kâtipler, farklı konular, farklı yıllar, farklı kelimeler. Bu bilim değil, düşünme eksikliğidir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 127, "id": "p127", "pt": "✅ *Prova 4: a conta de verdade é 26 de 27.*\nO vídeo quer que o senhor pense que só sabemos quem escreveu 7 livros. Agora veja a conta real dos 27:\n• *Os 4 Evangelhos e Atos:* quem escreveu cada um já foi provado no começo deste texto, pela cadeia de provas.\n• *As 13 cartas de Paulo:* todas começam com o nome dele, foram recebidas como dele em todas as regiões desde o século 2, e nenhum escritor antigo deu outro autor a elas.\n• *As cartas de Tiago, de Pedro, de João e de Judas e o Apocalipse:* chegaram às igrejas com o nome dos seus autores, e nenhum escritor antigo apresentou outro nome.\nO único livro em que a própria igreja antiga disse que não sabia quem escreveu foi Hebreus. Ou seja: *são 26 de 27, e não 7 de 27*. E mesmo se alguém quisesse ficar só com os 7 que os mais céticos aceitam, tudo o que o Islã nega, a cruz, a ressurreição e Jesus como Deus, já está neles, como mostro agora.", "tr": "✅ *4. delil: Gerçek hesap 27'de 26'dır.*\nVideo, sadece 7 kitabı kimin yazdığını bildiğimizi düşünmenizi istiyor. Şimdi 27 kitabın gerçek hesabına bakın:\n• *4 İncil ve Elçilerin İşleri:* Her birini kimin yazdığı bu metnin başında delil zinciriyle zaten kanıtlandı.\n• *Pavlus'un 13 mektubu:* Hepsi onun adıyla başlar, 2. yüzyıldan beri bütün bölgelerde onun mektupları olarak kabul edildi ve hiçbir eski yazar onları başka bir yazara vermedi.\n• *Yakup'un, Petrus'un, Yuhanna'nın ve Yahuda'nın mektupları ve Vahiy:* Kiliselere yazarlarının adıyla ulaştı ve hiçbir eski yazar başka bir isim ortaya koymadı.\nEski kilisenin, kimin yazdığını bilmediğini bizzat söylediği tek kitap İbraniler'dir. Yani *27'de 7 değil, 27'de 26*. Ve biri sadece en şüphecilerin kabul ettiği 7 mektupla yetinmek istese bile, İslam'ın inkâr ettiği her şey, yani çarmıh, diriliş ve Tanrı olarak İsa, şimdi göstereceğim gibi zaten onların içinde var.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 128, "id": "p128", "pt": "✅ *Prova 5: mesmo as 7 cartas que os mais céticos aceitam já derrubam o Islã.*\nEssas 7 cartas foram escritas entre os anos 50 e 60, uns 20 a 30 anos depois de Jesus. E o que elas dizem?\n• Que Jesus morreu na cruz, ressuscitou e apareceu a mais de 500 pessoas.\n• Que Jesus \"existia em forma de Deus\" antes de se tornar homem, e que todo joelho se dobrará diante dele (Filipenses 2:6-11).\nOu seja, com o mínimo que o estudioso mais cético aceita, *já temos a cruz, a ressurreição e Jesus como Deus, menos de 30 anos depois de Jesus*.", "tr": "✅ *5. delil: En şüphecilerin kabul ettiği 7 mektup bile İslam'ı yıkar.*\nBu 7 mektup 50 ile 60 yılları arasında, İsa'dan yaklaşık 20 ile 30 yıl sonra yazıldı. Peki ne diyorlar?\n• İsa'nın çarmıhta öldüğünü, dirildiğini ve 500'den fazla kişiye göründüğünü.\n• İsa'nın insan olmadan önce \"Tanrı özüne sahip\" olduğunu ve her dizin O'nun önünde çökeceğini (Filipililer 2:6-11).\nYani en şüpheci araştırmacının kabul ettiği en az şeyle bile, *İsa'dan 30 yıl geçmeden çarmıh, diriliş ve Tanrı olarak İsa elimizde*.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 129, "id": "p129", "pt": "✅ *Alguns dizem: \"Até os egípcios gravavam em pedra o que acontecia. Como não existe nenhum registro da coisa mais importante na hora?\"*\nEssa pergunta parece forte, mas mistura as coisas:\n• *Quem gravava em pedra eram reis e impérios.* Os faraós mandavam gravar as próprias vitórias, com o dinheiro e o poder do reino. Os seguidores de Jesus eram pescadores e gente simples, perseguidos, num país dominado por Roma, que tinha acabado de crucificar o mestre deles. Ninguém ia levantar um monumento a um homem que Roma crucificou.\n• *E houve registro na hora, sim.* Na própria cruz, Pilatos mandou escrever em três línguas: \"Jesus de Nazaré, o Rei dos Judeus\" (João 19:19-20). Poucas semanas depois, os apóstolos já pregavam em público em Jerusalém. Em poucos anos, o resumo da fé já estava fixado e era repetido nas igrejas. E antes de Lucas, muitos já tinham posto a história por escrito. Para a história antiga, isso é praticamente na hora.\n• *Pedra não é o que prova a história antiga.* Sócrates não escreveu nada e não tem nenhuma pedra contando a vida dele: tudo o que se sabe vem dos seus discípulos, como Platão e Xenofonte. Ninguém diz que Sócrates é invenção.\n• *E o Islã?* Não existe nenhuma pedra do tempo de Muhammad contando a vida dele. A inscrição mais famosa com o nome dele, a do Domo da Rocha, em Jerusalém, é do ano 691, quase 60 anos depois da sua morte.", "tr": "✅ *Bazıları şöyle der: \"Mısırlılar bile olanları taşa kazırdı. En önemli olay için neden o anda hiçbir kayıt yok?\"*\nBu soru güçlü görünür, ama şeyleri birbirine karıştırır:\n• *Taşa kazıtanlar krallar ve imparatorluklardı.* Firavunlar kendi zaferlerini, krallığın parasıyla ve gücüyle kazıtırdı. İsa'nın takipçileri ise balıkçılar ve sade insanlardı; Roma'nın egemenliği altındaki, öğretmenlerini daha yeni çarmıha germiş olan bir ülkede zulüm görüyorlardı. Kimse Roma'nın çarmıha gerdiği bir adama anıt dikemezdi.\n• *Ve o anda kayıt da vardı.* Çarmıhın üzerine Pilatus üç dilde şunu yazdırdı: \"Nasıralı İsa, Yahudilerin Kralı\" (Yuhanna 19:19-20). Birkaç hafta sonra elçiler Kudüs'te herkesin önünde vaaz ediyordu. Birkaç yıl içinde imanın özeti zaten belirlenmişti ve kiliselerde tekrarlanıyordu. Luka'dan önce de birçok kişi hikâyeyi yazıya geçirmişti. Eski tarih için bu neredeyse anında demektir.\n• *Eski tarihi kanıtlayan taş değildir.* Sokrates hiçbir şey yazmadı ve hayatını anlatan hiçbir taş yok: Onun hakkında bilinen her şey Platon ve Ksenofon gibi öğrencilerinden gelir. Kimse Sokrates'in uydurma olduğunu söylemez.\n• *Peki ya İslam?* Muhammed'in zamanından kalma, onun hayatını anlatan hiçbir taş yok. Adının geçtiği en meşhur yazıt, Kudüs'teki Kubbetü's-Sahra'nınki, onun ölümünden neredeyse 60 yıl sonra, 691 yılına aittir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 130, "id": "p130", "pt": "✅ *Prova 6: essas mesmas cartas mostram que Paulo não inventou nada.*\nMuitos canais muçulmanos usam essa história de \"só as 7 cartas de Paulo\" para depois dizer que Paulo inventou o cristianismo. Mas as mesmas 7 cartas mostram o contrário:\n• Paulo diz que o resumo da fé, a morte, a ressurreição e as aparições de Jesus, ele \"recebeu\" e passou adiante (1 Coríntios 15:3).\n• Paulo passou 15 dias com Pedro e conheceu Tiago, o irmão de Jesus.\n• Depois, apresentou a mensagem que pregava aos líderes de Jerusalém, e eles não acrescentaram nada a ela (Gálatas 2:6). Tiago, Pedro e João ainda apertaram a mão dele em sinal de comunhão (Gálatas 2:9).\nOu seja, a mensagem de Paulo foi conferida e aprovada pelos apóstolos que andaram com Jesus. Quem tenta separar Paulo dos apóstolos é desmentido pelas mesmas cartas que o vídeo aceita.", "tr": "✅ *6. delil: Aynı mektuplar Pavlus'un hiçbir şey uydurmadığını gösterir.*\nBirçok Müslüman kanal, bu \"sadece Pavlus'un 7 mektubu\" hikâyesini, ardından Hristiyanlığı Pavlus'un uydurduğunu söylemek için kullanır. Ama aynı 7 mektup tam tersini gösterir:\n• Pavlus, imanın özetini, yani İsa'nın ölümünü, dirilişini ve görünmelerini \"aldığını\" ve aktardığını söyler (1 Korintliler 15:3).\n• Pavlus Petrus'la 15 gün kaldı ve İsa'nın kardeşi Yakup'la tanıştı.\n• Sonra vaaz ettiği mesajı Kudüs'teki önderlere sundu ve onlar bu mesaja hiçbir şey eklemedi (Galatyalılar 2:6). Yakup, Petrus ve Yuhanna ayrıca paydaşlık işareti olarak onunla tokalaştı (Galatyalılar 2:9).\nYani Pavlus'un mesajı, İsa'yla birlikte dolaşmış elçiler tarafından kontrol edildi ve onaylandı. Pavlus'u elçilerden ayırmaya çalışanları, videonun kabul ettiği aynı mektuplar yalanlıyor.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 131, "id": "p131", "pt": "E quando Paulo repreendeu Pedro em Antioquia (Gálatas 2:11-14), não foi por causa da mensagem: foi porque Pedro, com medo de alguns, deixou de comer com os cristãos que não eram judeus, agindo contra o que ele mesmo cria e ensinava. Paulo cobrou Pedro justamente porque os dois criam na mesma coisa.", "tr": "Pavlus'un Antakya'da Petrus'u azarlaması da (Galatyalılar 2:11-14) mesaj yüzünden değildi: Petrus bazılarından korktuğu için Yahudi olmayan Hristiyanlarla yemek yemeyi bırakmış, kendi inandığı ve öğrettiği şeye aykırı davranmıştı. Pavlus, Petrus'u tam da ikisi aynı şeye inandığı için uyardı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 132, "id": "p132", "pt": "✅ *E o Alcorão?*\nO Alcorão nega a cruz quase 600 anos depois, sem citar nenhum documento, nenhuma testemunha e nenhuma fonte. De um lado, cartas de um homem que conheceu Pedro e Tiago, o irmão de Jesus. Do outro, uma afirmação sem nenhuma prova.", "tr": "✅ *Peki ya Kur'an?*\nKur'an çarmıhı neredeyse 600 yıl sonra, hiçbir belge, hiçbir tanık ve hiçbir kaynak göstermeden inkâr ediyor. Bir tarafta Petrus'u ve İsa'nın kardeşi Yakup'u tanımış bir adamın mektupları var. Diğer tarafta hiçbir delili olmayan bir iddia.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 133, "id": "p133", "pt": "E se o vídeo exige um escriba anotando palavra por palavra, os hadith não valem nada. Os Evangelhos foram escritos poucas décadas depois de Jesus, enquanto as testemunhas ainda viviam. Já o que Muhammad disse e fez foi passado por correntes de pessoas e só foi reunido em coleções como a de Bukhari mais de 200 anos depois dele, quando todas as testemunhas já tinham morrido havia muito tempo. E a própria tradição islâmica mostra que essa corrente falhou: segundo ela, Bukhari examinou cerca de 600 mil relatos e colocou no livro pouco mais de 7 mil, e os próprios sábios muçulmanos reconhecem que muitos hadith foram inventados.", "tr": "Ve video kelimesi kelimesine yazan bir kâtip şart koşuyorsa, hadislerin hiçbir değeri kalmaz. İnciller, İsa'dan birkaç on yıl sonra, tanıklar hâlâ hayattayken yazıldı. Muhammed'in söyledikleri ve yaptıkları ise kişiden kişiye zincirlerle aktarıldı ve ancak ondan 200 yıldan fazla sonra, bütün tanıklar çoktan ölmüşken, Buhari'ninki gibi koleksiyonlarda toplandı. İslami geleneğin kendisi bu zincirin işlemediğini gösterir: Ona göre Buhari yaklaşık 600 bin rivayeti inceledi ve kitabına 7 binden biraz fazlasını aldı; Müslüman alimlerin kendileri de birçok hadisin uydurulduğunu kabul eder.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "research", "n": 134, "id": "p134", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Decorar", "text": "No tempo de Jesus, era comum os discípulos dos mestres judeus decorarem os ensinos, em vez de alguém anotar tudo palavra por palavra?"}, {"label": "Mateus", "text": "No tempo de Jesus, um cobrador de impostos como Mateus precisava saber ler, escrever e fazer registros?"}, {"label": "Nomes", "text": "Existe algum manuscrito antigo em que um dos quatro Evangelhos apareça com o nome de outro autor? E Marcos e Lucas eram apóstolos?"}, {"label": "De onde vem o \"7\"", "text": "A separação das cartas de Paulo em 7 'aceitas' e 6 'disputadas' foi feita por estudiosos modernos, a partir dos séculos 18 e 19, e não pelos cristãos antigos? E diferenças de estilo, sozinhas, provam que Paulo não escreveu uma carta?"}, {"label": "Contagem de palavras", "text": "O estudo estatístico de Anthony Kenny, de 1986, sobre o estilo do Novo Testamento, encontrou motivo para dizer que 12 das 13 cartas de Paulo não são do mesmo autor?"}, {"label": "Secretários", "text": "Paulo usava secretários, como Tércio (Romanos 16:22), e assinava as cartas com a própria mão (1 Coríntios 16:21 e Gálatas 6:11)?"}, {"label": "Falsificador punido", "text": "Segundo Tertuliano (Sobre o Batismo 17), um presbítero que escreveu um livro inventado sobre Paulo perdeu o cargo por isso?"}, {"label": "Hebreus", "text": "Orígenes disse que só Deus sabe quem escreveu a carta aos Hebreus?"}, {"label": "O que as 7 cartas dizem", "text": "As cartas de Paulo que até os céticos aceitam já falam da morte de Jesus na cruz, da ressurreição e, em Filipenses 2:6-11, de Jesus 'em forma de Deus'?"}, {"label": "Pedras", "text": "Segundo João 19:19-20, Pilatos mandou escrever na cruz, em três línguas, 'Jesus de Nazaré, o Rei dos Judeus'? E existe alguma inscrição em pedra do tempo de Muhammad que fale dele?"}, {"label": "Alcorão", "text": "Quando diz que Jesus não foi crucificado, o Alcorão cita algum documento ou alguma testemunha?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Ezber", "text": "İsa'nın zamanında Yahudi öğretmenlerin öğrencilerinin, birinin her şeyi kelimesi kelimesine yazması yerine öğretileri ezberlemesi yaygın mıydı?"}, {"label": "Matta", "text": "İsa'nın zamanında Matta gibi bir vergi görevlisinin okuma, yazma ve kayıt tutma bilmesi gerekir miydi?"}, {"label": "İsimler", "text": "Dört İncil'den birinin başka bir yazarın adıyla geçtiği eski bir el yazması var mı? Markos ve Luka elçi miydi?"}, {"label": "\"7\" nereden geliyor", "text": "Pavlus'un mektuplarının 7 'kabul edilen' ve 6 'tartışmalı' olarak ayrılması eski Hristiyanlar tarafından değil, 18. ve 19. yüzyıllardan itibaren modern araştırmacılar tarafından mı yapıldı? Üslup farkları tek başına Pavlus'un bir mektubu yazmadığını kanıtlar mı?"}, {"label": "Kelime sayımı", "text": "Anthony Kenny'nin 1986'da Yeni Antlaşma'nın üslubu üzerine yaptığı istatistiksel çalışma, Pavlus'un 13 mektubundan 12'sinin aynı yazara ait olmadığını söylemek için bir sebep buldu mu?"}, {"label": "Kâtipler", "text": "Pavlus, Tertius gibi kâtipler kullanıyor (Romalılar 16:22) ve mektupları kendi eliyle imzalıyor muydu (1 Korintliler 16:21 ve Galatyalılar 6:11)?"}, {"label": "Cezalandırılan sahtekâr", "text": "Tertullianus'a göre (Vaftiz Üzerine 17), Pavlus hakkında uydurma bir kitap yazan bir presbiter bu yüzden görevini kaybetti mi?"}, {"label": "İbraniler", "text": "Origenes, İbraniler'e mektubu kimin yazdığını sadece Tanrı'nın bildiğini söyledi mi?"}, {"label": "7 mektubun söyledikleri", "text": "Şüphecilerin bile kabul ettiği Pavlus mektupları, İsa'nın çarmıhta ölümünden, dirilişinden ve Filipililer 2:6-11'de İsa'nın 'Tanrı özüne sahip' olmasından bahsediyor mu?"}, {"label": "Taşlar", "text": "Yuhanna 19:19-20'ye göre Pilatus çarmıhın üzerine üç dilde 'Nasıralı İsa, Yahudilerin Kralı' diye yazdırdı mı? Muhammed'in zamanından kalma, ondan bahseden taş bir yazıt var mı?"}, {"label": "Kur'an", "text": "Kur'an, İsa'nın çarmıha gerilmediğini söylerken herhangi bir belge ya da tanık gösteriyor mu?"}]}}, {"k": "trans", "n": 138, "id": "p138", "pt": "E agora o último erro desta parte.", "tr": "Ve şimdi bu bölümün son hatası.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escribas e o “só 7 de 27”", "tr": "1. Bölüm: İncilleri kim yazdı › Kâtipler ve “27'de sadece 7”"}, "newPoint": false}, {"k": "para", "n": 139, "id": "p139", "pt": "❌ *O que o vídeo diz:* que os próprios autores nunca disseram ser testemunhas, nem ter escrito com autoridade de Deus.", "tr": "❌ *Videonun söylediği:* Yazarların kendilerinin hiçbir zaman tanık olduklarını ya da Tanrı'nın yetkisiyle yazdıklarını söylemediği.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": true}, {"k": "para", "n": 140, "id": "p140", "pt": "Isso não é só falta de estudo: é mentira descarada, na cara de quem assiste. Para falar um absurdo desses, o autor do vídeo ou nunca abriu uma Bíblia na vida, ou tem certeza de que vocês nunca vão abrir para conferir. Basta ler o que está escrito, preto no branco, para ver a farsa cair na hora:", "tr": "Bu sadece bilgisizlik değil: İzleyenin gözünün içine bakarak söylenmiş açık bir yalandır. Böyle saçma bir şey söylemek için videonun sahibi ya hayatında hiç Kutsal Kitap açmamıştır ya da sizin onu açıp kontrol etmeyeceğinizden emindir. Açıkça yazılanı okumak, bu sahtekârlığın anında çökmesi için yeterli:", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 141, "id": "p141", "pt": "✅ *Prova 1: os autores dizem, com todas as letras, que viram ou que escreveram a partir de quem viu.*\n• Lucas abre o seu Evangelho dizendo que pesquisou tudo com cuidado, desde o princípio, com os que foram \"testemunhas oculares\" (Lucas 1:1-4). É a primeira coisa que ele escreve.\n• João, no meio da cena da cruz, para e afirma: \"Aquele que viu isto deu testemunho, e o seu testemunho é verdadeiro\" (João 19:35).\n• E começa a sua carta assim: \"o que ouvimos, o que vimos com os nossos olhos, o que as nossas mãos tocaram\" (1 João 1:1).\n• Paulo lista as testemunhas da ressurreição, avisa que a maioria ainda estava viva, ou seja, podia ser procurada e perguntada, e diz que ele mesmo viu Jesus ressuscitado (1 Coríntios 15:6-8).\nRepare: não é uma frase escondida. É a abertura de um Evangelho, o centro da cena da cruz e o começo de uma carta. *O autor do vídeo diz que eles \"nunca disseram\" justamente o que eles mais repetem.*", "tr": "✅ *1. delil: Yazarlar gördüklerini ya da görenlerden yazdıklarını açık açık söyler.*\n• Luka İncili'ne, her şeyi baştan beri \"görgü tanıkları\" olanlardan dikkatle araştırdığını söyleyerek başlar (Luka 1:1-4). Yazdığı ilk şey budur.\n• Yuhanna çarmıh sahnesinin ortasında durur ve şöyle der: \"Bunu gören tanıklık ediyor, onun tanıklığı gerçektir\" (Yuhanna 19:35).\n• Mektubuna da şöyle başlar: \"İşittiğimiz, gözlerimizle gördüğümüz, ellerimizle dokunduğumuz\" (1 Yuhanna 1:1).\n• Pavlus dirilişin tanıklarını sayar, çoğunun hâlâ hayatta olduğunu, yani bulunup sorulabileceğini söyler ve dirilmiş İsa'yı kendisinin de gördüğünü ekler (1 Korintliler 15:6-8).\nDikkat edin: Bu gizli kalmış bir cümle değil. Bir İncil'in açılışı, çarmıh sahnesinin tam ortası ve bir mektubun başlangıcı. *Videonun sahibi, yazarların en çok tekrarladığı şeyi \"hiç söylemediklerini\" iddia ediyor.*", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 142, "id": "p142", "pt": "✅ *Prova 2: os autores dizem que escreviam com a autoridade de Deus.*\n• Paulo escreve: \"o que vos escrevo é mandamento do Senhor\" (1 Coríntios 14:37).\n• Paulo agradece porque os tessalonicenses receberam a sua mensagem \"não como palavra de homens, mas como ela realmente é, a palavra de Deus\" (1 Tessalonicenses 2:13).\nE essas não são cartas \"disputadas\": são justamente cartas que até os estudiosos mais céticos aceitam como de Paulo. Ou seja, o vídeo nega o que está escrito nos livros que os próprios críticos que ele usa aceitam.", "tr": "✅ *2. delil: Yazarlar Tanrı'nın yetkisiyle yazdıklarını söyler.*\n• Pavlus şöyle yazar: \"Size yazdıklarım Rab'bin buyruğudur\" (1 Korintliler 14:37).\n• Pavlus, Selaniklilerin onun mesajını \"insan sözü olarak değil, gerçekte olduğu gibi Tanrı sözü olarak\" kabul ettikleri için şükreder (1 Selanikliler 2:13).\nÜstelik bunlar \"tartışmalı\" mektuplar değil: En şüpheci araştırmacıların bile Pavlus'a ait olduğunu kabul ettiği mektuplar. Yani video, kendi kullandığı eleştirmenlerin bile kabul ettiği kitaplarda yazanı inkâr ediyor.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 143, "id": "p143", "pt": "✅ *E o Alcorão? Quem é que realmente não viu nada do que contou?*\nAgora olhem a inversão absurda que vocês aceitam. Os autores do Novo Testamento dizem: \"nós vimos com os nossos olhos, nós ouvimos, as nossas mãos tocaram\". Já Muhammad nasceu por volta do ano 570, mais de 500 anos depois de Jesus, a mais de mil quilômetros de Jerusalém, numa terra onde Jesus nunca pisou. Muhammad nunca viu Jesus, nem Maria, nem Pedro, nem Moisés, nem Abraão, e não estava em nenhum dos acontecimentos que o Alcorão conta sobre eles.", "tr": "✅ *Peki ya Kur'an? Anlattığı hiçbir şeyi gerçekten görmemiş olan kim?*\nŞimdi kabul ettiğiniz saçma tersine çevirmeye bakın. Yeni Antlaşma'nın yazarları şöyle der: \"Gözlerimizle gördük, işittik, ellerimizle dokunduk.\" Muhammed ise İsa'dan 500 yıldan fazla sonra, yaklaşık 570 yılında, Kudüs'ten bin kilometreden fazla uzakta, İsa'nın hiç ayak basmadığı bir yerde doğdu. Muhammed ne İsa'yı, ne Meryem'i, ne Petrus'u, ne Musa'yı, ne de İbrahim'i gördü; Kur'an'ın onlar hakkında anlattığı olayların hiçbirinde bulunmadı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 144, "id": "p144", "pt": "E não sou eu quem diz isso: *é o próprio Alcorão que confessa*, várias vezes:\n• Sobre Maria: \"Isso é das notícias do oculto que te revelamos; tu não estavas com eles\" (3:44).\n• Sobre José: \"Isso é das notícias do oculto que te revelamos; tu não estavas com eles\" (12:102).\n• Sobre Moisés: \"Tu não estavas no lado ocidental do monte quando demos a ordem a Moisés, e não foste testemunha\" (28:44).\n• Sobre Noé: \"Nem tu nem o teu povo sabíeis disso antes\" (11:49).", "tr": "Bunu ben söylemiyorum: *Kur'an'ın kendisi defalarca itiraf ediyor*:\n• Meryem hakkında: \"Bunlar sana vahyettiğimiz gayb haberlerindendir; sen onların yanında değildin\" (3:44).\n• Yusuf hakkında: \"Bunlar sana vahyettiğimiz gayb haberlerindendir; sen onların yanında değildin\" (12:102).\n• Musa hakkında: \"Musa'ya emri verdiğimizde sen dağın batı yanında değildin ve şahitlerden de değildin\" (28:44).\n• Nuh hakkında: \"Bundan önce ne sen bunları biliyordun ne de kavmin\" (11:49).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 145, "id": "p145", "pt": "Pensem com honestidade: de um lado, testemunhas que andaram com Jesus, comeram com Ele, viram os milagres na frente das multidões e deram a própria vida pelo que viram. Do outro, um homem só, quase 600 anos depois, sozinho numa caverna, a de Hira, sem ninguém ao lado para ver o anjo.", "tr": "Dürüstçe düşünün: Bir yanda İsa'yla birlikte dolaşan, O'nunla yemek yiyen, mucizeleri kalabalıkların önünde gören ve gördükleri için canlarını veren tanıklar var. Öbür yanda ise neredeyse 600 yıl sonra, bir mağarada, Hira mağarasında, meleği görecek yanında kimse olmadan tek başına olan bir adam.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 146, "id": "p146", "pt": "E o próprio Bukhari conta como foi: Muhammad voltou da caverna tremendo, dizendo que tinha medo pelo que estava acontecendo com ele, e precisou que a esposa, Khadija, e o primo dela, Waraqa, lhe dissessem que aquilo vinha de Deus (Bukhari 3). E no próprio Bukhari está escrito que, quando as revelações pararam por um tempo, ele ficou tão triste que foi várias vezes ao alto das montanhas para se jogar (Bukhari 6982).", "tr": "Buhari'nin kendisi de nasıl olduğunu anlatır: Muhammed mağaradan titreyerek döndü, başına gelenden korktuğunu söyledi ve bunun Tanrı'dan geldiğini ona eşi Hatice ile Hatice'nin amcasının oğlu Varaka söylemek zorunda kaldı (Buhari 3). Yine Buhari'de, vahiy bir süre kesildiğinde o kadar üzüldüğü ve kendini atmak için defalarca dağların tepesine gittiği yazılıdır (Buhari 6982).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 147, "id": "p147", "pt": "E repare: quem disse que aquilo era um anjo de Deus foi Waraqa, que não viu nada; só ouviu o relato. Ele disse que era o mesmo anjo que veio a Moisés (Bukhari 3). Mas como ele podia saber? Ninguém viu esse ser além de Muhammad. E a Bíblia avisa exatamente sobre isso: \"o próprio Satanás se disfarça de anjo de luz\" (2 Coríntios 11:14), e \"ainda que um anjo do céu vos pregue outro evangelho, seja anátema\" (Gálatas 1:8).", "tr": "Şuna da dikkat edin: Bunun Tanrı'dan gelen bir melek olduğunu söyleyen, hiçbir şey görmemiş olan Varaka'ydı; o sadece anlatılanı duydu. Bunun Musa'ya gelen meleğin aynısı olduğunu söyledi (Buhari 3). Ama bunu nereden bilebilirdi? O varlığı Muhammed'den başka kimse görmedi. Kutsal Kitap da tam olarak bu konuda uyarır: \"Şeytan'ın kendisi bile ışık meleği kılığına girer\" (2 Korintliler 11:14) ve \"gökten bir melek bile size başka bir müjde duyurursa, lanet olsun\" (Galatyalılar 1:8).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 148, "id": "p148", "pt": "Então como saber de onde veio aquilo? Pelo que a mensagem ensina. Um anjo de Deus nunca contradiria o que Deus já revelou. Mas a mensagem da caverna nega justamente o centro de tudo o que veio antes: nega que Jesus é o Filho de Deus, nega que Ele morreu na cruz e nega que Ele é Deus. E a Bíblia diz: \"Quem nega o Filho também não tem o Pai\" (1 João 2:23). Ao mesmo tempo, essa mensagem fala bem de Jesus, e O chama de Messias e de Palavra de Deus (3:45). Pense: se ela falasse mal de Jesus, ninguém acreditaria. É exatamente assim que Satanás engana: *mistura verdade com mentira*, elogia Jesus por fora e tira d'Ele, por dentro, tudo o que salva.", "tr": "O halde bunun nereden geldiğini nasıl anlarız? Mesajın öğrettiğinden. Tanrı'nın bir meleği, Tanrı'nın daha önce açıkladığıyla asla çelişmez. Ama mağaradaki mesaj, daha önce gelen her şeyin tam merkezini inkâr ediyor: İsa'nın Tanrı'nın Oğlu olduğunu, çarmıhta öldüğünü ve Tanrı olduğunu inkâr ediyor. Kutsal Kitap ise şöyle der: \"Oğul'u inkâr eden Baba'ya da sahip değildir\" (1 Yuhanna 2:23). Aynı zamanda bu mesaj İsa'dan iyi bahseder, O'na Mesih ve Tanrı'nın Kelimesi der (3:45). Düşünün: İsa'yı kötüleseydi, kimse inanmazdı. Şeytan tam da böyle aldatır: *Doğruyla yalanı karıştırır*, İsa'yı dışarıdan över ve içeriden O'nun kurtaran her şeyini elinden alır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 149, "id": "p149", "pt": "E não adianta perguntar: \"Mas o Alcorão manda respeitar a Torá e o Evangelho; Satanás faria isso?\" Faria, sim, se fosse para enganar. Foi assim desde o começo: Satanás não negou a palavra de Deus de frente; repetiu o que Deus disse e torceu: \"É verdade que Deus disse...?\" (Gênesis 3:1). E quando tentou Jesus, citou a própria Escritura, dizendo \"porque está escrito\" (Mateus 4:6). É o mesmo que o Alcorão faz: usa a autoridade da Bíblia para ganhar crédito, diz que a confirma, depois se coloca acima dela como \"guardião/corretor\" dos livros anteriores (5:48), e muda justamente o que salva. Se ignorasse a Bíblia, ninguém daria crédito a ele.", "tr": "\"Ama Kur'an Tevrat'a ve İncil'e saygı gösterilmesini emrediyor; Şeytan bunu yapar mı?\" diye sormak da işe yaramaz. Aldatmak için olursa, evet, yapar. Başından beri böyle oldu: Şeytan Tanrı'nın sözünü açıkça inkâr etmedi; Tanrı'nın dediğini tekrarladı ve çarpıttı: \"Tanrı gerçekten ... dedi mi?\" (Yaratılış 3:1). İsa'yı denediğinde de Kutsal Yazı'nın kendisini aktardı ve \"çünkü yazılmıştır\" dedi (Matta 4:6). Kur'an'ın yaptığı da aynısıdır: İtibar kazanmak için Kutsal Kitap'ın otoritesini kullanır, onu onayladığını söyler, sonra önceki kitapların \"gözeticisi/düzelticisi\" olarak kendini onun üstüne koyar (5:48) ve tam da kurtaranı değiştirir. Kutsal Kitap'ı görmezden gelseydi, kimse ona itibar etmezdi.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 150, "id": "p150", "pt": "E veja o que acontece quando se nega o Filho. O próprio hadith diz que, antes da criação, \"Allah existia e não havia nada além d'Ele\" (Bukhari 3191). Mas o Alcorão chama Allah de Al-Wadud, \"o que ama\" (85:14).", "tr": "Oğul inkâr edildiğinde ne olduğuna da bakın. Hadisin kendisi, yaratılıştan önce \"Allah vardı ve O'ndan başka hiçbir şey yoktu\" der (Buhari 3191). Ama Kur'an Allah'a \"seven\" anlamında el-Vedud der (85:14).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 151, "id": "p151", "pt": "Antes de criar o mundo, um deus sozinho amava quem? Se não havia ninguém, o amor dele só passou a existir na prática quando ele criou alguém para amar, ou seja, ele precisou da criação para amar. E se disserem que ele amava a si mesmo, isso não é o amor que se doa a outro: é amor-próprio.", "tr": "Dünyayı yaratmadan önce, yapayalnız bir ilah kimi seviyordu? Hiç kimse yoksa, onun sevgisi ancak sevecek birini yarattığında fiilen var olmaya başladı; yani sevmek için yaratılışa muhtaç oldu. Kendini sevdiği söylenirse, bu başkasına kendini veren sevgi değil, kendini sevmedir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 152, "id": "p152", "pt": "Já o Deus da Bíblia nunca precisou do universo para amar, porque desde sempre o Pai ama o Filho, na comunhão do Espírito Santo: \"Tu me amaste antes da fundação do mundo\" (João 17:24). Por isso a Bíblia pode dizer: \"Deus é amor\" (1 João 4:8). *Negar o Filho é tirar de Deus o próprio amor.*", "tr": "Kutsal Kitap'ın Tanrı'sı ise sevmek için evrene hiç muhtaç olmadı, çünkü Baba, Kutsal Ruh'un paydaşlığında ezelden beri Oğul'u sever: \"Dünya kurulmadan önce beni sevdin\" (Yuhanna 17:24). Bu yüzden Kutsal Kitap \"Tanrı sevgidir\" diyebilir (1 Yuhanna 4:8). *Oğul'u inkâr etmek, Tanrı'nın sevgisinin kendisini elinden almaktır.*", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 153, "id": "p153", "pt": "E nem adianta dizer que Allah já sabia que nós íamos existir e, por isso, já nos amava. Saber que alguém vai existir não é ter alguém para amar. Um homem que sabe que um dia vai ter um filho pode amar a ideia desse filho, mas ainda não existe filho nenhum para receber esse amor e amar de volta.", "tr": "Allah'ın bizim var olacağımızı zaten bildiğini ve bu yüzden bizi zaten sevdiğini söylemek de işe yaramaz. Birinin var olacağını bilmek, sevecek birine sahip olmak değildir. Bir gün çocuğu olacağını bilen bir adam o çocuğun fikrini sevebilir, ama bu sevgiyi alacak ve karşılık verecek bir çocuk henüz yoktur.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 154, "id": "p154", "pt": "Pelo próprio hadith, antes da criação não havia nada além de Allah. Então o \"amor\" dele era por uma ideia na própria mente, e ele continuava precisando da criação para ter alguém de verdade para amar.", "tr": "Hadisin kendisine göre yaratılıştan önce Allah'tan başka hiçbir şey yoktu. O halde onun \"sevgisi\" kendi zihnindeki bir fikre yönelikti ve gerçekten sevecek birine sahip olmak için yine yaratılışa muhtaçtı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 155, "id": "p155", "pt": "Amor de verdade é entre dois que existem: um que ama e outro que é amado e ama de volta. No Deus da Bíblia isso sempre existiu: o Pai ama o Filho, e o Filho ama o Pai (João 14:31), desde sempre, sem precisar de nenhuma criatura.", "tr": "Gerçek sevgi var olan iki kişi arasındadır: Biri sever, diğeri sevilir ve karşılık verir. Kutsal Kitap'ın Tanrı'sında bu her zaman vardı: Baba Oğul'u sever, Oğul da Baba'yı sever (Yuhanna 14:31); ezelden beri, hiçbir yaratığa muhtaç olmadan.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os autores eram testemunhas?", "tr": "1. Bölüm: İncilleri kim yazdı › Yazarlar tanık mıydı?"}, "newPoint": false}, {"k": "para", "n": 156, "id": "p156", "pt": "✅ *Antes de continuar: o que é a Trindade, de um jeito simples.*\nComo acabei de falar do Pai, do Filho e do Espírito Santo, vou explicar agora o que é a Trindade, para não ficar nenhuma dúvida daqui para frente.", "tr": "✅ *Devam etmeden önce: Üçlü Birlik nedir? Basitçe anlatayım.*\nBaba'dan, Oğul'dan ve Kutsal Ruh'tan az önce bahsettiğim için, bundan sonra hiçbir şüphe kalmasın diye Üçlü Birlik'in ne olduğunu şimdi açıklayacağım.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › A Trindade explicada", "tr": "1. Bölüm: İncilleri kim yazdı › Üçlü Birlik açıklaması"}, "newPoint": true}, {"k": "para", "n": 157, "id": "p157", "pt": "Existe um só Deus, não três. E esse único Deus é, desde sempre, Pai, Filho e Espírito Santo. Pense numa pergunta simples: o que o senhor é? Um ser humano. E quem o senhor é? O Fatih. O \"o que\" é a natureza; o \"quem\" é a pessoa. No senhor existe uma natureza e uma pessoa. Em Deus existe uma só natureza, um só Deus, e três pessoas: o Pai, o Filho e o Espírito Santo. Contradição seria dizer que Deus é um e três do mesmo jeito. Não é isso: *é um só Deus em três pessoas*.", "tr": "Üç değil, tek bir Tanrı vardır. Ve bu tek Tanrı ezelden beri Baba, Oğul ve Kutsal Ruh'tur. Basit bir soru düşünün: Siz nesiniz? Bir insan. Peki siz kimsiniz? Fatih. \"Ne\" doğadır; \"kim\" ise kişidir. Sizde bir doğa ve bir kişi vardır. Tanrı'da ise tek bir doğa, yani tek bir Tanrı, ve üç kişi vardır: Baba, Oğul ve Kutsal Ruh. Çelişki, Tanrı'nın aynı açıdan hem bir hem üç olduğunu söylemek olurdu. Söylenen bu değil: *Üç kişide tek bir Tanrı.*", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › A Trindade explicada", "tr": "1. Bölüm: İncilleri kim yazdı › Üçlü Birlik açıklaması"}, "newPoint": false}, {"k": "para", "n": 158, "id": "p158", "pt": "E as objeções que vocês sempre repetem caem todas aqui:\n• *\"São três deuses.\"* Não. O próprio Jesus diz que o primeiro mandamento é: \"O Senhor nosso Deus é o único Senhor\" (Marcos 12:29).\n• *\"Maria faz parte da Trindade\" ou \"Deus teve um filho com uma mulher\".* Nenhuma igreja cristã jamais ensinou isso. \"Filho\" quer dizer que o Filho tem a mesma natureza do Pai, assim como o filho de um homem também é homem. E Ele existe desde sempre: \"No princípio era a Palavra, e a Palavra estava com Deus, e a Palavra era Deus\" (João 1:1).\n• *\"A palavra Trindade não está na Bíblia.\"* A palavra não, o ensino está. A palavra \"tawhid\" também não aparece no Alcorão, e vocês não dizem que por isso o tawhid foi inventado.\n• *\"Jesus orava ao Pai, disse que o Pai é maior e não sabia o dia do fim.\"* Jesus é o Filho: é Deus, e também se fez homem. Como homem, Ele orava, sentia fome e dormia. Pense num rei que se alista de verdade como soldado e vai para a guerra junto com o seu povo para salvá-lo. Não é uma fantasia: ele é soldado de verdade, obedece às ordens e come do mesmo prato, mas nunca deixou de ser rei. Assim é Jesus: homem de verdade, e Deus para sempre. E quando o Filho ora ao Pai, isso mostra que são duas pessoas diferentes. *Isso confirma a Trindade, não derruba.*\n• *\"Jesus nunca disse que é Deus.\"* Disse, e os judeus entenderam tão bem que pegaram pedras para matá-lo duas vezes: quando Ele disse \"Antes que Abraão existisse, Eu Sou\" (João 8:58), e quando disse \"Eu e o Pai somos um\". E eles mesmos disseram o motivo: \"sendo homem, te fazes Deus\" (João 10:30-33). Tomé o chamou de \"Senhor meu e Deus meu\" (João 20:28), e Jesus não o corrigiu. Pedro e um anjo não deixaram que os adorassem; Jesus nunca impediu ninguém de adorá-lo.\n• *\"A Trindade foi inventada em Niceia.\"* Jesus manda batizar \"em nome do Pai, do Filho e do Espírito Santo\" (Mateus 28:19): um só nome, três pessoas, e isso está em todos os manuscritos. A Didaquê, um dos escritos cristãos mais antigos depois do Novo Testamento, já manda batizar com essas mesmas palavras. E a palavra \"Trindade\" já era usada mais de 100 anos antes de Niceia, que só defendeu, contra Ário, o que as igrejas já criam.\n• *\"O Espírito Santo é o anjo Gabriel.\"* O próprio Gabriel fala do Espírito Santo como de outro: \"O Espírito Santo virá sobre ti\" (Lucas 1:35). E mentir ao Espírito Santo é mentir a Deus.", "tr": "Sürekli tekrarladığınız itirazların hepsi de burada çöker:\n• *\"Üç tanrı var.\"* Hayır. İsa'nın kendisi ilk buyruğun şu olduğunu söyler: \"Tanrımız Rab tek Rab'dir\" (Markos 12:29).\n• *\"Meryem Üçlü Birlik'in parçasıdır\" ya da \"Tanrı bir kadından çocuk sahibi oldu\".* Hiçbir Hristiyan kilisesi bunu asla öğretmedi. \"Oğul\", Oğul'un Baba ile aynı doğaya sahip olduğu anlamına gelir; tıpkı bir insanın oğlunun da insan olması gibi. Ve O ezelden beri vardır: \"Başlangıçta Söz vardı. Söz Tanrı'yla birlikteydi ve Söz Tanrı'ydı\" (Yuhanna 1:1).\n• *\"Üçlü Birlik kelimesi Kutsal Kitap'ta geçmiyor.\"* Kelime geçmez, öğreti geçer. \"Tevhid\" kelimesi de Kur'an'da geçmez, ve siz bu yüzden tevhidin uydurulduğunu söylemiyorsunuz.\n• *\"İsa Baba'ya dua ediyordu, Baba'nın kendisinden büyük olduğunu söyledi ve sonun gününü bilmiyordu.\"* İsa Oğul'dur: Tanrı'dır ve aynı zamanda insan oldu. İnsan olarak dua etti, acıktı ve uyudu. Halkını kurtarmak için gerçekten asker olup onlarla birlikte savaşa giden bir kral düşünün. Bu bir kılık değiştirme değildir: Gerçekten askerdir, emirlere uyar ve aynı kaptan yer, ama kral olmayı hiçbir zaman bırakmamıştır. İsa da böyledir: Gerçekten insandır ve sonsuza dek Tanrı'dır. Ve Oğul'un Baba'ya dua etmesi, ikisinin farklı kişiler olduğunu gösterir. *Bu, Üçlü Birlik'i yıkmaz, doğrular.*\n• *\"İsa hiçbir zaman Tanrı olduğunu söylemedi.\"* Söyledi, ve Yahudiler bunu o kadar iyi anladılar ki O'nu öldürmek için iki kez taş aldılar: \"İbrahim doğmadan önce ben varım\" dediğinde (Yuhanna 8:58) ve \"Ben ve Baba biriz\" dediğinde. Sebebini de kendileri söylediler: \"Sen insan olduğun halde Tanrı olduğunu ileri sürüyorsun\" (Yuhanna 10:30-33). Tomas O'na \"Rabbim ve Tanrım\" dedi (Yuhanna 20:28), ve İsa onu düzeltmedi. Petrus ve bir melek kendilerine tapınılmasına izin vermediler; İsa ise kendisine tapınan hiç kimseyi engellemedi.\n• *\"Üçlü Birlik İznik'te uyduruldu.\"* İsa \"Baba, Oğul ve Kutsal Ruh'un adıyla\" vaftiz etmeyi emreder (Matta 28:19): Tek bir ad, üç kişi; ve bu bütün el yazmalarında vardır. Yeni Antlaşma'dan sonraki en eski Hristiyan yazılarından biri olan Didahe de aynı sözlerle vaftiz etmeyi emreder. \"Üçlü Birlik\" kelimesi ise İznik'ten 100 yıldan fazla önce zaten kullanılıyordu; İznik ise Arius'a karşı sadece kiliselerin zaten inandığı şeyi savundu.\n• *\"Kutsal Ruh, melek Cebrail'dir.\"* Cebrail'in kendisi, Kutsal Ruh'tan kendisinden farklı biri olarak söz eder: \"Kutsal Ruh senin üzerine gelecek\" (Luka 1:35). Ve Kutsal Ruh'a yalan söylemek, Tanrı'ya yalan söylemektir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › A Trindade explicada", "tr": "1. Bölüm: İncilleri kim yazdı › Üçlü Birlik açıklaması"}, "newPoint": false}, {"k": "para", "n": 159, "id": "p159", "pt": "*E o Alcorão nem sabe o que está criticando.* Nele, Allah pergunta a Jesus se ele mandou os homens tomarem \"a mim e a minha mãe como dois deuses além de Allah\" (5:116), e pergunta: \"Como teria Ele um filho, se não tem companheira?\" (6:101).", "tr": "*Kur'an ise neyi eleştirdiğini bile bilmiyor.* Kur'an'da Allah, İsa'ya, insanlara \"beni ve annemi Allah'tan başka iki ilah edinin\" deyip demediğini sorar (5:116) ve şöyle der: \"Eşi olmadığı halde O'nun nasıl çocuğu olabilir?\" (6:101).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › A Trindade explicada", "tr": "1. Bölüm: İncilleri kim yazdı › Üçlü Birlik açıklaması"}, "newPoint": false}, {"k": "para", "n": 160, "id": "p160", "pt": "Ou seja, o Alcorão acusa os cristãos de fazerem de Maria uma deusa, e acha que \"Filho de Deus\" quer dizer que Deus teve uma mulher. Nenhum cristão jamais creu nisso.", "tr": "Yani Kur'an, Hristiyanları Meryem'i ilah edinmekle suçluyor ve \"Tanrı'nın Oğlu\" sözünün, Tanrı'nın bir eşinden çocuk sahibi olduğu anlamına geldiğini sanıyor. Hiçbir Hristiyan buna asla inanmadı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › A Trindade explicada", "tr": "1. Bölüm: İncilleri kim yazdı › Üçlü Birlik açıklaması"}, "newPoint": false}, {"k": "para", "n": 161, "id": "p161", "pt": "Se o Alcorão viesse de Deus, que sabe tudo, ele saberia o que os cristãos creem de verdade. E não adianta dizer que ele falava de algum grupo pequeno: um livro que diz corrigir o Evangelho (5:48) teria que corrigir o que o Evangelho ensina, e não uma coisa que nem está nele. Ele ataca uma Trindade que ninguém ensina, e nunca respondeu à verdadeira.", "tr": "Kur'an her şeyi bilen Tanrı'dan gelseydi, Hristiyanların gerçekte neye inandığını bilirdi. Küçük bir gruptan bahsettiğini söylemek de işe yaramaz: İncil'i düzelttiğini söyleyen bir kitap (5:48), İncil'de bile olmayan bir şeyi değil, İncil'in öğrettiğini düzeltmek zorundaydı. Kur'an, kimsenin öğretmediği bir Üçlü Birlik'e saldırıyor ve gerçeğine hiçbir zaman cevap vermedi.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › A Trindade explicada", "tr": "1. Bölüm: İncilleri kim yazdı › Üçlü Birlik açıklaması"}, "newPoint": false}, {"k": "para", "n": 162, "id": "p162", "pt": "Então, daqui para frente, quando eu falar da Trindade, é disso que estou falando.", "tr": "Yani bundan sonra Üçlü Birlik'ten bahsettiğimde, kastettiğim budur.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › A Trindade explicada", "tr": "1. Bölüm: İncilleri kim yazdı › Üçlü Birlik açıklaması"}, "newPoint": false}, {"k": "para", "n": 163, "id": "p163", "pt": "Agora, voltando às revelações de Muhammad, repare em mais duas coisas:\n• *Revelações que favoreciam o próprio Muhammad.* Uma revelação deu a ele, e só a ele, permissões de casamento que nenhum outro muçulmano tinha: \"privilégio exclusivo teu, não dos demais crentes\" (33:50). Outra permitiu que ele casasse com Zaynab, que tinha sido esposa do seu filho adotivo (33:37). E a própria Aisha, esposa dele, lhe disse: \"Vejo que o teu Senhor se apressa em satisfazer os teus desejos\" (Bukhari 4788).\n• *Histórias que já circulavam antes.* Além das que já mostrei, a de Jesus e os pássaros de barro e a de Maria no Templo, o Alcorão traz a história dos jovens que dormiram numa caverna por séculos (18:9-26), uma lenda cristã que já circulava no século 5. E a frase \"quem mata uma pessoa é como se matasse toda a humanidade\" (5:32) já estava num livro judaico, a Mishná, mais de 350 anos antes de Muhammad.", "tr": "Şimdi Muhammed'e gelen vahiylere dönelim ve iki şeye daha dikkat edin:\n• *Muhammed'in kendisinin işine yarayan vahiyler.* Bir vahiy ona, ve sadece ona, başka hiçbir Müslümanın sahip olmadığı evlilik izinleri verdi: \"Diğer müminlere değil, sadece sana mahsus olarak\" (33:50). Bir başkası, evlatlığının eski karısı Zeyneb'le evlenmesine izin verdi (33:37). Ve eşi Aişe'nin kendisi ona şöyle dedi: \"Görüyorum ki Rabbin senin arzularını yerine getirmekte acele ediyor\" (Buhari 4788).\n• *Daha önce dolaşan hikâyeler.* Daha önce gösterdiğim kilden kuşlar ve Tapınak'taki Meryem hikâyelerinin yanında, Kur'an bir mağarada yüzyıllarca uyuyan gençlerin hikâyesini de anlatır (18:9-26); bu, 5. yüzyılda zaten dolaşan bir Hristiyan efsanesidir. \"Kim bir insanı öldürürse bütün insanlığı öldürmüş gibidir\" cümlesi de (5:32), Muhammed'den 350 yıldan fazla önce bir Yahudi kitabında, Mişna'da zaten vardı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › A Trindade explicada", "tr": "1. Bölüm: İncilleri kim yazdı › Üçlü Birlik açıklaması"}, "newPoint": false}, {"k": "para", "n": 164, "id": "p164", "pt": "E veja até onde isso chega. No Bukhari e no Muslim, as duas coleções mais respeitadas do Islã, a própria Aisha conta que Muhammad casou com ela quando ela tinha 6 anos, e consumou o casamento quando ela tinha 9 (Bukhari 5134; Muslim 1422). Não adianta querer mudar isso agora: está escrito nas fontes de vocês, e ninguém pode voltar ao passado para reescrever a história.", "tr": "Ve bunun nereye kadar vardığına bakın. İslam'ın en saygın iki koleksiyonu olan Buhari ve Müslim'de, Aişe'nin kendisi Muhammed'in onunla 6 yaşındayken evlendiğini ve 9 yaşındayken evliliği tamamladığını anlatır (Buhari 5134; Müslim 1422). Bunu şimdi değiştirmeye çalışmanın bir anlamı yok: Sizin kaynaklarınızda yazıyor ve kimse geçmişe dönüp tarihi yeniden yazamaz.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": true}, {"k": "para", "n": 165, "id": "p165", "pt": "Alguns tentam escapar dizendo que quem contou isso foi Hisham ibn Urwa, já velho e com a memória fraca. Mas isso não se sustenta:\n• *O relato não vem só dele.* Ele chegou também por outros caminhos que não passam por Hisham: por al-Aswad, que ouviu da própria Aisha, e por al-Zuhri, que ouviu de Urwa (Muslim 1422).\n• *Bukhari e Muslim conheciam essa crítica sobre Hisham*, e mesmo assim colocaram esse relato nos dois livros mais rigorosos do Islã. Se fosse um erro de memória que todos conheciam, ele nem estaria lá.\n• *E pense:* se o Bukhari e o Muslim erraram justamente aqui, em que mais eles erraram? É por esses livros que os muçulmanos aprendem a rezar, a jejuar e quase tudo o que sabem sobre Muhammad. Quem joga fora esse relato para salvar Muhammad derruba junto a confiança em todo o resto. Ou vocês aceitam o Bukhari e o Muslim, e aceitam o que eles dizem sobre Aisha, ou não podem confiar em mais nada do que está neles.", "tr": "Bazıları bunu anlatanın yaşlanmış ve hafızası zayıflamış Hişam bin Urve olduğunu söyleyerek kaçmaya çalışır. Ama bu ayakta durmaz:\n• *Rivayet sadece ondan gelmiyor.* Hişam'dan geçmeyen başka yollarla da geldi: Aişe'nin kendisinden duyan Esved yoluyla ve Urve'den duyan Zühri yoluyla (Müslim 1422).\n• *Buhari ve Müslim, Hişam hakkındaki bu eleştiriyi biliyordu*, buna rağmen bu rivayeti İslam'ın en titiz iki kitabına koydular. Herkesin bildiği bir hafıza hatası olsaydı, orada yer almazdı bile.\n• *Ve düşünün:* Buhari ve Müslim tam da burada yanıldıysa, başka nerelerde yanıldılar? Müslümanlar namazı, orucu ve Muhammed hakkında bildiklerinin neredeyse hepsini bu kitaplardan öğrenir. Muhammed'i kurtarmak için bu rivayeti atan, geri kalan her şeye olan güveni de birlikte yıkar. Ya Buhari'yi ve Müslim'i, Aişe hakkında söyledikleriyle birlikte kabul edersiniz, ya da içlerindeki hiçbir şeye güvenemezsiniz.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": false}, {"k": "para", "n": 166, "id": "p166", "pt": "O senhor pode dizer que naquela época e naquela sociedade isso era aceito. Mas o problema não é esse. O problema é que, para o Islã, Muhammad é o exemplo perfeito de conduta para todos os tempos: \"Tendes no Mensageiro de Allah um belo exemplo\" (33:21). Para todos os tempos? Então isso teria que ser normal hoje. Vocês entregariam a Zeynep, com 9 anos, a um homem para consumar um casamento com ela? Claro que não. Vocês sabem que isso é um absurdo, e mesmo assim apoiam como exemplo perfeito um homem que, pelo que todos reconhecem hoje, seria chamado de pedófilo.", "tr": "O dönemde ve o toplumda bunun kabul gördüğünü söyleyebilirsiniz. Ama sorun bu değil. Sorun şu ki, İslam'a göre Muhammed bütün zamanlar için kusursuz davranış örneğidir: \"Andolsun, Allah'ın Resulü'nde sizin için güzel bir örnek vardır\" (33:21). Bütün zamanlar için mi? O halde bunun bugün de normal olması gerekirdi. Zeynep'i 9 yaşındayken, bir adamın onunla evliliği tamamlaması için verir miydiniz? Elbette hayır. Bunun saçma olduğunu biliyorsunuz, buna rağmen bugün herkesin kabul ettiği ölçülere göre pedofil denecek bir adamı kusursuz örnek olarak destekliyorsunuz.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": false}, {"k": "para", "n": 167, "id": "p167", "pt": "Com a Bíblia é diferente. Nenhum cristão defende os erros de ninguém da Bíblia, porque nenhum profeta é considerado sem pecado. *O único que nunca pecou foi Jesus* (Hebreus 4:15). Os erros dos outros estão escritos justamente para servir de aviso, para que ninguém os repita (1 Coríntios 10:11).", "tr": "Kutsal Kitap'ta durum farklıdır. Hiçbir Hristiyan Kutsal Kitap'taki kimsenin hatasını savunmaz, çünkü hiçbir peygamber günahsız sayılmaz. *Hiç günah işlemeyen tek kişi İsa'dır* (İbraniler 4:15). Diğerlerinin hataları, tam da bir uyarı olsun ve kimse onları tekrarlamasın diye yazılmıştır (1 Korintliler 10:11).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": false}, {"k": "para", "n": 168, "id": "p168", "pt": "Salomão teve muitas mulheres, e a Bíblia diz que elas desviaram o coração dele de Deus. A poligamia nunca foi o plano de Deus: Jesus lembra que, no princípio, Deus fez um homem e uma mulher, e \"os dois serão uma só carne\" (Mateus 19:4-6). Como Jesus disse sobre o divórcio, algumas coisas foram toleradas por causa da dureza do coração dos homens, mas \"no princípio não foi assim\" (Mateus 19:8). Já no Islã, Muhammad é considerado protegido do pecado.", "tr": "Süleyman'ın birçok karısı vardı ve Kutsal Kitap onların Süleyman'ın yüreğini Tanrı'dan saptırdığını söyler. Çok eşlilik hiçbir zaman Tanrı'nın planı değildi: İsa, başlangıçta Tanrı'nın bir erkek ve bir kadın yarattığını ve \"ikisinin tek beden olacağını\" hatırlatır (Matta 19:4-6). İsa'nın boşanma hakkında söylediği gibi, bazı şeylere insanların yüreklerinin katılığı yüzünden göz yumuldu, ama \"başlangıçta böyle değildi\" (Matta 19:8). İslam'da ise Muhammed günahtan korunmuş sayılır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": false}, {"k": "para", "n": 169, "id": "p169", "pt": "Então pensem: uma revelação que vem sozinha numa caverna, sem testemunhas, que nega o Filho de Deus, que dá ao próprio Muhammad privilégios que ninguém mais tem, e que transforma em exemplo para todos os tempos o que hoje qualquer pai chama de abuso. Isso não tem a marca de Deus. Tem a marca de Satanás: normalizar o que é errado e enganar misturando verdade com mentira.", "tr": "O halde düşünün: Bir mağarada, tanıksız, tek başına gelen; Tanrı'nın Oğlu'nu inkâr eden; Muhammed'in kendisine başka kimsenin sahip olmadığı ayrıcalıklar veren ve bugün her babanın istismar diyeceği bir şeyi bütün zamanlar için örnek yapan bir vahiy. Bunda Tanrı'nın izi yok. Şeytan'ın izi var: Yanlışı normalleştirmek ve doğruyla yalanı karıştırarak aldatmak.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": false}, {"k": "para", "n": 170, "id": "p170", "pt": "E se agora vocês quiserem falar de \"milagres científicos\" ou de \"profecias\" do Alcorão: isso já foi respondido no documento que mandei para a senhora Nezahat. Lá está explicado, ponto por ponto, que não existe milagre nem profecia nenhuma: é só o conhecimento comum da época, interpretado depois para parecer ciência. É mais uma coisa que contaram para vocês e que não se sustenta.", "tr": "Ve şimdi Kur'an'ın \"bilimsel mucizelerinden\" ya da \"kehanetlerinden\" bahsetmek isterseniz: Buna Nezahat Hanım'a gönderdiğim belgede zaten cevap verildi. Orada madde madde, hiçbir mucize ya da kehanet olmadığı açıklanıyor: Sadece o dönemin herkesçe bilinen bilgisi var, sonradan bilim gibi görünsün diye yorumlanmış. Bu da size anlatılan ve ayakta durmayan bir şey daha.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": false}, {"k": "para", "n": 171, "id": "p171", "pt": "Qualquer tribunal do mundo riria de quem tentasse trocar o depoimento público de várias testemunhas oculares pelo relato de um homem que nasceu mais de 500 anos depois, que o próprio livro confessa que \"não estava lá\", e que recebia mensagens sozinho, sem ninguém para confirmar.", "tr": "Dünyadaki hiçbir mahkeme, birçok görgü tanığının herkesin önündeki ifadesini; İsa'dan 500 yıldan fazla sonra doğmuş, kendi kitabının \"orada değildin\" diye itiraf ettiği ve mesajları tek başına, doğrulayacak kimse olmadan alan bir adamın anlatımıyla değiştirmeye çalışanı ciddiye almaz, ona güler geçer.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": false}, {"k": "research", "n": 172, "id": "p172", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Testemunhas", "text": "Um vídeo diz que os autores do Novo Testamento nunca afirmaram ser testemunhas. Isso é verdade? O que dizem Lucas 1:1-4, João 19:35 e 1 João 1:1?"}, {"label": "Autoridade de Deus", "text": "Um vídeo diz que os autores do Novo Testamento nunca afirmaram escrever com autoridade de Deus. Isso é verdade? O que dizem 1 Coríntios 14:37 e 1 Tessalonicenses 2:13, cartas que até os estudiosos céticos aceitam como de Paulo?"}, {"label": "\"Tu não estavas lá\"", "text": "Os versículos 3:44, 12:102, 28:44 e 11:49 do Alcorão dizem a Muhammad que ele não estava presente nos acontecimentos que estão sendo contados?"}, {"label": "A caverna", "text": "Segundo Bukhari 3, Muhammad voltou da caverna de Hira tremendo e com medo, e foram Khadija e Waraqa que lhe disseram que aquilo vinha de Deus?"}, {"label": "Revelações a favor dele", "text": "O Alcorão 33:50 dá a Muhammad uma permissão de casamento 'exclusiva', que os outros muçulmanos não tinham? E o que Aisha disse a ele em Bukhari 4788?"}, {"label": "Histórias antigas", "text": "A história dos jovens que dormiram na caverna (Alcorão 18:9-26) já existia como lenda cristã antes do Islã? E a frase do Alcorão 5:32 sobre matar uma pessoa já estava na Mishná, em Sanhedrin 4:5?"}, {"label": "Satanás disfarçado", "text": "Em 2 Coríntios 11:14 e Gálatas 1:8, a Bíblia avisa que Satanás se disfarça de anjo de luz, e que nem um anjo do céu pode pregar outro evangelho?"}, {"label": "Amor antes da criação", "text": "Segundo Bukhari 3191, antes da criação Allah existia e não havia nada além d'Ele? E o Alcorão 85:14 chama Allah de Al-Wadud, 'o que ama'?"}, {"label": "Trindade", "text": "A doutrina cristã da Trindade ensina que existem três deuses, ou um só Deus em três pessoas?"}, {"label": "Maria", "text": "Alguma igreja cristã ensina oficialmente que Maria faz parte da Trindade?"}, {"label": "O que o Alcorão critica", "text": "No Alcorão 5:116, Allah pergunta a Jesus se ele mandou tomar a ele e à sua mãe como dois deuses além de Allah? E o 6:101 pergunta como Allah teria um filho sem ter companheira?"}, {"label": "Tawhid", "text": "A palavra 'tawhid' aparece no Alcorão?"}, {"label": "A palavra Trindade", "text": "A palavra 'Trindade' já era usada antes do Concílio de Niceia por escritores cristãos como Teófilo de Antioquia e Tertuliano?"}, {"label": "Gabriel", "text": "Um muçulmano diz que o Espírito Santo é o anjo Gabriel. Em Lucas 1:35, o anjo Gabriel fala do Espírito Santo como alguém diferente dele mesmo?"}, {"label": "Aisha", "text": "Segundo Bukhari 5134 e Muslim 1422, com que idade Aisha casou com Muhammad e com que idade o casamento foi consumado?"}, {"label": "Outras correntes", "text": "Segundo Muslim 1422, o relato da idade de Aisha também chegou por al-Aswad, que ouviu da própria Aisha, e por al-Zuhri, que ouviu de Urwa, e não só por Hisham ibn Urwa?"}, {"label": "Exemplo para sempre", "text": "O Alcorão 33:21 apresenta Muhammad como belo exemplo para os muçulmanos, e os sábios muçulmanos ensinam que ele era protegido do pecado (ismah)?"}, {"label": "Salomão", "text": "Em 1 Reis 11:3-4 e Deuteronômio 17:17, a Bíblia reprova o rei que multiplica mulheres, como Salomão?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Tanıklar", "text": "Bir video, Yeni Antlaşma yazarlarının hiçbir zaman tanık olduklarını söylemediğini iddia ediyor. Bu doğru mu? Luka 1:1-4, Yuhanna 19:35 ve 1
