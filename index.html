conteceu.\" Ninguém conseguiria espalhar uma mentira dessas no meio de tantas testemunhas e de tantos inimigos.", "tr": "Bunun ne anlama geldiğini düşünün: Markos Petrus hakkında bir şey uydursaydı, Petrus'un arkadaşları onu yalancılıkla suçlardı. Luka Pavlus hakkında bir şey uydursaydı, Pavlus'u şahsen tanıyan, onun kurduğu kiliseler onun maskesini düşürürdü. Biri, doğru olmadığı halde İsa'nın herkesin önünde mucizeler yaptığını ya da Kudüs'te çarmıha gerilerek öldüğünü söyleseydi, İsa'ya karşı olan Yahudi önderlerin \"Bu hiç olmadı\" demekte büyük çıkarı vardı. Bu kadar tanığın ve bu kadar düşmanın arasında kimse böyle bir yalanı yayamazdı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 54, "id": "p54", "pt": "E repare: os inimigos de Jesus nunca disseram que os milagres não aconteceram. Até a tradição dos líderes judeus que eram contra Jesus, registrada mais tarde no Talmude (Sanhedrin 43a), diz que ele foi executado por \"praticar feitiçaria\". E já no século 2, Justino, em Roma, e o crítico pagão Celso registram que os inimigos de Jesus o acusavam de magia, e não de não ter feito nada. Ou seja, os inimigos não negavam que ele fazia coisas extraordinárias; tentavam explicá-las de outro jeito, como feitiçaria.", "tr": "Şuna da dikkat edin: İsa'nın düşmanları mucizelerin olmadığını hiçbir zaman söylemedi. İsa'ya karşı olan Yahudi önderlerin geleneği bile, daha sonra Talmud'a kaydedildiği şekliyle, onun \"büyücülük yaptığı\" için idam edildiğini söyler (Sanhedrin 43a). Daha 2. yüzyılda Roma'da Justinus ve pagan eleştirmen Celsus da İsa'nın düşmanlarının onu hiçbir şey yapmamakla değil, büyücülükle suçladığını kaydeder. Yani düşmanları onun olağanüstü şeyler yaptığını inkâr etmiyordu; bunları büyücülük diyerek başka şekilde açıklamaya çalışıyorlardı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 55, "id": "p55", "pt": "E veja a cadeia: os nomes estão nos manuscritos, são confirmados por escritores de regiões diferentes, as cartas de Paulo mostram que Marcos e Lucas eram homens reais do círculo dos apóstolos, e os próprios Evangelhos dizem de onde vem o que contam.", "tr": "Zincire de bakın: İsimler el yazmalarında var, farklı bölgelerden yazarlar tarafından doğrulanıyor, Pavlus'un mektupları Markos'un ve Luka'nın elçilerin çevresinden gerçek kişiler olduğunu gösteriyor ve İncillerin kendisi anlattıklarının nereden geldiğini söylüyor.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 56, "id": "p56", "pt": "Já o texto do Alcorão não diz em lugar nenhum quem o reuniu, nem como. O relato detalhado de como Zayd ibn Thabit juntou os versículos e de como Uthman fez o mushaf vem de hadith como Bukhari 4986 e 4987, numa coleção reunida mais de 200 anos depois de Muhammad. Ou seja: os Evangelhos foram lidos em público enquanto as testemunhas ainda viviam; as coleções em que o senhor lê a história de como o Alcorão foi reunido foram feitas quando aquela geração já tinha morrido havia muito tempo.", "tr": "Kur'an'ın metni ise onu kimin, nasıl topladığını hiçbir yerde söylemez. Zeyd ibn Sabit'in ayetleri nasıl topladığının ve Osman'ın mushafı nasıl yazdırdığının ayrıntılı anlatımı, Muhammed'den 200 yıldan fazla sonra derlenen bir koleksiyondaki Buhari 4986 ve 4987 gibi hadislerden gelir. Yani İnciller tanıklar hâlâ hayattayken herkesin önünde okundu; Kur'an'ın nasıl toplandığının hikâyesini okuduğunuz koleksiyonlar ise o kuşak çoktan öldükten sonra derlendi.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 57, "id": "p57", "pt": "O senhor pode dizer: \"Mas o manuscrito de Birmingham, datado entre 568 e 645, mostra que o texto do Alcorão é muito antigo.\" Veja:\n• O carbono 14 data a pele do animal usada no pergaminho, não o dia em que o texto foi escrito. Tanto que a faixa começa em 568, antes de Muhammad começar a recitar, por volta do ano 610.\n• O manuscrito de Birmingham tem só duas folhas, com partes das suratas 18 a 20. Ele não mostra quem reuniu o Alcorão, nem como.\n• O manuscrito de Sana'a, outro manuscrito antigo do século 7, tem por baixo um texto diferente do Alcorão de hoje, com muitas diferenças de palavras e expressões e as suratas em outra ordem. E veja o que aconteceu com ele: esse texto diferente foi raspado e apagado, e por cima escreveram o texto padrão de Uthman. É exatamente o que Uthman mandou fazer com as outras cópias: eliminar o que era diferente. Na Bíblia aconteceu o contrário: nenhuma autoridade cristã mandou queimar cópias dos quatro Evangelhos para trocar o texto deles por outro, por isso elas foram guardadas e podem ser comparadas até hoje. Do Alcorão, o diferente foi queimado ou apagado, e quase só sobrou o texto de Uthman. Isso nem se compara às variações da Bíblia: lá, tudo foi guardado e pode ser conferido; aqui, as provas foram destruídas.\n• E o mais importante para o nosso assunto: mesmo o manuscrito mais antigo do Alcorão está a uns 600 anos de Jesus. Quando o assunto é Jesus, o que importa é a distância até Jesus, não até Muhammad. Os manuscritos do Novo Testamento que sobreviveram até hoje estão a 100 ou 300 anos de Jesus, e os livros em si foram escritos poucas décadas depois dele. O Alcorão, por mais antigo que seja o pergaminho, está a 600.\n• E não adianta dizer: \"Mas o Alcorão tem manuscritos mais perto de Muhammad do que os do Novo Testamento estão de Jesus.\" Os manuscritos antigos do Alcorão vêm depois que Uthman queimou as outras cópias: eles só mostram o texto de quem queimou, e o pouco que sobrou de antes, como o texto de baixo de Sana'a, é diferente. Já o Novo Testamento se espalhou desde o começo por regiões diferentes, sem nenhum chefe que controlasse as cópias. Os manuscritos do Egito, os antigos em latim, do Ocidente, e os antigos em siríaco, do Oriente, vêm de linhas de cópia diferentes. Pense: se alguém tivesse mudado a mensagem nos primeiros anos, num lugar, os outros lugares não teriam essa mudança, e as linhas não concordariam. E elas concordam: o mesmo Jesus, a mesma cruz, a mesma ressurreição.", "tr": "Şöyle diyebilirsiniz: \"Ama 568 ile 645 yılları arasına tarihlenen Birmingham el yazması, Kur'an metninin çok eski olduğunu gösteriyor.\" Şunlara bakın:\n• Karbon 14, metnin yazıldığı günü değil, parşömende kullanılan hayvan derisini tarihler. Bu yüzden aralık, Muhammed'in yaklaşık 610 yılında okumaya başlamasından önce, 568'de başlıyor.\n• Birmingham el yazması, 18 ile 20. surelerin bazı kısımlarını içeren sadece iki yapraktır. Kur'an'ı kimin, nasıl topladığını göstermez.\n• 7. yüzyıldan kalma bir başka eski el yazması olan San'a el yazmasının altında, bugünkü Kur'an'dan farklı bir metin var: Kelime ve ifadelerde birçok farklılık ve farklı bir sure sırası. Bu el yazmasına ne olduğuna da bakın: Bu farklı metin kazınıp silinmiş ve üstüne Osman'ın standart metni yazılmış. Bu, tam da Osman'ın diğer nüshalar için emrettiği şeydir: farklı olanı yok etmek. Kutsal Kitap'ta ise tam tersi oldu: Hiçbir Hristiyan otorite, dört İncil'in metnini başka bir metinle değiştirmek için onların nüshalarının yakılmasını emretmedi; bu yüzden farklı nüshalar korundu ve bugün bile karşılaştırılabiliyor. Kur'an'da ise farklı olan yakıldı ya da silindi ve geriye neredeyse sadece Osman'ın metni kaldı. Bunun, Kutsal Kitap'taki farklılıklarla kıyaslanacak yanı bile yok: Orada her şey korundu ve kontrol edilebilir; burada ise deliller yok edildi.\n• Konumuz açısından en önemlisi de şu: En eski Kur'an el yazması bile İsa'dan yaklaşık 600 yıl uzaktadır. Konu İsa olduğunda önemli olan Muhammed'e olan uzaklık değil, İsa'ya olan uzaklıktır. Bugüne kadar ulaşan Yeni Antlaşma el yazmaları İsa'dan 100 ile 300 yıl sonraya aittir; kitapların kendisi ise O'ndan birkaç on yıl sonra yazıldı. Kur'an ise, parşömeni ne kadar eski olursa olsun, 600 yıl sonradır.\n• \"Ama Kur'an'ın el yazmaları Muhammed'e, Yeni Antlaşma'nın el yazmalarının İsa'ya olduğundan daha yakın\" demek de işe yaramaz. Kur'an'ın eski el yazmaları, Osman diğer nüshaları yaktıktan sonra gelir: Sadece yakanın metnini gösterirler ve öncesinden kalan az şey, San'a'nın alttaki metni gibi, farklıdır. Yeni Antlaşma ise en başından beri, nüshaları kontrol eden hiçbir lider olmadan farklı bölgelere yayıldı. Mısır'dan gelen el yazmaları, Batı'dan eski Latince olanlar ve Doğu'dan eski Süryanice olanlar farklı kopya hatlarından gelir. Düşünün: İlk yıllarda biri mesajı bir yerde değiştirmiş olsaydı, diğer yerlerde bu değişiklik olmazdı ve hatlar birbiriyle uyuşmazdı. Ama uyuşuyorlar: aynı İsa, aynı çarmıh, aynı diriliş.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 58, "id": "p58", "pt": "✅ *Repare em como o vídeo trata o senhor.*\nEle conta que o senhor não vai pesquisar. Tudo isso se descobre em poucos minutos no Google. Quem faz um vídeo assim ou não sabe nada do assunto, ou sabe e esconde. Nas duas opções, não merece a sua confiança.", "tr": "✅ *Videonun size nasıl davrandığına dikkat edin.*\nAraştırmayacağınıza güveniyor. Bütün bunlar Google'da birkaç dakikada bulunur. Böyle bir video yapan kişi ya konuyu hiç bilmiyor ya da biliyor ve saklıyor. İki durumda da güveninizi hak etmiyor.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "research", "n": 59, "id": "p59", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Títulos", "text": "Existe algum manuscrito antigo do Evangelho que hoje chamamos de Mateus, de Marcos, de Lucas ou de João, ou seja, desses mesmos textos, em que o título dê o livro a outro autor? Não estou perguntando sobre outros evangelhos, como os apócrifos, mas só sobre esses quatro textos."}, {"label": "Papiros", "text": "O Papiro 75 traz os títulos 'Evangelho segundo Lucas' e 'Evangelho segundo João', o Papiro 66 traz 'Evangelho segundo João', e uma folha de guarda ligada ao Papiro 4 traz 'Evangelho segundo Mateus'? De que época são esses papiros? E os primeiros códices completos, como o Sinaítico e o Vaticano, trazem os títulos dos quatro?"}, {"label": "Hebreus", "text": "Na igreja antiga, igrejas diferentes deram autores diferentes para a carta aos Hebreus, e Orígenes disse que só Deus sabe quem a escreveu? E, fora grupos que rejeitavam um Evangelho por causa da doutrina, como os álogos, algum escritor antigo atribuiu um dos quatro Evangelhos a um autor diferente de Mateus, Marcos, Lucas ou João?"}, {"label": "Quem era o \"nós\"", "text": "Quem eram os companheiros de Paulo citados como 'eles' em Atos 20:4-5, separados do 'nós'? O 'nós' chega com Paulo até Roma (Atos 28:16)? E quem estava com Paulo quando ele escreveu, preso, Filemom 24, uma carta aceita até pelos céticos, e Colossenses 4:14?"}, {"label": "Nomes que ninguém inventaria", "text": "Marcos e Lucas eram apóstolos? E os evangelhos falsos dos séculos 2 e 3, como os de Pedro, Tomé, Filipe, Maria e Judas, usavam nomes de pessoas famosas? Se a igreja quisesse inventar autores, faria sentido escolher Marcos e Lucas?"}, {"label": "Terceira pessoa", "text": "Júlio César na Guerra das Gálias, Xenofonte na Anábase e Josefo na Guerra dos Judeus falam de si mesmos na terceira pessoa, e os historiadores duvidam por isso que eles sejam os autores? E no Alcorão, Allah (2:173) e Muhammad (48:29) aparecem na terceira pessoa?"}, {"label": "Céticos e a cruz", "text": "Os estudiosos que duvidam dos autores tradicionais dos Evangelhos, como Bart Ehrman e John Dominic Crossan, aceitam que Jesus foi crucificado sob Pôncio Pilatos?"}, {"label": "Alcorão", "text": "Segundo Bukhari 4986, Zayd ibn Thabit encontrou os últimos versículos da surata 9 com quantas pessoas? Segundo Bukhari 4987, Uthman mandou queimar as outras cópias do Alcorão? E as diferenças entre o mushaf de Ibn Mas'ud, que Muhammad indicou como mestre do Alcorão em Bukhari 4999, e o de Uthman eram só de pronúncia, ou incluíam suratas, ordem e palavras diferentes, como a ausência das suratas 113 e 114 (Bukhari 4977)?"}, {"label": "Teodoreto", "text": "No século 5, o bispo Teodoreto de Ciro recolheu cópias do Diatessaron, uma harmonia dos Evangelhos, para colocar no lugar os quatro Evangelhos completos? E os livros que imperadores cristãos mandaram queimar eram cópias dos Evangelhos ou livros considerados heréticos?"}, {"label": "Distância", "text": "Quantos anos separam Jesus do manuscrito mais antigo do Alcorão, e quantos separam Jesus dos manuscritos mais antigos do Novo Testamento?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Başlıklar", "text": "Bugün Matta, Markos, Luka ya da Yuhanna dediğimiz İncillerin, yani bu aynı metinlerin, başlığında kitabı başka bir yazara veren eski bir el yazması var mı? Apokrif İnciller gibi başka metinleri değil, sadece bu dört metni soruyorum."}, {"label": "Papirüsler", "text": "Papirüs 75'te 'Luka'ya göre İncil' ve 'Yuhanna'ya göre İncil', Papirüs 66'da 'Yuhanna'ya göre İncil' başlıkları, Papirüs 4'le bağlantılı bir koruma yaprağında da 'Matta'ya göre İncil' başlığı var mı? Bu papirüsler hangi döneme ait? Sina ve Vatikan kodeksleri gibi ilk tam kodeksler dördünün de başlığını taşıyor mu?"}, {"label": "İbraniler", "text": "Eski kilisede farklı kiliseler İbraniler'e mektuba farklı yazarlar verdi mi ve Origenes onu kimin yazdığını sadece Tanrı'nın bildiğini söyledi mi? Alogoi gibi bir İncil'i öğreti yüzünden reddeden gruplar dışında, eski yazarlardan biri dört İncil'den birini Matta, Markos, Luka ya da Yuhanna dışında bir yazara atfetti mi?"}, {"label": "\"Biz\" kimdi", "text": "Elçilerin İşleri 20:4-5'te 'biz'den ayrı olarak 'onlar' diye anılan Pavlus'un arkadaşları kimlerdi? 'Biz' Pavlus'la birlikte Roma'ya kadar gidiyor mu (Elçilerin İşleri 28:16)? Pavlus hapisteyken, şüphecilerin bile kabul ettiği Filimon 24'ü ve Koloseliler 4:14'ü yazdığında yanında kim vardı?"}, {"label": "Kimsenin uydurmayacağı isimler", "text": "Markos ve Luka elçi miydi? 2. ve 3. yüzyıldaki Petrus, Tomas, Filipus, Meryem ve Yahuda İncilleri gibi sahte İnciller meşhur kişilerin isimlerini mi kullanıyordu? Kilise yazar uydurmak isteseydi, Markos'u ve Luka'yı seçmesi mantıklı olur muydu?"}, {"label": "Üçüncü şahıs", "text": "Jül Sezar Galya Savaşları'nda, Ksenophon Anabasis'te ve Josephus Yahudi Savaşı'nda kendilerinden üçüncü şahıs olarak mı bahseder ve tarihçiler bu yüzden onların yazar olduğundan şüphe ediyor mu? Kur'an'da Allah (2:173) ve Muhammed (48:29) üçüncü şahıs olarak mı geçiyor?"}, {"label": "Şüpheciler ve çarmıh", "text": "İncillerin geleneksel yazarlarından şüphe eden Bart Ehrman ve John Dominic Crossan gibi araştırmacılar, İsa'nın Pontius Pilatus döneminde çarmıha gerildiğini kabul ediyor mu?"}, {"label": "Kur'an", "text": "Buhari 4986'ya göre Zeyd ibn Sabit Tevbe suresinin son ayetlerini kaç kişide buldu? Buhari 4987'ye göre Osman Kur'an'ın diğer nüshalarının yakılmasını emretti mi? Muhammed'in Buhari 4999'da Kur'an öğretmeni olarak gösterdiği İbn Mesud'un mushafı ile Osman'ın mushafı arasındaki farklar sadece telaffuz farkı mıydı, yoksa 113 ve 114. surelerin olmaması (Buhari 4977) gibi sure, sıra ve kelime farklarını da içeriyor muydu?"}, {"label": "Teodoret", "text": "5. yüzyılda Kirroslu piskopos Teodoret, Diatessaron adlı İncil harmonisinin nüshalarını, yerlerine dört İncil'in tam halini koymak için mi topladı? Hristiyan imparatorların yakılmasını emrettiği kitaplar İncillerin nüshaları mıydı, yoksa sapkın sayılan kitaplar mı?"}, {"label": "Uzaklık", "text": "En eski Kur'an el yazması ile İsa arasında kaç yıl var, Yeni Antlaşma'nın en eski el yazmaları ile İsa arasında kaç yıl var?"}]}}, {"k": "trans", "n": 63, "id": "p63", "pt": "Agora vamos para o próximo erro do vídeo.", "tr": "Şimdi videonun bir sonraki hatasına geçelim.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 64, "id": "p64", "pt": "❌ *O que o vídeo diz:* que os Evangelhos foram escritos de 40 a 70 anos depois de Jesus, e que ninguém conseguiria lembrar das palavras de alguém depois de tanto tempo.", "tr": "❌ *Videonun söylediği:* İncillerin İsa'dan 40 ile 70 yıl sonra yazıldığı ve bu kadar zaman sonra kimsenin birinin sözlerini hatırlayamayacağı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": true}, {"k": "para", "n": 65, "id": "p65", "pt": "Fatih Bey, esse argumento é tão ilógico que, se for aplicado de verdade, o Islã é destruído na hora e o cristianismo continua de pé tranquilamente. Esse é o problema de confiar nos argumentos ridículos de quem só quer defender o próprio lado a qualquer custo, mesmo que precise negar a realidade. Sei que vocês já devem estar revoltados por ouvirem tantas verdades e perceberem que estão sem saída, mas é só o começo. A verdade dói.", "tr": "Fatih Bey, bu argüman o kadar mantıksız ki, gerçekten uygulanırsa İslam anında yıkılır, Hristiyanlık ise rahatça ayakta kalır. Kendi tarafını ne pahasına olursa olsun, gerçeği inkâr etmesi gerekse bile savunmak isteyen birinin gülünç argümanlarına güvenmenin sorunu budur. Bu kadar gerçeği duyup çıkışınız olmadığını fark ettiğiniz için şimdiden öfkelendiğinizi biliyorum, ama bu daha başlangıç. Gerçek acıtır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 66, "id": "p66", "pt": "E, como já avisei, tudo o que está aqui pode ser pesquisado e conferido. Não vai adiantar contar historinha nem tentar desconversar misturando mentiras para confundir a Zeynep. Eu não sou a Zeynep; eu não recuo na hora de expor os fatos e colocar a verdade na mesa. É covardia querer cobrar conhecimento profundo de história antiga de alguém que está começando agora na fé. E, mesmo assim, o pouco que ela falou já bastava para mostrar o erro de vocês: bastava terem a honestidade de pesquisar o que ela disse, em vez de engolirem de olhos fechados tudo o que um mentiroso fala no YouTube.", "tr": "Daha önce de uyardığım gibi, burada yazılan her şey araştırılabilir ve kontrol edilebilir. Masal anlatmak ya da Zeynep'in kafasını karıştırmak için yalanları birbirine katarak konuyu değiştirmeye çalışmak işe yaramayacak. Ben Zeynep değilim; gerçekleri ortaya koyarken ve doğruyu masaya koyarken geri adım atmam. İmanda yolun daha başında olan birinden eski tarih hakkında derin bilgi beklemek korkaklıktır. Buna rağmen, onun söylediği az şey bile yanıldığınızı göstermeye yetiyordu: YouTube'daki bir yalancının söylediği her şeyi gözü kapalı yutmak yerine, onun söylediklerini araştıracak dürüstlüğü göstermeniz yeterdi.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 67, "id": "p67", "pt": "É exatamente por isso que eu faço questão de escrever documentos longos e detalhados assim: para não sobrar espaço para dúvida nem para desculpas. Não adianta tentar me diminuir ou me menosprezar, porque isso não muda os fatos. Querem mostrar que estou errado? Pesquisem e apresentem as provas! Vocês podem tentar o quanto quiserem, mas não vão conseguir, a não ser que consigam voltar no tempo e apagar os livros e a história. E, como ninguém pode mudar o passado, vocês não têm para onde fugir.", "tr": "Bu kadar uzun ve ayrıntılı belgeler yazmayı tam da bu yüzden önemsiyorum: Şüpheye de bahaneye de yer kalmasın diye. Beni küçültmeye ya da küçümsemeye çalışmak işe yaramaz, çünkü bu gerçekleri değiştirmez. Yanıldığımı mı göstermek istiyorsunuz? Araştırın ve delilleri ortaya koyun! İstediğiniz kadar deneyebilirsiniz, ama başaramayacaksınız; tabii zamanda geriye gidip kitapları ve tarihi silemezseniz. Ve kimse geçmişi değiştiremeyeceğine göre, kaçacak yeriniz yok.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 68, "id": "p68", "pt": "Eu não queria colocar um peso tão grande sobre vocês, mas vocês mesmos pediram por isso. Antes, vocês ainda tinham a desculpa de dizer que não sabiam; agora, a verdade está escancarada diante dos seus olhos, e tentar fugir dela só vai pesar cada vez mais na consciência de vocês. Foram precisos 50 anos de vida para que alguém finalmente colocasse a verdade sobre Jesus frente a frente com vocês; mas esse dia chegou. Agora não dá mais para fingir que não viram: cabe a vocês decidirem se vão ter a coragem de aceitar a verdade ou se vão preferir continuar abraçados com uma mentira de estimação.", "tr": "Size bu kadar büyük bir yük yüklemek istemezdim, ama bunu siz kendiniz istediniz. Önceden hâlâ bilmediğinizi söyleme bahaneniz vardı; şimdi gerçek gözlerinizin önünde apaçık duruyor ve ondan kaçmaya çalışmak vicdanınıza giderek daha ağır gelecek. Birinin sonunda İsa hakkındaki gerçeği karşınıza koyması için 50 yıllık bir hayat gerekti; ama o gün geldi. Artık görmemiş gibi yapamazsınız: Gerçeği kabul etme cesaretini mi göstereceksiniz, yoksa çok sevdiğiniz bir yalana sarılmaya devam etmeyi mi tercih edeceksiniz, buna siz karar vereceksiniz.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 69, "id": "p69", "pt": "E não tomem isso como ofensa, porque chamar de mentira aquilo que as provas mostram que é falso não é falta de respeito: é falar a realidade. Lembrem-se bem disto: não importa por quantos anos a senhora Nezahat deu aulas sobre o Islã, nem quantos livros vocês leram ou quantas histórias ouviram a vida inteira: mentira + mentira + mentira nunca vai virar verdade.", "tr": "Ve bunu bir hakaret olarak almayın, çünkü delillerin yanlış olduğunu gösterdiği şeye yalan demek saygısızlık değildir: Gerçeği söylemektir. Şunu iyi hatırlayın: Nezahat Hanım'ın kaç yıl İslam dersi verdiği, kaç kitap okuduğunuz ya da hayatınız boyunca kaç hikâye dinlediğiniz önemli değil: yalan + yalan + yalan asla gerçek olmaz.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 70, "id": "p70", "pt": "Mesmo assim, Deus é tão bom e misericordioso que opera milagres até na vida de muçulmanos e de ateus, porque Ele ama vocês e está chamando vocês para uma mudança real. Parem um segundo e pensem: quando, na vida de vocês, alguém se importou tanto a ponto de insistir dessa forma e passar 12 horas seguidas escrevendo e reunindo provas só por amor à alma de vocês?", "tr": "Yine de Tanrı o kadar iyi ve merhametlidir ki, Müslümanların ve ateistlerin hayatında bile mucizeler yapar, çünkü sizi seviyor ve sizi gerçek bir değişime çağırıyor. Bir saniye durun ve düşünün: Hayatınızda ne zaman biri sizi bu kadar önemsedi ki bu şekilde ısrar etsin ve sırf ruhunuzu sevdiği için 12 saat boyunca aralıksız yazıp deliller toplasın?", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 71, "id": "p71", "pt": "Nós não sabemos o dia nem a hora em que vamos partir deste mundo, e por isso a mensagem do Evangelho é urgente. Quantas pessoas não estão perdendo a eternidade por confiarem em gente desinformada? Vocês passaram décadas cobertos por desinformação, e eu estou aqui para entregar a verdadeira Boa-Nova: a verdade de que Cristo, o Cordeiro de Deus, morreu na cruz para pagar o preço dos nossos pecados e abrir o caminho de volta para o Pai, para que todo aquele que Nele crer e seguir os Seus mandamentos tenha a vida eterna.", "tr": "Bu dünyadan hangi gün ve hangi saatte gideceğimizi bilmiyoruz, bu yüzden İncil'in mesajı acildir. Bilgisiz insanlara güvendikleri için kaç kişi sonsuzluğu kaybediyor? Onlarca yıl yanlış bilgiyle örtüldünüz ve ben size gerçek Müjde'yi getirmek için buradayım: Tanrı'nın Kuzusu Mesih'in, günahlarımızın bedelini ödemek ve Baba'ya dönüş yolunu açmak için çarmıhta öldüğü gerçeğini; öyle ki O'na iman eden ve O'nun buyruklarına uyan herkes sonsuz yaşama sahip olsun.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 72, "id": "p72", "pt": "É isso o que eu desejo para vocês de todo o meu coração, e tudo o que está ao meu alcance fazer por vocês, eu estou fazendo. Agora, vejam nas provas abaixo por que o vídeo também está completamente errado neste ponto:", "tr": "Size bütün kalbimle dilediğim budur ve sizin için elimden gelen her şeyi yapıyorum. Şimdi, videonun bu noktada da neden tamamen yanıldığını aşağıdaki delillerde görün:", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 73, "id": "p73", "pt": "✅ *Prova 1: as palavras de Jesus já estavam registradas muito antes de 40 anos.*\nO vídeo finge que, durante 40 anos, ninguém registrou nada, e que tudo dependeu de alguém tentando lembrar do passado décadas depois. Isso é falso.", "tr": "✅ *1. delil: İsa'nın sözleri 40 yıldan çok önce kayıtlıydı.*\nVideo, 40 yıl boyunca kimsenin hiçbir şey kaydetmediğini ve her şeyin, onlarca yıl sonra geçmişi hatırlamaya çalışan birine bağlı olduğunu iddia ediyor. Bu yanlıştır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 74, "id": "p74", "pt": "Na primeira carta aos Coríntios, escrita por volta do ano 55, uns 25 anos depois da cruz, e aceita até pelos estudiosos mais céticos, Paulo não lembra só da morte e da ressurreição de Jesus, que apareceu a mais de 500 testemunhas, \"a maior parte das quais ainda vive\" (1 Coríntios 15:3-6). Ele repete as palavras de Jesus na Última Ceia: \"Isto é o meu corpo... façam isto em memória de mim\" (1 Coríntios 11:23-25), as mesmas que estão em Lucas. Na mesma carta, cita o ensino de Jesus sobre o casamento e sobre o sustento de quem prega.", "tr": "Yaklaşık 55 yılında, yani çarmıhtan yaklaşık 25 yıl sonra yazılan ve en şüpheci araştırmacıların bile kabul ettiği Korintliler'e Birinci Mektup'ta Pavlus, sadece İsa'nın ölümünü ve dirilişini, \"çoğu hâlâ yaşayan\" 500'den fazla tanığa göründüğünü hatırlatmakla kalmaz (1 Korintliler 15:3-6). İsa'nın Son Akşam Yemeği'ndeki sözlerini de tekrarlar: \"Bu benim bedenimdir... Beni anmak için bunu yapın\" (1 Korintliler 11:23-25); Luka'daki sözlerin aynısı. Aynı mektupta İsa'nın evlilik ve vaaz edenlerin geçimi hakkındaki öğretilerini de aktarır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 75, "id": "p75", "pt": "E logo no começo do seu Evangelho, Lucas diz que, antes dele, \"muitos já tinham posto em ordem\" a história de Jesus, conforme as testemunhas oculares a transmitiram desde o princípio (Lucas 1:1-2). Os registros não começaram 40 anos depois: começaram com a própria geração que andou com Jesus.", "tr": "Luka da İncili'nin hemen başında, kendisinden önce \"birçok kişinin\", baştan beri görgü tanıklarının aktardığı şekliyle İsa'nın hikâyesini \"sıraya koymaya\" giriştiğini söyler (Luka 1:1-2). Kayıtlar 40 yıl sonra başlamadı: İsa'yla birlikte dolaşan kuşağın kendisiyle başladı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 76, "id": "p76", "pt": "✅ *Prova 2: há provas fortes de que Marcos, Lucas e Atos foram escritos antes do ano 70.*\nPor que muitos colocam os Evangelhos depois do ano 70? Porque neles Jesus anuncia que o Templo de Jerusalém seria destruído, o que aconteceu no ano 70. Como não acreditam em profecia, concluem que o texto foi escrito depois. Isso não é prova, é suposição. Agora veja o livro de Atos, escrito por Lucas depois do seu Evangelho:\n• Atos conta a história da igreja passo a passo, mas termina de repente, por volta do ano 62, com Paulo ainda vivo, preso numa casa em Roma.\n• Atos não conta a morte de Paulo, nem a de Pedro, nem a de Tiago, irmão de Jesus, que aconteceram entre os anos 62 e 67. Também não conta a perseguição de Nero, no ano 64, nem a destruição do Templo, no ano 70.\nPor que Lucas não contaria a morte dos heróis do próprio livro, nem a queda de Jerusalém? Pela razão mais simples: *quando ele terminou de escrever, nada disso tinha acontecido*. E se Atos é de por volta do ano 62, o Evangelho de Lucas, que veio antes, e o de Marcos, que Lucas usou, são ainda mais antigos: uns 20 a 30 anos depois da cruz.", "tr": "✅ *2. delil: Markos'un, Luka'nın ve Elçilerin İşleri'nin 70 yılından önce yazıldığına dair güçlü deliller var.*\nBirçok kişi İncilleri neden 70 yılından sonraya koyuyor? Çünkü İncillerde İsa, Kudüs Tapınağı'nın yıkılacağını bildiriyor; bu da 70 yılında oldu. Kehanete inanmadıkları için metnin daha sonra yazıldığı sonucuna varıyorlar. Bu bir delil değil, bir varsayımdır. Şimdi Luka'nın, İncili'nden sonra yazdığı Elçilerin İşleri'ne bakın:\n• Elçilerin İşleri kilisenin hikâyesini adım adım anlatır, ama yaklaşık 62 yılında, Pavlus Roma'da bir evde tutuklu ve hâlâ hayattayken aniden biter.\n• Elçilerin İşleri, 62 ile 67 yılları arasında gerçekleşen Pavlus'un, Petrus'un ve İsa'nın kardeşi Yakup'un ölümünü anlatmaz. 64 yılındaki Neron zulmünü ve 70 yılında Tapınağın yıkılışını da anlatmaz.\nLuka neden kendi kitabının kahramanlarının ölümünü ve Kudüs'ün düşüşünü anlatmasın? En basit sebepten: *Yazmayı bitirdiğinde bunların hiçbiri henüz olmamıştı.* Elçilerin İşleri yaklaşık 62 yılına aitse, ondan önce gelen Luka İncili ve Luka'nın kullandığı Markos İncili daha da eskidir: çarmıhtan yaklaşık 20 ile 30 yıl sonra.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 77, "id": "p77", "pt": "✅ *Prova 3: mesmo 30 ou 60 anos é muito pouco tempo para a história antiga.*\nAs principais biografias de Alexandre, o Grande, as de Plutarco e Arriano, foram escritas mais de 400 anos depois da morte dele, e os historiadores confiam nelas. A biografia do imperador Augusto, escrita por Suetônio, é de uns 100 anos depois. Os Evangelhos foram escritos enquanto ainda viviam amigos, parentes e inimigos que tinham visto e ouvido Jesus.", "tr": "✅ *3. delil: 30 ya da 60 yıl bile eski tarih için çok kısa bir süredir.*\nBüyük İskender'in en önemli biyografileri olan Plutarkhos'un ve Arrianos'un eserleri, onun ölümünden 400 yıldan fazla sonra yazıldı ve tarihçiler onlara güvenir. İmparator Augustus'un Suetonius tarafından yazılan biyografisi de yaklaşık 100 yıl sonrasına aittir. İnciller ise İsa'yı görmüş ve duymuş dostlar, akrabalar ve düşmanlar hâlâ hayattayken yazıldı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 78, "id": "p78", "pt": "✅ *Prova 4: a memória judaica e o jeito de Jesus ensinar.*\nO vídeo julga o mundo antigo como se fosse o homem de hoje, que esquece tudo porque anota tudo no celular. Na Judeia do século 1, os discípulos eram treinados para decorar os ensinos do seu mestre.", "tr": "✅ *4. delil: Yahudi hafıza kültürü ve İsa'nın öğretme biçimi.*\nVideo eski dünyayı, her şeyi telefonuna yazdığı için her şeyi unutan bugünün insanı gibi değerlendiriyor. 1. yüzyıl Yahudiye'sinde öğrenciler, öğretmenlerinin öğretilerini ezberlemek üzere yetiştirilirdi.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 79, "id": "p79", "pt": "E Jesus ensinava com parábolas curtas, frases com ritmo e comparações fáceis de guardar, como a do filho pródigo e a do bom samaritano. Ninguém esquece uma história como a do filho pródigo.", "tr": "İsa da kısa benzetmelerle, ritimli cümlelerle ve akılda kalması kolay karşılaştırmalarla öğretirdi; kaybolan oğul ve iyi Samiriyeli gibi. Kimse kaybolan oğul gibi bir hikâyeyi unutmaz.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 80, "id": "p80", "pt": "E não era a memória de um homem sozinho, 40 anos depois: era a memória de uma comunidade inteira. Como já mostrei, os ensinos de Jesus eram repetidos em público, na presença dos apóstolos e de testemunhas vivas, que corrigiriam qualquer mudança.", "tr": "Bu, 40 yıl sonra tek başına hatırlamaya çalışan bir adamın hafızası değildi: bütün bir topluluğun hafızasıydı. Daha önce gösterdiğim gibi, İsa'nın öğretileri elçilerin ve her değişikliği düzeltecek canlı tanıkların önünde, herkesin önünde tekrarlanıyordu.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 81, "id": "p81", "pt": "Os muçulmanos dizem que a memorização guardou o Alcorão. Mas o próprio Bukhari mostra que só a memória não bastou: Umar teve medo de que grande parte do Alcorão se perdesse com a morte dos recitadores, Zayd procurou o Alcorão nos escritos e na memória dos homens, e mesmo assim um versículo só foi encontrado com um homem, e Uthman teve que queimar as cópias diferentes (Bukhari 4986 e 4987). Com os Evangelhos é diferente: além da memória, houve registro escrito desde cedo, pregação pública diante de testemunhas e quatro relatos que concordam.", "tr": "Müslümanlar Kur'an'ı ezberin koruduğunu söyler. Ama Buhari'nin kendisi sadece hafızanın yetmediğini gösterir: Ömer kurraların ölmesiyle Kur'an'ın büyük bir kısmının kaybolmasından korktu, Zeyd Kur'an'ı hem yazılı olanlarda hem de insanların hafızasında aradı, buna rağmen bir ayet sadece tek bir adamda bulundu ve Osman farklı nüshaları yakmak zorunda kaldı (Buhari 4986 ve 4987). İncillerde ise durum farklıdır: Hafızanın yanında, erken dönemden itibaren yazılı kayıt, tanıkların önünde açık vaaz ve birbiriyle uyuşan dört anlatım vardır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 82, "id": "p82", "pt": "✅ *Prova 5: a regra do vídeo destrói as fontes do Islã, e não toca nos Evangelhos.*\nSe não dá para confiar no que foi escrito 40 a 70 anos depois, veja o que acontece com o Islã:\n• *O Alcorão sobre Jesus, 600 anos depois:* o Alcorão traz falas de Jesus, inclusive falando no berço (19:29-33), escritas 600 anos depois dele, a mais de mil quilômetros de Jerusalém, sem nenhuma testemunha. *Se 40 anos é muito tempo, como 600 anos pode ser confiável?*\n• *A biografia de Muhammad, 120 a 200 anos depois:* a primeira biografia de Muhammad, a de Ibn Ishaq, foi escrita uns 120 anos depois da morte dele, e o original se perdeu: só temos a versão de Ibn Hisham, uns 200 anos depois.\n• *Os hadith, mais de 200 anos depois:* grande parte do que um muçulmano sabe sobre o que Muhammad disse e fez vem de coleções como a de Bukhari, que morreu no ano 870, uns 238 anos depois de Muhammad.", "tr": "✅ *5. delil: Videonun kuralı İslam'ın kaynaklarını yıkar, İncillere ise dokunmaz.*\n40 ile 70 yıl sonra yazılana güvenilemiyorsa, İslam'a ne olduğuna bakın:\n• *600 yıl sonra İsa hakkında Kur'an:* Kur'an, İsa'nın beşikte konuşması da dahil (19:29-33) sözlerini aktarır; hem de İsa'dan 600 yıl sonra, Kudüs'ten bin kilometreden fazla uzakta ve hiçbir tanık olmadan. *40 yıl çok uzunsa, 600 yıl nasıl güvenilir olabilir?*\n• *120 ile 200 yıl sonra Muhammed'in biyografisi:* Muhammed'in ilk biyografisi olan İbn İshak'ınki, ölümünden yaklaşık 120 yıl sonra yazıldı ve aslı kayboldu: Elimizde sadece yaklaşık 200 yıl sonraki İbn Hişam versiyonu var.\n• *200 yıldan fazla sonra hadisler:* Bir Müslümanın Muhammed'in söyledikleri ve yaptıkları hakkında bildiklerinin büyük kısmı, Muhammed'den yaklaşık 238 yıl sonra, 870 yılında ölen Buhari'ninki gibi koleksiyonlardan gelir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 83, "id": "p83", "pt": "O senhor pode dizer: \"Mas os hadith têm o isnad, a corrente de quem ouviu de quem, e Bukhari verificou tudo.\" Pense nisto: segundo a própria tradição islâmica, Bukhari examinou cerca de 600 mil relatos e colocou no livro pouco mais de 7 mil, contando as repetições. E os próprios sábios muçulmanos reconhecem que muitos hadith falsos foram inventados e espalhados com correntes de nomes que pareciam boas, quando já não havia testemunhas vivas para desmentir.", "tr": "Şöyle diyebilirsiniz: \"Ama hadislerin isnadı, yani kimin kimden duyduğunu gösteren zinciri var ve Buhari her şeyi kontrol etti.\" Şunu düşünün: İslami geleneğin kendisine göre Buhari yaklaşık 600 bin rivayeti inceledi ve tekrarlarla birlikte 7 binden biraz fazlasını kitabına aldı. Müslüman alimlerin kendileri de, onları yalanlayacak canlı tanıklar artık yokken, iyi görünen isim zincirleriyle birçok sahte hadisin uydurulup yayıldığını kabul eder.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 84, "id": "p84", "pt": "Nos hadith, o senhor precisa confiar numa corrente de várias pessoas passando uma frase de geração em geração por mais de 200 anos. Nos Evangelhos não existe corrente de 200 anos: temos testemunhas que viram Jesus, como Mateus e João, e companheiros diretos das testemunhas, como Marcos, ao lado de Pedro, e Lucas, ao lado de Paulo, escrevendo enquanto a primeira geração ainda vivia.", "tr": "Hadislerde, bir cümleyi 200 yıldan fazla kuşaktan kuşağa aktaran birçok kişiden oluşan bir zincire güvenmeniz gerekir. İncillerde 200 yıllık bir zincir yoktur: Matta ve Yuhanna gibi İsa'yı görmüş tanıklar ve Petrus'un yanındaki Markos ile Pavlus'un yanındaki Luka gibi tanıkların doğrudan arkadaşları, ilk kuşak hâlâ yaşarken yazdılar.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "research", "n": 85, "id": "p85", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Alexandre", "text": "Quantos anos depois da morte de Alexandre, o Grande, Plutarco e Arriano escreveram as biografias dele? E quantos anos depois da morte de Augusto Suetônio escreveu a dele? Os historiadores confiam nessas biografias?"}, {"label": "1 Coríntios", "text": "Em que ano foi escrita a primeira carta aos Coríntios, e os estudiosos céticos aceitam que ela é de Paulo? Nela, Paulo cita palavras de Jesus, como as da Última Ceia (1 Coríntios 11:23-25), o ensino sobre o divórcio (1 Coríntios 7:10-11) e o de 1 Coríntios 9:14?"}, {"label": "Testemunhas", "text": "O que 1 Coríntios 15:6 diz sobre as mais de 500 pessoas que viram Jesus ressuscitado, e se elas ainda estavam vivas?"}, {"label": "Lucas 1:1-2", "text": "O que Lucas 1:1-2 diz sobre relatos que existiam antes do Evangelho de Lucas?"}, {"label": "Atos", "text": "Com que acontecimento termina o livro de Atos, e por volta de que ano? Atos conta a morte de Paulo, de Pedro, de Tiago, irmão de Jesus, ou a destruição de Jerusalém no ano 70?"}, {"label": "Ensino de Jesus", "text": "Os estudiosos dizem que o jeito de ensinar de Jesus, com parábolas e frases curtas e ritmadas, facilitava a memorização?"}, {"label": "Hadith", "text": "Quantos anos depois da morte de Muhammad foi reunido o Sahih al-Bukhari, quantos relatos a tradição diz que Bukhari examinou e quantos ele colocou no livro? Os sábios muçulmanos reconhecem que muitos hadith falsos foram inventados?"}, {"label": "Biografia", "text": "Quando foi escrita a Sira de Ibn Ishaq, e ela chegou até nós completa ou só pela versão de Ibn Hisham?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "İskender", "text": "Plutarkhos ve Arrianos, Büyük İskender'in biyografilerini onun ölümünden kaç yıl sonra yazdı? Suetonius, Augustus'un biyografisini onun ölümünden kaç yıl sonra yazdı? Tarihçiler bu biyografilere güveniyor mu?"}, {"label": "1 Korintliler", "text": "Korintliler'e Birinci Mektup hangi yılda yazıldı ve şüpheci araştırmacılar onun Pavlus'a ait olduğunu kabul ediyor mu? Pavlus bu mektupta Son Akşam Yemeği'ndeki sözler (1 Korintliler 11:23-25), boşanma hakkındaki öğreti (1 Korintliler 7:10-11) ve 1 Korintliler 9:14'teki öğreti gibi İsa'nın sözlerini aktarıyor mu?"}, {"label": "Tanıklar", "text": "1 Korintliler 15:6, dirilmiş İsa'yı gören 500'den fazla kişi hakkında ne diyor ve onlar hâlâ hayatta mıydı?"}, {"label": "Luka 1:1-2", "text": "Luka 1:1-2, Luka İncili'nden önce var olan anlatımlar hakkında ne diyor?"}, {"label": "Elçilerin İşleri", "text": "Elçilerin İşleri hangi olayla ve yaklaşık hangi yılda bitiyor? Pavlus'un, Petrus'un, İsa'nın kardeşi Yakup'un ölümünü ya da 70 yılında Kudüs'ün yıkılışını anlatıyor mu?"}, {"label": "İsa'nın öğretisi", "text": "Araştırmacılar, İsa'nın benzetmelerle ve kısa, ritimli cümlelerle öğretme biçiminin ezberlemeyi kolaylaştırdığını söylüyor mu?"}, {"label": "Hadis", "text": "Sahih-i Buhari Muhammed'in ölümünden kaç yıl sonra derlendi, geleneğe göre Buhari kaç rivayeti inceledi ve kaçını kitabına aldı? Müslüman alimler birçok sahte hadis uydurulduğunu kabul ediyor mu?"}, {"label": "Siret", "text": "İbn İshak'ın Siret'i ne zaman yazıldı ve bize tam olarak mı, yoksa sadece İbn Hişam'ın versiyonuyla mı ulaştı?"}]}}, {"k": "trans", "n": 89, "id": "p89", "pt": "Agora vamos para mais um erro do vídeo.", "tr": "Şimdi videonun bir başka hatasına geçelim.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Escritos 40 a 70 anos depois?", "tr": "1. Bölüm: İncilleri kim yazdı › 40 ile 70 yıl sonra mı yazıldı?"}, "newPoint": false}, {"k": "para", "n": 90, "id": "p90", "pt": "❌ *O que o vídeo diz:* que Jesus falava aramaico, mas os Evangelhos foram escritos em grego, e por isso não temos as palavras de Jesus na língua dele.", "tr": "❌ *Videonun söylediği:* İsa'nın Aramice konuştuğu, ama İncillerin Grekçe yazıldığı ve bu yüzden İsa'nın sözlerinin onun kendi dilinde elimizde olmadığı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aramaico e grego", "tr": "1. Bölüm: İncilleri kim yazdı › Aramice ve Grekçe"}, "newPoint": true}, {"k": "para", "n": 91, "id": "p91", "pt": "Mais um argumento que explode na mão de quem usa: pela regra do próprio vídeo, o Alcorão não teria nenhuma palavra de Jesus, nem de Moisés, nem de Abraão. Vamos às provas:", "tr": "Kullananın elinde patlayan bir argüman daha: Videonun kendi kuralına göre Kur'an'da ne İsa'nın, ne Musa'nın, ne de İbrahim'in tek bir sözü olurdu. Delillere geçelim:", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aramaico e grego", "tr": "1. Bölüm: İncilleri kim yazdı › Aramice ve Grekçe"}, "newPoint": false}, {"k": "para", "n": 92, "id": "p92", "pt": "✅ *Prova 1: o grego era a língua que todos entendiam.*\nNo século 1, o grego era a língua comum entre povos diferentes, como o inglês é hoje. Jesus mandou fazer discípulos de todas as nações, e por isso os Evangelhos foram escritos na língua que o mundo inteiro podia ler. E quem passou as palavras de Jesus do aramaico para o grego não foi um desconhecido séculos depois: foram os próprios discípulos e os seus companheiros, que ouviram Jesus ou ouviram de quem estava lá, e que conheciam as duas línguas.", "tr": "✅ *1. delil: Grekçe herkesin anladığı dildi.*\n1. yüzyılda Grekçe, tıpkı bugün İngilizce gibi, farklı halklar arasındaki ortak dildi. İsa bütün ulusları öğrenci olarak yetiştirmeyi emretti, bu yüzden İnciller bütün dünyanın okuyabileceği dilde yazıldı. İsa'nın sözlerini Aramiceden Grekçeye aktaranlar da yüzyıllar sonra yaşamış bilinmeyen biri değildi: İsa'yı dinlemiş ya da orada bulunanlardan duymuş ve iki dili de bilen öğrencilerin kendileri ve onların arkadaşlarıydı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aramaico e grego", "tr": "1. Bölüm: İncilleri kim yazdı › Aramice ve Grekçe"}, "newPoint": false}, {"k": "para", "n": 93, "id": "p93", "pt": "✅ *Prova 2: os Evangelhos guardaram até palavras de Jesus em aramaico.*\nEm alguns momentos, os Evangelhos deixam as palavras de Jesus exatamente como Ele falou, em aramaico, e depois explicam o que querem dizer:\n• \"Talitá cumi\", que quer dizer \"menina, eu te digo, levante-se\" (Marcos 5:41).\n• \"Efatá\", que quer dizer \"abra-se\" (Marcos 7:34).\n• Na cruz: \"Eloí, Eloí, lamá sabactâni?\", que quer dizer \"Meu Deus, meu Deus, por que me abandonaste?\" (Marcos 15:34).\nPense: quem inventa uma história não guarda as palavras exatas em outra língua, nem se dá ao trabalho de traduzi-las. Isso é sinal de quem ouviu Jesus falar e fez questão de passar adiante as palavras como foram ditas.", "tr": "✅ *2. delil: İnciller İsa'nın bazı sözlerini Aramice olarak bile korudu.*\nİnciller bazı anlarda İsa'nın sözlerini tam O'nun söylediği gibi, Aramice bırakır ve sonra ne anlama geldiklerini açıklar:\n• \"Talita kum\", yani \"Kızım, sana söylüyorum, kalk\" (Markos 5:41).\n• \"Effata\", yani \"Açıl\" (Markos 7:34).\n• Çarmıhta: \"Elohi, Elohi, lema şevaktani?\", yani \"Tanrım, Tanrım, neden beni terk ettin?\" (Markos 15:34).\nDüşünün: Bir hikâye uyduran kişi, sözleri başka bir dilde aynen korumaz ve onları tercüme etme zahmetine de girmez. Bu, İsa'yı konuşurken dinlemiş ve sözleri söylendiği gibi aktarmaya özen göstermiş kişilerin işaretidir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aramaico e grego", "tr": "1. Bölüm: İncilleri kim yazdı › Aramice ve Grekçe"}, "newPoint": false}, {"k": "para", "n": 94, "id": "p94", "pt": "✅ *Prova 3: pela regra do vídeo, o Alcorão é que não teria as palavras de Jesus.*\n• O Alcorão coloca falas na boca de Jesus em árabe, uma língua que Jesus nunca falou, quase 600 anos depois dele (por exemplo, 5:116-117).\n• Faz o mesmo com Moisés, com Abraão, com Noé e com o Faraó: todas as falas deles estão em árabe, uma língua que nenhum deles falou.\nOs muçulmanos aceitam que o Alcorão conte em árabe o que Jesus e Moisés disseram em outra língua. Então eles mesmos sabem que o problema nunca foi a língua: contar em outra língua não muda a mensagem. O que muda a mensagem é mentir sobre o que foi dito. E aí está a diferença: os Evangelhos passaram para o grego o que Jesus disse, escritos por quem O ouviu e por quem andou com as testemunhas. O Alcorão, 600 anos depois e sem nenhuma testemunha, coloca na boca de Jesus coisas que Ele nunca disse e nega até a cruz, que as testemunhas viram. *O problema do Alcorão não é ser em árabe: é contradizer quem estava lá.*", "tr": "✅ *3. delil: Videonun kuralına göre İsa'nın sözleri asıl Kur'an'da olmazdı.*\n• Kur'an, İsa'nın ağzına, İsa'nın hiç konuşmadığı bir dil olan Arapçayla, ondan neredeyse 600 yıl sonra sözler koyar (örneğin 5:116-117).\n• Aynısını Musa, İbrahim, Nuh ve Firavun için de yapar: Onların bütün sözleri, hiçbirinin konuşmadığı bir dil olan Arapçadır.\nMüslümanlar, Kur'an'ın İsa'nın ve Musa'nın başka bir dilde söylediklerini Arapça anlatmasını kabul eder. Demek ki sorunun hiçbir zaman dil olmadığını kendileri de biliyorlar: Başka bir dilde anlatmak mesajı değiştirmez. Mesajı değiştiren, söylenenler hakkında yalan söylemektir. İşte fark burada: İnciller İsa'nın söylediklerini Grekçeye aktardı ve onları O'nu dinleyenler ve tanıklarla birlikte dolaşanlar yazdı. Kur'an ise 600 yıl sonra ve hiçbir tanık olmadan, İsa'nın ağzına O'nun hiç söylemediği şeyler koyar ve tanıkların gördüğü çarmıhı bile inkâr eder. *Kur'an'ın sorunu Arapça olması değil: Orada bulunanlarla çelişmesidir.*", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aramaico e grego", "tr": "1. Bölüm: İncilleri kim yazdı › Aramice ve Grekçe"}, "newPoint": false}, {"k": "research", "n": 95, "id": "p95", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aramaico e grego", "tr": "1. Bölüm: İncilleri kim yazdı › Aramice ve Grekçe"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Grego", "text": "No século 1, o grego era a língua comum usada entre povos diferentes no leste do Império Romano, inclusive na Judeia?"}, {"label": "Aramaico nos Evangelhos", "text": "Em Marcos 5:41, 7:34 e 15:34, o Evangelho guarda palavras de Jesus em aramaico e depois traduz o significado?"}, {"label": "Alcorão", "text": "Jesus e Moisés falavam árabe? Em que língua o Alcorão conta as falas deles, e quantos anos depois de Jesus o Alcorão foi escrito?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Grekçe", "text": "1. yüzyılda Grekçe, Yahudiye de dahil olmak üzere Roma İmparatorluğu'nun doğusunda farklı halklar arasında kullanılan ortak dil miydi?"}, {"label": "İncillerde Aramice", "text": "Markos 5:41, 7:34 ve 15:34'te İncil, İsa'nın sözlerini Aramice olarak koruyup sonra anlamını tercüme ediyor mu?"}, {"label": "Kur'an", "text": "İsa ve Musa Arapça konuşuyor muydu? Kur'an onların sözlerini hangi dilde anlatır ve Kur'an İsa'dan kaç yıl sonra yazıldı?"}]}}, {"k": "trans", "n": 99, "id": "p99", "pt": "E o vídeo continua errando.", "tr": "Video hata yapmaya devam ediyor.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aramaico e grego", "tr": "1. Bölüm: İncilleri kim yazdı › Aramice ve Grekçe"}, "newPoint": false}, {"k": "para", "n": 100, "id": "p100", "pt": "❌ *O que o vídeo diz:* que Mateus copiou 90% de Marcos, e que um apóstolo não precisaria copiar alguém que não estava lá; e que Marcos é \"a cópia de uma cópia\", porque escreveu o que Pedro pregava depois que Pedro morreu.", "tr": "❌ *Videonun söylediği:* Matta'nın Markos'un %90'ını kopyaladığı ve bir elçinin orada olmayan birini kopyalamaya ihtiyacı olmayacağı; Markos'un da Petrus öldükten sonra onun vaazlarını yazdığı için \"bir kopyanın kopyası\" olduğu.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": true}, {"k": "para", "n": 101, "id": "p101", "pt": "Aqui o autor do vídeo mostra que não entende nada nem de história, nem de como funciona um testemunho verdadeiro, e precisa distorcer os fatos para fingir que a força da Bíblia é um defeito. A Bíblia está 100% certa por si mesma e tem o modelo mais forte de prova que pode existir na história. Vamos ver prova por prova:", "tr": "Burada videonun sahibi ne tarihten ne de gerçek bir tanıklığın nasıl işlediğinden hiçbir şey anlamadığını gösteriyor ve Kutsal Kitap'ın gücünü bir kusurmuş gibi göstermek için gerçekleri çarpıtmak zorunda kalıyor. Kutsal Kitap kendi başına %100 doğrudur ve tarihte var olabilecek en güçlü delil modeline sahiptir. Delil delil bakalım:", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 102, "id": "p102", "pt": "Antes das provas, para não confundir os nomes, veja quem é quem nesta parte:\n• *Pedro:* o líder dos apóstolos, chamado por Jesus logo no começo e o primeiro da lista dos doze. Andou com Jesus desde o começo. Ele não escreveu um Evangelho; quem colocou a pregação dele no papel foi Marcos.\n• *Mateus:* apóstolo, autor do primeiro Evangelho. Antes de seguir Jesus era cobrador de impostos, e também era chamado de Levi.\n• *Marcos:* também chamado João Marcos. Não era apóstolo: era companheiro e intérprete de Pedro, e escreveu o segundo Evangelho com a pregação de Pedro.\n• *Lucas:* médico, companheiro de Paulo. Não era apóstolo: pesquisou com as testemunhas e escreveu o terceiro Evangelho e o livro de Atos.\n• *João:* apóstolo, um dos mais próximos de Jesus, autor do quarto Evangelho, onde aparece como \"o discípulo a quem Jesus amava\".", "tr": "Delillerden önce, isimler karışmasın diye bu bölümde kimin kim olduğuna bakın:\n• *Petrus:* Elçilerin önderi, İsa'nın en başta çağırdığı ve on ikilerin listesinde ilk sırada yer alan kişi. Başından beri İsa'yla birlikte dolaştı. Kendisi bir İncil yazmadı; onun vaazını yazıya geçiren Markos'tur.\n• *Matta:* Elçi, birinci İncil'in yazarı. İsa'yı izlemeden önce vergi görevlisiydi ve Levi diye de anılırdı.\n• *Markos:* Yuhanna Markos diye de anılır. Elçi değildi: Petrus'un arkadaşı ve tercümanıydı ve ikinci İncil'i Petrus'un vaazıyla yazdı.\n• *Luka:* Hekim, Pavlus'un arkadaşı. Elçi değildi: Tanıklarla araştırma yaptı, üçüncü İncil'i ve Elçilerin İşleri'ni yazdı.\n• *Yuhanna:* Elçi, İsa'ya en yakın olanlardan biri, dördüncü İncil'in yazarı; orada \"İsa'nın sevdiği öğrenci\" olarak geçer.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 103, "id": "p103", "pt": "Agora repare no truque do vídeo. Ele faz duas acusações:\n• *Contra Mateus:* se Mateus fosse mesmo apóstolo, não precisaria usar o livro de Marcos, que nem andou com Jesus.\n• *Contra Marcos:* o livro dele seria só \"cópia de uma cópia\", escrito depois da morte de Pedro, sem ninguém para conferir.\nAs duas acusações dependem da mesma mentira: que o livro de Marcos é o relato de alguém que não estava lá. Mas *o livro de Marcos é a pregação de Pedro, a maior testemunha de todas*. E quando isso fica provado, as duas caem juntas:\n• Mateus não usou o livro de \"alguém que não estava lá\": usou o relato de Pedro.\n• E Marcos não é \"cópia de uma cópia\": é o testemunho de Pedro, colocado no papel pelo seu companheiro.", "tr": "Şimdi videonun hilesine dikkat edin. İki suçlama yapıyor:\n• *Matta'ya karşı:* Matta gerçekten elçi olsaydı, İsa'yla hiç dolaşmamış Markos'un kitabını kullanmaya ihtiyaç duymazdı.\n• *Markos'a karşı:* Onun kitabı, Petrus'un ölümünden sonra, kimse kontrol etmeden yazılmış \"bir kopyanın kopyası\" olurdu.\nİki suçlama da aynı yalana dayanıyor: Markos'un kitabının orada olmayan birinin anlatımı olduğu. Ama *Markos'un kitabı, tanıkların en büyüğü olan Petrus'un vaazıdır*. Bu kanıtlandığında iki suçlama birlikte düşer:\n• Matta \"orada olmayan birinin\" kitabını kullanmadı: Petrus'un anlatımını kullandı.\n• Markos da \"bir kopyanın kopyası\" değildir: Petrus'un tanıklığıdır, arkadaşı tarafından yazıya geçirilmiştir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 104, "id": "p104", "pt": "✅ *Prova 1: o livro de Marcos é a pregação de Pedro.*\nO vídeo fala de Marcos como se ele fosse um qualquer, que nunca viu Jesus e escreveu de cabeça. Mas Marcos não escreveu o que ele achava: ele colocou no papel o que Pedro pregava. Entre Jesus e o livro de Marcos há só uma pessoa: Pedro, que andou com Jesus desde o começo. E isso aparece em fontes diferentes, de lugares diferentes:\n• O livro de Atos mostra Pedro, logo depois de sair da prisão, indo direto à casa da mãe de Marcos, em Jerusalém, onde a igreja se reunia: Marcos era do círculo mais próximo de Pedro.\n• No Evangelho de Marcos, Pedro está no primeiro chamado que Jesus faz e é o último dos apóstolos a ser citado pelo nome: o livro começa e termina com Pedro.\n• Tertuliano, no norte da África, por volta do ano 200, escreve que o Evangelho que Marcos publicou é considerado de Pedro, porque Marcos era o intérprete de Pedro. Ou seja, até no norte da África, longe de onde Pedro pregou, as igrejas sabiam que o Evangelho de Marcos vinha da pregação de Pedro.\nOu seja, a Bíblia e os escritores antigos dizem a mesma coisa: o Evangelho de Marcos é a pregação de Pedro.", "tr": "✅ *1. delil: Markos'un kitabı Petrus'un vaazıdır.*\nVideo Markos'tan, İsa'yı hiç görmemiş ve kafasından yazmış sıradan biri gibi bahsediyor. Ama Markos kendi düşündüğünü yazmadı: Petrus'un vaaz ettiğini yazıya geçirdi. İsa ile Markos'un kitabı arasında sadece bir kişi var: Başından beri İsa'yla birlikte dolaşan Petrus. Ve bu, farklı yerlerden farklı kaynaklarda görülür:\n• Elçilerin İşleri, Petrus'un hapisten çıkar çıkmaz doğruca Kudüs'te, kilisenin toplandığı Markos'un annesinin evine gittiğini gösterir: Markos, Petrus'un en yakın çevresindendi.\n• Markos İncili'nde Petrus, İsa'nın yaptığı ilk çağrıda yer alır ve adı anılan son elçidir: Kitap Petrus'la başlar ve Petrus'la biter.\n• Kuzey Afrika'da Tertullianus, yaklaşık 200 yılında, Markos'un yayımladığı İncil'in Petrus'a ait sayıldığını, çünkü Markos'un Petrus'un tercümanı olduğunu yazar. Yani Petrus'un vaaz ettiği yerlerden çok uzakta, Kuzey Afrika'da bile kiliseler, Markos İncili'nin Petrus'un vaazından geldiğini biliyordu.\nYani Kutsal Kitap da eski yazarlar da aynı şeyi söylüyor: Markos İncili, Petrus'un vaazıdır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 105, "id": "p105", "pt": "✅ *Prova 2: o próprio livro de Marcos mostra que a fonte é Pedro.*\nMarcos não protege o líder dos apóstolos. Ele conta as maiores vergonhas de Pedro: Jesus chamando Pedro de \"Satanás\" (Marcos 8:33), Pedro dormindo no Getsêmani quando Jesus pediu que vigiasse (Marcos 14:37), e Pedro negando Jesus três vezes, jurando que nem O conhecia (Marcos 14:66-72).", "tr": "✅ *2. delil: Markos'un kitabının kendisi kaynağın Petrus olduğunu gösterir.*\nMarkos, elçilerin önderini korumaya çalışmaz. Petrus'un en utanç verici anlarını anlatır: İsa'nın Petrus'a \"Şeytan\" demesi (Markos 8:33), İsa uyanık kalmasını istediği halde Petrus'un Getsemani'de uyuması (Markos 14:37) ve Petrus'un İsa'yı tanımadığına yemin ederek O'nu üç kez inkâr etmesi (Markos 14:66-72).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 106, "id": "p106", "pt": "E repare como a negação é contada: quando Jesus foi preso, todos os discípulos fugiram (Marcos 14:50); depois, Pedro seguiu Jesus de longe até o pátio do sumo sacerdote, e o relato acompanha cada passo dele: as perguntas da criada, os juramentos, o galo cantando, Pedro lembrando da palavra de Jesus e chorando (Marcos 14:72). É a lembrança de quem viveu a cena por dentro.", "tr": "İnkârın nasıl anlatıldığına da dikkat edin: İsa tutuklandığında bütün öğrenciler kaçtı (Markos 14:50); sonra Petrus İsa'yı uzaktan başkâhinin avlusuna kadar izledi ve anlatım onun her adımını takip eder: hizmetçi kızın soruları, yeminler, horozun ötüşü, Petrus'un İsa'nın sözünü hatırlayıp ağlaması (Markos 14:72). Bu, sahneyi içeriden yaşamış birinin hatırasıdır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 107, "id": "p107", "pt": "Pense: nenhum seguidor inventaria essas vergonhas sobre o líder. Quem conta assim as próprias falhas é o próprio Pedro, pregando com humildade, e Marcos escreveu o que ouviu dele.", "tr": "Düşünün: Hiçbir takipçi önderi hakkında böyle utançlar uydurmaz. Kendi düşüşlerini böyle anlatan, alçakgönüllülükle vaaz eden Petrus'un kendisidir ve Markos ondan duyduklarını yazdı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 108, "id": "p108", "pt": "✅ *Prova 3: então Mateus não copiou \"alguém que não estava lá\": usou o relato de Pedro.*\nAqui cai a primeira acusação do vídeo. O livro de Marcos é o relato de Pedro, e Pedro viu coisas que Mateus não viu. Pedro estava no primeiro chamado que Jesus fez, à beira do mar da Galileia (Marcos 1:16), e na lista dos apóstolos é chamado de \"o primeiro\" (Mateus 10:2). Mateus só entrou no grupo depois (Mateus 9:9), então não viu o começo. E mesmo depois que Mateus entrou, houve momentos em que Jesus levou só Pedro, Tiago e João (esse Tiago é o irmão de João, e não Tiago, o irmão de Jesus), e deixou os outros apóstolos do lado de fora:\n• no quarto onde ressuscitou a filha de Jairo (Marcos 5:37);\n• no monte onde foi transfigurado (Mateus 17:1);\n• no fundo do jardim do Getsêmani, na noite em que foi preso (Mateus 26:37).\nPara contar o que aconteceu lá dentro, Mateus precisava do relato de quem estava lá: Pedro. E a pregação de Pedro, escrita por Marcos, já era o relato que todas as igrejas conheciam. Mateus não jogou fora o relato do líder dos apóstolos para inventar outra versão: usou esse relato como base, confirmou o que ele também tinha visto e acrescentou o que ele mesmo viveu. É o que uma testemunha honesta faz: não inventa o que não viu, usa o relato de quem viu.", "tr": "✅ *3. delil: Yani Matta \"orada olmayan birini\" kopyalamadı: Petrus'un anlatımını kullandı.*\nBurada videonun birinci suçlaması düşer. Markos'un kitabı Petrus'un anlatımıdır ve Petrus, Matta'nın görmediği şeyleri gördü. Petrus, İsa'nın Celile Gölü kıyısında yaptığı ilk çağrıda vardı (Markos 1:16) ve elçilerin listesinde \"ilk\" olarak anılır (Matta 10:2). Matta gruba ancak daha sonra katıldı (Matta 9:9), yani başlangıcı görmedi. Matta katıldıktan sonra bile, İsa'nın sadece Petrus'u, Yakup'u ve Yuhanna'yı (bu Yakup, Yuhanna'nın kardeşidir, İsa'nın kardeşi Yakup değil) yanına alıp diğer elçileri dışarıda bıraktığı anlar oldu:\n• Yayir'in kızını dirilttiği odada (Markos 5:37);\n• görünümünün değiştiği dağda (Matta 17:1);\n• tutuklandığı gece Getsemani bahçesinin içerisinde (Matta 26:37).\nİçeride olanları anlatmak için Matta'nın, orada bulunanın anlatımına ihtiyacı vardı: Petrus'un. Ve Markos'un yazdığı Petrus vaazı, bütün kiliselerin zaten bildiği anlatımdı. Matta, başka bir versiyon uydurmak için elçilerin önderinin anlatımını bir kenara atmadı: Bu anlatımı temel aldı, kendisinin de gördüklerini doğruladı ve kendi yaşadıklarını ekledi. Dürüst bir tanığın yaptığı budur: Görmediğini uydurmaz, görenin anlatımını kullanır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 109, "id": "p109", "pt": "Pense: Mateus andou com Jesus durante anos. Se o relato de Pedro tivesse algum erro, ele saberia, e não o colocaria no seu Evangelho. Quando um apóstolo usa o relato de outro apóstolo, ele está dizendo: \"isso é verdade, eu confirmo\".", "tr": "Düşünün: Matta yıllarca İsa'yla birlikte dolaştı. Petrus'un anlatımında bir hata olsaydı bunu bilirdi ve onu kendi İncili'ne koymazdı. Bir elçi başka bir elçinin anlatımını kullandığında şunu söylemiş olur: \"Bu doğru, ben de bunu onaylıyorum.\"", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 110, "id": "p110", "pt": "✅ *Prova 4: Mateus usou o texto de Marcos até no próprio chamado para mostrar: \"aquele homem sou eu\".*\nO vídeo pergunta: por que Mateus usou o texto de Marcos até para contar o dia em que ele mesmo foi chamado? A resposta está no próprio texto.\nNa pregação de Pedro, escrita por Marcos, a história do cobrador de impostos que Jesus chamou já era conhecida pelas igrejas, mas ali o homem aparece com o nome Levi (Marcos 2:14). Mateus contou essa mesma cena, quase com as mesmas palavras, mas trocou o nome: \"um homem chamado Mateus\" (Mateus 9:9). E na lista dos doze apóstolos escreveu \"Mateus, o cobrador de impostos\" (Mateus 10:3).", "tr": "✅ *4. delil: Matta, kendi çağrılışında bile Markos'un metnini kullandı, çünkü şunu göstermek istedi: \"O adam benim.\"*\nVideo soruyor: Matta neden kendi çağrıldığı günü anlatırken bile Markos'un metnini kullandı? Cevap metnin kendisinde.\nMarkos'un yazdığı Petrus vaazında, İsa'nın çağırdığı vergi görevlisinin hikâyesi kiliseler tarafından zaten biliniyordu, ama orada adam Levi adıyla geçer (Markos 2:14). Matta aynı sahneyi neredeyse aynı sözlerle anlattı, ama adı değiştirdi: \"Matta adında bir adam\" (Matta 9:9). On iki elçinin listesinde de \"vergi görevlisi Matta\" diye yazdı (Matta 10:3).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 111, "id": "p111", "pt": "Marcos não errou: *Levi e Mateus são a mesma pessoa, com dois nomes*. Isso era muito comum entre os judeus da época: José era chamado de Barnabé (Atos 4:36), e Marcos também se chamava João. E quem seguia Jesus podia até ganhar um nome novo, como Simão, que passou a ser chamado de Pedro (Marcos 3:16). Mateus quer dizer \"presente de Deus\".", "tr": "Markos yanılmadı: *Levi ve Matta, iki adı olan aynı kişidir*. Bu, o dönemin Yahudileri arasında çok yaygındı: Yusuf'a Barnaba denirdi (Elçilerin İşleri 4:36), Markos'un da Yuhanna adı vardı. İsa'yı izleyen biri yeni bir ad bile alabilirdi: Petrus diye anılmaya başlayan Simun gibi (Markos 3:16). Matta, \"Tanrı'nın armağanı\" demektir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 112, "id": "p112", "pt": "O que isso prova? Ao manter a cena que todos já conheciam e trocar só o nome, Mateus estava dizendo a toda a igreja: \"Sabe aquele cobrador de impostos da história que Pedro conta? Aquele homem sou eu.\" Quem saberia disso melhor do que o próprio Mateus? E os judeus desprezavam os cobradores de impostos: quem inventasse um Evangelho para parecer importante não faria questão de lembrar a vergonha do autor. Só o próprio Mateus, com humildade, faria isso.", "tr": "Bu neyi kanıtlıyor? Herkesin bildiği sahneyi koruyup sadece adı değiştirerek Matta bütün kiliseye şunu söylüyordu: \"Petrus'un anlattığı hikâyedeki o vergi görevlisini biliyor musunuz? O adam benim.\" Bunu Matta'nın kendisinden daha iyi kim bilebilirdi? Ve Yahudiler vergi görevlilerini hor görürdü: Önemli görünmek için bir İncil uyduran biri, yazarın utancını özellikle hatırlatmazdı. Bunu ancak Matta'nın kendisi, alçakgönüllülükle yapardı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 113, "id": "p113", "pt": "✅ *Prova 5: \"90%\" não quer dizer que Mateus é uma cópia.*\nO número do vídeo engana. Os 90% são da parte de Marcos que aparece em Mateus, e não da parte de Mateus que vem de Marcos. Marcos é curto, e Mateus é muito maior: mais de um terço de Mateus não está em Marcos, como o nascimento de Jesus, o Sermão da Montanha com o Pai Nosso, muitas parábolas e o envio dos discípulos a todas as nações. Ou seja, Mateus usou Marcos como base, mas o livro não é uma cópia: é um Evangelho com muito material próprio.", "tr": "✅ *5. delil: \"%90\", Matta'nın bir kopya olduğu anlamına gelmez.*\nVideonun rakamı yanıltıcıdır. %90, Markos'un Matta'da geçen kısmıdır; Matta'nın Markos'tan gelen kısmı değil. Markos kısadır, Matta ise çok daha uzundur: Matta'nın üçte birinden fazlası Markos'ta yoktur; İsa'nın doğumu, Rab'bin Duası'yla birlikte Dağdaki Vaaz, birçok benzetme ve öğrencilerin bütün uluslara gönderilmesi gibi. Yani Matta, Markos'u temel aldı ama kitabı bir kopya değildir: Kendine ait çok fazla malzeme içeren bir İncil'dir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 114, "id": "p114", "pt": "✅ *Prova 6: Marcos não escreveu de cabeça, sem ninguém para conferir.*\nAqui cai a segunda acusação do vídeo. Como já mostrei, há provas fortes de que Marcos foi escrito antes do ano 70. Mas o vídeo erra até na lógica: um texto não vira \"cópia de uma cópia\" por causa da data. Pedro pregou essa mensagem em público durante anos, diante de milhares de pessoas, e Marcos escreveu o que ouviu da boca dele. Entre Jesus e o texto há uma pessoa só: Pedro. Cópia de uma cópia seria alguém escrevendo o que ouviu de outra pessoa, que ouviu de Pedro. E Marcos escreveu quando ainda viviam muitas pessoas que tinham visto Jesus e ouvido Pedro pregar: qualquer invenção seria percebida na hora.", "tr": "✅ *6. delil: Markos, kimsenin kontrol etmediği bir şekilde kafasından yazmadı.*\nBurada videonun ikinci suçlaması düşer. Daha önce gösterdiğim gibi, Markos'un 70 yılından önce yazıldığına dair güçlü deliller var. Ama video mantıkta bile yanılıyor: Bir metin tarihi yüzünden \"bir kopyanın kopyası\" olmaz. Petrus bu mesajı yıllarca, binlerce kişinin önünde açıkça vaaz etti ve Markos onun ağzından duyduklarını yazdı. İsa ile metin arasında sadece bir kişi var: Petrus. Kopyanın kopyası, Petrus'tan duyan başka birinden duyduklarını yazan biri olurdu. Ve Markos, İsa'yı görmüş ve Petrus'un vaazını dinlemiş birçok kişi hâlâ hayattayken yazdı: Her uydurma anında fark edilirdi.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 115, "id": "p115", "pt": "Até aqui, não precisei comparar nada com o Islã: os Evangelhos ficam de pé sozinhos. Agora vejam como o Islã fica muito abaixo disso:", "tr": "Buraya kadar İslam'la hiçbir karşılaştırma yapmama gerek olmadı: İnciller kendi başlarına ayakta duruyor. Şimdi İslam'ın bunun ne kadar gerisinde kaldığına bakın:", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Mateus copiou Marcos?", "tr": "1. Bölüm: İncilleri kim yazdı › Matta, Markos'u mu kopyaladı?"}, "newPoint": false}, {"k": "para", "n": 116, "id": "p116", "pt": "✅ *E o Alcorão? Nem chega aos pés.*\n• *Mateus tinha o relato de Pedro; Zayd tinha pedaços soltos:* Mateus usou o relato de Pedro, a maior testemunha de Jesus, um relato que todas as igrejas já conheciam. Zayd ibn Thabit, quando foi juntar o Alcorão, não tinha o Alcorão reunido num só volume, porque Muhammad não deixou isso: teve que caçar versículos espalhados em folhas de palmeira, em pedras e na memória das pessoas, e um deles só achou com um homem (Bukhari 4986). De um lado, o relato completo de uma testemunha ocular; do outro, pedaços espalhados que ninguém tinha juntado.\n• *Marcos escreveu o que Pedro pregava; o Alcorão nem era um livro quando Muhammad morreu:* o vídeo diz que escrever o que o mestre ensinou depois da morte dele vira \"cópia de uma cópia\". Mas o Alcorão só virou livro depois da morte de Muhammad, e o próprio Abu Bakr hesitou em fazer \"algo que o Mensageiro de Allah não fez\" (Bukhari 4986). Pela regra do vídeo, o próprio Alcorão seria \"cópia de uma cópia\". E não adianta dizer que Jesus também não deixou um livro: os cristãos nunca disseram que Jesus ditou um livro; o Evangelho é o testemunho dos apóstolos que Ele enviou. Já os muçulmanos dizem que o Alcorão é um livro que desceu do céu, palavra por palavra, e mesmo assim Muhammad morreu sem deixá-lo reunido.\n• *Cópia de cópia de verdade são os hadith:* entre Jesus e Marcos há uma pessoa só. Nos hadith é \"fulano ouviu de beltrano, que ouviu de outro, que ouviu de outro, que ouviu de Muhammad\", uma corrente de várias pessoas, de geração em geração, por mais de 200 anos antes de coleções como a de Bukhari.\n• *O Alcorão usa histórias de livros que os cristãos rejeitavam:* a de Jesus fazendo pássaros de barro e soprando neles para dar vida (3:49 e 5:110) já aparecia, contada de Jesus menino, no \"Evangelho da Infância de Tomé\", do século 2; e a de Maria criada no Templo e recebendo comida do céu (3:37) já aparecia no \"Protoevangelho de Tiago\", também do século 2. São livros falsos que usaram os nomes de Tomé e de Tiago, como os que mostrei no começo, e os cristãos nunca os aceitaram como Escritura: nenhuma lista dos livros da Bíblia feita pelas igrejas antigas, séculos antes de Muhammad, os inclui. E não adianta dizer que eram tradições verdadeiras: esses livros foram escritos mais de cem anos depois de Jesus, sem nenhuma testemunha, e foram rejeitados justamente porque eram invenção. O vídeo acusa Mateus de usar o relato de um apóstolo, mas o Alcorão usa livros que os próprios cristãos sabiam que eram falsos.", "tr": "✅ *Peki ya Kur'an? Yanına bile yaklaşamaz.*\n• *Matta'nın elinde Petrus'un anlatımı vardı; Zeyd'in elinde dağınık parçalar:* Matta, İsa'nın en büyük tanığı olan Petrus'un, bütün kiliselerin zaten bildiği anlatımını kullandı. Zeyd ibn Sabit ise Kur'an'ı toplamaya başladığında elinde tek bir ciltte toplanmış bir Kur'an yoktu, çünkü Muhammed böyle bir şey bırakmamıştı: Hurma yapraklarına, taşlara ve insanların hafızasına dağılmış ayetleri tek tek aramak zorunda kaldı ve bir ayeti sadece tek bir adamda buldu (Buhari 4986). Bir tarafta bir görgü tanığının eksiksiz anlatımı; diğer tarafta kimsenin bir araya getirmediği dağınık parçalar.\n• *Markos, Petrus'un vaazını yazdı; Kur'an ise Muhammed öldüğünde bir kitap bile değildi:* Video, hocanın öğrettiklerini onun ölümünden sonra yazmanın \"bir kopyanın kopyası\" olduğunu söylüyor. Ama Kur'an ancak Muhammed'in ölümünden sonra kitap oldu ve Ebu Bekir'in kendisi \"Allah'ın Resulü'nün yapmadığı bir şeyi\" yapmaktan çekindi (Buhari 4986). Vi
