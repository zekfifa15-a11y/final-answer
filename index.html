const CHUNKS=(()=>{
  const out=[];let cur=null;
  const push=()=>{if(cur&&cur.pt.length)out.push(cur)};
  DATA.blocks.forEach(b=>{
    if(b.k==='part'||b.k==='title'||b.newPoint){push();cur={id:b.id,where:b.where,pt:'',tr:''}}
    if(!cur)cur={id:b.id,where:b.where,pt:'',tr:''};
    const pt=b.k==='research'?b.pt.qs.map(q=>'• '+q.label+' '+q.text).join('\n'):plain(b.pt);
    const tr=b.k==='research'?b.tr.qs.map(q=>'• '+q.label+' '+q.text).join('\n'):plain(b.tr);
    if(cur.pt.length>3800){push();cur={id:b.id,where:b.where,pt:'',tr:''}}
    cur.pt+=pt+'\n\n';cur.tr+=tr+'\n\n';
  });push();
  out.forEach(c=>{c.tk=toks(c.pt+' '+c.tr);c.tf={};c.tk.forEach(w=>c.tf[w]=(c.tf[w]||0)+1)});
  return out})();
const DF=(()=>{const d={};CHUNKS.forEach(c=>Object.keys(c.tf).forEach(w=>d[w]=(d[w]||0)+1));return d})();
const AVG=CHUNKS.reduce((a,c)=>a+c.tk.length,0)/CHUNKS.length;
function retrieve(q,k){
  const qt=[...new Set(toks(q))];const N=CHUNKS.length;
  return CHUNKS.map(c=>{let s=0;qt.forEach(w=>{const f=c.tf[w]||0;if(!f)return;const idf=Math.log(1+(N-(DF[w]||0)+.5)/((DF[w]||0)+.5));s+=idf*(f*2.2)/(f+1.2*(.25+.75*c.tk.length/AVG))});return {c,s}})
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,k).map(x=>x.c);
}
const isTr=q=>/[ğşıİĞŞ]/.test(q)||/\b(neden|nasıl|nasil|değil|degil|mi|mı|mu|için|icin|ve|bir|bu|kim|ne)\b/i.test(q);

/* ---------------- AI: chat ---------------- */
let history=[];
const HKEY='jx_hist';
const loadH=()=>{try{return JSON.parse(store.get(HKEY,'[]'))||[]}catch(e){return []}};
const saveH=h=>store.set(HKEY,JSON.stringify(h.slice(-200)));
function updateHint(){$('#aiHint').textContent=t('hintOn');$('#histCount').textContent=loadH().length||''}
function md(s){
  const lines=esc(s).split('\n');let out='',ul=false,ol=false;
  const close=()=>{if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}};
  lines.forEach(l=>{
    let x=l.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
    if(/^\s*[-•]\s+/.test(l)){if(!ul){close();out+='<ul>';ul=true}out+='<li>'+x.replace(/^\s*[-•]\s+/,'')+'</li>';return}
    if(/^\s*\d+[.)]\s+/.test(l)){if(!ol){close();out+='<ol>';ol=true}out+='<li>'+x.replace(/^\s*\d+[.)]\s+/,'')+'</li>';return}
    close();
    if(/^#{1,4}\s/.test(l)){out+='<h4>'+x.replace(/^#{1,4}\s/,'')+'</h4>';return}
    if(x.trim())out+='<p>'+x+'</p>';
  });close();
  return out.replace(/(Parte\s+([1-8]))|((\b[1-8])\.\s*Bölüm)/g,(m,a,n1,b,n2)=>{const n=n1||n2;return `<a href="#part-${n}" data-jump="part-${n}">${m}</a>`});
}
function srcHTML(srcs){if(!srcs||!srcs.length)return '';return '<div class="src"><span>'+t('related')+'</span>'+srcs.map(c=>`<a href="#${c.id}" data-jump="${c.id}">${esc(c.where[uiLang()])}</a>`).join('')+'</div>'}
function addMsg(role,html){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html;$('#aiLog').append(d);return d}
function buildContext(q){
  const tr=isTr(q);const top=retrieve(q,AI_CONFIG.topChunks);
  const ctx=top.map((c,i)=>`### Trecho ${i+1} | ${c.where.pt} | ${c.where.tr}\n${tr?c.tr:c.pt}`).join('\n\n');
  return {tr,top,ctx};
}
function systemPrompt(){
  return NOTES+"\n\nESTRUTURA DO DOCUMENTO (use estes nomes ao indicar onde o assunto é explicado):\n"+DATA.toc.map(e=>(e.lvl===1?'':'  - ')+e.pt+' / '+e.tr).join('\n');
}
async function ask(q,onText){
  const {tr,top,ctx}=buildContext(q);
  const userMsg=`Pergunta (${tr?'responda em turco':'responda no idioma da pergunta'}):\n${q}\n\nTRECHOS DO DOCUMENTO QUE PODEM TER RELAÇÃO COM A PERGUNTA (use para o estilo, para os argumentos e para dizer se o assunto está no documento; se não tiverem relação real, diga que o assunto não está no documento):\n${ctx||'(nenhum trecho encontrado)'}`;
  const messages=[...history.slice(-6),{role:'user',content:userMsg}];
  const body={model:AI_CONFIG.model,max_tokens:AI_CONFIG.maxTokens,system:systemPrompt(),messages,output_config:{effort:AI_CONFIG.effort},stream:true};
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':AI_CONFIG.key,'anthropic-version':AI_CONFIG.apiVersion,'anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error((j.error&&j.error.message)||('HTTP '+r.status))}
  const reader=r.body.getReader(),dec=new TextDecoder();let buf='',text='';
  for(;;){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);
      const line=ev.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
      let d;try{d=JSON.parse(line.slice(5))}catch(e){continue}
      if(d.type==='content_block_delta'&&d.delta&&d.delta.type==='text_delta'){text+=d.delta.text;onText(text)}
      if(d.type==='error')throw new Error((d.error&&d.error.message)||'erro');
    }}
  text=text.trim();
  history.push({role:'user',content:q},{role:'assistant',content:text});
  const srcs=top.filter(c=>c.where.pt!=='Referências bíblicas').slice(0,4).map(c=>({id:c.id,where:c.where}));
  return {text,srcs};
}
$('#aiForm').addEventListener('submit',async e=>{
  e.preventDefault();const q=$('#aiInput').value.trim();if(!q)return;
  addMsg('user',esc(q));$('#aiInput').value='';
  const bot=addMsg('bot','<span class="typing"><i></i><i></i><i></i></span>');$('#aiSend').disabled=true;
  let pending=false,latest='';
  const onText=txt=>{latest=txt;if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;bot.innerHTML=md(latest)})};
  try{const {text,srcs}=await ask(q,onText);bot.innerHTML=md(text)+srcHTML(srcs);
    const h=loadH();h.push({t:Date.now(),q,a:text,srcs});saveH(h);updateHint();}
  catch(err){bot.innerHTML='<p>'+esc(t('err'))+'</p><p class="hint">'+esc(String(err.message||err))+'</p>'}
  finally{$('#aiSend').disabled=false}
});
const SUGG={pt:["Se Jesus é Deus, por que Ele orava ao Pai?","A Bíblia foi alterada?","Jesus disse alguma vez que é Deus?","Por que Uthman queimou as cópias do Alcorão?"],tr:["İsa Tanrı ise neden Baba'ya dua ediyordu?","Kutsal Kitap değiştirildi mi?","İsa hiç Tanrı olduğunu söyledi mi?","Osman neden Kur'an nüshalarını yaktı?"]};
function renderSugg(){$('#aiSugg').innerHTML=SUGG[uiLang()].map(q=>`<button type="button" class="sugg">${esc(q)}</button>`).join('')}
$('#aiSugg').addEventListener('click',e=>{const b=e.target.closest('.sugg');if(!b)return;$('#aiInput').value=b.textContent;$('#aiForm').requestSubmit()});
$('#aiInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(pointer:fine)').matches){e.preventDefault();$('#aiForm').requestSubmit()}});
$('#aiClear').onclick=()=>{history=[];$('#aiLog').innerHTML='';$('#aiInput').focus()};
function renderHist(){
  const h=loadH().slice().reverse();const L=uiLang();
  $('#hpBody').innerHTML=h.length?h.map(x=>{const d=new Date(x.t);const ds=d.toLocaleDateString(L==='tr'?'tr-TR':'pt-BR')+' '+d.toLocaleTimeString(L==='tr'?'tr-TR':'pt-BR',{hour:'2-digit',minute:'2-digit'});
    return `<details class="hitem"><summary><span class="hd">${esc(ds)}</span>${esc(x.q)}</summary><div class="ha">${md(x.a)}${srcHTML(x.srcs)}</div></details>`}).join(''):`<p class="sp-meta">${t('histEmpty')}</p>`;
}
function openHist(){renderHist();document.body.classList.add('hp-open')}
function closeHist(){document.body.classList.remove('hp-open')}
$('#histBtn').onclick=openHist;$('#hpClose').onclick=closeHist;
$('#hpClear').onclick=()=>{if(confirm(t('histConfirm'))){saveH([]);renderHist();updateHint()}};

/* ---------------- copy ---------------- */
function copyText(s){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(s);
  return new Promise(res=>{const a=document.createElement('textarea');a.value=s;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();res()});
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const fi=e.target.closest('.fig img');if(fi){const l=$('#lb');l.querySelector('img').src=fi.src;l.querySelector('img').alt=fi.alt;l.classList.add('on');return}
  if(e.target.closest('#lb')){$('#lb').classList.remove('on');return}
  const cp=e.target.closest('.q .copy');
  if(cp){const b=DATA.blocks.find(x=>x.n==cp.dataset.b);const R=b[cp.dataset.l];const q=R.qs[+cp.dataset.q];
    copyText(R.prompt+'\n\n'+q.text).then(()=>{cp.classList.add('done');cp.textContent=UI[cp.dataset.l].copied;toast(UI[cp.dataset.l].copied);setTimeout(()=>{cp.classList.remove('done');cp.textContent=UI[cp.dataset.l].copyQ},1800)});return}
  const j=e.target.closest('[data-jump]');if(j){e.preventDefault();goTo(j.dataset.jump);return}
  const r=e.target.closest('.res');if(r){const terms=$('#q').value.split('|').flatMap(s=>s.trim().split(/\s+/));goTo(r.dataset.id,terms);return}
  const ch=e.target.closest('.chip');if(ch){const c=DATA.topics[+ch.dataset.i];goTo(c.id,c.terms.split('|'));return}
  const tl=e.target.closest('nav.toc a[data-id]');if(tl){e.preventDefault();goTo(tl.dataset.id);return}
  const qc=e.target.closest('.qcard');if(qc){const g=qc.dataset.go;if(g==='read')goTo(DATA.blocks[0].id);if(g==='search')openSearch();if(g==='ask'){$('#perguntar').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('#aiInput').focus(),400)}return}
});
function readingAnchor(){
  const top=(document.querySelector('header.top').offsetHeight||64)+8;
  for(const r of document.querySelectorAll('#doc .r')){const b=r.getBoundingClientRect();
    if(b.bottom>top){return b.top<=top?{id:r.id,ratio:(top-b.top)/Math.max(1,b.height),top}:null}}
  return null}
function switchLang(m){
  if(m===mode)return;const a=readingAnchor();
  mode=m;store.set('jx_lang',mode);applyUI();renderDoc();
  if(a){const el=document.getElementById(a.id);if(el){const y=el.getBoundingClientRect().top+scrollY-a.top+a.ratio*el.offsetHeight;
    document.documentElement.style.scrollBehavior='auto';scrollTo(0,y);document.documentElement.style.scrollBehavior=''}}
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>switchLang(b.dataset.mode));
$('#fsPlus').onclick=()=>setFs(fs+1);$('#fsMinus').onclick=()=>setFs(fs-1);
$('#themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme||'dark';const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;store.set('jx_theme',n)};
$('#searchBtn').onclick=()=>openSearch();$('#spClose').onclick=closeSearch;$('#spBack').onclick=()=>{closeSearch();closeHist()};
$('#q').addEventListener('input',()=>{clearTimeout(window._sq);window._sq=setTimeout(doSearch,120)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeSearch();closeHist();$('#lb').classList.remove('on');document.body.classList.remove('toc-open')}});
$('#fab').onclick=()=>{$('#perguntar').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('#aiInput').focus(),400)};
$('#totop').onclick=()=>scrollTo({top:0,behavior:'smooth'});
$('#tocBtn').onclick=()=>document.body.classList.toggle('toc-open');
const mq=matchMedia('(max-width:1000px)');const tocBtn=()=>{$('#tocBtn').style.display=mq.matches?'inline-flex':'none'};mq.addEventListener('change',tocBtn);tocBtn();
/* active TOC item */
let ticking=false;addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;let best=null;for(const e of DATA.toc){const el=document.getElementById(e.id);if(el&&el.getBoundingClientRect().top<140)best=e.id}document.querySelectorAll('nav.toc a').forEach(a=>a.classList.toggle('active',a.dataset.id===best))})});

/* ---------------- init ---------------- */
(function(){document.documentElement.dataset.theme=store.get('jx_theme','dark')})();
setFs(fs);applyUI();renderDoc();
</script>
