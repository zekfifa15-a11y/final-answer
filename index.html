<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Jesus Esquecido? Resposta completa</title>
<meta name="description" content="Resposta completa, em português e turco, ao vídeo O Jesus Esquecido, episódio 2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --fs:20px;
  --bg:#f7f3ec; --paper:#fffdf9; --ink:#1f2430; --muted:#5e6575; --line:#e6dfd2;
  --accent:#1e3a5f; --accent-2:#b0802f; --accent-soft:#eef2f8; --gold-soft:#f6eedc; --heading:#1e3a5f;
  --ok:#2f7d4f; --ok-soft:#e8f4ec; --bad:#b23b3b; --bad-soft:#fbecec; --ask:#2a5ea8; --ask-soft:#e9f0fb;
  --btn-ink:#fffdf9; --mark:#ffe08a; --glow:rgba(176,128,47,.10);
  --body:#2d3342; --strong:#0f1420; --title:#14243d; --quran:#c25a0c; --quran-soft:#fdf1e6; --edge:#d9cfbd;
  --shadow:0 1px 2px rgba(20,25,35,.06),0 8px 24px rgba(20,25,35,.06);
  --radius:14px; --head-h:64px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a0d13; --paper:#111620; --ink:#eef1f6; --muted:#9aa5b8; --line:#2a3446; --edge:#3a4760;
  --accent:#6eaaff; --accent-2:#ffbf47; --accent-soft:#16233a; --gold-soft:#2e2510; --heading:#ffc65c;
  --ok:#3fdc8a; --ok-soft:#0f2a1d; --bad:#ff6b6b; --bad-soft:#2c1216; --ask:#7fb0ff; --ask-soft:#0f1b30;
  --btn-ink:#0a0d13; --mark:#7a5a12; --glow:rgba(255,191,71,.07);
  --body:#c5cddb; --strong:#ffffff; --title:#ffffff; --quran:#ffa64d; --quran-soft:#2b1a0b;
  --shadow:0 0 0 1px rgba(110,170,255,.06),0 18px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:radial-gradient(1100px 560px at 12% -10%,var(--glow),transparent 62%),radial-gradient(900px 500px at 100% 0%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:var(--fs);line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:Montserrat,system-ui,sans-serif}
.ui{font-family:Montserrat,system-ui,sans-serif}
a{color:var(--accent)}
/* Header */
header.top{position:sticky;top:0;z-index:50;height:var(--head-h);display:flex;align-items:center;gap:12px;padding:0 16px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:Montserrat,sans-serif;font-weight:700;font-size:15px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;text-decoration:none}
.brand span{color:var(--accent-2)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--btn-ink)}
.iconbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);height:36px;min-width:36px;padding:0 10px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn:hover{border-color:var(--accent)}
.hide-sm{display:inline-flex}
/* Hero */
.hero{max-width:1240px;margin:0 auto;padding:48px 16px 8px}
.hero h1{font-size:clamp(30px,4.2vw,50px);line-height:1.15;margin:0 0 12px;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--accent-2)}
.hero p.lead{font-size:1.05em;color:var(--muted);margin:0 0 26px;max-width:860px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;text-align:left;color:var(--ink);font-family:Montserrat,sans-serif}
.qcard b{display:block;font-size:17px;margin-bottom:4px}
.qcard span{font-size:14.5px;color:var(--muted);line-height:1.5}
.qcard .ic{font-size:22px;display:block;margin-bottom:8px}
.qcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:500;cursor:pointer;font-family:Montserrat,sans-serif}
.chip:hover{background:var(--accent-soft);border-color:var(--accent)}
.label{font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px}
/* AI box */
.ai{max-width:1240px;margin:18px auto 0;padding:0 16px}
.ai-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.ai-head{padding:20px 22px 6px;display:flex;gap:12px;align-items:flex-start}
.ai-head .dot{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex:none}
.ai-head h2{margin:0;font-size:1.25em;line-height:1.3}
.ai-head p{margin:2px 0 0;color:var(--muted);font-size:.85em;line-height:1.5}
.ai-log{padding:6px 22px;display:flex;flex-direction:column;gap:14px;max-height:none}
.msg{border-radius:14px;padding:14px 16px;line-height:1.65}
.msg.user{background:var(--accent-soft);align-self:flex-end;max-width:90%;font-family:Montserrat,sans-serif;font-size:.9em}
.msg.bot{background:var(--bg);border:1px solid var(--line)}
.msg.bot p{margin:.4em 0}
.msg.bot ul,.msg.bot ol{margin:.4em 0;padding-left:1.3em}
.msg.bot h4{margin:.6em 0 .2em;font-size:1em}
.msg .src{margin-top:10px;font-family:Montserrat,sans-serif;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.msg .src a{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;font-weight:500}
.ai-form{padding:12px 22px 20px;display:flex;flex-direction:column;gap:10px}
.ai-form textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:max(16px,.85em);background:var(--bg);color:var(--ink);line-height:1.5}
.ai-form textarea:focus,.search-input:focus{outline:2px solid var(--accent);outline-offset:1px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--btn-ink);font-weight:600;font-size:15px;padding:11px 18px;border-radius:11px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:wait}
.hint{font-family:Montserrat,sans-serif;font-size:13px;color:var(--muted)}
.typing{display:inline-flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* Layout */
.layout{max-width:1240px;margin:28px auto 80px;padding:0 16px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
nav.toc{position:sticky;top:calc(var(--head-h) + 14px);max-height:calc(100vh - var(--head-h) - 28px);overflow:auto;font-family:Montserrat,sans-serif;font-size:14px;padding-right:4px}
nav.toc .ttl{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
nav.toc a{display:block;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:8px;line-height:1.35}
nav.toc a.part{color:var(--ink);font-weight:650;margin-top:8px}
nav.toc a.pt{padding-left:22px;font-size:13.5px}
nav.toc a:hover,nav.toc a.active{background:var(--accent-soft);color:var(--accent)}
main.doc{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:10px 0 30px;min-width:0}
.r{display:grid;grid-template-columns:1fr;gap:0;padding:6px 34px;scroll-margin-top:calc(var(--head-h) + 16px);border-radius:10px;transition:background .6s}
body.mode-both .r{grid-template-columns:1fr 1fr;gap:34px}
body.mode-both .r>.c+.c{border-left:1px solid var(--line);padding-left:34px}
body.mode-pt .c.tr, body.mode-tr .c.pt{display:none}
.r.flash{background:var(--gold-soft)}
.c{min-width:0}
.c p{margin:.55em 0}
.lang-tag{display:none;font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.c ul{margin:.4em 0 .7em;padding-left:1.15em}
.c li{margin:.3em 0}
.c li::marker{color:var(--accent-2)}
.r.title h1{font-size:1.45em;line-height:1.3;margin:.6em 0 .2em;color:var(--heading)}
.r.part{margin-top:34px}
.r.part h2{font-size:1.5em;line-height:1.25;margin:.2em 0;padding:18px 0 12px;border-top:2px solid var(--accent-2);color:var(--heading);letter-spacing:-.2px}
.claim{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:10px;padding:12px 16px;margin:.7em 0}
.okh{display:flex;gap:10px;align-items:flex-start;margin:1.1em 0 .25em;font-weight:600;color:var(--ink)}
.okh .ico,.claim .ico,.askh .ico{flex:none;width:1.3em;height:1.3em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.72em;font-family:Montserrat,sans-serif;font-weight:800;margin-top:.2em}
.okh .ico{background:var(--ok);color:#fff}
.claim .ico{background:var(--bad);color:#fff;margin-right:6px;vertical-align:.1em;display:inline-flex}
.askh{display:flex;gap:10px;margin:1em 0 .2em;font-weight:600}
.askh .ico{background:var(--ask);color:#fff}
.okline{display:flex;gap:10px;align-items:flex-start;margin:.6em 0}
.okline .ico{flex:none;width:1.3em;height:1.3em;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.72em;font-family:Montserrat,sans-serif;font-weight:800;margin-top:.25em}
/* research */
.research{margin:18px 0;border:1px solid var(--line);border-radius:16px;background:var(--ask-soft);overflow:hidden}
.research>summary{list-style:none;cursor:pointer;padding:14px 18px;font-family:Montserrat,sans-serif;font-weight:700;font-size:16px;color:var(--ask);display:flex;align-items:center;gap:10px}
.research>summary::-webkit-details-marker{display:none}
.research>summary .count{margin-left:auto;font-weight:600;font-size:13px;color:var(--muted)}
.research>summary .chev{transition:transform .2s}
.research[open]>summary .chev{transform:rotate(90deg)}
.rs-body{padding:0 18px 18px}
.rs-grid{display:grid;grid-template-columns:1fr;gap:18px}
body.mode-both .rs-grid{grid-template-columns:1fr 1fr}
body.mode-pt .rs-col.tr, body.mode-tr .rs-col.pt{display:none}
.prompt{font-family:Montserrat,sans-serif;font-size:13.5px;line-height:1.55;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted)}
.prompt summary{cursor:pointer;font-weight:600;color:var(--ink)}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-family:Montserrat,sans-serif;font-size:max(15px,.8em);line-height:1.55}
.q b{display:block;color:var(--ask);margin-bottom:3px}
.q .copy{margin-top:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer}
.q .copy.done{background:var(--ok);color:#fff;border-color:var(--ok)}
/* search panel */
.sp-back{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:80;display:none}
.sp{visibility:hidden;position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--paper);z-index:90;box-shadow:-10px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
body.sp-open #sp{transform:none;visibility:visible} body.sp-open .sp-back,body.hp-open .sp-back{display:block}
body.hp-open #hp{transform:none;visibility:visible}
.badge{background:var(--accent);color:var(--paper);border-radius:999px;font-size:12px;padding:1px 8px;margin-left:4px}.badge:empty{display:none}
.hitem{border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:10px}
.hitem>summary{cursor:pointer;padding:12px 14px;list-style:none;font-size:15px;line-height:1.45}
.hitem>summary::-webkit-details-marker{display:none}
.hitem .hd{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.hitem .ha{padding:0 14px 12px;font-family:Montserrat,system-ui,sans-serif;font-size:16px;line-height:1.6;border-top:1px solid var(--line)}
.hitem .ha .src a{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;font-family:Montserrat,sans-serif;font-size:13px;margin:3px 4px 0 0;display:inline-block}
.sp-head{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.search-input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;background:var(--bg);color:var(--ink)}
.sp-body{overflow:auto;padding:12px 16px 30px;font-family:Montserrat,sans-serif}
.sp-meta{font-size:13px;color:var(--muted);margin:4px 2px 10px}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--ink);font-size:15px;line-height:1.5}
.res:hover{border-color:var(--accent)}
.res .where{font-size:12px;font-weight:700;color:var(--accent-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] .claim{color:#f3dede}
:root[data-theme="dark"] .q{background:#171e2a}
:root[data-theme="dark"] .fab{color:var(--btn-ink)}
:root[data-theme="dark"] .msg.user{color:var(--ink)}
.th-sun{display:none}:root[data-theme="dark"] .th-sun{display:block}:root[data-theme="dark"] .th-moon{display:none}
/* settings */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:22px;font-family:Montserrat,sans-serif;font-size:15px}
dialog::backdrop{background:rgba(10,14,22,.5)}
dialog label{display:block;font-weight:600;margin:14px 0 6px}
dialog input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-family:Montserrat,sans-serif;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.fab{position:fixed;right:18px;bottom:18px;z-index:60;border:0;border-radius:999px;background:var(--accent);color:var(--btn-ink);font-family:Montserrat,sans-serif;font-weight:700;font-size:15px;padding:13px 18px;box-shadow:var(--shadow);cursor:pointer}
.totop{position:fixed;left:18px;bottom:18px;z-index:60}
footer{max-width:1240px;margin:0 auto 60px;padding:0 16px;color:var(--muted);font-family:Montserrat,sans-serif;font-size:13px}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  nav.toc{display:none}
  body.toc-open nav.toc{display:block;position:fixed;inset:var(--head-h) 0 0 0;max-height:none;background:var(--paper);z-index:70;padding:16px;font-size:16px}
  body.mode-both .r{grid-template-columns:1fr;gap:0}
  body.mode-both .r>.c+.c{border-left:0;padding-left:0;border-top:1px dashed var(--line);margin-top:6px}
  body.mode-both .lang-tag{display:block}
  body.mode-both .rs-grid{grid-template-columns:1fr}
  .r{padding:6px 18px}
  .quick{grid-template-columns:1fr}
}
@media (max-width:640px){
  .hide-sm{display:none}
  .seg button{padding:6px 9px}
  header.top{gap:6px;padding:0 10px}
  .hero{padding-top:28px}
  .brand{display:none}
  .fab{padding:11px 14px;font-size:14px}
  .ai-head,.ai-log,.ai-form{padding-left:14px;padding-right:14px}
}
@media print{header.top,.ai,.fab,.totop,nav.toc,.hero .quick,.chips{display:none}.layout{display:block}main.doc{box-shadow:none;border:0}}

/* ===== Tipografia e hierarquia ===== */
body{letter-spacing:.005em;line-height:1.8}
.c p,.c li{color:var(--body)}
.c strong,.msg.bot strong,.hitem strong{color:var(--strong);font-weight:700}
.c em{color:var(--strong)}
.c li>strong.lbl{color:var(--accent)}
.hero h1{font-weight:800;letter-spacing:-.8px}
:root[data-theme="dark"] .hero h1{color:var(--title)}
.hero h1 em{color:var(--heading)}
.ai-head h2{font-weight:800;color:var(--title)}
main.doc{border:1px solid var(--edge);position:relative;overflow:hidden}
main.doc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.r.title h1{font-weight:800;color:var(--title);font-size:1.5em;letter-spacing:-.4px}
.r.part{margin-top:46px}
.r.part .c{padding:22px 0 8px;border-top:1px solid var(--edge)}
.eyebrow{display:inline-block;font-size:.7em;font-weight:800;letter-spacing:.14em;color:var(--btn-ink);background:var(--accent-2);border-radius:999px;padding:4px 12px;margin-bottom:12px}
.r.part h2{border:0;padding:0;margin:0 0 6px;font-size:1.75em;font-weight:800;line-height:1.2;color:var(--title);letter-spacing:-.6px}
.claim{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-left:5px solid var(--bad);border-radius:12px;padding:14px 18px;margin:1.2em 0 .8em;color:var(--strong);font-weight:500}
.claim strong.cl{color:var(--bad);text-transform:uppercase;font-size:.78em;letter-spacing:.08em;font-weight:800;margin-right:4px}
.okh{font-size:1.12em;font-weight:700;color:var(--title);margin:1.7em 0 .35em;line-height:1.4}
.okh strong{color:var(--title);font-weight:800}
.okh .ico{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.okh.quran strong,.okh.quran{color:var(--quran)}
.okh.quran .ico{background:var(--quran);box-shadow:0 0 0 4px color-mix(in srgb,var(--quran) 22%,transparent)}
.okh.quran+p,.okh.quran+ul{border-left:3px solid color-mix(in srgb,var(--quran) 55%,transparent);padding-left:14px}
.okline{color:var(--body)}
.askh{font-size:1.08em;color:var(--title)}
.trans{display:flex;align-items:center;gap:14px;margin:26px 0 6px;color:var(--muted);font-size:.85em;font-weight:600;letter-spacing:.02em}
.trans::before,.trans::after{content:"";flex:1;height:1px;background:var(--edge)}
.c ul{padding-left:1.25em}
.c li{margin:.45em 0}
.c li::marker{color:var(--accent-2);font-size:1.1em}
.research{border:1px solid color-mix(in srgb,var(--ask) 35%,transparent)}
.research>summary{color:var(--ask);font-size:17px}
.q{border-color:var(--line)}
.q b{color:var(--ask);font-weight:700}
nav.toc a.part{color:var(--title)}
nav.toc a.active{box-shadow:inset 3px 0 0 var(--accent)}
.chip{font-weight:600}
:root[data-theme="dark"] .chip{border-color:var(--edge)}
:root[data-theme="dark"] .chip:hover{border-color:var(--accent);color:var(--accent)}
:root[data-theme="dark"] .qcard,:root[data-theme="dark"] .ai-card,:root[data-theme="dark"] .iconbtn,:root[data-theme="dark"] .seg{border-color:var(--edge)}
:root[data-theme="dark"] .qcard:hover{border-color:var(--accent-2)}
:root[data-theme="dark"] .ai-card{box-shadow:0 0 0 1px rgba(255,191,71,.08),var(--shadow)}

.sugg{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 8%,var(--paper));color:var(--title);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:Montserrat,sans-serif;text-align:left}

.ai-form{padding:14px 26px 24px}
.ai-box{position:relative;border-radius:16px;background:var(--bg);border:1.5px solid var(--edge);transition:border-color .15s,box-shadow .15s}
.ai-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.ai-form .ai-box textarea{display:block;border:0;background:transparent;outline:none;min-height:110px;padding:16px 18px 64px;border-radius:16px;font-size:max(16px,.85em);color:var(--ink);resize:vertical;font-family:Montserrat,sans-serif}
.ai-form .ai-box textarea:focus{outline:none}
.send{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent-2),color-mix(in srgb,var(--accent-2) 40%,var(--accent)));box-shadow:0 6px 18px color-mix(in srgb,var(--accent-2) 35%,transparent);transition:transform .15s,box-shadow .15s,filter .15s;font-family:Montserrat,sans-serif}

.ai-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--edge);background:var(--paper);color:var(--title);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:Montserrat,sans-serif}

.ai-bar .hint{margin-left:auto;font-size:12.5px}
.badge{background:var(--accent-2);color:#1a1206}

<script>
/* CONFIGURAÇÃO DA IA (Claude Opus 5.5, esforço alto) */
const AI_CONFIG = {
  key: ["sk-ant-usr-13A4J9gAU","T9s_V6Gs5R2Xqy7NsvyH","3xKDzoemKjGcChs6u8HH","MgT03x910LFE_nBS5Axd","So_RQETYqgGHwvFhEwS1","FfTwAA"].join(""),
  model: "claude-opus-5-5",
  effort: "high",
  maxTokens: 16000,
  apiVersion: "2023-06-01",
  topChunks: 9
};

const DATA = {"blocks": [{"k": "title", "n": 0, "id": "p0", "pt": "*Resposta ao segundo vídeo (\"O Jesus Esquecido\", episódio 2) e às perguntas do senhor*", "tr": "*İkinci videoya (\"Unutulan İsa\", 2. bölüm) ve sorularınıza cevap*", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "para", "n": 1, "id": "p1", "pt": "Fatih Bey e senhora Nezahat, agora vou responder o segundo vídeo que o senhor, Fatih Bey, me mandou. Ele faz muitas afirmações, uma atrás da outra, e para quem não conhece o assunto parece muito forte. Mas quando cada afirmação é conferida, ela cai. Vou responder todas, em ordem, e também as perguntas que o senhor mesmo me fez: como a Bíblia pode ser sagrada se pode ser alterada, e se Muhammad aprovou as leituras diferentes do Alcorão. No final, vou mostrar que as próprias regras do vídeo derrubam o Islã, e não fazem nem cócegas no cristianismo. Peço que leia até o fim.", "tr": "Fatih Bey ve Nezahat Hanım, şimdi Fatih Bey'in bana gönderdiği ikinci videoya cevap vereceğim. Video art arda birçok iddia ortaya atıyor ve konuyu bilmeyen biri için çok güçlü görünüyor. Ama her iddia kontrol edildiğinde çöküyor. Hepsine sırayla cevap vereceğim; sizin bana sorduğunuz sorulara da: Kutsal Kitap değiştirilebiliyorsa nasıl kutsal olabilir ve Muhammed Kur'an'ın farklı kıraatlerini onayladı mı? Sonunda da videonun kendi kurallarının İslam'ı yıktığını, Hristiyanlığa ise zerre kadar dokunmadığını göstereceğim. Sonuna kadar okumanızı rica ediyorum.", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "para", "n": 2, "id": "p2", "pt": "Antes, uma coisa importante: esse vídeo é feito por um canal muçulmano, para convencer cristãos a deixar a fé. Ele usa os estudiosos críticos só quando servem para ele, e esconde o que esses mesmos estudiosos dizem quando não serve. O senhor vai ver isso várias vezes abaixo.", "tr": "Önce önemli bir şey: Bu video, Hristiyanları imanlarından vazgeçirmek için hazırlanmış Müslüman bir kanalın videosudur. Eleştirel araştırmacıları sadece işine geldiğinde kullanıyor, aynı araştırmacıların işine gelmeyen sözlerini ise saklıyor. Aşağıda bunu birçok kez göreceksiniz.", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "para", "n": 3, "id": "p3", "pt": "E para vocês não ficarem mentindo para a Zeynep, citando argumentos falsos e histórias que nem existem, no final de cada ponto vocês podem pesquisar as perguntas que eu deixei, no bloco \"*Antes de dizer que é mentira, pesquisem:*\". Elas não são enviesadas, para que vocês possam ver claramente a verdade.", "tr": "Ve Zeynep'e yalan söylemeyi, yanlış argümanlar ve hiç var olmayan hikâyeler anlatmayı bırakmanız için, her bölümün sonunda \"*Yalan demeden önce araştırın:*\" kısmında bıraktığım soruları araştırabilirsiniz. Bu sorular taraflı değil; gerçeği açıkça görebilmeniz için hazırlandı.", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "para", "n": 4, "id": "p4", "pt": "Em cada bloco de pesquisa eu deixei um texto para colar antes de cada pergunta, para a inteligência artificial responder direto, sem ficar dando voltas.", "tr": "Her araştırma kısmına, yapay zekâ lafı dolandırmadan doğrudan cevap versin diye, her sorudan önce yapıştırılacak bir metin koydum.", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "para", "n": 5, "id": "p5", "pt": "É muito fácil querer crescer para cima da Zeynep, que é cristã há nem 4 meses direito. Mas quando é para falar comigo, vocês me evitam e nunca respondem nada diretamente. Que medo é esse de mim? Vocês me evitam porque sabem que eu não afino como a Zeynep, porque eu respondo tudo de um jeito que não tem saída, e a única saída que vocês têm é negar a realidade, mentindo e querendo interpretar a realidade do jeito que vocês querem.", "tr": "Hristiyan olalı daha dört ay bile olmayan Zeynep'in üzerine gitmek çok kolay. Ama iş benimle konuşmaya gelince benden kaçıyorsunuz ve hiçbir şeye doğrudan cevap vermiyorsunuz. Benden bu korku ne? Benden kaçıyorsunuz, çünkü Zeynep gibi geri adım atmadığımı biliyorsunuz; çünkü her şeye çıkış yolu bırakmayacak şekilde cevap veriyorum ve sizin tek çıkış yolunuz gerçeği inkâr etmek, yalan söylemek ve gerçeği istediğiniz gibi yorumlamaya çalışmak.", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "para", "n": 6, "id": "p6", "pt": "Vocês estão vendo claramente uma parede branca na frente de vocês. Eu provo por que a parede é branca, com documentos e fatos mostrando que a parede é branca, e vocês insistem em dizer que a parede é verde. Esse é o nível de vocês.", "tr": "Önünüzde açıkça beyaz bir duvar görüyorsunuz. Duvarın neden beyaz olduğunu kanıtlıyorum; duvarın beyaz olduğunu gösteren belgeler ve olgular var, siz ise duvarın yeşil olduğunda ısrar ediyorsunuz. Sizin seviyeniz bu.", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "para", "n": 7, "id": "p7", "pt": "Falem comigo. Por que ficam enchendo a cabeça da Zeynep com tantas mentiras? A menina vive triste o dia inteiro. Se pelo menos fosse por algo que valesse a pena... Mas não: é tudo por causa de mentiras e dos argumentos mais ilógicos do mundo. Vocês não são analfabetos digitais, vocês sabem fazer uma pesquisa no Google. Fazem de tudo para defender uma mentira indefensável, mas hoje isso acaba.", "tr": "Benimle konuşun. Zeynep'in kafasını neden bu kadar yalanla dolduruyorsunuz? Kız bütün gün üzgün geziyor. Hiç olmazsa buna değecek bir şey için olsa... Ama hayır: Her şey yalanlar ve dünyanın en mantıksız argümanları yüzünden. Siz dijital cahiller değilsiniz, Google'da arama yapmayı biliyorsunuz. Savunulamaz bir yalanı savunmak için her şeyi yapıyorsunuz, ama bugün bu bitiyor.", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "para", "n": 8, "id": "p8", "pt": "Tenham pelo menos a honestidade de ouvir a filha de vocês sem interromper, porque nem deixar ela falar vocês deixam. Os ouvidos sangram ao ouvir a verdade? O que é isso? Apenas ouçam, ponto por ponto. Aí sim vocês podem discutir um ponto e depois seguir para o próximo. Vocês passam 4 horas falando mentiras que eu já respondi nos primeiros documentos e mensagens que mandei para o senhor, Fatih Bey, e o senhor tem a audácia de dizer que leu. O senhor não é bobo, o senhor sabe ler. O que o senhor ganha mentindo? Só perde a coisa mais importante da sua vida: a salvação e a vida eterna.", "tr": "Hiç olmazsa kızınızı sözünü kesmeden dinleyecek kadar dürüst olun; ona konuşma fırsatı bile vermiyorsunuz. Gerçeği duymak kulaklarınızı mı kanatıyor? Bu ne? Sadece dinleyin, bölüm bölüm. Ancak o zaman bir bölümü tartışıp sonra bir sonrakine geçebilirsiniz. Size, Fatih Bey, gönderdiğim ilk belgelerde ve mesajlarda zaten cevap verdiğim yalanları dört saat boyunca konuşuyorsunuz ve siz okuduğunuzu söyleme cüretini gösteriyorsunuz. Siz saf biri değilsiniz, okumayı biliyorsunuz. Yalan söyleyerek ne kazanıyorsunuz? Sadece hayatınızdaki en önemli şeyi kaybediyorsunuz: kurtuluşu ve sonsuz yaşamı.", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "para", "n": 9, "id": "p9", "pt": "Isso acaba hoje, porque hoje não vai ter margem para essas mentiras e distorções de palavras que vocês fazem. Então vamos lá, vamos começar.", "tr": "Bu bugün bitiyor, çünkü bugün yaptığınız bu yalanlara ve sözleri çarpıtmalarınıza yer olmayacak. O halde haydi, başlayalım.", "where": {"pt": "Introdução", "tr": "Giriş"}, "newPoint": false}, {"k": "part", "n": 10, "id": "part-1", "pt": "*PARTE 1: QUEM ESCREVEU OS EVANGELHOS?*", "tr": "*1. BÖLÜM: İNCİLLERİ KİM YAZDI?*", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos", "tr": "1. Bölüm: İncilleri kim yazdı"}, "newPoint": false, "lab": {"pt": ["PARTE 1", "Quem escreveu os Evangelhos"], "tr": ["1. BÖLÜM", "İncilleri kim yazdı"]}}, {"k": "para", "n": 11, "id": "p11", "pt": "❌ *O que o vídeo diz:* que os Evangelhos são anônimos, que os títulos \"segundo Mateus\", \"segundo Marcos\" foram colocados depois, e que, se Mateus fosse o autor, não falaria de si mesmo na terceira pessoa (Mateus 9:9).", "tr": "❌ *Videonun söylediği:* İncillerin anonim olduğu, \"Matta'ya göre\", \"Markos'a göre\" başlıklarının sonradan konduğu ve Matta yazar olsaydı kendisinden üçüncü şahıs olarak bahsetmeyeceği (Matta 9:9).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": true}, {"k": "para", "n": 12, "id": "p12", "pt": "Fatih Bey, o vídeo quer que o senhor pense que, como os autores não escrevem o próprio nome dentro do texto, ninguém sabe quem escreveu. Isso é falso, e o argumento da terceira pessoa é tão fraco que derrubaria até Júlio César, e até o próprio Alcorão, em que Allah e Muhammad aparecem na terceira pessoa. E repare: mesmo que o senhor aceitasse tudo o que os estudiosos mais céticos dizem sobre os autores, o Islã não ganharia nada com isso, como vou mostrar no fim deste ponto. Veja:", "tr": "Fatih Bey, video, yazarlar kendi isimlerini metnin içine yazmadığı için bu kitapları kimin yazdığını kimsenin bilmediğini düşünmenizi istiyor. Bu yanlıştır; üçüncü şahıs argümanı ise o kadar zayıftır ki Jül Sezar'ı, hatta Allah'ın ve Muhammed'in üçüncü şahıs olarak geçtiği Kur'an'ın kendisini bile yıkardı. Şuna da dikkat edin: Yazarlar konusunda en şüpheci araştırmacıların söylediği her şeyi kabul etseniz bile, İslam bundan hiçbir şey kazanmaz; bunu bu bölümün sonunda göstereceğim. Bakın:", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 13, "id": "p13", "pt": "✅ *É verdade: os autores não escrevem o próprio nome no meio do texto. Mas isso não quer dizer que ninguém sabia quem eram.*\nOs estudiosos chamam isso de anonimato do texto. Mas um texto sem assinatura não é a mesma coisa que um livro de autor desconhecido. O que mostra quem escreveu um livro antigo não é uma frase dentro dele, nem a palavra de uma pessoa só, porque uma pessoa sozinha pode errar ou mentir. O que mostra é uma cadeia de provas, que vêm de fontes e lugares diferentes e apontam todas para os mesmos nomes. Os Evangelhos têm essa cadeia. Veja, prova por prova:", "tr": "✅ *Doğru: Yazarlar kendi isimlerini metnin içine yazmaz. Ama bu, kimsenin onları bilmediği anlamına gelmez.*\nAraştırmacılar buna metnin anonimliği der. Ama imzası olmayan bir metin, yazarı bilinmeyen bir kitapla aynı şey değildir. Eski bir kitabı kimin yazdığını gösteren şey, kitabın içindeki bir cümle ya da tek bir kişinin sözü değildir, çünkü tek bir kişi yanılabilir ya da yalan söyleyebilir. Bunu gösteren, farklı kaynaklardan ve yerlerden gelen ve hepsi aynı isimleri gösteren bir delil zinciridir. İncillerin böyle bir zinciri var. Delil delil bakın:", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 14, "id": "p14", "pt": "✅ *Prova 1: os manuscritos.*\nPapiros de por volta do ano 200 já trazem os títulos: o Papiro 75 traz \"Evangelho segundo Lucas\" no fim de Lucas e \"Evangelho segundo João\" logo no começo de João; o Papiro 66 começa com \"Evangelho segundo João\"; e o Papiro 4, um códice de Lucas da mesma época ou pouco depois, tem numa folha de guarda o título \"Evangelho segundo Mateus\". E os primeiros códices completos trazem os títulos dos quatro.", "tr": "✅ *1. delil: el yazmaları.*\nYaklaşık 200 yılına ait papirüslerde başlıklar zaten vardır: Papirüs 75'te Luka'nın sonunda \"Luka'ya göre İncil\", hemen ardından Yuhanna'nın başında \"Yuhanna'ya göre İncil\" yazar; Papirüs 66 \"Yuhanna'ya göre İncil\" ile başlar; aynı döneme ya da biraz sonrasına ait bir Luka kodeksi olan Papirüs 4'ün koruma yaprağında da \"Matta'ya göre İncil\" başlığı vardır. İlk tam kodeksler de dördünün başlığını taşır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 15, "id": "p15", "pt": "Nos livros antigos, o título ficava na folha de rosto, no começo ou no fechamento do livro, e em todos os manuscritos em que a parte do título sobreviveu, o nome é sempre o mesmo. *Em nenhum manuscrito, em nenhuma língua*, um desses quatro Evangelhos aparece com o nome de outra pessoa.", "tr": "Eski kitaplarda başlık ön sayfada, kitabın başında ya da sonunda yer alırdı ve başlık kısmının günümüze ulaştığı bütün el yazmalarında isim hep aynıdır. *Hiçbir el yazmasında, hiçbir dilde*, bu dört İncil'den biri başka birinin adıyla geçmez.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 16, "id": "p16", "pt": "✅ *Prova 2: escritores de regiões diferentes confirmam os mesmos Evangelhos.*\nDo meio para o fim do século 2, em lugares a milhares de quilômetros de distância, sem nenhum chefe central para combinar uma história, escritores diferentes confirmam os mesmos Evangelhos:\n• Em Roma, por volta do ano 150, Justino conta que os Evangelhos, que ele chama de \"memórias dos apóstolos\", eram lidos todo domingo nas reuniões cristãs, e que foram escritos \"pelos apóstolos e por aqueles que os seguiram\". É exatamente o que temos: dois apóstolos, Mateus e João, e dois seguidores dos apóstolos, Marcos e Lucas. Ele não cita os quatro nomes, mas descreve exatamente esses quatro.\n• Por volta do ano 170, Taciano, aluno de Justino, juntou esses mesmos quatro Evangelhos num só livro, o Diatessaron.\n• Na Gália, por volta do ano 180, Irineu cita os quatro pelo nome.\n• No norte da África, por volta do ano 200, Tertuliano diz que João e Mateus eram apóstolos, e que Lucas e Marcos eram discípulos dos apóstolos.\nSe os nomes tivessem sido inventados, cada região teria inventado os seus. *Mas todas dizem os mesmos.*", "tr": "✅ *2. delil: farklı bölgelerdeki yazarlar aynı İncilleri doğruluyor.*\n2. yüzyılın ortasından sonuna kadar, birbirinden binlerce kilometre uzak yerlerde, bir hikâyeyi birlikte uyduracak merkezi bir önder olmadan, farklı yazarlar aynı İncilleri doğrular:\n• Roma'da, yaklaşık 150 yılında Justinus, \"elçilerin hatıratları\" dediği İncillerin her pazar Hristiyan toplantılarında okunduğunu ve bunların \"elçiler ve onları izleyenler tarafından\" yazıldığını anlatır. Bu, tam olarak elimizdekidir: İki elçi, Matta ve Yuhanna, ve elçileri izleyen iki kişi, Markos ve Luka. Dört ismi anmaz, ama tam olarak bu dördünü tarif eder.\n• Yaklaşık 170 yılında Justinus'un öğrencisi Tatianus, aynı dört İncil'i Diatessaron adlı tek bir kitapta birleştirdi.\n• Galya'da, yaklaşık 180 yılında İreneus dördünün adını verir.\n• Kuzey Afrika'da, yaklaşık 200 yılında Tertullianus, Yuhanna ile Matta'nın elçi, Luka ile Markos'un ise elçilerin öğrencileri olduğunu söyler.\nİsimler uydurulmuş olsaydı, her bölge kendi isimlerini uydururdu. *Ama hepsi aynı isimleri söylüyor.*", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 17, "id": "p17", "pt": "Os pouquíssimos que rejeitaram algum Evangelho fizeram isso por causa de doutrina, e não porque tivessem provas sobre outro autor. Marcião, que rejeitava o Deus do Antigo Testamento, por volta do ano 140 jogou fora os outros Evangelhos e usava só uma versão cortada de um Evangelho, que os escritores antigos identificam como o de Lucas. Um pequeno grupo, que os relatos antigos chamam de álogos, não gostava do que João ensinava e, segundo esses relatos, dizia que o livro era de Cerinto, um herege do fim do século 1.", "tr": "Herhangi bir İncil'i reddeden çok az kişi, bunu başka bir yazar hakkında delilleri olduğu için değil, öğreti yüzünden yaptı. Eski Antlaşma'nın Tanrısı'nı reddeden Markion, yaklaşık 140 yılında diğer İncilleri attı ve sadece, eski yazarların Luka'nınki olarak tanımladığı bir İncil'in kırpılmış bir versiyonunu kullandı. Eski kaynakların Alogoi diye andığı küçük bir grup da Yuhanna'nın öğrettiklerini sevmiyordu ve bu kaynaklara göre kitabın, 1. yüzyılın sonunda yaşamış sapkın Kerintos'a ait olduğunu söylüyordu.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 18, "id": "p18", "pt": "Nenhum deles mostrou prova nenhuma, e as igrejas de todas as regiões os rejeitaram. E repare: o próprio Marcião confirma que o texto de Lucas já existia e circulava antes do ano 140, porque foi dele que ele cortou a sua versão.", "tr": "Hiçbiri hiçbir delil göstermedi ve bütün bölgelerdeki kiliseler onları reddetti. Dikkat edin: Markion'un kendisi, Luka metninin 140 yılından önce zaten var olduğunu ve dolaştığını doğruluyor, çünkü kendi versiyonunu ondan kesti.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 19, "id": "p19", "pt": "✅ *\"Memórias\" não quer dizer lembranças soltas de uma pessoa.*\nJustino chama os Evangelhos de \"memórias dos apóstolos\" porque eles registram o que os apóstolos viram e viveram com Jesus. E essa mensagem não ficou guardada na cabeça de uma pessoa até alguém escrever. Ela foi pregada em público desde o primeiro dia, e conferida. Veja a sequência:\n• Jesus ensinou em público, na frente de multidões, e não em segredo.\n• Poucas semanas depois da cruz, os apóstolos começaram a pregar em Jerusalém, a mesma cidade onde Jesus tinha sido crucificado, e Pedro disse à multidão: \"como vocês mesmos sabem\" (Atos 2:22). Paulo disse o mesmo diante do rei Agripa: \"nada disso foi feito num canto escondido\" (Atos 26:26). *Quem está inventando não apela para o que o público já sabe.*\n• O resumo da mensagem foi fixado muito cedo. Paulo cita um resumo que ele \"recebeu\": Cristo morreu pelos nossos pecados, foi sepultado, ressuscitou e apareceu a Pedro, aos Doze e a mais de 500 pessoas, \"a maior parte das quais ainda vive\" (1 Coríntios 15:3-7). Até estudiosos céticos datam esse resumo de poucos anos depois da cruz.\n• E essa mensagem foi conferida com os apóstolos. Paulo passou 15 dias com Pedro e encontrou Tiago, o irmão de Jesus, e depois apresentou o evangelho que pregava aos líderes de Jerusalém, que o aprovaram.\n• Quem tentava mudar a mensagem era denunciado na hora: Paulo escreve contra quem pregava \"outro Jesus\" (2 Coríntios 11:4) e \"outro evangelho\" (Gálatas 1:6-8). Se os apóstolos denunciavam até quem mudava o sentido da mensagem, muito menos deixariam passar alguém inventando fatos sobre a vida de Jesus.\n• Quando os Evangelhos foram escritos, as igrejas, de Jerusalém a Roma, já conheciam essa mensagem havia décadas, porque a tinham ouvido dos apóstolos e dos seus companheiros, e ainda viviam pessoas daquela geração. Um Evangelho que contasse outra história seria percebido na hora.\n• E o núcleo dessa mensagem, que Jesus foi crucificado sob Pôncio Pilatos, é confirmado até por historiadores que não são cristãos. *Nenhuma fonte do século 1, de amigo ou de inimigo, diz que Jesus não foi crucificado.*", "tr": "✅ *\"Hatırat\", birinin dağınık anıları demek değildir.*\nJustinus İncillere \"elçilerin hatıratları\" der, çünkü bunlar elçilerin İsa'yla birlikte gördüklerini ve yaşadıklarını kaydeder. Ve bu mesaj, biri yazana kadar tek bir kişinin aklında saklı kalmadı. İlk günden itibaren herkesin önünde vaaz edildi ve kontrol edildi. Sırayla bakın:\n• İsa gizlice değil, kalabalıkların önünde, herkesin gözü önünde öğretti.\n• Çarmıhtan sadece birkaç hafta sonra elçiler, İsa'nın çarmıha gerildiği aynı şehirde, Kudüs'te vaaz etmeye başladı ve Petrus kalabalığa \"kendinizin de bildiği gibi\" dedi (Elçilerin İşleri 2:22). Pavlus da Kral Agrippa'nın önünde aynı şeyi söyledi: \"Bunlar bir köşede olup bitmedi\" (Elçilerin İşleri 26:26). *Uyduran biri, dinleyenlerin zaten bildiklerine başvurmaz.*\n• Mesajın özeti çok erken sabitlendi. Pavlus \"aldığı\" bir özeti aktarır: Mesih günahlarımız için öldü, gömüldü, dirildi ve Petrus'a, Onikiler'e ve \"çoğu hâlâ yaşayan\" 500'den fazla kişiye göründü (1 Korintliler 15:3-7). Şüpheci araştırmacılar bile bu özeti çarmıhtan birkaç yıl sonrasına tarihlendirir.\n• Bu mesaj elçilerle de kontrol edildi. Pavlus Petrus'la 15 gün kaldı ve İsa'nın kardeşi Yakup'la görüştü; sonra vaaz ettiği müjdeyi Kudüs'teki önderlere sundu ve onlar onu onayladı.\n• Mesajı değiştirmeye çalışan hemen ifşa ediliyordu: Pavlus \"başka bir İsa\" (2 Korintliler 11:4) ve \"başka bir müjde\" (Galatyalılar 1:6-8) vaaz edenlere karşı yazar. Elçiler mesajın anlamını değiştireni bile hemen ifşa ediyorsa, İsa'nın hayatı hakkında olaylar uyduranı hiç geçirmezlerdi.\n• İnciller yazıldığında, Kudüs'ten Roma'ya kadar kiliseler bu mesajı onlarca yıldır biliyordu, çünkü onu elçilerden ve onların arkadaşlarından duymuşlardı ve o kuşaktan insanlar hâlâ yaşıyordu. Başka bir hikâye anlatan bir İncil hemen fark edilirdi.\n• Bu mesajın özü, yani İsa'nın Pontius Pilatus döneminde çarmıha gerildiği, Hristiyan olmayan tarihçiler tarafından bile doğrulanır. *1. yüzyıldan, dost ya da düşman, hiçbir kaynak İsa'nın çarmıha gerilmediğini söylemez.*", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 20, "id": "p20", "pt": "✅ *E os relatos concordam entre si.*\nOs Evangelhos não vieram de uma fonte só. Marcos escreveu a partir da pregação de Pedro. Mateus e Lucas usaram Marcos como uma de suas fontes e acrescentaram muito material que só eles têm, e Lucas pesquisou com as testemunhas. João escreveu em grande parte de forma independente dos outros três.", "tr": "✅ *Anlatımlar birbiriyle uyuşuyor.*\nİnciller tek bir kaynaktan gelmedi. Markos, Petrus'un vaazlarından yazdı. Matta ve Luka, Markos'u kaynaklarından biri olarak kullandı ve sadece kendilerinde olan çok sayıda bilgi ekledi; Luka da tanıklarla araştırdı. Yuhanna büyük ölçüde diğer üçünden bağımsız yazdı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 21, "id": "p21", "pt": "E Paulo, antes de todos eles, já dá o mesmo resumo. Fontes diferentes, e todas apontam para o mesmo núcleo: Jesus morreu na cruz e ressuscitou.", "tr": "Hepsinden önce Pavlus da aynı özeti verir. Kaynaklar farklı, ama hepsi aynı özü gösteriyor: İsa çarmıhta öldü ve dirildi.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 22, "id": "p22", "pt": "Os quatro Evangelhos contam a mesma história: o mesmo Jesus, que ensina, cura, morre na cruz e ressuscita, e o mesmo túmulo vazio. As diferenças são de detalhe, como acontece com qualquer grupo de testemunhas verdadeiras, e na Parte 5 eu mostro que nenhuma das \"contradições\" que o vídeo aponta é uma contradição de verdade. Isso mostra Deus guardando a Sua palavra, que não se contradiz.", "tr": "Dört İncil de aynı hikâyeyi anlatır: öğreten, iyileştiren, çarmıhta ölen ve dirilen aynı İsa ve aynı boş mezar. Farklar ayrıntılardadır, tıpkı gerçek tanıklardan oluşan her grupta olduğu gibi; 5. bölümde de videonun gösterdiği \"çelişkilerin\" hiçbirinin gerçek bir çelişki olmadığını göstereceğim. Bu, Tanrı'nın çelişmeyen kendi sözünü koruduğunu gösterir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 23, "id": "p23", "pt": "Compare com o Alcorão: ele conta a história de Jesus 600 anos depois, sem nenhuma dessas testemunhas, e o que ele diz sobre a cruz contradiz os quatro relatos e todas as fontes do século 1.", "tr": "Kur'an'la karşılaştırın: Kur'an, İsa'nın hikâyesini 600 yıl sonra, bu tanıkların hiçbiri olmadan anlatır ve çarmıh hakkında söyledikleri dört anlatımla da, 1. yüzyılın bütün kaynaklarıyla da çelişir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 24, "id": "p24", "pt": "✅ *Prova 3: as cartas de Paulo mostram que Marcos e Lucas eram pessoas reais, do círculo dos apóstolos.*\nNuma carta que até os estudiosos mais céticos aceitam como de Paulo, ele manda saudações de Marcos e de Lucas e os chama de seus colaboradores. E o livro de Atos mostra Pedro, logo depois de sair da prisão, indo à casa da mãe de Marcos, em Jerusalém, onde os cristãos estavam reunidos.", "tr": "✅ *3. delil: Pavlus'un mektupları, Markos'un ve Luka'nın elçilerin çevresinden gerçek kişiler olduğunu gösteriyor.*\nEn şüpheci araştırmacıların bile Pavlus'a ait kabul ettiği bir mektupta Pavlus, Markos'un ve Luka'nın selamlarını iletir ve onlara emektaşlarım der. Elçilerin İşleri de, Petrus'un hapisten çıkar çıkmaz Kudüs'te, Hristiyanların toplanmış olduğu Markos'un annesinin evine gittiğini anlatır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 25, "id": "p25", "pt": "Marcos tinha dois nomes, como muitos judeus da época: um nome judeu, João (não é o apóstolo João), e um nome romano, Marcos; por isso o versículo o chama de \"João, chamado Marcos\".", "tr": "O dönemin birçok Yahudisi gibi Markos'un da iki adı vardı: Yahudi adı Yuhanna (elçi Yuhanna değil), Romalı adı Markos; bu yüzden ayet ondan \"Markos diye anılan Yuhanna\" diye bahseder.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 26, "id": "p26", "pt": "Essas passagens não dizem que eles escreveram os Evangelhos, mas mostram uma coisa importante: os nomes não foram tirados do nada. São homens reais, do círculo mais próximo de Pedro e de Paulo, exatamente as pessoas que poderiam saber o que esses apóstolos ensinavam.", "tr": "Bu bölümler onların İncilleri yazdığını söylemez, ama önemli bir şey gösterir: İsimler yoktan uydurulmadı. Bunlar Petrus'un ve Pavlus'un en yakın çevresinden gerçek adamlardır, yani bu elçilerin ne öğrettiğini tam olarak bilebilecek kişilerdir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 27, "id": "p27", "pt": "✅ *Prova 4: o próprio texto confirma.*\nO Evangelho de Lucas e o livro de Atos foram escritos pela mesma pessoa: os dois são dirigidos ao mesmo homem, Teófilo, e Atos diz que é a continuação de um \"primeiro livro\" sobre o que Jesus fez e ensinou.", "tr": "✅ *4. delil: metnin kendisi doğruluyor.*\nLuka İncili ile Elçilerin İşleri'ni aynı kişi yazdı: İkisi de aynı adama, Teofilos'a hitap eder ve Elçilerin İşleri, İsa'nın yaptıklarını ve öğrettiklerini anlatan \"ilk kitabın\" devamı olduğunu söyler.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 28, "id": "p28", "pt": "Em Atos, quando o autor conta as viagens de Paulo, em alguns trechos ele deixa de dizer \"eles\" e passa a dizer \"nós\". A explicação mais simples e direta é que ele mesmo viajava com Paulo. Mas quem era ele? O próprio texto ajuda a eliminar vários companheiros de Paulo:\n• Timóteo, Aristarco, Tíquico e outros quatro companheiros de Paulo aparecem num desses trechos como os que \"foram na frente e nos esperaram em Trôade\". Ou seja, eles são \"eles\", e o autor é outra pessoa.\n• O \"nós\" chega com Paulo até Roma. E nas cartas que Paulo escreve preso, Lucas está ao lado dele.\n• Escritores antigos de regiões diferentes, como Irineu, na Gália, e Tertuliano, no norte da África, dizem que o autor desse Evangelho é Lucas, o companheiro de Paulo. Ninguém na Antiguidade apresentou outro nome.\nO texto, as cartas de Paulo e os escritores de regiões diferentes apontam para a mesma pessoa, Lucas, e nenhuma fonte antiga aponta para outra.", "tr": "Elçilerin İşleri'nde yazar, Pavlus'un yolculuklarını anlatırken bazı bölümlerde \"onlar\" demeyi bırakıp \"biz\" demeye başlar. Bunun en basit ve en doğrudan açıklaması, kendisinin de Pavlus'la birlikte yolculuk etmesidir. Peki kimdi? Metnin kendisi, Pavlus'un birçok arkadaşını elemeye yardım ediyor:\n• Timoteos, Aristarhos, Tihikos ve Pavlus'un dört arkadaşı daha, bu bölümlerden birinde \"önden gidip bizi Troas'ta bekleyenler\" olarak geçer. Yani onlar \"onlar\"dır, yazar ise başka biridir.\n• \"Biz\", Pavlus'la birlikte Roma'ya kadar gider. Pavlus'un hapisteyken yazdığı mektuplarda da Luka onun yanındadır.\n• Galya'da İreneus ve Kuzey Afrika'da Tertullianus gibi farklı bölgelerdeki eski yazarlar, bu İncil'in yazarının Pavlus'un arkadaşı Luka olduğunu söyler. Eski çağda hiç kimse başka bir isim öne sürmedi.\nMetin, Pavlus'un mektupları ve farklı bölgelerden yazarlar aynı kişiyi, Luka'yı gösteriyor ve hiçbir eski kaynak başka birini göstermiyor.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 29, "id": "p29", "pt": "E com o Evangelho de João acontece o mesmo: o próprio livro diz de onde vem. No final está escrito: \"este é o discípulo que dá testemunho destas coisas e que as escreveu; e nós sabemos que o seu testemunho é verdadeiro\" (João 21:24).", "tr": "Yuhanna İncili'nde de durum aynıdır: Kitabın kendisi nereden geldiğini söyler. Sonunda şöyle yazar: \"Bu olaylara tanıklık eden ve bunları yazan öğrenci budur. Onun tanıklığının doğru olduğunu biliyoruz\" (Yuhanna 21:24).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 30, "id": "p30", "pt": "Por que está escrito assim? Porque, quando o livro foi entregue às igrejas, as pessoas que conheciam o apóstolo pessoalmente colocaram a sua garantia: \"nós conhecemos esse homem, ele viu tudo, e o que ele escreveu é verdade\". É como um documento importante que, além da assinatura de quem escreveu, leva a assinatura de testemunhas que confirmam. Isso não enfraquece o livro, fortalece.", "tr": "Neden böyle yazılmış? Çünkü kitap kiliselere verildiğinde, elçiyi şahsen tanıyan insanlar kendi güvencelerini eklediler: \"Bu adamı tanıyoruz, her şeyi gördü ve yazdıkları doğrudur.\" Bu, yazanın imzasının yanında onu doğrulayan tanıkların imzasını da taşıyan önemli bir belge gibidir. Bu, kitabı zayıflatmaz, güçlendirir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 31, "id": "p31", "pt": "E isso não foi colocado depois por qualquer pessoa: esse versículo está em todos os manuscritos de João que guardaram o final do livro. Ele faz parte do livro desde que o livro começou a circular.", "tr": "Bu ayeti sonradan herhangi biri de eklemedi: Bu ayet, Yuhanna'nın sonunu koruyan bütün el yazmalarında vardır. Kitap dolaşmaya başladığından beri kitabın bir parçasıdır.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 32, "id": "p32", "pt": "E Deus sempre usou pessoas para escrever a Sua palavra. O profeta Jeremias falava as palavras de Deus, e Baruque escrevia (Jeremias 36:4). Numa carta de Paulo, quem segurava a pena se apresenta: \"Eu, Tércio, que escrevi esta carta\" (Romanos 16:22). E a carta continua sendo de Paulo e Palavra de Deus.", "tr": "Tanrı her zaman kendi sözünü yazmak için insanları kullandı. Peygamber Yeremya Tanrı'nın sözlerini söylüyor, Baruk da yazıyordu (Yeremya 36:4). Pavlus'un bir mektubunda kalemi tutan kişi kendini tanıtır: \"Bu mektubu yazan ben Tertius\" (Romalılar 16:22). Mektup yine Pavlus'undur ve Tanrı'nın Sözü'dür.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 33, "id": "p33", "pt": "Agora compare com o que o próprio Bukhari conta sobre o Alcorão:\n• Muhammad não escreveu uma única linha. Segundo a própria tradição islâmica, ele não escrevia; outros anotavam os versículos em pedaços de folhas de palmeira e em pedras.\n• Muhammad morreu sem deixar o Alcorão num livro. Quando Umar pediu para juntar tudo, Abu Bakr respondeu: \"Como vou fazer algo que o Mensageiro de Allah não fez?\" (Bukhari 4986).\n• Depois da batalha de Yamama, Umar disse ter medo de que, com a morte dos recitadores, \"grande parte do Alcorão se perdesse\" (Bukhari 4986).\n• Zayd ibn Thabit teve que procurar os versículos em folhas de palmeira, em pedras e na memória das pessoas, e conta que os últimos versículos da surata 9 ele só encontrou com um homem, Abu Khuzayma al-Ansari, e com mais ninguém (Bukhari 4986).\n• Uns 20 anos depois da morte de Muhammad, os muçulmanos já brigavam porque recitavam o Alcorão de formas diferentes, e Uthman mandou fazer uma versão oficial e queimar todas as outras cópias (Bukhari 4987).", "tr": "Şimdi bunu, Buhari'nin kendisinin Kur'an hakkında anlattıklarıyla karşılaştırın:\n• Muhammed tek bir satır bile yazmadı. İslami geleneğin kendisine göre o yazmıyordu; ayetleri başkaları hurma dallarına ve taşlara yazıyordu.\n• Muhammed, Kur'an'ı bir kitap halinde bırakmadan vefat etti. Ömer her şeyin toplanmasını istediğinde Ebu Bekir şöyle cevap verdi: \"Allah'ın Resulü'nün yapmadığı bir şeyi nasıl yaparım?\" (Buhari 4986).\n• Yemame savaşından sonra Ömer, kurraların ölmesiyle \"Kur'an'ın büyük bir kısmının kaybolmasından\" korktuğunu söyledi (Buhari 4986).\n• Zeyd ibn Sabit ayetleri hurma dallarında, taşlarda ve insanların hafızalarında aramak zorunda kaldı ve Tevbe suresinin son ayetlerini sadece bir kişide, Ebu Huzeyme el-Ensarî'de bulduğunu, başka hiç kimsede bulamadığını anlatır (Buhari 4986).\n• Muhammed'in vefatından yaklaşık 20 yıl sonra Müslümanlar, Kur'an'ı farklı şekillerde okudukları için zaten tartışıyordu ve Osman resmî bir nüsha yazdırıp diğer bütün nüshaların yakılmasını emretti (Buhari 4987).", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 34, "id": "p34", "pt": "Alguns dizem que o testemunho desse homem \"valia por dois\". Mas, no próprio Bukhari, o homem cujo testemunho valia por dois é Khuzayma ibn Thabit, ligado a outro versículo, da surata 33 (Bukhari 2807). E mesmo que fosse o mesmo homem, dizer que o testemunho dele \"valia por dois\" é admitir que só havia um homem com aquele versículo.", "tr": "Bazıları bu adamın tanıklığının \"iki kişiye bedel\" olduğunu söyler. Ama Buhari'nin kendisinde tanıklığı iki kişiye bedel sayılan kişi, başka bir ayetle, Ahzab suresindeki bir ayetle ilgili olan Huzeyme ibn Sabit'tir (Buhari 2807). Aynı kişi olsa bile, tanıklığının \"iki kişiye bedel\" olduğunu söylemek, o ayetin sadece tek bir adamda bulunduğunu kabul etmektir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 35, "id": "p35", "pt": "E a desculpa da \"memorização perfeita\" cai pelo próprio Bukhari. Se milhares de pessoas sabiam o Alcorão inteiro de cor, sem nenhuma diferença:\n• por que Umar teve medo de que grande parte do Alcorão se perdesse?\n• por que Zayd teve que procurar versículos em folhas de palmeira e em pedras?\n• por que um versículo só foi encontrado com um homem?\n• e por que Uthman teve que queimar as outras cópias, se todos recitavam a mesma coisa?", "tr": "\"Kusursuz ezber\" bahanesi de Buhari'nin kendisiyle çöküyor. Binlerce kişi Kur'an'ın tamamını hiçbir fark olmadan ezbere biliyor idiyse:\n• Ömer Kur'an'ın büyük bir kısmının kaybolmasından neden korktu?\n• Zeyd ayetleri neden hurma dallarında ve taşlarda aramak zorunda kaldı?\n• Bir ayet neden sadece tek bir adamda bulundu?\n• Herkes aynı şeyi okuyor idiyse, Osman diğer nüshaları neden yakmak zorunda kaldı?", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 36, "id": "p36", "pt": "E por que Uthman mandou queimar as outras cópias? O próprio Bukhari responde: os muçulmanos de regiões diferentes recitavam o Alcorão de formas diferentes e já brigavam por isso, e Hudhayfa pediu a Uthman que salvasse a comunidade \"antes que ela discorde sobre o Livro\" (Bukhari 4987). Ou seja, as cópias e as recitações não batiam. E a solução foi escolher uma versão e destruir as outras.", "tr": "Peki Osman diğer nüshaları neden yaktırdı? Buhari'nin kendisi cevap veriyor: Farklı bölgelerdeki Müslümanlar Kur'an'ı farklı şekillerde okuyordu ve bu yüzden zaten tartışıyorlardı; Huzeyfe de Osman'dan ümmeti \"Kitap hakkında ihtilafa düşmeden önce\" kurtarmasını istedi (Buhari 4987). Yani nüshalar ve okuyuşlar birbirini tutmuyordu. Çözüm de bir nüshayı seçip diğerlerini yok etmek oldu.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 37, "id": "p37", "pt": "Alguns dizem que as diferenças eram só de dialeto, ou seja, de jeito de pronunciar. Mas veja:\n• Dialeto é pronúncia. *Ninguém queima livros para acabar com um sotaque.* Queimam-se livros quando o texto escrito é diferente.\n• O mushaf de Ibn Mas'ud não tinha as duas últimas suratas, a 113 e a 114 (Bukhari 4977; Musnad Ahmad 21186). Isso não é dialeto: são duas suratas inteiras.\n• O manuscrito de Sana'a, do século 7, tem por baixo um texto com palavras diferentes e as suratas em outra ordem. Isso também não é dialeto.\n• E versículos que os companheiros diziam ter sido revelados, como o do apedrejamento e o das amamentações, não estão no Alcorão de hoje (Bukhari 6829; Muslim 1452).\nOu seja, as diferenças eram de conteúdo, e não só de pronúncia.", "tr": "Bazıları farkların sadece lehçe, yani telaffuz farkı olduğunu söyler. Ama bakın:\n• Lehçe telaffuzdur. *Kimse bir şiveyi ortadan kaldırmak için kitap yakmaz.* Kitaplar, yazılı metin farklı olduğunda yakılır.\n• İbn Mesud'un mushafında son iki sure, 113 ve 114 yoktu (Buhari 4977; Müsned-i Ahmed 21186). Bu lehçe değildir: Koca iki sure eksikti.\n• 7. yüzyıldan kalma San'a el yazmasının altında, farklı kelimeler ve farklı bir sure sırası olan bir metin var. Bu da lehçe değildir.\n• Sahabelerin indirildiğini söylediği recm ayeti ve emzirme ayeti gibi ayetler bugünkü Kur'an'da yok (Buhari 6829; Müslim 1452).\nYani farklar sadece telaffuzda değil, içerikteydi.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 38, "id": "p38", "pt": "E a ordem valia para todas as outras cópias, inclusive as dos companheiros que o próprio Muhammad tinha indicado como mestres do Alcorão. Muhammad disse: \"Aprendam o Alcorão com quatro: Abdullah ibn Mas'ud, Salim, Mu'adh e Ubayy ibn Ka'b\" (Bukhari 4999). E Ibn Mas'ud, o primeiro da lista, não aceitou a ordem e mandou os seus alunos esconderem os seus mushafs (Tirmidhi 3104). É como se, no ano 50, um líder cristão mandasse queimar os escritos de Pedro e de João para impor uma cópia só.", "tr": "Bu emir diğer bütün nüshalar için geçerliydi; Muhammed'in kendisinin Kur'an öğretmeni olarak gösterdiği sahabelerin nüshaları da dahil. Muhammed şöyle dedi: \"Kur'an'ı dört kişiden öğrenin: Abdullah ibn Mesud, Salim, Muaz ve Übey ibn Ka'b\" (Buhari 4999). Listenin ilk sırasındaki İbn Mesud ise bu emri kabul etmedi ve öğrencilerine mushaflarını saklamalarını söyledi (Tirmizi 3104). Bu, 50 yılında bir Hristiyan önderin tek bir nüsha dayatmak için Petrus'un ve Yuhanna'nın yazdıklarını yaktırması gibidir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 39, "id": "p39", "pt": "Então eu pergunto: se as cópias dos próprios companheiros escolhidos por Muhammad eram diferentes e foram destruídas, quem garante que a versão que sobrou é a certa? Não dá mais para comparar, porque as outras foram queimadas.", "tr": "O halde soruyorum: Muhammed'in seçtiği sahabelerin kendi nüshaları bile farklıydı ve yok edildiyse, geriye kalan nüshanın doğru olduğunu kim garanti ediyor? Artık karşılaştırmak mümkün değil, çünkü diğerleri yakıldı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 40, "id": "p40", "pt": "Com a Bíblia aconteceu o contrário. Nenhuma autoridade cristã jamais mandou queimar cópias dos quatro Evangelhos para trocar o texto deles por outro. Nos primeiros 300 anos, os cristãos nem tinham poder para isso: quem queimava as Escrituras cristãs eram os imperadores pagãos, como Diocleciano, no ano 303. Os livros que imperadores cristãos mandaram queimar depois eram livros de hereges, como os de Ário, e não cópias dos Evangelhos.", "tr": "Kutsal Kitap'ta ise tam tersi oldu. Hiçbir Hristiyan otorite, dört İncil'in metnini başka bir metinle değiştirmek için onların nüshalarının yakılmasını hiçbir zaman emretmedi. İlk 300 yılda Hristiyanların buna gücü bile yoktu: Hristiyan Kutsal Yazılarını yakanlar, 303 yılında Diokletianus gibi pagan imparatorlardı. Daha sonra Hristiyan imparatorların yakılmasını emrettiği kitaplar ise Arius'unkiler gibi sapkınların kitaplarıydı, İncillerin nüshaları değil.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 41, "id": "p41", "pt": "E quando o bispo Teodoreto, na Síria, no século 5, recolheu mais de 200 cópias do Diatessaron, um livro que juntava os quatro Evangelhos numa história só e tinha cortado partes deles, foi para colocar no lugar os quatro Evangelhos completos. Repare na diferença: Teodoreto tirou um resumo feito por um homem para devolver às igrejas os textos originais. Uthman fez o contrário: queimou até as cópias dos companheiros de Muhammad para deixar só a versão dele.", "tr": "Suriye'de piskopos Teodoret, 5. yüzyılda, dört İncil'i tek bir hikâyede birleştiren ve onlardan bazı kısımları çıkarmış olan Diatessaron'un 200'den fazla nüshasını topladığında da, bunu yerlerine dört İncil'in tam halini koymak için yaptı. Farka dikkat edin: Teodoret, bir adamın yaptığı bir özeti kaldırıp kiliselere asıl metinleri geri verdi. Osman ise tam tersini yaptı: Sadece kendi versiyonu kalsın diye Muhammed'in sahabelerinin nüshalarını bile yaktı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 42, "id": "p42", "pt": "Por isso os manuscritos de regiões diferentes foram guardados, e todos contam a mesma mensagem. E onde houve um acréscimo, foram os próprios cristãos que mostraram, porque guardaram os manuscritos para comparar. No Islã, o que era diferente foi queimado, e ninguém mais pode comparar. *A Bíblia mostra tudo e pode ser conferida; o Alcorão escondeu as provas.*", "tr": "Bu yüzden farklı bölgelerden el yazmaları korundu ve hepsi aynı mesajı anlatıyor. Bir ekleme olduğunda da onu gösterenler Hristiyanların kendileri oldu, çünkü karşılaştırmak için el yazmalarını korudular. İslam'da ise farklı olan yakıldı ve artık kimse karşılaştıramıyor. *Kutsal Kitap her şeyi gösteriyor ve kontrol edilebiliyor; Kur'an ise delilleri sakladı.*", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 43, "id": "p43", "pt": "✅ *Prova 5: ninguém teria motivo para inventar esses nomes.*\nPense: se o senhor fosse inventar um livro e quisesse que todo mundo acreditasse nele, colocaria o nome de um ajudante pouco conhecido, ou o nome do homem mais importante que conseguisse?\n• Marcos e Lucas nem eram apóstolos. Eram ajudantes, que aparecem só poucas vezes no Novo Testamento.\n• Mateus era cobrador de impostos, uma profissão que os judeus odiavam, porque era vista como trabalhar para Roma contra o próprio povo.\n• Se a igreja quisesse inventar, teria usado os nomes mais fortes: Pedro, o líder dos apóstolos, ou Tiago, o irmão de Jesus.\nE é exatamente isso que os falsificadores fizeram. Os livros falsos que apareceram depois usaram nomes famosos: \"Evangelho de Pedro\", \"Evangelho de Tomé\", \"Evangelho de Filipe\", \"Evangelho de Maria\", \"Evangelho de Judas\" e o \"Protoevangelho de Tiago\". *Os falsos precisavam de nomes famosos porque eram falsos.* Os quatro verdadeiros têm nomes simples, e a explicação mais natural é uma só: esses eram os autores de verdade, e todo mundo sabia disso.", "tr": "✅ *5. delil: kimsenin bu isimleri uydurmak için bir sebebi olmazdı.*\nDüşünün: Bir kitap uydursaydınız ve herkesin ona inanmasını isteseydiniz, az tanınan bir yardımcının adını mı koyardınız, yoksa bulabileceğiniz en önemli adamın adını mı?\n• Markos ve Luka elçi bile değildi. Yeni Antlaşma'da sadece birkaç kez geçen yardımcılardı.\n• Matta, Yahudilerin nefret ettiği bir meslek olan vergi görevlisiydi; çünkü bu, kendi halkına karşı Roma için çalışmak olarak görülüyordu.\n• Kilise uydurmak isteseydi, en güçlü isimleri kullanırdı: elçilerin önderi Petrus'u ya da İsa'nın kardeşi Yakup'u.\nSahtekârlar da tam olarak bunu yaptı. Sonradan ortaya çıkan sahte kitaplar meşhur isimler kullandı: \"Petrus İncili\", \"Tomas İncili\", \"Filipus İncili\", \"Meryem İncili\", \"Yahuda İncili\" ve \"Yakup'un İlk İncili\". *Sahteler meşhur isimlere ihtiyaç duyuyordu, çünkü sahteydiler.* Dört gerçek İncil ise sade isimler taşıyor ve bunun en doğal tek bir açıklaması var: Gerçek yazarlar onlardı ve herkes bunu biliyordu.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 44, "id": "p44", "pt": "✅ *O senhor pode dizer: \"Mas os estudiosos dizem que os títulos só foram colocados no começo do século 2.\"*\nMesmo que fosse assim, isso não muda nada. Os nomes não apareceram do nada: estavam lá porque essas pessoas de fato escreveram os livros, e as igrejas sabiam disso. Um Evangelho não aparecia numa igreja sozinho: ele chegava pelas mãos de pessoas conhecidas e era lido em voz alta toda semana. A igreja sabia de onde ele tinha vindo e quem o tinha escrito. Mesmo que a etiqueta com o nome tenha sido escrita por um copista, o copista não inventou o nome: ele escreveu o que a igreja já sabia.", "tr": "✅ *Şöyle diyebilirsiniz: \"Ama araştırmacılar başlıkların ancak 2. yüzyılın başında konduğunu söylüyor.\"*\nÖyle olsa bile, bu hiçbir şeyi değiştirmez. İsimler birdenbire ortaya çıkmadı: Orada olmalarının sebebi, bu kişilerin kitapları gerçekten yazmış olması ve kiliselerin bunu bilmesiydi. Bir İncil bir kiliseye kendi kendine gelmezdi: Tanınan insanların eliyle gelir ve her hafta yüksek sesle okunurdu. Kilise onun nereden geldiğini ve kimin yazdığını bilirdi. İsmi içeren etiketi bir kâtip yazmış olsa bile, kâtip ismi uydurmadı: Kilisenin zaten bildiğini yazdı.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 45, "id": "p45", "pt": "E a igreja antiga não inventava nomes para dar autoridade a um livro. A prova é a carta aos Hebreus: como não se sabia com certeza quem a escreveu, umas igrejas diziam Paulo, outras diziam Barnabé, e Orígenes chegou a escrever que só Deus sabe quem a escreveu. Ou seja, quando o autor não era conhecido, a dúvida aparecia e ficava registrada. *Com os quatro Evangelhos nunca apareceu dúvida nenhuma*: todas as regiões deram os mesmos nomes desde o começo. Isso só é possível porque os autores eram conhecidos.", "tr": "Eski kilise bir kitaba yetki kazandırmak için isim de uydurmazdı. Bunun delili İbraniler'e mektuptur: Onu kimin yazdığı kesin olarak bilinmediği için bazı kiliseler Pavlus, bazıları Barnabas dedi ve Origenes onu kimin yazdığını sadece Tanrı'nın bildiğini bile yazdı. Yani yazar bilinmediğinde şüphe ortaya çıkar ve kayda geçerdi. *Dört İncil'de ise hiçbir zaman şüphe ortaya çıkmadı*: Bütün bölgeler en başından aynı isimleri verdi. Bu ancak yazarlar bilindiği için mümkündür.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 46, "id": "p46", "pt": "E no começo do século 2 ainda viviam homens que tinham conhecido os apóstolos, como Policarpo, bispo de Esmirna, que, segundo Irineu, na Gália, aprendeu com os apóstolos e conviveu com João, e, segundo Tertuliano, no norte da África, foi colocado ali pelo próprio apóstolo João. Se alguém inventasse de repente que um livro era de João ou de Mateus sem ser, esses discípulos dos apóstolos não teriam denunciado a farsa? Mas não existe na história nenhum registro deles reclamando disso. Pense: como uma mentira dessas passaria por igrejas na Europa, na Ásia e na África, com testemunhas ainda vivas, sem que ninguém reclamasse?", "tr": "2. yüzyılın başında elçileri tanımış adamlar da hâlâ yaşıyordu; örneğin İzmir piskoposu Polikarpos: Galya'daki İreneus'a göre elçilerden öğrenmiş ve Yuhanna'yla birlikte bulunmuştu, Kuzey Afrika'daki Tertullianus'a göre de oraya bizzat elçi Yuhanna tarafından atanmıştı. Biri birdenbire, Yuhanna'nın ya da Matta'nın olmayan bir kitabın onlara ait olduğunu uydursaydı, elçilerin bu öğrencileri sahtekârlığı ifşa etmez miydi? Ama tarihte onların böyle bir şikâyette bulunduğuna dair hiçbir kayıt yok. Düşünün: Böyle bir yalan, tanıklar hâlâ hayattayken, Avrupa'daki, Asya'daki ve Afrika'daki kiliselerden kimse itiraz etmeden nasıl geçebilirdi?", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 47, "id": "p47", "pt": "✅ *A cadeia inteira junta.*\nManuscritos, escritores de regiões diferentes, as cartas de Paulo, o próprio texto e a lógica: tudo aponta para os mesmos nomes. Não é a palavra de uma pessoa. Quem diz que os nomes são falsos precisa explicar como todas as regiões, sem combinar, deram os mesmos nomes, e precisa mostrar pelo menos um manuscrito com outro autor, ou alguma fonte antiga que não seja só birra de seita contra a doutrina do livro, como já vimos. Esse manuscrito não existe. E um youtuber, 1.900 anos depois, acha que sabe mais do que tudo isso junto.", "tr": "✅ *Zincirin tamamı.*\nEl yazmaları, farklı bölgelerden yazarlar, Pavlus'un mektupları, metnin kendisi ve mantık: Hepsi aynı isimleri gösteriyor. Bu tek bir kişinin sözü değil. İsimlerin sahte olduğunu söyleyen, bütün bölgelerin anlaşmadan nasıl aynı isimleri verdiğini açıklamak ve başka bir yazarı gösteren en az bir el yazması ya da, gördüğümüz gibi, kitabın öğretisine karşı bir tarikatın inadından ibaret olmayan bir eski kaynak göstermek zorundadır. Böyle bir el yazması yok. 1.900 yıl sonra bir YouTuber ise bütün bunların toplamından daha iyi bildiğini sanıyor.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 48, "id": "p48", "pt": "✅ *E agora a parte que o vídeo esconde: mesmo que o senhor aceitasse tudo o que os céticos dizem, o Islã continuaria perdendo.*\nOs estudiosos que duvidam de quem escreveu os Evangelhos, como Bart Ehrman e John Dominic Crossan, não concluem que Jesus não foi crucificado. Pelo contrário: eles dizem que *a crucificação de Jesus sob Pôncio Pilatos é um dos fatos mais certos da história antiga*, e que os discípulos acreditavam ter visto Jesus ressuscitado. Ou seja, a discussão sobre os nomes dos autores não muda nada sobre a cruz. E é justamente a cruz que o Alcorão nega (4:157). O vídeo usa a dúvida sobre os nomes como se ela ajudasse o Islã, mas ela não ajuda em nada.", "tr": "✅ *Ve videonun sakladığı kısım: En şüphecilerin söylediği her şeyi kabul etseniz bile, İslam yine kaybeder.*\nİncilleri kimin yazdığından şüphe eden Bart Ehrman ve John Dominic Crossan gibi araştırmacılar, İsa'nın çarmıha gerilmediği sonucuna varmaz. Tam tersine, *İsa'nın Pontius Pilatus döneminde çarmıha gerilmesinin eski tarihin en kesin olaylarından biri olduğunu* ve öğrencilerin İsa'yı dirilmiş olarak gördüklerine inandıklarını söylerler. Yani yazarların isimleri hakkındaki tartışma çarmıh hakkında hiçbir şeyi değiştirmez. Kur'an'ın inkâr ettiği de tam olarak çarmıhtır (4:157). Video, isimler hakkındaki şüpheyi İslam'a yardım ediyormuş gibi kullanıyor, ama hiçbir yardımı yok.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 49, "id": "p49", "pt": "✅ *\"Segundo\" não quer dizer \"atribuído por alguém\".*\nPara os cristãos existe um só Evangelho, a boa notícia de Jesus, contado por quatro testemunhas. Por isso se diz: o Evangelho segundo Mateus, segundo Marcos, segundo Lucas e segundo João. Isso é o básico do básico.", "tr": "✅ *\"Göre\" ifadesi, \"biri tarafından atfedilmiş\" demek değildir.*\nHristiyanlara göre tek bir İncil, yani İsa'nın müjdesi vardır ve bu müjdeyi dört tanık anlatır. Bu yüzden Matta'ya göre, Markos'a göre, Luka'ya göre ve Yuhanna'ya göre İncil denir. Bu, işin en temel bilgisidir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 50, "id": "p50", "pt": "✅ *Escrever sobre si mesmo na terceira pessoa era normal na Antiguidade.*\nJúlio César, na \"Guerra das Gálias\", escreve sobre si mesmo como \"César\". Xenofonte faz o mesmo na \"Anábase\", e o historiador judeu Flávio Josefo também, na \"Guerra dos Judeus\". Pela lógica do vídeo, Júlio César não escreveu os livros de Júlio César. Dá para ver o quanto isso é absurdo.", "tr": "✅ *Eski çağda yazarın kendisinden üçüncü şahıs olarak bahsetmesi normaldi.*\nJül Sezar \"Galya Savaşları\"nda kendisinden \"Sezar\" diye bahseder. Ksenophon \"Anabasis\"te, Yahudi tarihçi Josephus da \"Yahudi Savaşı\"nda aynısını yapar. Videonun mantığıyla, Jül Sezar'ın kitaplarını Jül Sezar yazmamış olur. Bunun ne kadar saçma olduğu ortada.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 51, "id": "p51", "pt": "E mais: no Alcorão, tanto Allah (\"Allah é Perdoador, Misericordioso\", 2:173) quanto Muhammad (\"Muhammad é o Mensageiro de Allah\", 48:29) aparecem na terceira pessoa. Se um muçulmano disser que falar na terceira pessoa é só um estilo normal de escrita, então ele acabou de dar razão a Mateus e desmentir o vídeo. E se insistir na regra do vídeo, então nem Allah nem Muhammad poderiam ser o autor do Alcorão.", "tr": "Dahası, Kur'an'da hem Allah (\"Allah bağışlayandır, merhametlidir\", 2:173) hem de Muhammed (\"Muhammed Allah'ın elçisidir\", 48:29) üçüncü şahıs olarak geçer. Bir Müslüman, üçüncü şahıs kullanmanın sadece normal bir yazı üslubu olduğunu söylerse, Matta'yı haklı çıkarmış ve videoyu yalanlamış olur. Videonun kuralında ısrar ederse, o zaman ne Allah ne de Muhammed Kur'an'ın yazarı olabilir.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 52, "id": "p52", "pt": "✅ *Sobre quem escreveu, os Evangelhos estão muito à frente do Alcorão.*\nOs Evangelhos foram escritos e lidos em público enquanto ainda viviam pessoas que tinham conhecido Jesus e os apóstolos, amigos e inimigos.", "tr": "✅ *Kimin yazdığı konusunda İnciller, Kur'an'ın çok önündedir.*\nİnciller, İsa'yı ve elçileri tanımış insanlar, dostlar da düşmanlar da, hâlâ hayattayken yazıldı ve herkesin önünde okundu.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Os Evangelhos são anônimos?", "tr": "1. Bölüm: İncilleri kim yazdı › İnciller anonim mi?"}, "newPoint": false}, {"k": "para", "n": 53, "id": "p53", "pt": "Pense no que isso significa: se Marcos tivesse inventado algo sobre Pedro, os companheiros de Pedro o acusariam de mentira. Se Lucas tivesse inventado algo sobre Paulo, as igrejas que Paulo fundou, que o conheciam pessoalmente, o desmascarariam. E se alguém dissesse que Jesus fez milagres em público ou morreu crucificado em Jerusalém sem que isso fosse verdade, os líderes judeus que eram contra Jesus teriam todo o interesse em dizer: \"Isso nunca a
