us seja Deus (5:72-73) e nega que Ele seja o Filho de Deus (9:30 e 112:1-4). Então só existem duas saídas, e as duas derrubam o Islã:\n• Se o Evangelho que os cristãos tinham era a palavra de Allah, como o Alcorão diz, então o Alcorão contradiz a palavra de Allah quando nega a cruz.\n• Se esse Evangelho estava corrompido, então o Alcorão mandou os cristãos julgarem por um livro falso, e mandou Muhammad tirar dúvidas com ele.\n*Não existe uma terceira saída.* O problema não é da Bíblia: é do Alcorão, que confirma um livro que ele mesmo contradiz.", "tr": "✅ *Ve Kur'an'ın kendini soktuğu tuzağa dikkat edin.*\nKur'an, Hristiyanların elindeki Tevrat'a ve İncil'e uyulmasını emreder (5:47 ve 5:68). Bu İncil, 4. yüzyıl kodekslerinde olduğu gibi, İsa'nın çarmıhta öldüğünü ve Tanrı'nın Oğlu olduğunu söyler. Ama aynı Kur'an çarmıhı inkâr eder (4:157), İsa'nın Tanrı olduğunu inkâr eder (5:72-73) ve Tanrı'nın Oğlu olduğunu da inkâr eder (9:30 ve 112:1-4). O halde sadece iki çıkış yolu var ve ikisi de İslam'ı yıkar:\n• Hristiyanların elindeki İncil, Kur'an'ın dediği gibi Allah'ın sözüyse, Kur'an çarmıhı inkâr ederken Allah'ın sözüyle çelişiyor.\n• Bu İncil bozulmuşsa, Kur'an Hristiyanlara sahte bir kitapla hükmetmelerini, Muhammed'e de şüphesini onunla gidermesini emretmiş oluyor.\n*Üçüncü bir çıkış yolu yok.* Sorun Kutsal Kitap'ta değil: Kendi çeliştiği bir kitabı onaylayan Kur'an'da.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": false}, {"k": "para", "n": 254, "id": "p254", "pt": "✅ *\"Mas se o Alcorão fosse de Satanás, por que mandaria ler a Bíblia?\"*\nComo já mostrei na Parte 1, é exatamente assim que Satanás engana: ele não nega a palavra de Deus de frente, mas a cita para depois torcer. E agora fica claro onde está a armadilha: o Alcorão usa a autoridade da Bíblia, diz que a confirma, e depois se coloca acima dela como \"guardião/corretor\" dos livros anteriores, mudando justamente o que salva: nega que Jesus morreu na cruz e ressuscitou, e nega que Ele é o Filho de Deus.", "tr": "✅ *\"Ama Kur'an Şeytan'dan olsaydı, neden Kutsal Kitap'ı okumayı emretsin?\"*\n1. bölümde gösterdiğim gibi, Şeytan tam olarak böyle aldatır: Tanrı'nın sözünü açıkça inkâr etmez, onu aktarır ve sonra çarpıtır. Ve şimdi tuzağın nerede olduğu açıkça görülüyor: Kur'an, Kutsal Kitap'ın otoritesini kullanır, onu onayladığını söyler, sonra önceki kitapların \"gözeticisi/düzelticisi\" olarak kendini onun üstüne koyar ve tam da kurtaranı değiştirir: İsa'nın çarmıhta ölüp dirildiğini ve Tanrı'nın Oğlu olduğunu inkâr eder.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": false}, {"k": "para", "n": 255, "id": "p255", "pt": "✅ *E a ideia de que o Alcorão veio \"corrigir\" a Bíblia não tem lógica nenhuma.*\nOs muçulmanos dizem que o Alcorão é um \"lembrete\" (dhikr) e o \"guardião/corretor\" (muhaymin) dos livros anteriores, que veio corrigir o que estava errado. Mas pensem:\n• Allah não erra. Se a Torá e o Evangelho vieram d'Ele, não precisavam de correção. E se os homens os tivessem estragado, o Alcorão não mandaria os cristãos julgarem por eles (5:47).\n• Um lembrete repete o que foi dito. Ele não diz o contrário. Se alguém \"lembra\" vocês de uma coisa dizendo exatamente o oposto do que foi dito, isso não é lembrete, é troca.\n• E a \"correção\" não é de um detalhe: ela muda o centro de tudo. Por 600 anos, as igrejas de todas as regiões e línguas criam que Jesus morreu na cruz e ressuscitou. E então um homem sozinho, sem nenhuma testemunha, diz que isso nunca aconteceu.\n• Quem estava lá viu Jesus morrer. Quem \"corrige\" nasceu mais de 500 anos depois, longe de Jerusalém. Uma correção feita por quem não viu nada, contra quem viu tudo, não é correção: é contradição.\nPensem: Deus não precisa corrigir a si mesmo. Quem precisa misturar verdade com mentira para parecer confiável é o enganador.", "tr": "✅ *Kur'an'ın Kutsal Kitap'ı \"düzeltmek\" için geldiği fikrinin de hiçbir mantığı yok.*\nMüslümanlar Kur'an'ın bir \"hatırlatma\" (zikir) ve önceki kitapların \"gözeticisi/düzelticisi\" (müheymin) olduğunu, yanlış olanı düzeltmeye geldiğini söyler. Ama düşünün:\n• Allah yanılmaz. Tevrat ve İncil O'ndan geldiyse, düzeltilmeye ihtiyaçları yoktu. İnsanlar onları bozmuş olsaydı, Kur'an Hristiyanlara onlarla hükmetmelerini emretmezdi (5:47).\n• Hatırlatma, söyleneni tekrarlar. Tersini söylemez. Biri size bir şeyi, söylenenin tam tersini söyleyerek \"hatırlatıyorsa\", bu hatırlatma değil, değiştirmedir.\n• Ve bu \"düzeltme\" bir ayrıntıyla ilgili değil: Her şeyin merkezini değiştiriyor. 600 yıl boyunca, her bölgeden ve her dilden kiliseler İsa'nın çarmıhta öldüğüne ve dirildiğine inandı. Sonra tek başına, hiçbir tanığı olmayan bir adam bunun hiç olmadığını söylüyor.\n• Orada olanlar İsa'nın öldüğünü gördü. \"Düzelten\" ise 500 yıldan fazla sonra, Kudüs'ten uzakta doğdu. Hiçbir şey görmemiş birinin, her şeyi görmüş olanlara karşı yaptığı düzeltme, düzeltme değil, çelişkidir.\nDüşünün: Tanrı'nın kendini düzeltmeye ihtiyacı yoktur. Güvenilir görünmek için doğruyu yalanla karıştırmaya ihtiyaç duyan, aldatıcıdır.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": false}, {"k": "para", "n": 256, "id": "p256", "pt": "E não adianta dizer que \"palavras de Allah\" em 6:115 quer dizer só as promessas ou só o Alcorão. O argumento nem depende desse versículo: depende de 5:43, 5:47, 5:68, 7:157 e 10:94, onde o próprio Alcorão manda seguir e consultar a Torá e o Evangelho que eles tinham.", "tr": "6:115'teki \"Allah'ın sözleri\"nin sadece vaatler ya da sadece Kur'an olduğunu söylemek de işe yaramaz. Argüman bu ayete bile dayanmıyor: Kur'an'ın kendisinin, ellerindeki Tevrat'a ve İncil'e uyulmasını ve onlara başvurulmasını emrettiği 5:43, 5:47, 5:68, 7:157 ve 10:94'e dayanıyor.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": false}, {"k": "para", "n": 257, "id": "p257", "pt": "✅ *Se a regra fosse \"o que pode ser alterado não é sagrado\", o Alcorão cairia, e a Bíblia continuaria de pé.*\nComo vou mostrar nas Partes 7 e 8, o Alcorão tem leituras diferentes que mudam o sentido da lei, versículos que não estão no texto de hoje e cópias que Uthman mandou queimar. A diferença é que os cristãos guardaram todas as cópias antigas e mostram, dentro das próprias Bíblias, até o trecho que foi acrescentado.", "tr": "✅ *Kural \"değiştirilebilen şey kutsal değildir\" olsaydı, Kur'an çökerdi, Kutsal Kitap ise ayakta kalırdı.*\n7. ve 8. bölümlerde göstereceğim gibi, Kur'an'ın hükmün anlamını değiştiren farklı kıraatleri, bugünkü metinde olmayan ayetleri ve Osman'ın yaktırdığı nüshaları var. Fark şu: Hristiyanlar bütün eski kopyaları korudu ve sonradan eklenen bölümü bile Kutsal Kitapların içinde gösteriyor.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": false}, {"k": "para", "n": 258, "id": "p258", "pt": "✅ *Sagrado não quer dizer que nenhum homem consegue errar ao copiar.*\nQuer dizer que vem de Deus, e que Deus garante que a Sua palavra não se perde: \"a palavra do nosso Deus permanece para sempre\", e \"o céu e a terra passarão, mas as minhas palavras jamais passarão\". E Deus fez isso de um jeito que nenhum homem pode controlar: multiplicando as cópias pelo mundo inteiro.", "tr": "✅ *Kutsal olmak, hiçbir insanın kopyalarken hata yapamayacağı anlamına gelmez.*\nTanrı'dan geldiği ve Tanrı'nın kendi sözünün kaybolmamasını garanti ettiği anlamına gelir: \"Tanrımız'ın sözü sonsuza dek kalır\" ve \"Yer ve gök ortadan kalkacak, ama benim sözlerim asla ortadan kalkmayacak\". Tanrı bunu hiçbir insanın kontrol edemeyeceği bir şekilde yaptı: kopyaları bütün dünyada çoğaltarak.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": false}, {"k": "research", "n": 259, "id": "p259", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Erros de cópia", "text": "Antes da imprensa, os mushafs do Alcorão copiados à mão também tinham erros de copista?"}, {"label": "Controle", "text": "Nos primeiros 300 anos do cristianismo, havia alguma autoridade central que controlasse todas as cópias do Novo Testamento? E já existiam traduções em latim, siríaco e copta antes do ano 300?"}, {"label": "Isaías", "text": "O Grande Rolo de Isaías, encontrado em Qumran, é quantos anos mais antigo que os manuscritos hebraicos de Isaías conhecidos antes dele, e quão diferente é o texto?"}, {"label": "A Bíblia no tempo de Muhammad", "text": "Nos versículos 5:43, 5:47, 5:68, 7:157 e 10:94, o Alcorão fala da Torá e do Evangelho que os judeus e os cristãos tinham no tempo de Muhammad, e manda julgar por eles e consultá-los?"}, {"label": "Tahrif", "text": "A ideia de que o texto da Bíblia foi totalmente alterado foi desenvolvida de forma sistemática só séculos depois de Muhammad, por autores como Ibn Hazm, no século 11?"}, {"label": "Esconder", "text": "O Alcorão 5:15 diz que Muhammad veio esclarecer muito do que o povo do Livro escondia do Livro?"}, {"label": "O dilema", "text": "O Alcorão 5:47 manda os cristãos julgarem pelo Evangelho que tinham, e os Evangelhos dos Códices Sinaítico e Vaticano, do século 4, dizem que Jesus morreu na cruz? E o Alcorão 4:157 nega a crucificação?"}, {"label": "Satanás citando a Escritura", "text": "Em Gênesis 3:1 e Mateus 4:6, Satanás usa a palavra de Deus para enganar?"}, {"label": "Guardião", "text": "O Alcorão 5:48 diz que o Alcorão confirma os livros anteriores e é 'guardião' (muhaymin) sobre eles?"}, {"label": "Bukhari", "text": "No Sahih al-Bukhari, no Livro do Tawhid, como é explicada a palavra 'yuharrifun' a respeito dos livros de Allah? Está escrito que ninguém pode remover uma palavra deles?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Kopya hataları", "text": "Matbaadan önce elle kopyalanan Kur'an mushaflarında da kâtip hataları var mıydı?"}, {"label": "Kontrol", "text": "Hristiyanlığın ilk 300 yılında Yeni Antlaşma'nın bütün kopyalarını kontrol eden merkezi bir otorite var mıydı? 300 yılından önce Latince, Süryanice ve Kıptice çeviriler var mıydı?"}, {"label": "İşaya", "text": "Kumran'da bulunan Büyük İşaya Tomarı, ondan önce bilinen İbranice İşaya el yazmalarından kaç yıl daha eski ve metni ne kadar farklı?"}, {"label": "Muhammed'in zamanında Kutsal Kitap", "text": "Kur'an 5:43, 5:47, 5:68, 7:157 ve 10:94'te Muhammed'in zamanında Yahudilerin ve Hristiyanların elindeki Tevrat'tan ve İncil'den mi bahsediyor ve onlarla hükmedilmesini ve onlara başvurulmasını mı emrediyor?"}, {"label": "Tahrif", "text": "Kutsal Kitap'ın metninin tamamen değiştirildiği fikri, Muhammed'den yüzyıllar sonra, 11. yüzyılda İbn Hazm gibi yazarlar tarafından mı sistemli hale getirildi?"}, {"label": "Gizlemek", "text": "Kur'an 5:15, Muhammed'in Kitap ehlinin Kitap'tan gizlediği şeylerin birçoğunu açıklamak için geldiğini söylüyor mu?"}, {"label": "İkilem", "text": "Kur'an 5:47 Hristiyanlara ellerindeki İncil ile hükmetmelerini emrediyor mu ve 4. yüzyıla ait Sina ve Vatikan Kodekslerindeki İnciller İsa'nın çarmıhta öldüğünü söylüyor mu? Kur'an 4:157 çarmıha gerilmeyi inkâr ediyor mu?"}, {"label": "Kutsal Yazı'yı aktaran Şeytan", "text": "Yaratılış 3:1'de ve Matta 4:6'da Şeytan aldatmak için Tanrı'nın sözünü kullanıyor mu?"}, {"label": "Gözetici", "text": "Kur'an 5:48, Kur'an'ın önceki kitapları onayladığını ve onlar üzerinde 'gözetici' (müheymin) olduğunu söylüyor mu?"}, {"label": "Buhari", "text": "Sahih-i Buhari'nin Tevhid Kitabı'nda, Allah'ın kitapları hakkında 'yuharrifûn' kelimesi nasıl açıklanıyor? Onlardan bir kelimeyi kimsenin kaldıramayacağı yazıyor mu?"}]}}, {"k": "part", "n": 263, "id": "part-5", "pt": "*PARTE 5: AS \"CONTRADIÇÕES\"*", "tr": "*5. BÖLÜM: \"ÇELİŞKİLER\"*", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false, "lab": {"pt": ["PARTE 5", "As “contradições”"], "tr": ["5. BÖLÜM", "“Çelişkiler”"]}}, {"k": "para", "n": 264, "id": "p264", "pt": "Antes de tudo: quando quatro testemunhas contam a mesma história, é normal que cada uma conte detalhes diferentes. Se todas contassem tudo exatamente igual, palavra por palavra, isso sim seria suspeito, porque pareceria combinado. *Uma contradição só existe quando as duas coisas não podem ser verdade ao mesmo tempo.* Vamos ver cada uma:", "tr": "Her şeyden önce: Dört tanık aynı olayı anlattığında, her birinin farklı ayrıntılar anlatması normaldir. Hepsi her şeyi kelimesi kelimesine aynı anlatsaydı, asıl o zaman şüphe edilirdi, çünkü önceden anlaşılmış gibi görünürdü. *Çelişki, ancak iki şeyin aynı anda doğru olamadığı durumda vardır.* Şimdi her birine bakalım:", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 265, "id": "p265", "pt": "❌ *\"Em Marcos, Jesus grita 'Meu Deus, por que me abandonaste?', e em Lucas diz 'Pai, em tuas mãos entrego o meu espírito'.\"*\n✅ Jesus disse as duas coisas. Na cruz, Ele disse várias frases, e cada Evangelho registrou algumas. Isso não é contradição, é complemento. E as duas frases vêm dos Salmos: Salmo 22:1 e Salmo 31:5.", "tr": "❌ *\"Markos'ta İsa 'Tanrım, neden beni terk ettin?' diye haykırıyor, Luka'da ise 'Baba, ruhumu ellerine bırakıyorum' diyor.\"*\n✅ İsa ikisini de söyledi. Çarmıhta birçok söz söyledi ve her İncil bunların bir kısmını kaydetti. Bu çelişki değil, tamamlamadır. Üstelik iki söz de Mezmurlar'dan gelir: Mezmur 22:1 ve Mezmur 31:5.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 266, "id": "p266", "pt": "❌ *\"Marcos diz que Jesus foi crucificado na terceira hora, e João diz que na sexta hora ele ainda estava com Pilatos.\"*\n✅ Marcos conta as horas no jeito judeu, a partir das 6 da manhã: a terceira hora é 9h. João diz \"por volta da sexta hora\" (João 19:14), e muitos estudiosos explicam que ele usa a contagem romana, a partir da meia-noite: 6h da manhã. Primeiro o julgamento, por volta das 6h, depois a crucificação, às 9h. Tudo se encaixa.", "tr": "❌ *\"Markos İsa'nın üçüncü saatte çarmıha gerildiğini söylüyor, Yuhanna ise altıncı saatte hâlâ Pilatus'un önünde olduğunu söylüyor.\"*\n✅ Markos saatleri Yahudi usulüyle, sabah 6'dan itibaren sayar: Üçüncü saat sabah 9'dur. Yuhanna ise \"altıncı saat sularında\" der (Yuhanna 19:14) ve birçok araştırmacı onun gece yarısından başlayan Roma usulünü kullandığını, yani sabah 6'yı kastettiğini açıklar. Önce sabah 6 sularında yargılama, sonra sabah 9'da çarmıha germe. Her şey yerine oturuyor.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 267, "id": "p267", "pt": "❌ *\"Os três primeiros dizem que a Última Ceia foi a ceia de Páscoa, e João diz que Jesus morreu antes da Páscoa.\"*\n✅ A palavra \"Páscoa\" tinha dois usos, como \"Bayram\" para vocês: pode ser o primeiro dia da festa, mas também o nome de todos os dias da festa. Na época de Jesus, \"Páscoa\" era a ceia daquela noite, e também o nome da festa inteira, que durava sete dias. O próprio Lucas diz: \"a Festa dos Pães Asmos, chamada Páscoa\" (Lucas 22:1).\nAgora veja a ordem dos fatos:\n• Na quinta-feira à noite, Jesus comeu a ceia da Páscoa com os discípulos. É o que contam Mateus, Marcos e Lucas.\n• Na sexta-feira de manhã, os líderes não quiseram entrar na casa de Pilatos, um estrangeiro, para não ficarem impuros e poderem \"comer a Páscoa\" (João 18:28). Eles falavam das refeições sagradas da festa, que continuavam nos dias seguintes, e não da ceia da noite anterior.\n• E quando João diz que era \"a preparação da Páscoa\" (João 19:14), \"preparação\" era o nome que os judeus davam à sexta-feira, o dia de preparar o sábado. Ou seja: a sexta-feira da semana da Páscoa.\nÉ como alguém dizer, no segundo dia do Bayram: \"não posso me sujar agora, porque ainda vou ao almoço do Bayram\". Ninguém diria que essa pessoa errou o dia do Bayram.", "tr": "❌ *\"İlk üç İncil Son Akşam Yemeği'nin Fısıh yemeği olduğunu söylüyor, Yuhanna ise İsa'nın Fısıh'tan önce öldüğünü söylüyor.\"*\n✅ \"Fısıh\" kelimesinin iki kullanımı vardı, sizdeki \"Bayram\" gibi: Hem bayramın ilk günü, hem de bayramın bütün günlerinin adı olabilir. İsa'nın zamanında \"Fısıh\" o gecenin yemeğiydi, ama aynı zamanda yedi gün süren bütün bayramın da adıydı. Luka'nın kendisi şöyle der: \"Fısıh denilen Mayasız Ekmek Bayramı\" (Luka 22:1).\nŞimdi olayların sırasına bakın:\n• Perşembe akşamı İsa öğrencileriyle Fısıh yemeğini yedi. Matta, Markos ve Luka'nın anlattığı budur.\n• Cuma sabahı önderler, kirlenmemek ve \"Fısıh yemeğini yiyebilmek\" için yabancı olan Pilatus'un evine girmek istemediler (Yuhanna 18:28). Önceki gecenin yemeğinden değil, sonraki günlerde de devam eden bayramın kutsal yemeklerinden bahsediyorlardı.\n• Yuhanna \"Fısıh'ın hazırlık günü\" dediğinde de (Yuhanna 19:14), \"hazırlık\", Yahudilerin cumartesiye hazırlanılan cuma gününe verdiği addı. Yani: Fısıh haftasının cuması.\nBu, Bayram'ın ikinci günü birinin \"Şimdi kirlenemem, çünkü daha bayram yemeğine gideceğim\" demesi gibidir. Kimse bu kişinin Bayram'ın gününü karıştırdığını söylemez.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 268, "id": "p268", "pt": "❌ *\"Mateus diz que Judas se enforcou, e Atos diz que ele caiu de cabeça e o corpo se rompeu.\"*\n✅ As duas coisas aconteceram: Judas se enforcou, e depois o corpo caiu e se rompeu. Um relato conta como ele morreu, o outro conta o que aconteceu com o corpo.", "tr": "❌ *\"Matta Yahuda'nın kendini astığını söylüyor, Elçilerin İşleri ise baş aşağı düştüğünü ve bedeninin yarıldığını söylüyor.\"*\n✅ İkisi de oldu: Yahuda kendini astı, sonra bedeni düştü ve yarıldı. Bir anlatım onun nasıl öldüğünü, diğeri bedenine ne olduğunu anlatıyor.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 269, "id": "p269", "pt": "❌ *\"Mateus diz que o centurião foi pessoalmente a Jesus, e Lucas diz que ele mandou mensageiros.\"*\n✅ Naquela época, o que alguém fazia por meio de mensageiros era contado como feito por ele mesmo, como até hoje dizemos que \"o presidente construiu a ponte\". E o Alcorão faz a mesma coisa: em 3:42 são \"os anjos\" que falam com Maria, e em 19:17 é um só espírito que aparece a ela. O senhor aceita essa explicação para o Alcorão. Então tem que aceitar para a Bíblia.", "tr": "❌ *\"Matta yüzbaşının İsa'ya bizzat gittiğini söylüyor, Luka ise haberciler gönderdiğini söylüyor.\"*\n✅ O dönemde birinin haberciler aracılığıyla yaptığı şey, kendisinin yaptığı şey olarak anlatılırdı; bugün bile \"cumhurbaşkanı köprüyü yaptı\" deriz. Kur'an da aynısını yapar: 3:42'de Meryem'le konuşanlar \"melekler\"dir, 19:17'de ise ona tek bir ruh görünür. Bu açıklamayı Kur'an için kabul ediyorsunuz. O halde Kutsal Kitap için de kabul etmelisiniz.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 270, "id": "p270", "pt": "❌ *\"Marcos diz que Jesus mandou levar cajado e sandálias, e Mateus diz que mandou não levar.\"*\n✅ Leia as duas frases com atenção:\n• Em Marcos, Jesus manda não levar nada para o caminho, a não ser o cajado, e ir calçado com sandálias (Marcos 6:8-9). Ou seja: vão com o que vocês já têm no corpo e na mão.\n• Em Mateus, Jesus diz: \"Não adquiram ouro, nem prata... nem duas túnicas, nem sandálias, nem cajado\" (Mateus 10:9-10). O verbo é \"adquirir\", ou seja, conseguir, comprar. Jesus está dizendo: não saiam comprando coisas novas e a mais para a viagem.\nÉ como um pai que diz ao filho que vai viajar: \"leve só a mochila que você já tem\". E outra pessoa conta a mesma conversa assim: \"ele disse para não comprar mochila nova\". As duas frases dizem a mesma coisa: vá com o que você já tem, sem gastar e sem levar nada a mais.", "tr": "❌ *\"Markos İsa'nın asa ve çarık almayı emrettiğini söylüyor, Matta ise almamayı emrettiğini söylüyor.\"*\n✅ İki cümleyi dikkatle okuyun:\n• Markos'ta İsa, asa dışında yol için hiçbir şey almamalarını ve çarık giymelerini söyler (Markos 6:8-9). Yani: Üstünüzde ve elinizde zaten ne varsa onunla gidin.\n• Matta'da İsa şöyle der: \"Kuşaklarınıza altın, gümüş... edinmeyin; yolculuk için ne torba, ne iki mintan, ne çarık, ne de asa\" (Matta 10:9-10). Fiil \"edinmek\"tir, yani tedarik etmek, satın almak. İsa şunu söylüyor: Yolculuk için yeni ve fazladan şeyler satın almaya kalkmayın.\nBu, yolculuğa çıkacak oğluna \"sadece zaten sahip olduğun çantayı al\" diyen bir babaya benzer. Başka biri de aynı konuşmayı \"yeni çanta almamasını söyledi\" diye anlatır. İki cümle de aynı şeyi söyler: Zaten sahip olduğunla git, para harcama ve fazladan bir şey alma.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 271, "id": "p271", "pt": "❌ *\"Ninguém pode ver Deus e continuar vivo (Êxodo 33:20), mas Jacó viu Deus e lutou com ele.\"*\n✅ A confusão está na expressão \"face a face\". Ela não quer dizer olhar para Deus em toda a sua glória. É um jeito de falar, como quando dizemos \"conversar cara a cara\": quer dizer pessoalmente, de perto, sem intermediário. O próprio versículo explica: Deus falava com Moisés \"face a face, como um homem fala com o seu amigo\" (Êxodo 33:11). É sobre a conversa, direta e de perto.", "tr": "❌ *\"Hiç kimse Tanrı'yı görüp yaşayamaz (Çıkış 33:20), ama Yakup Tanrı'yı gördü ve O'nunla güreşti.\"*\n✅ Karışıklık \"yüz yüze\" ifadesinden kaynaklanıyor. Bu ifade, Tanrı'ya bütün yüceliğiyle bakmak anlamına gelmez. Türkçede de \"yüz yüze konuşmak\" deriz: Şahsen, yakından, aracısız demektir. Ayetin kendisi bunu açıklar: Tanrı Musa'yla \"bir adamın arkadaşıyla konuştuğu gibi yüz yüze\" konuşurdu (Çıkış 33:11). Bu, doğrudan ve yakından yapılan bir konuşmadır.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 272, "id": "p272", "pt": "Agora veja o que acontece logo depois, no mesmo capítulo. Moisés pede: \"mostra-me a tua glória\" (Êxodo 33:18). E Deus responde: \"não poderás ver a minha face, porque ninguém pode me ver e continuar vivo\" (Êxodo 33:20). Aqui, \"face\" é a glória de Deus, Deus como Ele é. E Deus mostra a Moisés só uma parte: \"verás as minhas costas, mas a minha face não se verá\" (Êxodo 33:23).", "tr": "Şimdi aynı bölümde hemen sonra ne olduğuna bakın. Musa şöyle ister: \"Lütfen bana görkemini göster\" (Çıkış 33:18). Tanrı da şöyle cevap verir: \"Yüzümü göremezsin, çünkü beni gören yaşayamaz\" (Çıkış 33:20). Burada \"yüz\", Tanrı'nın görkemi, yani Tanrı'nın olduğu haliyle kendisidir. Ve Tanrı Musa'ya sadece bir kısmını gösterir: \"Sırtımı göreceksin, ama yüzüm görünmeyecek\" (Çıkış 33:23).", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 273, "id": "p273", "pt": "Então não há contradição nenhuma: Moisés falava com Deus de perto e diretamente, mas nunca viu a glória de Deus em toda a sua força. São duas coisas diferentes, explicadas no mesmo capítulo.", "tr": "Yani hiçbir çelişki yok: Musa Tanrı'yla yakından ve doğrudan konuşurdu, ama Tanrı'nın görkemini hiçbir zaman bütün gücüyle görmedi. Bunlar, aynı bölümde açıklanan iki farklı şeydir.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 274, "id": "p274", "pt": "Com Jacó é a mesma coisa. Ele não viu a glória de Deus: lutou com Deus, que apareceu na forma de \"um homem\" (Gênesis 32:24). Por isso disse: \"vi Deus face a face, e a minha vida foi poupada\" (Gênesis 32:30). Ele esteve com Deus pessoalmente, de perto, mas Deus se mostrou numa forma que ele podia aguentar. É como o sol: ninguém aguenta olhar direto para ele, mas todo mundo pode ficar debaixo da luz dele.", "tr": "Yakup'ta da aynısı var. O, Tanrı'nın görkemini görmedi: \"Bir adam\" şeklinde görünen Tanrı'yla güreşti (Yaratılış 32:24). Bu yüzden şöyle dedi: \"Tanrı'yla yüz yüze görüştüğüm halde canım bağışlandı\" (Yaratılış 32:30). Tanrı'yla şahsen, yakından bir aradaydı, ama Tanrı kendini onun dayanabileceği bir şekilde gösterdi. Güneş gibi: Kimse doğrudan ona bakmaya dayanamaz, ama herkes onun ışığı altında durabilir.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 275, "id": "p275", "pt": "E até o Alcorão conta algo parecido: Moisés pediu para ver Allah, e quando Allah se manifestou ao monte, o monte virou pó (7:143). E é exatamente isso que os cristãos dizem de Jesus: \"Ninguém jamais viu Deus; o Filho único, que está junto do Pai, foi quem o revelou\" (João 1:18). O Deus que ninguém pode ver em toda a sua glória se mostrou de um jeito que o homem pode ver: em Jesus.", "tr": "Kur'an bile benzer bir şey anlatır: Musa Allah'ı görmek istedi, Allah dağa tecelli edince dağ paramparça oldu (7:143). Hristiyanların İsa hakkında söylediği de tam olarak budur: \"Tanrı'yı hiçbir zaman hiç kimse görmedi. Baba'nın bağrında olan biricik Oğul O'nu tanıttı\" (Yuhanna 1:18). Bütün yüceliğiyle kimsenin göremeyeceği Tanrı, kendini insanın görebileceği bir şekilde gösterdi: İsa'da.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 276, "id": "p276", "pt": "❌ *\"Êxodo 34:7 diz que Deus castiga os filhos pelos pecados dos pais, e Ezequiel 18:20 diz que o filho não levará a culpa do pai.\"*\n✅ São duas coisas diferentes: consequência e culpa. Veja um exemplo: um pai gasta todo o dinheiro da família no jogo. Os filhos vão sofrer a pobreza, mesmo sem ter culpa nenhuma. Isso é consequência. Mas nenhum juiz manda o filho para a cadeia pelo crime do pai. Isso é culpa.\n• Êxodo fala de consequência, e só para quem continua no mesmo caminho: o próprio Êxodo diz \"até a terceira e a quarta geração dos que me odeiam\" (Êxodo 20:5).\n• Ezequiel fala de culpa diante do julgamento: cada um responde pelo que fez (Ezequiel 18:20).\nE repare: a própria lei de Moisés, do mesmo tempo do Êxodo, já dizia: \"os pais não serão mortos pelos filhos, nem os filhos pelos pais; cada um morrerá pelo seu próprio pecado\" (Deuteronômio 24:16). Se Moisés escreveu as duas coisas, é porque elas não se contradizem.", "tr": "❌ *\"Çıkış 34:7 Tanrı'nın babaların günahı yüzünden çocukları cezalandırdığını söylüyor, Hezekiel 18:20 ise oğulun babanın suçunu yüklenmeyeceğini söylüyor.\"*\n✅ Bunlar iki farklı şeydir: sonuç ve suç. Bir örneğe bakın: Bir baba ailenin bütün parasını kumarda harcıyor. Çocuklar, hiçbir suçları olmadan yoksulluk çekecek. Bu sonuçtur. Ama hiçbir hâkim babanın suçu yüzünden oğlu hapse göndermez. Bu da suçtur.\n• Çıkış sonuçtan bahseder, hem de sadece aynı yolda devam edenler için: Çıkış'ın kendisi \"benden nefret edenlerin üçüncü ve dördüncü kuşağına kadar\" der (Çıkış 20:5).\n• Hezekiel ise yargı önündeki suçtan bahseder: Herkes kendi yaptığından sorumludur (Hezekiel 18:20).\nŞuna da dikkat edin: Çıkış'la aynı döneme ait Musa'nın yasası zaten şöyle diyordu: \"Çocuklar yüzünden babalar, babalar yüzünden de çocuklar öldürülmeyecek; herkes kendi günahı yüzünden ölecek\" (Yasa'nın Tekrarı 24:16). Musa ikisini de yazdıysa, demek ki ikisi çelişmiyor.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 277, "id": "p277", "pt": "❌ *\"O cristianismo diz que todo bebê nasce culpado pelo pecado de Adão, e o Islã diz que toda criança nasce pura.\"*\n✅ Primeiro, o vídeo distorce o que a Bíblia ensina. A Bíblia não diz que um bebê é culpado pelo erro de Adão como um criminoso. Diz que todos herdam de Adão uma natureza inclinada ao erro, e que todos acabam pecando (Romanos 3:23 e 5:12). É como herdar do pai a cor dos olhos: ninguém escolheu, mas recebeu.\nE qualquer pai vê isso em casa: ninguém precisa ensinar uma criança a mentir, a bater no irmão ou a gritar \"é meu!\". Ela já faz sozinha. O que precisa ser ensinado é o contrário: a dizer a verdade, a dividir, a pedir perdão.", "tr": "❌ *\"Hristiyanlık her bebeğin Adem'in günahı yüzünden suçlu doğduğunu söylüyor, İslam ise her çocuğun temiz doğduğunu söylüyor.\"*\n✅ Önce, video Kutsal Kitap'ın öğrettiğini çarpıtıyor. Kutsal Kitap bir bebeğin Adem'in hatasından bir suçlu gibi suçlu olduğunu söylemez. Herkesin Adem'den hataya eğilimli bir doğa miras aldığını ve herkesin sonunda günah işlediğini söyler (Romalılar 3:23 ve 5:12). Babadan göz rengini miras almak gibi: Kimse seçmedi, ama aldı.\nVe her anne baba bunu evde görür: Hiç kimse bir çocuğa yalan söylemeyi, kardeşine vurmayı ya da \"benim!\" diye bağırmayı öğretmek zorunda kalmaz. Bunları kendiliğinden yapar. Öğretilmesi gereken tam tersidir: doğruyu söylemek, paylaşmak, özür dilemek.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 278, "id": "p278", "pt": "✅ E o próprio Islã, olhando com atenção, diz a mesma coisa:\n• Por causa do erro de Adão, todos nascemos fora do Paraíso (2:36). Ou seja, o erro de Adão atinge todos os filhos dele.\n• O Alcorão diz que \"a alma é muito inclinada ao mal\" (12:53).\n• E o Bukhari diz: \"não nasce nenhum filho de Adão sem que Satanás o toque, e por isso ele chora ao nascer, exceto Maria e o filho dela\" (Bukhari 3431).\nEntão, pelo próprio Islã, todo ser humano nasce fora do Paraíso, com uma alma inclinada ao mal e tocado por Satanás. Isso não é \"nascer puro\". E repare em quem fica de fora: só Jesus e a mãe dele. Até o Islã mostra que Jesus é diferente de todos os homens.", "tr": "✅ İslam'ın kendisi de, dikkatle bakınca, aynı şeyi söyler:\n• Adem'in hatası yüzünden hepimiz Cennet'in dışında doğarız (2:36). Yani Adem'in hatası bütün çocuklarını etkiler.\n• Kur'an \"nefis kötülüğü çok emreder\" der (12:53).\n• Buhari de şöyle der: \"Âdemoğullarından doğan her çocuğa Şeytan dokunur ve bu yüzden doğduğunda ağlar; Meryem ve oğlu hariç\" (Buhari 3431).\nYani İslam'ın kendisine göre her insan Cennet'in dışında, kötülüğe eğilimli bir nefisle ve Şeytan'ın dokunuşuyla doğar. Bu \"temiz doğmak\" değildir. Ve kimin dışarıda kaldığına dikkat edin: Sadece İsa ve annesi. İslam bile İsa'nın bütün insanlardan farklı olduğunu gösteriyor.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 279, "id": "p279", "pt": "❌ *\"Em Gênesis 6:19 Noé leva um casal de cada animal, e em Gênesis 7:2-3 leva sete casais dos animais puros.\"*\n✅ A resposta é: as duas coisas, para tipos diferentes de animais. Veja como é simples:\n• Dos animais que não eram puros, que são a maioria, como o cavalo, o camelo e o porco: um casal de cada espécie.\n• Dos animais puros, os que podiam ser oferecidos a Deus, como a ovelha, a cabra e o boi: sete casais de cada espécie.\nÉ exatamente isso que Gênesis 7:2 diz: \"De todos os animais puros, leve sete casais, macho e fêmea; e dos animais que não são puros, um casal, macho e fêmea.\"", "tr": "❌ *\"Yaratılış 6:19'da Nuh her hayvandan bir çift alıyor, Yaratılış 7:2-3'te ise temiz hayvanlardan yedi çift alıyor.\"*\n✅ Cevap: İkisi de, farklı hayvan türleri için. Ne kadar basit olduğuna bakın:\n• Temiz olmayan hayvanlardan, yani hayvanların çoğundan, örneğin at, deve ve domuzdan: her türden bir çift.\n• Temiz hayvanlardan, yani Tanrı'ya sunulabilenlerden, örneğin koyun, keçi ve sığırdan: her türden yedi çift.\nYaratılış 7:2 tam olarak bunu söyler: \"Her temiz hayvandan erkekli dişili yedi çift, temiz olmayan hayvanlardan erkekli dişili birer çift al.\"", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 280, "id": "p280", "pt": "E Gênesis 6:19? Ali Deus dá a regra geral: os animais devem ir \"em casais, macho e fêmea\", para cada espécie continuar existindo. O versículo não diz \"só um casal\", nem \"nenhum a mais\". Diz que tem que ir macho e fêmea. Depois, em Gênesis 7:2, Deus dá a conta completa: quantos casais de cada tipo.", "tr": "Peki Yaratılış 6:19? Orada Tanrı genel kuralı verir: Hayvanlar, her türün varlığını sürdürmesi için \"erkek ve dişi, çift çift\" gidecek. Ayet \"sadece bir çift\" ya da \"fazlası olmasın\" demez. Erkek ve dişi gitmesi gerektiğini söyler. Sonra Yaratılış 7:2'de Tanrı tam hesabı verir: her türden kaç çift.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 281, "id": "p281", "pt": "E por que sete casais dos puros? Porque, depois do dilúvio, Noé ofereceu sacrifícios a Deus com os animais puros (Gênesis 8:20). Se houvesse só um casal, essas espécies teriam acabado no primeiro sacrifício.", "tr": "Peki temiz hayvanlardan neden yedi çift? Çünkü tufandan sonra Nuh temiz hayvanlarla Tanrı'ya kurban sundu (Yaratılış 8:20). Sadece bir çift olsaydı, bu türler ilk kurbanda yok olurdu.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 282, "id": "p282", "pt": "É como uma mãe que diz ao filho que vai viajar: \"leve as meias em pares, um pé e o outro\". Depois ela completa: \"das meias da escola, leve sete pares, uma para cada dia\". A primeira frase não diz para levar um par só: diz que tem que ser em pares. A segunda diz quantos pares.", "tr": "Bu, yolculuğa çıkan oğluna \"çorapları çift çift al, bir teki ve öbür teki\" diyen bir anneye benzer. Sonra şöyle tamamlar: \"Okul çoraplarından yedi çift al, her gün için bir tane.\" Birinci cümle tek bir çift alınmasını söylemiyor: Çift olması gerektiğini söylüyor. İkincisi kaç çift olduğunu söylüyor.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 283, "id": "p283", "pt": "❌ *\"Existem mais de 300 contradições na Bíblia, segundo o livro Izhar al-Haqq.\"*\n✅ Listas assim circulam há séculos, e cada ponto já foi respondido, como os que vimos acima. E repare: em todos eles, a explicação está no próprio texto da Bíblia (Lucas 22:1, Gênesis 8:20, Êxodo 20:5).", "tr": "❌ *\"İzhâru'l-Hak kitabına göre Kutsal Kitap'ta 300'den fazla çelişki var.\"*\n✅ Bu tür listeler yüzyıllardır dolaşıyor ve yukarıda gördüklerimiz gibi her maddeye zaten cevap verildi. Şuna dikkat edin: Hepsinde açıklama Kutsal Kitap'ın kendi metninde var (Luka 22:1, Yaratılış 8:20, Çıkış 20:5).", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": true}, {"k": "para", "n": 284, "id": "p284", "pt": "Agora veja o Alcorão: em 7:54, ele diz que Allah criou os céus e a terra em seis dias, mas em 41:9-12 fala de dois dias, mais quatro, mais dois: oito. Os sábios muçulmanos explicam dizendo que os quatro dias já incluem os dois primeiros, algo que o versículo não diz.", "tr": "Şimdi Kur'an'a bakın: Kur'an 7:54'te Allah'ın gökleri ve yeri altı günde yarattığını söylüyor, ama 41:9-12'de iki gün, artı dört gün, artı iki gün, yani sekiz günden bahsediyor. Müslüman alimler bunu, dört günün ilk iki günü de içine aldığını söyleyerek açıklıyor; oysa ayet bunu söylemiyor.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "para", "n": 285, "id": "p285", "pt": "Ou seja: na Bíblia, a explicação está escrita no texto; no Alcorão, é preciso acrescentar o que o versículo não diz. Se o senhor aceita essa explicação para o Alcorão, não tem como recusar as da Bíblia, que estão no próprio texto.", "tr": "Yani Kutsal Kitap'ta açıklama metnin içinde yazılı; Kur'an'da ise ayetin söylemediği bir şeyi eklemek gerekiyor. Bu açıklamayı Kur'an için kabul ediyorsanız, metnin kendisinde olan Kutsal Kitap açıklamalarını reddetmenizin hiçbir yolu yok.", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "newPoint": false}, {"k": "research", "n": 286, "id": "p286", "where": {"pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Salmos", "text": "As frases de Jesus na cruz 'Meu Deus, por que me abandonaste?' e 'Pai, em tuas mãos entrego o meu espírito' vêm de quais Salmos?"}, {"label": "Horas", "text": "Na contagem judaica, a 'terceira hora' corresponde a que horas? E há estudiosos que explicam que João 19:14 conta as horas a partir da meia-noite, de modo que a 'sexta hora' seria por volta das 6h da manhã?"}, {"label": "Páscoa", "text": "Segundo Lucas 22:1, a Festa dos Pães Asmos também era chamada de 'Páscoa' e durava sete dias? E 'preparação' (paraskeuē) era o nome que os judeus davam à sexta-feira?"}, {"label": "Sandálias", "text": "Em Mateus 10:9-10, o verbo grego que Jesus usa significa 'não adquiram', ou seja, não consigam ou comprem? E em Marcos 6:8-9 Jesus manda levar só o cajado e ir calçado com sandálias?"}, {"label": "Moisés e Jacó", "text": "Em Êxodo 33, Moisés pede para ver a glória de Deus (versículo 18), Deus diz que ninguém pode ver a sua face e viver (versículo 20) e mostra só as suas costas (versículo 23)? E no versículo 11, 'face a face' quer dizer falar diretamente, 'como um homem fala com o seu amigo'? Em Gênesis 32:24, Jacó luta com 'um homem'?"}, {"label": "Pais e filhos", "text": "Êxodo 20:5 diz 'dos que me odeiam'? E Deuteronômio 24:16, da lei de Moisés, diz que cada um morrerá pelo seu próprio pecado?"}, {"label": "Noé", "text": "Em Gênesis 7:2, Deus manda levar sete casais dos animais puros e um casal dos animais que não são puros? E segundo Gênesis 8:20, com quais animais Noé ofereceu sacrifícios depois do dilúvio?"}, {"label": "Bukhari", "text": "Em Bukhari 3431, quem são as únicas pessoas que Satanás não tocou ao nascer? E o Alcorão 12:53 diz que a alma é muito inclinada ao mal?"}, {"label": "Alcorão", "text": "Em 3:42 o Alcorão fala de 'os anjos' falando com Maria, e em 19:17 de um só espírito? Como os sábios muçulmanos explicam isso?"}, {"label": "Alcorão", "text": "Como os sábios muçulmanos explicam que 7:54 fala de seis dias e 41:9-12 fala de dois, quatro e dois dias?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Mezmurlar", "text": "İsa'nın çarmıhtaki 'Tanrım, neden beni terk ettin?' ve 'Baba, ruhumu ellerine bırakıyorum' sözleri hangi Mezmurlar'dan geliyor?"}, {"label": "Saatler", "text": "Yahudi saat hesabına göre 'üçüncü saat' saat kaça denk gelir? Bazı araştırmacılar, Yuhanna 19:14'ün saatleri gece yarısından itibaren saydığını ve bu durumda 'altıncı saatin' sabah 6 civarı olacağını açıklıyor mu?"}, {"label": "Fısıh", "text": "Luka 22:1'e göre Mayasız Ekmek Bayramı'na 'Fısıh' da deniyor muydu ve yedi gün mü sürüyordu? 'Hazırlık' (paraskevi), Yahudilerin cuma gününe verdiği ad mıydı?"}, {"label": "Çarıklar", "text": "Matta 10:9-10'da İsa'nın kullandığı Grekçe fiil 'edinmeyin', yani tedarik etmeyin ya da satın almayın mı demektir? Markos 6:8-9'da İsa sadece asa almalarını ve çarık giymelerini mi söylüyor?"}, {"label": "Musa ve Yakup", "text": "Çıkış 33'te Musa Tanrı'nın görkemini görmek mi istiyor (18. ayet), Tanrı kimsenin O'nun yüzünü görüp yaşayamayacağını mı söylüyor (20. ayet) ve sadece sırtını mı gösteriyor (23. ayet)? 11. ayetteki 'yüz yüze', 'bir adamın arkadaşıyla konuştuğu gibi' doğrudan konuşmak anlamında mı? Yaratılış 32:24'te Yakup 'bir adam'la mı güreşiyor?"}, {"label": "Babalar ve çocuklar", "text": "Çıkış 20:5 'benden nefret edenlerin' diyor mu? Musa'nın yasasındaki Yasa'nın Tekrarı 24:16, herkesin kendi günahı yüzünden öleceğini söylüyor mu?"}, {"label": "Nuh", "text": "Yaratılış 7:2'de Tanrı temiz hayvanlardan yedi çift, temiz olmayanlardan bir çift alınmasını mı emrediyor? Yaratılış 8:20'ye göre Nuh tufandan sonra hangi hayvanlarla kurban sundu?"}, {"label": "Buhari", "text": "Buhari 3431'e göre doğarken Şeytan'ın dokunmadığı kişiler kimlerdir? Kur'an 12:53 nefsin kötülüğü çok emrettiğini söylüyor mu?"}, {"label": "Kur'an", "text": "Kur'an 3:42'de Meryem'le konuşan 'melekler'den, 19:17'de ise tek bir ruhtan mı bahsediyor? Müslüman alimler bunu nasıl açıklıyor?"}, {"label": "Kur'an", "text": "Müslüman alimler, 7:54'te altı günden, 41:9-12'de ise iki, dört ve iki günden bahsedilmesini nasıl açıklıyor?"}]}}, {"k": "part", "n": 290, "id": "part-6", "pt": "*PARTE 6: AS \"300 BÍBLIAS\" E AS REVISÕES*", "tr": "*6. BÖLÜM: \"300 KUTSAL KİTAP\" VE REVİZYONLAR*", "where": {"pt": "Parte 6: As “300 Bíblias”", "tr": "6. Bölüm: “300 Kutsal Kitap”"}, "newPoint": false, "lab": {"pt": ["PARTE 6", "As “300 Bíblias”"], "tr": ["6. BÖLÜM", "“300 Kutsal Kitap”"]}}, {"k": "para", "n": 291, "id": "p291", "pt": "❌ *O que o vídeo diz:* que um colecionador tem 300 Bíblias e todas são diferentes; que a King James de 1611 foi revisada em 1881, 1901, 1952, 1971 e depois várias vezes, porque \"tinha erros\"; que não muda só a tradução, mas o próprio conteúdo; e que numa Bíblia de 1825 alguns versículos \"sumiram\".", "tr": "❌ *Videonun söylediği:* Bir koleksiyoncunun 300 Kutsal Kitabı olduğu ve hepsinin farklı olduğu; 1611 tarihli King James'in \"hataları olduğu için\" 1881, 1901, 1952, 1971 ve sonra birçok kez revize edildiği; değişenin sadece çeviri değil, içeriğin kendisi olduğu ve 1825 tarihli bir Kutsal Kitap'ta bazı ayetlerin \"kaybolduğu\".", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": true}, {"k": "para", "n": 292, "id": "p292", "pt": "Isso parece forte para quem não conhece o assunto. Mas as diferenças que ele mostra vêm de três coisas simples: tradução, mudança da língua e descoberta de manuscritos mais antigos. Nenhuma delas muda a mensagem.", "tr": "Bu, konuyu bilmeyen biri için güçlü görünür. Ama gösterdiği farklar üç basit şeyden gelir: çeviri, dilin değişmesi ve daha eski el yazmalarının bulunması. Bunların hiçbiri mesajı değiştirmez.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "para", "n": 293, "id": "p293", "pt": "✅ *1. Tradução não é uma Bíblia diferente.*\nO Antigo Testamento foi escrito em hebraico e o Novo Testamento, em grego. Os estudiosos comparam os manuscritos e publicam o texto em hebraico e grego, e as traduções são feitas a partir dele. *Ter 300 traduções não é ter 300 Bíblias diferentes.* É traduzir o mesmo texto de 300 jeitos.", "tr": "✅ *1. Çeviri, farklı bir Kutsal Kitap değildir.*\nEski Antlaşma İbranice, Yeni Antlaşma Grekçe yazıldı. Araştırmacılar el yazmalarını karşılaştırıp İbranice ve Grekçe metni yayımlar, çeviriler de bu metinden yapılır. *300 çeviriye sahip olmak, 300 farklı Kutsal Kitap'a sahip olmak değildir.* Aynı metni 300 farklı şekilde çevirmektir.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "para", "n": 294, "id": "p294", "pt": "É exatamente o que acontece com o Alcorão na Turquia. Existe o meal do Diyanet, o meal de Elmalılı, o de Süleyman Ateş e dezenas de outros, cada um com palavras diferentes. Se eu juntasse 300 meals e dissesse \"o Alcorão muda o tempo todo\", o senhor aceitaria? Claro que não. O senhor diria: \"Os meals mudam, o texto árabe é o mesmo.\" É exatamente isso que acontece com a Bíblia. E repare: as diferenças que o vídeo mostra na Bíblia são de tradução. Já as do Alcorão, como vou mostrar na Parte 7, estão no próprio texto árabe, nas leituras.", "tr": "Türkiye'de Kur'an'la da tam olarak bu oluyor. Diyanet meali, Elmalılı meali, Süleyman Ateş meali ve her birinin kelimeleri farklı olan onlarca başka meal var. Ben 300 meal toplayıp \"Kur'an sürekli değişiyor\" deseydim, kabul eder miydiniz? Elbette hayır. \"Mealler değişir, Arapça metin aynıdır\" derdiniz. Kutsal Kitap'ta olan da tam olarak budur. Şuna da dikkat edin: Videonun Kutsal Kitap'ta gösterdiği farklar çeviri farklarıdır. Kur'an'ınkiler ise, 7. bölümde göstereceğim gibi, Arapça metnin kendisinde, kıraatlerdedir.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "para", "n": 295, "id": "p295", "pt": "✅ *2. A língua muda.*\nO inglês de 1611 é muito diferente do inglês de hoje, assim como o turco de 1800 era o turco otomano, que hoje quase ninguém entende. Por isso as traduções são atualizadas: para que as pessoas entendam, não para mudar a mensagem.", "tr": "✅ *2. Dil değişir.*\n1611'in İngilizcesi bugünün İngilizcesinden çok farklıdır; tıpkı 1800'lerin Türkçesinin bugün neredeyse kimsenin anlamadığı Osmanlıca olması gibi. Bu yüzden çeviriler güncellenir: Mesajı değiştirmek için değil, insanlar anlasın diye.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "para", "n": 296, "id": "p296", "pt": "✅ *3. Hoje temos manuscritos mais antigos.*\nA King James de 1611 usou manuscritos da Idade Média, porque eram os que se conheciam na época. Depois foram encontrados manuscritos muito mais antigos: o Códice Sinaítico, em 1844 e 1859, e os papiros, no século 20. Repare nas datas: a primeira grande revisão foi em 1881, logo depois da descoberta do Sinaítico, justamente para usar os manuscritos mais antigos. É isso que o vídeo chama de \"mudar o conteúdo\".", "tr": "✅ *3. Bugün daha eski el yazmalarımız var.*\n1611 tarihli King James, o zaman bilinenler onlar olduğu için Orta Çağ el yazmalarını kullandı. Sonra çok daha eski el yazmaları bulundu: 1844 ve 1859'da Sina Kodeksi, 20. yüzyılda da papirüsler. Tarihlere dikkat edin: İlk büyük revizyon, Sina Kodeksi'nin bulunmasından hemen sonra, 1881'de, tam da daha eski el yazmalarını kullanmak için yapıldı. Videonun \"içeriği değiştirmek\" dediği şey budur.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "para", "n": 297, "id": "p297", "pt": "✅ *Os \"versículos que sumiram\":*\nsão sempre os mesmos poucos versículos, como 1 João 5:7 e a mulher adúltera, que as Bíblias antigas traziam e as modernas colocam em colchetes ou em nota, porque não estão nos manuscritos mais antigos. Eles não sumiram escondidos: as Bíblias explicam onde estão e por quê. E nenhum deles muda nada do que os cristãos creem, como já mostrei.", "tr": "✅ *\"Kaybolan ayetler\":*\nBunlar hep aynı birkaç ayettir; eski Kutsal Kitapların içerdiği, modern olanların ise en eski el yazmalarında bulunmadıkları için köşeli parantez içine ya da nota aldığı 1 Yuhanna 5:7 ve zina eden kadının hikâyesi gibi. Gizlice kaybolmadılar: Kutsal Kitaplar nerede olduklarını ve nedenini açıklıyor. Gösterdiğim gibi, hiçbiri Hristiyanların inandığı hiçbir şeyi değiştirmiyor.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "para", "n": 298, "id": "p298", "pt": "✅ *E veja o resultado.*\nA King James, de 1611, feita com manuscritos medievais, e a New International Version, de 2011, feita com os manuscritos mais antigos, dizem exatamente a mesma frase em João 1:1: \"the Word was God\", a Palavra era Deus. Quatrocentos anos depois, com manuscritos diferentes, a mensagem é a mesma.", "tr": "✅ *Sonuca da bakın.*\nOrta Çağ el yazmalarıyla yapılan 1611 tarihli King James ile en eski el yazmalarıyla yapılan 2011 tarihli New International Version, Yuhanna 1:1'de tam olarak aynı cümleyi söyler: \"the Word was God\", yani Söz Tanrı'ydı. Dört yüz yıl sonra, farklı el yazmalarıyla, mesaj aynı.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "para", "n": 299, "id": "p299", "pt": "✅ *O teste das 300 Bíblias.*\nPeça ao colecionador para abrir as 300 Bíblias dele em três versículos: João 1:1, João 3:16 e João 20:28. Em todas elas, a Palavra é Deus, Deus amou o mundo e deu Seu Filho, e Tomé chama Jesus de \"Senhor meu e Deus meu\". Nenhuma delas diz que Jesus é só um profeta, ou que Ele não morreu na cruz.", "tr": "✅ *300 Kutsal Kitap testi.*\nKoleksiyoncudan 300 Kutsal Kitabının hepsini üç ayette açmasını isteyin: Yuhanna 1:1, Yuhanna 3:16 ve Yuhanna 20:28. Hepsinde Söz Tanrı'dır, Tanrı dünyayı sevip Oğlu'nu vermiştir ve Tomas İsa'ya \"Rabbim ve Tanrım!\" der. Hiçbiri İsa'nın sadece bir peygamber olduğunu ya da çarmıhta ölmediğini söylemez.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "para", "n": 300, "id": "p300", "pt": "✅ *O senhor pode dizer: \"Mas a Bíblia das Testemunhas de Jeová é diferente.\"*\nEla traz \"a Palavra era um deus\" em João 1:1. Mas ela é de 1950, feita por um grupo que já não aceitava que Jesus é Deus e que traduziu o texto para combinar com o que já acreditava. Isso nem pode ser chamado de Bíblia. Se fosse assim, qualquer grupo poderia pegar a Bíblia, mudar as partes de que não gosta e chamar o resultado de Bíblia. Não é porque alguém pega um livro e chama de Bíblia que ele é Bíblia. Nenhuma igreja cristã, católica, ortodoxa ou protestante, aceita essa tradução. E mesmo ela, em João 20:28, traz Tomé dizendo a Jesus: \"Meu Senhor e meu Deus!\"", "tr": "✅ *Şöyle diyebilirsiniz: \"Ama Yehova'nın Şahitlerinin Kutsal Kitabı farklı.\"*\nOnda Yuhanna 1:1'de \"Söz Tanrı'ydı\" yerine, Söz'ün \"bir ilah\" ya da \"bir tanrı\" olduğunu söyleyen bir ifade var. Ama bu çeviri 1950 tarihlidir ve İsa'nın Tanrı olduğunu zaten kabul etmeyen, metni kendi inancına uydurmak için çeviren bir grup tarafından yapılmıştır. Buna Kutsal Kitap bile denemez. Öyle olsaydı, herhangi bir grup Kutsal Kitap'ı alıp hoşuna gitmeyen kısımları değiştirir ve sonuca Kutsal Kitap derdi. Biri bir kitabı alıp ona Kutsal Kitap dedi diye o kitap Kutsal Kitap olmaz. Ne Katolik, ne Ortodoks, ne de Protestan, hiçbir Hristiyan kilisesi bu çeviriyi kabul etmez. Üstelik bu çeviride bile Yuhanna 20:28'de Tomas İsa'ya \"Rabbim ve Tanrım!\" der.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "para", "n": 301, "id": "p301", "pt": "✅ *E as Bíblias católicas?*\nAs Bíblias católicas e ortodoxas têm alguns livros a mais no Antigo Testamento, como Tobias e Macabeus. Mas o Novo Testamento, com os quatro Evangelhos, é o mesmo em todas: católica, ortodoxa e protestante. E nenhum desses livros a mais muda nada sobre quem Jesus é.", "tr": "✅ *Peki ya Katolik Kutsal Kitapları?*\nKatolik ve Ortodoks Kutsal Kitaplarında, Eski Antlaşma'da Tobit ve Makabeler gibi birkaç kitap daha vardır. Ama dört İncil'i içeren Yeni Antlaşma hepsinde aynıdır: Katolik, Ortodoks ve Protestan. Bu fazladan kitapların hiçbiri de İsa'nın kim olduğu hakkında hiçbir şeyi değiştirmez.", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "newPoint": false}, {"k": "research", "n": 302, "id": "p302", "where": {"pt": "Parte 6: As “300 Bíblias” › 300 Bíblias e revisões", "tr": "6. Bölüm: “300 Kutsal Kitap” › 300 Kutsal Kitap ve revizyonlar"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Meals", "text": "Existem muitos meals turcos diferentes do Alcorão, como os do Diyanet, de Elmalılı e de Süleyman Ateş, com palavras diferentes?"}, {"label": "João 1:1", "text": "Como João 1:1 é traduzido na King James de 1611 e na New International Version de 2011?"}, {"label": "1881", "text": "Por que foi feita a Revised Version de 1881, e que manuscrito importante tinha sido descoberto pouco antes?"}, {"label": "Testemunhas de Jeová", "text": "Quando foi publicada a Tradução do Novo Mundo das Testemunhas de Jeová, e as igrejas católica, ortodoxa e protestantes a aceitam?"}, {"label": "João 20:28", "text": "Como a Tradução do Novo Mundo traduz João 20:28?"}, {"label": "Novo Testamento", "text": "O Novo Testamento das Bíblias católicas, ortodoxas e protestantes tem os mesmos 27 livros?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Mealler", "text": "Diyanet, Elmalılı ve Süleyman Ateş mealleri gibi, farklı kelimeler kullanan birçok Türkçe Kur'an meali var mı?"}, {"label": "Yuhanna 1:1", "text": "Yuhanna 1:1, 1611 tarihli King James'te ve 2011 tarihli New International Version'da nasıl çevrilmiş?"}, {"label": "1881", "text": "1881 tarihli Revised Version neden yapıldı ve ondan kısa süre önce hangi önemli el yazması bulunmuştu?"}, {"label": "Yehova'nın Şahitleri", "text": "Yehova'nın Şahitlerinin Yeni Dünya Çevirisi ne zaman yayımlandı ve Katolik, Ortodoks ve Protestan kiliseleri bu çeviriyi kabul ediyor mu?"}, {"label": "Yuhanna 20:28", "text": "Yeni Dünya Çevirisi Yuhanna 20:28'i nasıl çeviriyor?"}, {"label": "Yeni Antlaşma", "text": "Katolik, Ortodoks ve Protestan Kutsal Kitaplarının Yeni Antlaşması aynı 27 kitaptan mı oluşuyor?"}]}}, {"k": "part", "n": 306, "id": "part-7", "pt": "*PARTE 7: \"A BÍBLIA MUDOU E O ALCORÃO FOI PRESERVADO\"*", "tr": "*7. BÖLÜM: \"KUTSAL KİTAP DEĞİŞTİ, KUR'AN KORUNDU\"*", "where": {"pt": "Parte 7: “O Alcorão foi preservado”", "tr": "7. Bölüm: “Kur'an korundu”"}, "newPoint": false, "lab": {"pt": ["PARTE 7", "“O Alcorão foi preservado”"], "tr": ["7. BÖLÜM", "“Kur'an korundu”"]}}, {"k": "para", "n": 307, "id": "p307", "pt": "❌ *O que o vídeo diz:* que Allah deixou a Torá e o Evangelho serem alterados porque eram só para um povo e uma época, que os rabinos receberam a missão de guardar o Livro e falharam (5:44), e que só o Alcorão foi preservado, porque Allah prometeu guardá-lo (15:9).", "tr": "❌ *Videonun söylediği:* Allah'ın Tevrat'ın ve İncil'in değiştirilmesine izin verdiği, çünkü onların sadece bir kavim ve bir dönem için olduğu; hahamlara Kitab'ı koruma görevinin verildiği ve başaramadıkları (5:44) ve sadece Kur'an'ın korunduğu, çünkü Allah'ın onu koruyacağını vaat ettiği (15:9).", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "newPoint": true}, {"k": "para", "n": 308, "id": "p308", "pt": "✅ *5:44 não diz que eles falharam.*\nComo já provei na Parte 4, o Alcorão fala da Torá e do Evangelho que os judeus e os cristãos tinham nas mãos no tempo de Muhammad, e manda seguir esses livros. E o versículo diz que os rabinos foram encarregados de guardar o Livro de Allah \"e eram testemunhas dele\". Não diz em lugar nenhum que o Livro se perdeu. E logo depois, em 5:46-47, o Alcorão manda os cristãos julgarem pelo Evangelho. *Ninguém manda julgar por um livro perdido.*", "tr": "✅ *5:44 onların başaramadığını söylemiyor.*\n4. bölümde kanıtladığım gibi, Kur'an Muhammed'in zamanında Yahudilerin ve Hristiyanların elinde olan Tevrat'tan ve İncil'den bahseder ve bu kitaplara uyulmasını emreder. Ayet de, hahamlara Allah'ın Kitabı'nı korumanın emanet edildiğini \"ve onun üzerine şahit olduklarını\" söyler. Kitab'ın kaybolduğunu hiçbir yerde söylemez. Hemen ardından, 5:46-47'de, Kur'an Hristiyanlara İncil ile hükmetmelerini emreder. *Kimse kaybolmuş bir kitapla hükmetmeyi emretmez.*", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "newPoint": false}, {"k": "para", "n": 309, "id": "p309", "pt": "✅ *O Alcorão diz que a Torá e o Evangelho eram para a humanidade.*\nEm 3:3-4, o Alcorão diz que Allah revelou a Torá e o Evangelho \"como orientação para os homens\". E se o Evangelho fosse só para os judeus do tempo de Jesus, por que o Alcorão, 600 anos depois, manda os cristãos da Arábia julgarem por ele (5:47)? E Jesus mandou levar o Evangelho \"a todas as nações\", e prometeu: \"O céu e a terra passarão, mas as minhas palavras jamais passarão\".", "tr": "✅ *Kur'an, Tevrat'ın ve İncil'in insanlık için olduğunu söylüyor.*\n3:3-4'te Kur'an, Allah'ın Tevrat'ı ve İncil'i \"insanlara yol gösterici olarak\" indirdiğini söyler. İncil sadece İsa'nın zamanındaki Yahudiler içinse, Kur'an neden 600 yıl sonra Arabistan'daki Hristiyanlara onunla hükmetmelerini emrediyor (5:47)? İsa da İncil'in \"bütün uluslara\" götürülmesini emretti ve şunu vaat etti: \"Yer ve gök ortadan kalkacak, ama benim sözlerim asla ortadan kalkmayacak\".", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "newPoint": false}, {"k": "para", "n": 310, "id": "p310", "pt": "✅ *E o próprio Alcorão diz que os seguidores de Jesus venceriam.*\nEm 3:55, Allah diz a Jesus: \"farei os que te seguem superiores aos que descreem, até o Dia da Ressurreição\". Mas quem eram os seguidores de Jesus nos 600 anos antes de Muhammad? Eram os cristãos, que criam que Jesus morreu na cruz, ressuscitou e é Deus. Os poucos grupos diferentes também contradiziam o Alcorão: os ebionitas, segundo Irineu, negavam que Jesus nasceu de uma virgem, e os gnósticos diziam que Ele nem tinha um corpo de verdade. Então, pelo próprio Alcorão, quem recebeu a vitória foram justamente os cristãos.", "tr": "✅ *Kur'an'ın kendisi de İsa'nın takipçilerinin galip geleceğini söylüyor.*\n3:55'te Allah İsa'ya şöyle der: \"Sana uyanları, kıyamet gününe kadar inkâr edenlerin üstünde tutacağım.\" Peki Muhammed'den önceki 600 yılda İsa'nın takipçileri kimlerdi? İsa'nın çarmıhta öldüğüne, dirildiğine ve Tanrı olduğuna inanan Hristiyanlardı. Farklı olan birkaç grup da Kur'an'la çelişiyordu: İreneus'a göre Ebionitler İsa'nın bakireden doğduğunu inkâr ediyordu, gnostikler ise O'nun gerçek bir bedeni bile olmadığını söylüyordu. O halde Kur'an'ın kendisine göre zaferi kazananlar tam da Hristiyanlardır.", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "newPoint": false}, {"k": "para", "n": 311, "id": "p311", "pt": "✅ *A ideia de que o Evangelho \"era só para aquela época\" foi criada depois,*\nporque não havia outra forma de explicar por que a Bíblia contradiz o Alcorão. O Alcorão nunca diz isso.", "tr": "✅ *İncil'in \"sadece o dönem için\" olduğu fikri sonradan uyduruldu,*\nçünkü Kutsal Kitap'ın Kur'an'la neden çeliştiğini açıklamanın başka yolu yoktu. Kur'an bunu hiçbir yerde söylemez.", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "newPoint": false}, {"k": "para", "n": 312, "id": "p312", "pt": "✅ *E o Alcorão foi mesmo preservado sem nenhuma diferença?*\nExistem leituras diferentes do Alcorão (kıraat), como a de Hafs, usada na Turquia, e a de Warsh, usada no norte da África. E algumas diferenças mudam o sentido:\n• Em 5:6, o versículo do abdest, a leitura de Hafs diz \"erculekum\", que significa lavar os pés. Já as leituras de Ibn Kathir e de Abu Amr, que também são aceitas, dizem \"erculikum\", que pela gramática aponta para só passar a mão molhada nos pés (mesh). Por isso esse versículo é discutido até hoje, e os xiitas passam a mão nos pés em vez de lavar.\n• Em 3:146, uma leitura diz que muitos profetas \"lutaram\" (kâtele), e outra diz que eles \"foram mortos\" (kutile).", "tr": "✅ *Peki Kur'an gerçekten hiçbir fark olmadan mı korundu?*\nKur'an'ın, Türkiye'de kullanılan Hafs ve Kuzey Afrika'da kullanılan Varş gibi farklı kıraatleri vardır. Bazı farklar anlamı da değiştirir:\n• Abdest ayeti olan 5:6'da Hafs kıraati \"erculekum\" der; bu, ayakları yıkamak demektir. Yine kabul edilen kıraatlerden olan İbn Kesir ve Ebu Amr kıraatleri ise \"erculikum\" der; bu da dilbilgisi açısından ayaklara sadece mesh etmeye işaret eder. Bu yüzden bu ayet bugün bile tartışılır ve Şiiler ayaklarını yıkamak yerine mesh eder.\n• 3:146'da bir kıraate göre birçok peygamber \"savaştı\" (kâtele), başka bir kıraate göre ise \"öldürüldü\" (kutile).", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "newPoint": false}, {"k": "para", "n": 313, "id": "p313", "pt": "E as próprias fontes islâmicas contam de partes que faltam ou que um companheiro de Muhammad não aceitava:\n• Ibn Mas'ud, um dos companheiros que mais conheciam o Alcorão, não escrevia as duas últimas suratas (113 e 114) no seu mushaf (Bukhari 4977; Musnad Ahmad 21186).\n• Umar disse ter medo de que, com o tempo, as pessoas dissessem que não encontravam no Livro de Allah o versículo do apedrejamento (recm). Esse versículo não está no Alcorão de hoje (Bukhari 6829).\n• Aisha disse que havia um versículo sobre dez amamentações, depois mudado para cinco, que ainda era recitado quando Muhammad morreu. Esse versículo também não está no Alcorão de hoje (Muslim 1452).\n• E Uthman mandou queimar todas as outras cópias do Alcorão (Bukhari 4987). Por isso hoje não podemos compará-las.", "tr": "İslami kaynakların kendisi de, eksik olan ya da Muhammed'in bir sahabesinin kabul etmediği kısımlardan bahseder:\n• Kur'an'ı en iyi bilen sahabelerden biri olan İbn Mesud, son iki sureyi (113 ve 114) kendi mushafına yazmazdı (Buhari 4977; Müsned-i Ahmed 21186).\n• Ömer, zamanla insanların Allah'ın Kitabı'nda recm ayetini bulamadıklarını söylemelerinden korktuğunu söyledi. Bu ayet bugünkü Kur'an'da yoktur (Buhari 6829).\n• Aişe, önce on, sonra beşe indirilen emzirme hakkında bir ayet olduğunu ve Muhammed vefat ettiğinde hâlâ okunduğunu söyledi. Bu ayet de bugünkü Kur'an'da yoktur (Müslim 1452).\n• Osman da Kur'an'ın diğer bütün nüshalarının yakılmasını emretti (Buhari 4987). Bu yüzden bugün onları karşılaştıramıyoruz.", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "newPoint": false}, {"k": "para", "n": 314, "id": "p314", "pt": "O senhor pode dizer: \"Esses versículos foram revogados (nesh).\" Mas repare: Aisha diz que o versículo das amamentações ainda era recitado quando Muhammad morreu, e depois da morte dele não há mais revelação. Então quem o tirou, e com que autoridade? E o Alcorão não avisa o leitor de nada disso. Já os cristãos guardaram as cópias antigas e mostram, dentro das próprias Bíblias, até o trecho que foi acrescentado. Um lado mostra tudo; o outro queimou as cópias.", "tr": "Şöyle diyebilirsiniz: \"Bu ayetler nesh edildi.\" Ama dikkat edin: Aişe, emzirme ayetinin Muhammed vefat ettiğinde hâlâ okunduğunu söylüyor; onun vefatından sonra ise artık vahiy yok. O halde bu ayeti kim, hangi yetkiyle çıkardı? Kur'an da okuyucuya bunların hiçbirini bildirmiyor. Hristiyanlar ise eski kopyaları korudu ve sonradan eklenen bölümü bile Kutsal Kitapların içinde gösteriyor. Bir taraf her şeyi gösteriyor; diğer taraf nüshaları yaktı.", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "newPoint": false}, {"k": "para", "n": 315, "id": "p315", "pt": "✅ *E pense nisto:*\nse Allah deixou o Evangelho se perder, que garantia o senhor tem de que o mesmo não aconteceria com o Alcorão? *Um deus que deixa a própria palavra se perder uma vez pode deixar de novo.* O Deus da Bíblia promete o contrário: \"a palavra do nosso Deus permanece para sempre\".", "tr": "✅ *Bir de şunu düşünün:*\nAllah İncil'in kaybolmasına izin verdiyse, aynı şeyin Kur'an'ın başına gelmeyeceğinin ne garantisi var? *Kendi sözünün bir kez kaybolmasına izin veren bir ilah, bunu yine yapabilir.* Kutsal Kitap'ın Tanrısı ise tam tersini vaat eder: \"Tanrımız'ın sözü sonsuza dek kalır\".", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "newPoint": false}, {"k": "research", "n": 316, "id": "p316", "where": {"pt": "Parte 7: “O Alcorão foi preservado” › 5:44, 15:9 e as leituras", "tr": "7. Bölüm: “Kur'an korundu” › 5:44, 15:9 ve kıraatler"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "5:44", "text": "O que diz o Alcorão 5:44 sobre os rabinos e o Livro de Allah? Diz que o Livro se perdeu?"}, {"label": "5:47", "text": "Segundo o Alcorão 5:46-47 e 3:3-4, o que os seguidores do Evangelho deveriam fazer, e para quem a Torá e o Evangelho foram enviados?"}, {"label": "3:55", "text": "O que Allah promete aos seguidores de Jesus em 3:55? E nos 600 anos antes de Muhammad, o que a grande maioria dos seguidores de Jesus acreditava sobre a crucificação?"}, {"label": "Ebionitas", "text": "Segundo Irineu, os ebionitas aceitavam que Jesus nasceu de uma virgem? E os gnósticos de Basilides diziam que Jesus tinha um corpo humano de verdade?"}, {"label": "Leituras", "text": "Quais são as diferenças entre as leituras de Hafs e de Warsh do Alcorão, e onde cada uma é usada?"}, {"label": "5:6", "text": "Em 5:6, qual é a diferença entre as leituras 'arjulakum' e 'arjulikum', quais leitores usam cada uma, e por que isso entra no debate entre sunitas e xiitas sobre os pés no abdest?"}, {"label": "3:146", "text": "Em 3:146, quais são as leituras 'qatala' e 'qutila', e que diferença de sentido elas têm?"}, {"label": "Ibn Mas'ud", "text": "Ibn Mas'ud escrevia as suratas 113 e 114 no seu mushaf, segundo Bukhari 4977 e o Musnad de Ahmad?"}, {"label": "Versículos", "text": "Segundo Muslim 1452 e Bukhari 6829, que versículos Aisha e Umar disseram que foram revelados, e eles estão no Alcorão de hoje?"}, {"label": "Nesh", "text": "Pode haver revogação (nesh) de um versículo depois da morte de Muhammad? Como os sábios explicam que o versículo das amamentações ainda era recitado quando ele morreu (Muslim 1452)?"}, {"label": "Uthman", "text": "Segundo Bukhari 4987, o que Uthman mandou fazer com as outras cópias do Alcorão?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "5:44", "text": "Kur'an 5:44 hahamlar ve Allah'ın Kitabı hakkında ne diyor? Kitab'ın kaybolduğunu söylüyor mu?"}, {"label": "5:47", "text": "Kur'an 5:46-47 ve 3:3-4'e göre İncil ehlinin ne yapması gerekiyordu ve Tevrat ile İncil kimler için indirildi?"}, {"label": "3:55", "text": "Allah 3:55'te İsa'ya uyanlara ne vaat ediyor? Muhammed'den önceki 600 yılda İsa'nın takipçilerinin büyük çoğunluğu çarmıh hakkında neye inanıyordu?"}, {"label": "Ebionitler", "text": "İreneus'a göre Ebionitler İsa'nın bakireden doğduğunu kabul ediyor muydu? Basilides'in gnostikleri İsa'nın gerçek bir insan bedeni olduğunu söylüyor muydu?"}, {"label": "Kıraatler", "text": "Kur'an'ın Hafs ve Varş kıraatleri arasındaki farklar nelerdir ve her biri nerede kullanılır?"}, {"label": "5:6", "text": "5:6'daki 'erculekum' ve 'erculikum' kıraatleri arasındaki fark nedir, hangi kıraat imamları hangisini okur ve bu neden abdestte ayaklar konusunda Sünniler ile Şiiler arasındaki tartışmaya girer?"}, {"label": "3:146", "text": "3:146'daki 'kâtele' ve 'kutile' kıraatleri nedir ve aralarında nasıl bir anlam farkı var?"}, {"label": "İbn Mesud", "text": "Buhari 4977'ye ve Müsned-i Ahmed'e göre İbn Mesud 113 ve 114. sureleri kendi mushafına yazıyor muydu?"}, {"label": "Ayetler", "text": "Müslim 1452 ve Buhari 6829'a göre Aişe ve Ömer hangi ayetlerin indirildiğini söyledi ve bu ayetler bugünkü Kur'an'da var mı?"}, {"label": "Nesh", "text": "Muhammed'in vefatından sonra bir ayet nesh edilebilir mi? Alimler, emzirme ayetinin Muhammed vefat ettiğinde hâlâ okunduğunu (Müslim 1452) nasıl açıklıyor?"}, {"label": "Osman", "text": "Buhari 4987'ye göre Osman, Kur'an'ın diğer nüshaları için ne emretti?"}]}}, {"k": "part", "n": 320, "id": "part-8", "pt": "*PARTE 8: \"MAS MUHAMMAD APROVOU AS LEITURAS\"*", "tr": "*8. BÖLÜM: \"AMA MUHAMMED KIRAATLERİ ONAYLADI\"*", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras”", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı”"}, "newPoint": false, "lab": {"pt": ["PARTE 8", "“Muhammad aprovou as leituras”"], "tr": ["8. BÖLÜM", "“Muhammed kıraatleri onayladı”"]}}, {"k": "para", "n": 321, "id": "p321", "pt": "Fatih Bey, agora respondo o que o senhor mesmo me disse, e não mais o vídeo. O senhor aceitou que o Alcorão tem leituras diferentes, e que algumas mudam o sentido da lei. Mas disse três coisas: que Muhammad aprovou essas leituras, que ele falava \"Alcorão\" no singular, e que Jesus não aprovou os Evangelhos. Vamos ver cada uma.", "tr": "Fatih Bey, şimdi artık videoya değil, sizin bana söylediklerinize cevap veriyorum. Kur'an'ın farklı kıraatleri olduğunu ve bazılarının hükmün anlamını değiştirdiğini kabul ettiniz. Ama üç şey söylediniz: Muhammed'in bu kıraatleri onayladığını, tekil olarak \"Kur'an\" dediğini ve İsa'nın İncilleri onaylamadığını. Şimdi her birine bakalım.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras”", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı”"}, "newPoint": false}, {"k": "para", "n": 322, "id": "p322", "pt": "❌ *O que o senhor me disse:* Muhammad aprovou as diferentes leituras, por isso o Alcorão continua sendo um só.", "tr": "❌ *Bana söylediğiniz:* Muhammed farklı kıraatleri onayladı, bu yüzden Kur'an hâlâ tektir.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "newPoint": true}, {"k": "para", "n": 323, "id": "p323", "pt": "✅ *Hafs e Warsh nem existiam no tempo de Muhammad.*\nAs leituras de hoje têm o nome de homens que viveram muito depois dele. Hafs morreu por volta do ano 796, e Warsh por volta de 812, mais de 160 anos depois de Muhammad. E quem escolheu quais seriam as \"sete leituras oficiais\" foi Ibn Mujahid, que morreu no ano 936, uns 300 anos depois de Muhammad. A lista de dez leituras só foi fechada por Ibn al-Jazari, que morreu em 1429, uns 800 anos depois. Então Muhammad não poderia ter aprovado \"Hafs\" e \"Warsh\". Quem escolheu essas leituras foram homens, séculos depois.", "tr": "✅ *Hafs ve Varş, Muhammed'in zamanında daha yoktu bile.*\nBugünkü kıraatler, ondan çok sonra yaşamış insanların adını taşır. Hafs yaklaşık 796 yılında, Varş ise yaklaşık 812 yılında, yani Muhammed'den 160 yıldan fazla sonra öldü. \"Yedi resmî kıraatin\" hangileri olacağını seçen kişi de, Muhammed'den yaklaşık 300 yıl sonra, 936 yılında ölen İbn Mücahid'dir. On kıraat listesi ise ancak 1429'da, yani yaklaşık 800 yıl sonra ölen İbnü'l-Cezerî tarafından kesinleştirildi. Yani Muhammed \"Hafs\"ı ve \"Varş\"ı onaylamış olamaz. Bu kıraatleri yüzyıllar sonra insanlar seçti.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "newPoint": false}, {"k": "para", "n": 324, "id": "p324", "pt": "✅ *Os \"sete ahruf\" não provam que as leituras de hoje foram aprovadas.*\nO hadith conta que Umar ouviu Hisham recitar a surata al-Furqan de um jeito diferente do que ele tinha aprendido, quase brigou com ele e o levou até Muhammad. Muhammad aprovou os dois jeitos e disse que o Alcorão foi revelado em \"sete ahruf\" (Bukhari 4992). Mas veja os problemas:\n• *Ninguém sabe o que são os \"sete ahruf\".* Os próprios sábios muçulmanos dão dezenas de explicações diferentes: uns dizem que são sete dialetos árabes, outros que são sete tipos de palavras, outros que \"sete\" quer dizer apenas \"muitos\". Se nem os sábios do Islã sabem o que Muhammad aprovou, ninguém pode dizer que ele aprovou as leituras de hoje.\n• *As leituras de hoje não são os sete ahruf.* As sete leituras oficiais foram escolhidas por Ibn Mujahid uns 300 anos depois de Muhammad, e muitos sábios muçulmanos avisam que é um erro confundir essas sete leituras com os sete ahruf do hadith. O número sete é só uma coincidência.\n• *O hadith mostra o problema, não a solução.* Dois companheiros de Muhammad recitavam a mesma surata de jeitos diferentes, a ponto de quase brigarem. Isso não mostra um texto único e perfeito: mostra que, já no tempo de Muhammad, o Alcorão era recitado de formas diferentes, e que essas diferenças causavam briga. E foi exatamente por causa dessas diferenças que, poucos anos depois, Uthman queimou as outras cópias.", "tr": "✅ *\"Yedi harf\", bugünkü kıraatlerin onaylandığını kanıtlamaz.*\nHadis, Ömer'in Hişam'ın Furkan suresini kendisinin öğrendiğinden farklı okuduğunu duyduğunu, onunla neredeyse kavga ettiğini ve onu Muhammed'e götürdüğünü anlatır. Muhammed iki okuyuşu da onayladı ve Kur'an'ın \"yedi harf\" üzere indirildiğini söyledi (Buhari 4992). Ama sorunlara bakın:\n• *\"Yedi harf\"in ne olduğunu kimse bilmiyor.* Müslüman alimlerin kendileri onlarca farklı açıklama yapar: Kimisi yedi Arap lehçesi olduğunu, kimisi yedi kelime türü o
