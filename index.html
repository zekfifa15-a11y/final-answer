lduğunu, kimisi de \"yedi\"nin sadece \"çok\" anlamına geldiğini söyler. İslam alimleri bile Muhammed'in neyi onayladığını bilmiyorsa, kimse onun bugünkü kıraatleri onayladığını söyleyemez.\n• *Bugünkü kıraatler yedi harf değildir.* Yedi resmi kıraat, Muhammed'den yaklaşık 300 yıl sonra İbn Mücahid tarafından seçildi ve birçok Müslüman alim, bu yedi kıraati hadisteki yedi harfle karıştırmanın bir hata olduğu konusunda uyarır. Yedi sayısı sadece bir tesadüftür.\n• *Hadis çözümü değil, sorunu gösteriyor.* Muhammed'in iki sahabesi aynı sureyi, neredeyse kavga edecek kadar farklı okuyordu. Bu, tek ve kusursuz bir metin göstermez: Daha Muhammed'in zamanında Kur'an'ın farklı şekillerde okunduğunu ve bu farkların kavgaya yol açtığını gösterir. Ve tam da bu farklar yüzünden, birkaç yıl sonra Osman diğer nüshaları yaktı.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "newPoint": false}, {"k": "para", "n": 325, "id": "p325", "pt": "✅ *Se Muhammad aprovou tudo, por que Uthman queimou as outras cópias?*\nO próprio Bukhari conta que Hudhayfa viu os muçulmanos da Síria e do Iraque discordando sobre a recitação, e disse a Uthman: \"salve esta comunidade antes que ela discorde sobre o Livro como os judeus e os cristãos\". Então Uthman mandou fazer cópias no dialeto dos Coraixitas e mandou queimar todas as outras (Bukhari 4987). Se essas diferenças tinham sido aprovadas por Muhammad, *Uthman queimou o que Muhammad aprovou*.", "tr": "✅ *Muhammed her şeyi onayladıysa, Osman diğer nüshaları neden yaktı?*\nBuhari'nin kendisi anlatır: Huzeyfe, Suriye ve Irak Müslümanlarının kıraat konusunda anlaşmazlığa düştüğünü gördü ve Osman'a şöyle dedi: \"Bu ümmeti, Yahudiler ve Hristiyanlar gibi Kitap hakkında ihtilafa düşmeden önce kurtar.\" Bunun üzerine Osman, Kureyş lehçesiyle nüshalar yazdırdı ve diğer bütün nüshaların yakılmasını emretti (Buhari 4987). Bu farklar Muhammed tarafından onaylanmışsa, *Osman Muhammed'in onayladığı şeyi yaktı*.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "newPoint": false}, {"k": "para", "n": 326, "id": "p326", "pt": "E al-Tabari, um dos maiores sábios do Islã, dizia que o mushaf de Uthman guarda só um dos sete ahruf, e que os outros seis foram deixados de lado. Repare no problema: pela opinião de um dos maiores sábios do Islã, *seis das sete formas que Allah revelou se perderam*.", "tr": "İslam'ın en büyük alimlerinden biri olan Taberî de, Osman'ın mushafının yedi harften sadece birini koruduğunu, diğer altısının ise bırakıldığını söylüyordu. Soruna dikkat edin: İslam'ın en büyük alimlerinden birinin görüşüne göre, *Allah'ın indirdiği yedi şeklin altısı kayboldu*.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "newPoint": false}, {"k": "para", "n": 327, "id": "p327", "pt": "✅ *Muhammad mandou aprender o Alcorão com Ibn Mas'ud.*\nMuhammad disse: \"Aprendam o Alcorão com quatro: Abdullah ibn Mas'ud, Salim, Mu'adh e Ubayy ibn Ka'b\" (Bukhari 4999). E Ibn Mas'ud, o primeiro da lista, não escrevia as duas últimas suratas (113 e 114) no seu mushaf (Bukhari 4977; Musnad Ahmad 21186). Ou seja, o homem que Muhammad mandou seguir não tinha o mesmo Alcorão que vocês têm hoje.", "tr": "✅ *Muhammed, Kur'an'ın İbn Mesud'dan öğrenilmesini emretti.*\nMuhammed şöyle dedi: \"Kur'an'ı dört kişiden öğrenin: Abdullah ibn Mesud, Salim, Muaz ve Übey ibn Ka'b\" (Buhari 4999). Listenin ilk sırasındaki İbn Mesud ise son iki sureyi (113 ve 114) kendi mushafına yazmazdı (Buhari 4977; Müsned-i Ahmed 21186). Yani Muhammed'in uyulmasını emrettiği kişinin Kur'an'ı, bugün sizin elinizdeki Kur'an'la aynı değildi.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "newPoint": false}, {"k": "para", "n": 328, "id": "p328", "pt": "✅ *E os versículos que sumiram, quem aprovou?*\nAisha disse que o versículo das cinco amamentações, que tinha substituído o das dez, ainda era recitado quando Muhammad morreu (Muslim 1452). Umar disse que o versículo do apedrejamento foi revelado e recitado (Bukhari 6829). Nenhum dos dois está no Alcorão de hoje. Muhammad não pode ter aprovado essa retirada, porque esses versículos ainda eram recitados quando ele morreu.", "tr": "✅ *Kaybolan ayetleri kim onayladı?*\nAişe, on emzirme ayetinin yerine gelen beş emzirme ayetinin Muhammed vefat ettiğinde hâlâ okunduğunu söyledi (Müslim 1452). Ömer de recm ayetinin indirildiğini ve okunduğunu söyledi (Buhari 6829). İkisi de bugünkü Kur'an'da yok. Muhammed bunların çıkarılmasını onaylamış olamaz, çünkü o vefat ettiğinde bu ayetler hâlâ okunuyordu.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "newPoint": false}, {"k": "para", "n": 329, "id": "p329", "pt": "✅ *Aprovar duas leis diferentes não faz delas uma só.*\nEm 5:6, uma leitura manda lavar os pés no abdest, e outra aponta para só passar a mão molhada. Se Muhammad aprovou as duas, então Allah deu duas leis diferentes no mesmo versículo. Por isso os sunitas lavam os pés e os xiitas passam a mão, e os dois usam o mesmo versículo. Dizer \"foi aprovado\" não resolve o problema. Só confirma que o texto muda o sentido da lei.", "tr": "✅ *İki farklı hükmü onaylamak, onları tek bir hüküm yapmaz.*\n5:6'da bir kıraat abdestte ayakların yıkanmasını emreder, diğeri ise sadece mesh etmeye işaret eder. Muhammed ikisini de onayladıysa, Allah aynı ayette iki farklı hüküm vermiş olur. Bu yüzden Sünniler ayaklarını yıkar, Şiiler mesh eder ve ikisi de aynı ayete dayanır. \"Onaylandı\" demek sorunu çözmüyor. Sadece metnin hükmün anlamını değiştirdiğini doğruluyor.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "newPoint": false}, {"k": "research", "n": 330, "id": "p330", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Leitores", "text": "Quando viveram Hafs, Warsh, Ibn Mujahid e Ibn al-Jazari, e quem escolheu as sete leituras oficiais do Alcorão?"}, {"label": "Sete ahruf", "text": "O que conta o hadith de Bukhari 4992 sobre Umar e Hisham, e os sábios muçulmanos concordam sobre o que significam os 'sete ahruf'?"}, {"label": "Leituras e ahruf", "text": "As sete leituras escolhidas por Ibn Mujahid são os mesmos sete ahruf do hadith, segundo os sábios muçulmanos?"}, {"label": "Uthman", "text": "Segundo Bukhari 4987, por que Uthman fez um único mushaf, em que dialeto, e o que mandou fazer com as outras cópias?"}, {"label": "al-Tabari", "text": "Qual era a opinião de al-Tabari sobre quantos dos sete ahruf ficaram no mushaf de Uthman?"}, {"label": "Ibn Mas'ud", "text": "Segundo Bukhari 4999, com quem Muhammad mandou aprender o Alcorão, e quem é o primeiro nome da lista?"}, {"label": "Versículos", "text": "Segundo Muslim 1452, o versículo das amamentações ainda era recitado quando Muhammad morreu?"}, {"label": "5:6", "text": "Por que os sunitas lavam os pés e os xiitas passam a mão no abdest, se os dois usam o versículo 5:6?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Kıraat imamları", "text": "Hafs, Varş, İbn Mücahid ve İbnü'l-Cezerî ne zaman yaşadı ve Kur'an'ın yedi resmî kıraatini kim seçti?"}, {"label": "Yedi harf", "text": "Buhari 4992'deki Ömer ile Hişam hadisi ne anlatıyor ve Müslüman alimler 'yedi harf'in ne anlama geldiği konusunda hemfikir mi?"}, {"label": "Kıraatler ve harfler", "text": "Müslüman alimlere göre İbn Mücahid'in seçtiği yedi kıraat, hadisteki yedi harfle aynı şey mi?"}, {"label": "Osman", "text": "Buhari 4987'ye göre Osman neden tek bir mushaf yazdırdı, hangi lehçeyle yazdırdı ve diğer nüshalar için ne emretti?"}, {"label": "Taberî", "text": "Taberî'nin, yedi harften kaçının Osman mushafında kaldığı konusundaki görüşü neydi?"}, {"label": "İbn Mesud", "text": "Buhari 4999'a göre Muhammed Kur'an'ın kimden öğrenilmesini emretti ve listenin ilk ismi kim?"}, {"label": "Ayetler", "text": "Müslim 1452'ye göre emzirme ayeti, Muhammed vefat ettiğinde hâlâ okunuyor muydu?"}, {"label": "5:6", "text": "Sünniler de Şiiler de 5:6. ayete dayanıyorsa, neden Sünniler abdestte ayaklarını yıkıyor, Şiiler ise mesh ediyor?"}]}}, {"k": "trans", "n": 334, "id": "p334", "pt": "Agora vamos para a segunda coisa que o senhor me disse.", "tr": "Şimdi bana söylediğiniz ikinci şeye geçelim.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Muhammad aprovou as leituras?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Muhammed kıraatleri onayladı mı?"}, "newPoint": false}, {"k": "para", "n": 335, "id": "p335", "pt": "❌ *O que o senhor me disse:* Muhammad falava \"Alcorão\", no singular, e não \"Alcorões\", por isso é um só.", "tr": "❌ *Bana söylediğiniz:* Muhammed \"Kur'anlar\" değil, tekil olarak \"Kur'an\" diyordu, bu yüzden Kur'an tektir.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › “Alcorão” no singular", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Tekil “Kur'an”"}, "newPoint": true}, {"k": "para", "n": 336, "id": "p336", "pt": "✅ *Jesus também falava \"o Evangelho\", no singular.*\nJesus disse: \"arrependam-se e creiam no Evangelho\" (Marcos 1:15), e \"onde quer que este Evangelho for pregado, no mundo inteiro\" (Marcos 14:9). E Paulo escreveu que não existe outro Evangelho (Gálatas 1:6-8). É exatamente por isso que se diz \"o Evangelho segundo Mateus, segundo Marcos, segundo Lucas e segundo João\": um só Evangelho, contado por quatro testemunhas. E o próprio Alcorão fala do \"Injil\", no singular, mesmo que no tempo de Muhammad os cristãos já tivessem os quatro Evangelhos havia séculos.", "tr": "✅ *İsa da tekil olarak \"İncil\" diyordu.*\nİsa şöyle dedi: \"Tövbe edin, Müjde'ye inanın\" (Markos 1:15) ve \"Bütün dünyada bu Müjde nerede duyurulursa\" (Markos 14:9). Pavlus da başka bir Müjde olmadığını yazdı (Galatyalılar 1:6-8). İşte tam da bu yüzden \"Matta'ya göre, Markos'a göre, Luka'ya göre ve Yuhanna'ya göre İncil\" denir: Dört tanığın anlattığı tek bir İncil. Kur'an'ın kendisi de, Muhammed'in zamanında Hristiyanların elinde yüzyıllardır dört İncil olduğu halde, tekil olarak \"İncil\"den bahseder.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › “Alcorão” no singular", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Tekil “Kur'an”"}, "newPoint": false}, {"k": "para", "n": 337, "id": "p337", "pt": "✅ *E quatro testemunhas valem mais do que uma.*\nNum tribunal, quatro testemunhas que concordam no essencial são uma prova forte. Os Evangelhos são isso: quatro relatos da mesma vida, escritos por apóstolos e por quem ouviu os apóstolos. Tudo o que o Alcorão diz sobre Jesus vem de um homem só, Muhammad, que nasceu mais de 500 anos depois de Jesus.", "tr": "✅ *Dört tanık, bir tanıktan daha değerlidir.*\nBir mahkemede, temel noktalarda birbirini doğrulayan dört tanık güçlü bir delildir. İnciller de budur: Elçiler ve elçileri dinleyenler tarafından yazılmış, aynı hayatın dört anlatımı. Kur'an'ın İsa hakkında söylediği her şey ise tek bir kişiden, İsa'dan 500 yıldan fazla sonra doğan Muhammed'den geliyor.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › “Alcorão” no singular", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Tekil “Kur'an”"}, "newPoint": false}, {"k": "research", "n": 338, "id": "p338", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › “Alcorão” no singular", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Tekil “Kur'an”"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Singular", "text": "Em Marcos 1:15 e Marcos 14:9, Jesus fala do 'Evangelho' no singular?"}, {"label": "Gálatas", "text": "O que Paulo diz em Gálatas 1:6-8 sobre existir outro evangelho?"}, {"label": "Segundo", "text": "Por que os títulos dizem 'Evangelho segundo Mateus', 'segundo Marcos', e o que Irineu quis dizer com 'Evangelho quádruplo'?"}, {"label": "Alcorão", "text": "No tempo de Muhammad, quais Evangelhos os cristãos usavam? Eram os mesmos quatro de hoje? E o Alcorão chama o livro dos cristãos de 'Injil', no singular?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Tekil", "text": "Markos 1:15 ve Markos 14:9'da İsa tekil olarak 'Müjde'den mi bahsediyor?"}, {"label": "Galatyalılar", "text": "Pavlus, Galatyalılar 1:6-8'de başka bir müjde olup olmadığı hakkında ne diyor?"}, {"label": "Göre", "text": "Başlıklar neden 'Matta'ya göre İncil', 'Markos'a göre İncil' diyor ve İreneus 'dört biçimli İncil' derken ne kastediyordu?"}, {"label": "Kur'an", "text": "Muhammed'in zamanında Hristiyanlar hangi İncilleri kullanıyordu, bugünkü dört İncil'in aynısı mıydı? Kur'an Hristiyanların kitabına tekil olarak 'İncil' mi diyor?"}]}}, {"k": "trans", "n": 342, "id": "p342", "pt": "E agora a terceira coisa que o senhor me disse.", "tr": "Ve şimdi bana söylediğiniz üçüncü şey.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › “Alcorão” no singular", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › Tekil “Kur'an”"}, "newPoint": false}, {"k": "para", "n": 343, "id": "p343", "pt": "❌ *O que o senhor me disse:* Jesus não aprovou os Evangelhos, mas Muhammad aprovou as diferenças.", "tr": "❌ *Bana söylediğiniz:* İsa İncilleri onaylamadı, ama Muhammed farkları onayladı.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": true}, {"k": "para", "n": 344, "id": "p344", "pt": "✅ *Muhammad nunca aprovou o Alcorão como livro.*\nO próprio Bukhari conta que, depois que muitos recitadores morreram na batalha de Yamama, Umar pediu a Abu Bakr para juntar o Alcorão. Abu Bakr respondeu: \"Como vou fazer algo que o Mensageiro de Allah não fez?\" E Zayd ibn Thabit, encarregado de juntar, disse que seria mais fácil mover uma montanha. Ele juntou o Alcorão de pedaços de folhas de palmeira, de pedras e da memória dos homens, e os últimos versículos da surata at-Tawba ele só encontrou com um homem, Abu Khuzayma al-Ansari (Bukhari 4986).", "tr": "✅ *Muhammed, Kur'an'ı bir kitap olarak hiçbir zaman onaylamadı.*\nBuhari'nin kendisi anlatır: Yemame savaşında birçok kurra şehit düştükten sonra Ömer, Ebu Bekir'den Kur'an'ı toplamasını istedi. Ebu Bekir şöyle cevap verdi: \"Allah'ın Resulü'nün yapmadığı bir şeyi nasıl yaparım?\" Toplamakla görevlendirilen Zeyd ibn Sabit de bir dağı yerinden oynatmanın daha kolay olacağını söyledi. Kur'an'ı hurma dallarından, taşlardan ve insanların hafızalarından topladı; Tevbe suresinin son ayetlerini ise sadece bir kişide, Ebu Huzeyme el-Ensarî'de buldu (Buhari 4986).", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "para", "n": 345, "id": "p345", "pt": "Ou seja, Muhammad morreu sem que o Alcorão fosse um livro. E o mushaf de Uthman, que vocês leem hoje, foi feito uns 20 anos depois da morte dele. *Muhammad nunca viu esse livro, nem o aprovou.*", "tr": "Yani Muhammed, Kur'an bir kitap haline gelmeden vefat etti. Bugün okuduğunuz Osman mushafı da onun vefatından yaklaşık 20 yıl sonra yazıldı. *Muhammed bu kitabı hiç görmedi ve onaylamadı.*", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "para", "n": 346, "id": "p346", "pt": "✅ *Jesus aprovou antes, por meio dos apóstolos.*\nJesus escolheu doze discípulos \"para que estivessem com ele e para enviá-los a pregar\". Disse a eles: \"Quem recebe vocês, recebe a mim\" (Mateus 10:40), e \"Assim como o Pai me enviou, eu também envio vocês\". E prometeu: \"o Espírito Santo ensinará a vocês todas as coisas e fará vocês lembrarem de tudo o que eu disse\" (João 14:26), e \"ele guiará vocês a toda a verdade\". Jesus deu aos apóstolos a autoridade de ensinar em nome dele, e os Evangelhos vêm justamente deles: Mateus e João eram apóstolos, Marcos escreveu o que Pedro pregava, e Lucas escreveu a partir das testemunhas oculares.", "tr": "✅ *İsa ise önceden, elçileri aracılığıyla onayladı.*\nİsa on iki öğrencisini \"yanında bulunsunlar ve onları müjdeyi duyurmaya göndersin diye\" seçti. Onlara şöyle dedi: \"Sizi kabul eden beni kabul etmiş olur\" (Matta 10:40) ve \"Baba beni nasıl gönderdiyse, ben de sizi öyle gönderiyorum\". Şunu da vaat etti: \"Kutsal Ruh size her şeyi öğretecek, size söylediğim her şeyi hatırlatacak\" (Yuhanna 14:26) ve \"O sizi bütün gerçeğe yöneltecek\". İsa elçilere kendi adına öğretme yetkisi verdi ve İnciller de tam olarak onlardan gelir: Matta ve Yuhanna elçiydi, Markos Petrus'un vaazlarını yazdı, Luka da görgü tanıklarından yola çıkarak yazdı.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "para", "n": 347, "id": "p347", "pt": "O senhor pode dizer: \"Mas quem garante que Jesus disse isso, e que não foi inventado ou alterado depois?\"", "tr": "Şöyle diyebilirsiniz: \"Ama İsa'nın bunu söylediğini, sonradan uydurulmadığını ya da değiştirilmediğini kim garanti ediyor?\"", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "para", "n": 348, "id": "p348", "pt": "✅ *Essa pergunta derruba o Islã, não os Evangelhos.*\nQuem garante que Muhammad disse que o Alcorão foi revelado em sete ahruf, ou que aprovou as leituras? Só os hadith, e Bukhari morreu no ano 870, mais de 230 anos depois de Muhammad. As palavras de Jesus foram escritas poucas décadas depois dele, por quem andou com ele ou ouviu de quem andou, enquanto ainda havia testemunhas vivas. Duvidar de Lucas e aceitar o Bukhari é usar dois pesos e duas medidas: Lucas está muito mais perto dos fatos. E as palavras de Jesus aos apóstolos têm garantia, como mostro agora.", "tr": "✅ *Bu soru İncilleri değil, İslam'ı yıkar.*\nMuhammed'in Kur'an'ın yedi harf üzere indirildiğini söylediğini ya da kıraatleri onayladığını kim garanti ediyor? Sadece hadisler; Buhari ise Muhammed'den 230 yıldan fazla sonra, 870 yılında öldü. İsa'nın sözleri ise O'ndan birkaç on yıl sonra, O'nunla birlikte dolaşmış ya da O'nunla dolaşanlardan duymuş kişiler tarafından, tanıklar hâlâ hayattayken yazıldı. Luka'dan şüphe edip Buhari'yi kabul etmek çifte standarttır: Luka olaylara çok daha yakındır. Ve İsa'nın elçilere söylediği sözlerin güvencesi var, şimdi bunu gösteriyorum.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "para", "n": 349, "id": "p349", "pt": "✅ *Não é um versículo só: são várias fontes diferentes.*\nQue Jesus escolheu doze apóstolos e os enviou para ensinar em nome dele está em Marcos, Mateus, Lucas e João, e também nas cartas de Paulo, escritas uns 20 a 25 anos depois de Jesus, onde ele fala dos \"Doze\" e conta que esteve com Pedro. Até Bart Ehrman, o crítico que esses canais adoram citar, aceita que Jesus teve um grupo de doze discípulos. Fontes diferentes, escritas em lugares diferentes, dizendo a mesma coisa: é assim que os historiadores sabem que algo aconteceu de verdade.", "tr": "✅ *Bu tek bir ayet değil: birçok farklı kaynak var.*\nİsa'nın on iki elçi seçtiğini ve onları kendi adına öğretmeye gönderdiğini Markos, Matta, Luka ve Yuhanna anlatır; İsa'dan yaklaşık 20 ile 25 yıl sonra yazılan Pavlus'un mektupları da \"Onikiler\"den bahseder ve Pavlus'un Petrus'la birlikte kaldığını anlatır. Bu kanalların alıntı yapmaya bayıldığı eleştirmen Bart Ehrman bile İsa'nın on iki öğrenciden oluşan bir grubu olduğunu kabul eder. Farklı yerlerde yazılmış farklı kaynakların aynı şeyi söylemesi: Tarihçiler bir şeyin gerçekten olduğunu böyle bilir.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "para", "n": 350, "id": "p350", "pt": "✅ *E os apóstolos morreram pelo que ensinavam.*\nClemente de Roma, por volta do ano 96, conta que Pedro e Paulo sofreram e morreram por causa do seu testemunho. E Tácito, um historiador romano que desprezava os cristãos, conta que Nero mandou matar uma grande multidão de cristãos em Roma. Pense: uma pessoa pode morrer por uma mentira que ela acha que é verdade. Mas ninguém aceita morrer por uma mentira que ele mesmo inventou. Os apóstolos estavam lá e viram tudo. Se tivessem inventado o que Jesus disse, saberiam que era mentira, e *ninguém entrega a vida por algo que sabe que é mentira*.", "tr": "✅ *Elçiler öğrettikleri şey uğruna öldü.*\nRomalı Klemens, yaklaşık 96 yılında, Petrus'un ve Pavlus'un tanıklıkları yüzünden acı çektiğini ve öldüğünü anlatır. Hristiyanları hor gören Romalı tarihçi Tacitus da Neron'un Roma'da çok büyük bir Hristiyan kalabalığını öldürttüğünü anlatır. Düşünün: Bir insan, doğru olduğunu sandığı bir yalan uğruna ölebilir. Ama kimse kendi uydurduğu bir yalan uğruna ölmeyi kabul etmez. Elçiler oradaydı ve her şeyi gördüler. İsa'nın söylediklerini uydurmuş olsalardı, bunun yalan olduğunu bilirlerdi ve *kimse yalan olduğunu bildiği bir şey için canını vermez*.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "para", "n": 351, "id": "p351", "pt": "✅ *E esses versículos não estão entre os acrescentados.*\nQuando algo foi acrescentado na Bíblia, como a história da mulher adúltera, os manuscritos mostram e as próprias Bíblias avisam. Nenhum desses versículos está entre os trechos que os estudiosos marcam como acrescentados.", "tr": "✅ *Bu ayetler sonradan eklenenler arasında da değil.*\nKutsal Kitap'a bir şey eklendiğinde, zina eden kadının hikâyesinde olduğu gibi, el yazmaları bunu gösterir ve Kutsal Kitapların kendisi de bunu belirtir. Bu ayetlerin hiçbiri, araştırmacıların sonradan eklenmiş olarak işaretlediği bölümler arasında değildir.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "para", "n": 352, "id": "p352", "pt": "✅ *O próprio Alcorão diz que os discípulos de Jesus eram fiéis.*\nComo vocês acreditam, Allah diz: \"Inspirei os discípulos: creiam em Mim e no Meu mensageiro\" (5:111). Os discípulos dizem: \"Nós somos os ajudantes de Allah\" (3:52 e 61:14). E em 61:14 Allah diz que fortaleceu os que creram contra os seus inimigos, \"e eles venceram\". Então, pelo Alcorão, os discípulos de Jesus não eram mentirosos que inventaram coisas: eram homens fiéis, inspirados por Allah. E os Evangelhos vêm justamente desses discípulos e dos seus companheiros. Se o senhor diz que eles inventaram, está contradizendo o próprio Alcorão.", "tr": "✅ *Kur'an'ın kendisi de İsa'nın havarilerinin sadık olduğunu söylüyor.*\nSizin inandığınıza göre Allah şöyle der: \"Havarilere, 'Bana ve elçime iman edin' diye vahyetmiştim\" (5:111). Havariler de \"Biz Allah'ın yardımcılarıyız\" der (3:52 ve 61:14). 61:14'te Allah, iman edenleri düşmanlarına karşı desteklediğini \"ve onların üstün geldiğini\" söyler. O halde Kur'an'a göre İsa'nın havarileri bir şeyler uyduran yalancılar değildi: Allah'ın kendilerine vahyettiği sadık insanlardı. İnciller de tam olarak bu havarilerden ve onların arkadaşlarından gelir. Onların uydurduğunu söylerseniz, Kur'an'ın kendisiyle çelişmiş olursunuz.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "para", "n": 353, "id": "p353", "pt": "✅ *E pelo Alcorão, Allah aprovou o Evangelho que os cristãos tinham.*\nComo já provei na Parte 4, o Alcorão fala do Evangelho que os cristãos tinham nas mãos no tempo de Muhammad. Como vocês acreditam, Allah diz: \"Que os seguidores do Evangelho julguem pelo que Allah revelou nele\" (5:47). E diz a Muhammad: \"Se estás em dúvida sobre o que te revelamos, pergunta aos que leem o Livro antes de ti\" (10:94). E o Evangelho que os cristãos tinham no tempo de Muhammad eram os mesmos quatro Evangelhos de hoje: o Códice Sinaítico e o Códice Vaticano, do século 4, uns 300 anos antes de Muhammad, trazem os mesmos quatro. Então, pela fé de vocês, quem aprovou os Evangelhos não foi um homem. Foi o próprio Allah.", "tr": "✅ *Kur'an'a göre de Allah, Hristiyanların elindeki İncil'i onayladı.*\n4. bölümde kanıtladığım gibi, Kur'an Muhammed'in zamanında Hristiyanların elinde olan İncil'den bahseder. Sizin inandığınıza göre Allah şöyle der: \"İncil ehli, Allah'ın onda indirdiği ile hükmetsin\" (5:47). Muhammed'e de şöyle der: \"Sana indirdiğimizden şüphe içindeysen, senden önce Kitab'ı okuyanlara sor\" (10:94). Muhammed'in zamanında Hristiyanların elindeki İncil de bugünkü dört İncil'in aynısıydı: Muhammed'den yaklaşık 300 yıl önce, 4. yüzyılda yazılmış Sina Kodeksi ve Vatikan Kodeksi aynı dört İncil'i içerir. O halde sizin inancınıza göre İncilleri onaylayan bir insan değil, Allah'ın kendisidir.", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "newPoint": false}, {"k": "research", "n": 354, "id": "p354", "where": {"pt": "Parte 8: “Muhammad aprovou as leituras” › Jesus não aprovou os Evangelhos?", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı” › İsa İncilleri onaylamadı mı?"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Bukhari 4986", "text": "Segundo Bukhari 4986, o que Abu Bakr disse quando Umar pediu para juntar o Alcorão num livro, e de onde Zayd ibn Thabit juntou os versículos?"}, {"label": "Mushaf", "text": "Quantos anos depois da morte de Muhammad foi feito o mushaf de Uthman?"}, {"label": "Apóstolos", "text": "O que dizem Marcos 3:14, Mateus 10:40, João 20:21, João 14:26 e João 16:13 sobre os apóstolos?"}, {"label": "Bukhari", "text": "Em que ano morreu Bukhari, e quantos anos depois de Muhammad isso foi?"}, {"label": "Os Doze", "text": "Os historiadores, incluindo céticos como Bart Ehrman, aceitam que Jesus teve um grupo de doze discípulos? O que diz 1 Coríntios 15:5?"}, {"label": "Mártires", "text": "O que diz 1 Clemente 5, escrito por volta do ano 96, sobre Pedro e Paulo? E o que Tácito, nos Anais 15.44, conta sobre Nero e os cristãos?"}, {"label": "Acréscimos", "text": "Mateus 10:40 e João 14:26 estão entre os trechos que os estudiosos consideram acrescentados depois nos manuscritos?"}, {"label": "Discípulos", "text": "O que dizem os versículos 5:111, 3:52 e 61:14 do Alcorão sobre os discípulos de Jesus?"}, {"label": "5:47 e 10:94", "text": "Segundo o Alcorão 5:47 e 10:94, os cristãos deviam julgar pelo Evangelho, e Muhammad devia perguntar aos que liam o Livro antes dele?"}, {"label": "Códices", "text": "O Códice Sinaítico e o Códice Vaticano, do século 4, trazem os mesmos quatro Evangelhos de hoje?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Buhari 4986", "text": "Buhari 4986'ya göre Ömer, Kur'an'ın bir kitapta toplanmasını istediğinde Ebu Bekir ne dedi ve Zeyd ibn Sabit ayetleri nereden topladı?"}, {"label": "Mushaf", "text": "Osman mushafı, Muhammed'in vefatından kaç yıl sonra yazıldı?"}, {"label": "Elçiler", "text": "Markos 3:14, Matta 10:40, Yuhanna 20:21, Yuhanna 14:26 ve Yuhanna 16:13 elçiler hakkında ne diyor?"}, {"label": "Buhari", "text": "Buhari hangi yılda öldü ve bu, Muhammed'den kaç yıl sonraydı?"}, {"label": "Onikiler", "text": "Bart Ehrman gibi şüpheciler de dahil, tarihçiler İsa'nın on iki öğrenciden oluşan bir grubu olduğunu kabul ediyor mu? 1 Korintliler 15:5 ne diyor?"}, {"label": "Şehitler", "text": "Yaklaşık 96 yılında yazılan 1 Klemens 5, Petrus ve Pavlus hakkında ne diyor? Tacitus, Yıllıklar 15.44'te Neron ve Hristiyanlar hakkında ne anlatıyor?"}, {"label": "Eklemeler", "text": "Matta 10:40 ve Yuhanna 14:26, araştırmacıların el yazmalarına sonradan eklendiğini düşündüğü bölümler arasında mı?"}, {"label": "Havariler", "text": "Kur'an'ın 5:111, 3:52 ve 61:14. ayetleri İsa'nın havarileri hakkında ne diyor?"}, {"label": "5:47 ve 10:94", "text": "Kur'an 5:47 ve 10:94'e göre Hristiyanlar İncil ile hükmetmeli miydi ve Muhammed kendisinden önce Kitab'ı okuyanlara sormalı mıydı?"}, {"label": "Kodeksler", "text": "4. yüzyıla ait Sina Kodeksi ve Vatikan Kodeksi, bugünkü dört İncil'in aynısını içeriyor mu?"}]}}, {"k": "part", "n": 358, "id": "part-c", "pt": "*CONCLUSÃO: AS REGRAS DO PRÓPRIO VÍDEO*", "tr": "*SONUÇ: VİDEONUN KENDİ KURALLARI*", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false, "lab": {"pt": ["", "Conclusão"], "tr": ["", "Sonuç"]}}, {"k": "para", "n": 359, "id": "p359", "pt": "Fatih Bey, agora repare no que acontece quando usamos as próprias regras do vídeo:", "tr": "Fatih Bey, şimdi videonun kendi kurallarını kullandığımızda ne olduğuna dikkat edin:", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 360, "id": "p360", "pt": "❌ *O vídeo diz:* 40 anos depois de Jesus é tempo demais para confiar.\n✅ Então o Alcorão, que fala de Jesus 600 anos depois, sem nenhuma testemunha, não pode ser confiável.", "tr": "❌ *Video diyor ki:* İsa'dan 40 yıl sonrası güvenmek için çok uzun.\n✅ O halde İsa'dan 600 yıl sonra, hiçbir tanık olmadan O'ndan bahseden Kur'an güvenilir olamaz.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 361, "id": "p361", "pt": "❌ *O vídeo diz:* sem as palavras de Jesus na língua dele, não dá para confiar.\n✅ Então o Alcorão, que põe palavras na boca de Jesus em árabe, não pode ser confiável.", "tr": "❌ *Video diyor ki:* İsa'nın sözleri onun kendi dilinde olmadan güvenilemez.\n✅ O halde İsa'nın ağzına Arapça sözler koyan Kur'an güvenilir olamaz.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 362, "id": "p362", "pt": "❌ *O vídeo diz:* relatos passados de boca em boca não são confiáveis.\n✅ Então nenhum hadith é confiável, porque todos foram passados por correntes de pessoas, de geração em geração, por mais de 200 anos antes das grandes coleções.", "tr": "❌ *Video diyor ki:* Ağızdan ağıza aktarılan anlatımlar güvenilir değildir.\n✅ O halde hiçbir hadis güvenilir değildir, çünkü hepsi büyük koleksiyonlardan önce 200 yıldan fazla, kişiden kişiye zincirlerle kuşaktan kuşağa aktarıldı.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 363, "id": "p363", "pt": "❌ *O vídeo diz:* diferenças entre cópias provam corrupção.\n✅ Então o Alcorão, com suas leituras diferentes, versículos que não estão nele e cópias queimadas por Uthman, também estaria corrompido.", "tr": "❌ *Video diyor ki:* Kopyalar arasındaki farklar bozulmayı kanıtlar.\n✅ O halde farklı kıraatleri, içinde olmayan ayetleri ve Osman'ın yaktırdığı nüshalarıyla Kur'an da bozulmuş olurdu.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 364, "id": "p364", "pt": "❌ *O senhor diz:* os Evangelhos não valem, porque Jesus não os aprovou.\n✅ Mas Jesus deu autoridade aos apóstolos, e os Evangelhos vêm deles. Quem morreu antes de o livro existir foi Muhammad, que nunca viu o mushaf de Uthman. Pela regra do senhor, quem cai é o Alcorão.", "tr": "❌ *Siz diyorsunuz ki:* İnciller geçersizdir, çünkü İsa onları onaylamadı.\n✅ Ama İsa elçilere yetki verdi ve İnciller onlardan geliyor. Kitap ortaya çıkmadan vefat eden ise Muhammed'dir ve Osman mushafını hiç görmedi. Sizin kuralınıza göre çöken Kur'an'dır.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 365, "id": "p365", "pt": "❌ *O vídeo diz:* devemos acreditar no que dizem os estudiosos críticos.\n✅ Então o senhor tem que aceitar o que eles dizem sobre a cruz. John Dominic Crossan, um dos estudiosos mais céticos, um dos fundadores do \"Jesus Seminar\", escreveu que a morte de Jesus crucificado sob Pôncio Pilatos \"é tão certa quanto qualquer coisa histórica pode ser\". E até Bart Ehrman, o crítico mais usado nesses vídeos, ensina que Jesus foi crucificado por ordem de Pilatos. Mas o Alcorão diz que Jesus não foi crucificado (4:157).", "tr": "❌ *Video diyor ki:* Eleştirel araştırmacıların söylediklerine inanmalıyız.\n✅ O halde onların çarmıh hakkında söylediklerini de kabul etmelisiniz. En şüpheci araştırmacılardan biri olan, \"Jesus Seminar\"ın kurucularından John Dominic Crossan, İsa'nın Pontius Pilatus döneminde çarmıhta ölümünün \"tarihsel herhangi bir şey ne kadar kesin olabilirse o kadar kesin\" olduğunu yazdı. Bu videolarda en çok kullanılan eleştirmen Bart Ehrman bile İsa'nın Pilatus'un emriyle çarmıha gerildiğini öğretir. Kur'an ise İsa'nın çarmıha gerilmediğini söylüyor (4:157).", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 366, "id": "p366", "pt": "E não são só os cristãos que dizem isso. Historiadores que não eram cristãos também:\n• Tácito, historiador romano, por volta do ano 116, diz que Cristo foi executado por ordem de Pôncio Pilatos.\n• Flávio Josefo, historiador judeu, por volta do ano 93, diz que Pilatos condenou Jesus à cruz (Antiguidades 18.63).\n• A tradição judaica contrária a Jesus, registrada mais tarde no Talmude, diz que ele foi executado na véspera da Páscoa (Sanhedrin 43a).\nCristãos, judeus e romanos, amigos e inimigos, todos dizem a mesma coisa. Os únicos que diziam o contrário antes do Islã eram alguns grupos gnósticos, que achavam que Jesus nem tinha um corpo de verdade, o que o próprio Alcorão rejeita, porque diz que Jesus e Maria comiam alimentos (5:75). Fora eles, só um livro diz que Jesus não foi crucificado: o Alcorão, 600 anos depois, sem nenhuma prova. Pense: os inimigos de Jesus, judeus e romanos, tinham todo o interesse em dizer que ele nunca foi crucificado, para acabar com o cristianismo. Em vez disso, eles confirmam a cruz.", "tr": "Bunu sadece Hristiyanlar söylemiyor. Hristiyan olmayan tarihçiler de söylüyor:\n• Romalı tarihçi Tacitus, yaklaşık 116 yılında, Mesih'in Pontius Pilatus'un emriyle idam edildiğini söyler.\n• Yahudi tarihçi Josephus, yaklaşık 93 yılında, Pilatus'un İsa'yı çarmıha mahkûm ettiğini söyler (Yahudi Eski Eserleri 18.63).\n• İsa'ya karşı olan ve daha sonra Talmud'a kaydedilen Yahudi geleneği, onun Fısıh arifesinde idam edildiğini söyler (Sanhedrin 43a).\nHristiyanlar, Yahudiler ve Romalılar, dostlar ve düşmanlar, hepsi aynı şeyi söylüyor. İslam'dan önce bunun tersini söyleyenler, İsa'nın gerçek bir bedeni bile olmadığını düşünen bazı gnostik gruplardı; bunu Kur'an'ın kendisi de reddeder, çünkü İsa ile Meryem'in yemek yediğini söyler (5:75). Onların dışında, İsa'nın çarmıha gerilmediğini söyleyen tek bir kitap var: 600 yıl sonra, hiçbir delil olmadan gelen Kur'an. Düşünün: İsa'nın düşmanları olan Yahudiler ve Romalılar, Hristiyanlığı bitirmek için İsa'nın hiç çarmıha gerilmediğini söylemekte büyük bir çıkara sahipti. Bunun yerine çarmıhı doğruluyorlar.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "research", "n": 367, "id": "p367", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Crucificação", "text": "Os historiadores, incluindo os que não são cristãos, aceitam que Jesus foi crucificado?"}, {"label": "Crossan", "text": "John Dominic Crossan escreveu que a crucificação de Jesus é tão certa quanto qualquer coisa histórica pode ser?"}, {"label": "Ehrman", "text": "Bart Ehrman ensina que Jesus foi crucificado por ordem de Pôncio Pilatos?"}, {"label": "Fontes não cristãs", "text": "O que Tácito, nos Anais 15.44, Josefo, nas Antiguidades 18.63, e o Talmude, em Sanhedrin 43a, dizem sobre a morte de Jesus?"}, {"label": "Gnósticos", "text": "Os gnósticos que negavam a crucificação, como Basilides, acreditavam que Jesus tinha um corpo humano de verdade? E o que diz o Alcorão 5:75 sobre Jesus e Maria comerem?"}, {"label": "Antes do Islã", "text": "Existe algum grupo ou documento de antes do Islã que ensinasse, ao mesmo tempo, que Jesus nasceu de uma virgem, era só um profeta humano e não foi crucificado?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Çarmıh", "text": "Hristiyan olmayanlar da dahil, tarihçiler İsa'nın çarmıha gerildiğini kabul ediyor mu?"}, {"label": "Crossan", "text": "John Dominic Crossan, İsa'nın çarmıha gerilmesinin tarihsel herhangi bir şey ne kadar kesin olabilirse o kadar kesin olduğunu yazdı mı?"}, {"label": "Ehrman", "text": "Bart Ehrman, İsa'nın Pontius Pilatus'un emriyle çarmıha gerildiğini öğretiyor mu?"}, {"label": "Hristiyan olmayan kaynaklar", "text": "Tacitus'un Yıllıklar 15.44'te, Josephus'un Yahudi Eski Eserleri 18.63'te ve Talmud'un Sanhedrin 43a'da İsa'nın ölümü hakkında söyledikleri nedir?"}, {"label": "Gnostikler", "text": "Basilides gibi çarmıhı inkâr eden gnostikler, İsa'nın gerçek bir insan bedeni olduğuna inanıyor muydu? Kur'an 5:75, İsa ve Meryem'in yemek yemesi hakkında ne diyor?"}, {"label": "İslam'dan önce", "text": "İslam'dan önce, İsa'nın bakireden doğduğunu, sadece insan bir peygamber olduğunu ve çarmıha gerilmediğini aynı anda öğreten bir grup ya da belge var mı?"}]}}, {"k": "para", "n": 371, "id": "p371", "pt": "Então o senhor só tem duas opções:\n• Se aceita as regras do vídeo, o Alcorão e os hadith caem, e a Bíblia não sofre nem um arranhão, porque passa em todas elas, como mostrei ponto por ponto.\n• Se não aceita as regras do vídeo, então o vídeo inteiro não vale nada.\n*Não existe uma terceira opção.* Nas duas, o vídeo não prova nada contra a Bíblia.", "tr": "O halde sadece iki seçeneğiniz var:\n• Videonun kurallarını kabul ederseniz, Kur'an ve hadisler çöker; Kutsal Kitap ise bir çizik bile almaz, çünkü bölüm bölüm gösterdiğim gibi bu kuralların hepsinden geçiyor.\n• Videonun kurallarını kabul etmezseniz, videonun tamamı hiçbir şey ifade etmez.\n*Üçüncü bir seçenek yok.* İkisinde de video Kutsal Kitap'a karşı hiçbir şey kanıtlamıyor.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 372, "id": "p372", "pt": "❓ Então eu pergunto ao senhor:\n• Se 40 anos é tempo demais para confiar nos Evangelhos, como 600 anos pode ser confiável para o Alcorão?\n• Se o senhor confia nos estudiosos que o vídeo usa, por que não aceita o que esses mesmos estudiosos dizem sobre a cruz?\n• Onde está um único documento de antes de Muhammad que ensine sobre Jesus o que o Alcorão ensina: que Ele nasceu de uma virgem, que era só um profeta e que não foi crucificado? Os poucos grupos antigos que negavam a cruz, como os gnósticos de Basilides, diziam que Jesus nem era um homem de verdade; e os que diziam que Ele era só um homem, como os ebionitas, segundo Irineu, negavam que Ele nasceu de uma virgem. Nenhum deles ensina o Jesus do Alcorão.\n• Se Muhammad aprovou as diferenças entre as leituras, por que Uthman mandou queimar as outras cópias?\nSe o senhor responder essas quatro perguntas com provas, eu vou analisar com toda a atenção. Mas essas provas não existem.", "tr": "❓ O halde size soruyorum:\n• İnciller için 40 yıl güvenmek için çok uzunsa, Kur'an için 600 yıl nasıl güvenilir olabilir?\n• Videonun kullandığı araştırmacılara güveniyorsanız, aynı araştırmacıların çarmıh hakkında söylediklerini neden kabul etmiyorsunuz?\n• Muhammed'den önceye ait, İsa hakkında Kur'an'ın öğrettiğini, yani bakireden doğduğunu, sadece bir peygamber olduğunu ve çarmıha gerilmediğini öğreten tek bir belge nerede? Çarmıhı inkâr eden birkaç eski grup, Basilides'in gnostikleri gibi, İsa'nın gerçek bir insan bile olmadığını söylüyordu; O'nun sadece bir insan olduğunu söyleyen Ebionitler ise, İreneus'a göre, bakireden doğduğunu inkâr ediyordu. Hiçbiri Kur'an'ın İsa'sını öğretmiyor.\n• Muhammed kıraatler arasındaki farkları onayladıysa, Osman diğer nüshaların yakılmasını neden emretti?\nBu dört soruya delillerle cevap verirseniz, büyük bir dikkatle inceleyeceğim. Ama böyle deliller yok.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 373, "id": "p373", "pt": "Fatih Bey e senhora Nezahat, pelo amor de Deus, me escutem. Eu não estou escrevendo tudo isso para ganhar uma discussão. O que está em jogo é a eternidade de vocês: céu ou inferno. Se vocês estiverem errados sobre quem é Jesus, vão perder tudo à toa, só por não terem querido ouvir e pesquisar. É isso que vocês querem? Eu estou praticamente gritando aqui, mostrando quem é Jesus, e vocês preferem ouvir um youtuber que não conhece o assunto?", "tr": "Fatih Bey ve Nezahat Hanım, Tanrı aşkına beni dinleyin. Bütün bunları bir tartışmayı kazanmak için yazmıyorum. Burada söz konusu olan sizin sonsuzluğunuz: cennet ya da cehennem. İsa'nın kim olduğu konusunda yanılıyorsanız, sırf dinlemek ve araştırmak istemediğiniz için her şeyi boş yere kaybedeceksiniz. İstediğiniz bu mu? Ben burada adeta bağırarak İsa'nın kim olduğunu gösteriyorum, siz ise konuyu bilmeyen bir YouTuber'ı dinlemeyi mi tercih ediyorsunuz?", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 374, "id": "p374", "pt": "Não confiem em mim. Pesquisem. Quantas vezes eu já pedi isso? O que custa pesquisar do jeito certo? Parem de ver só canais muçulmanos. Pesquisem no Google, abram os sites e os blogs dos dois lados, usem a inteligência artificial e façam perguntas honestas, sem colocar a resposta dentro da pergunta. Em cada ponto deste texto eu deixei perguntas assim: elas só perguntam fatos, datas e o que as próprias fontes dizem, inclusive as fontes islâmicas. E não fiquem só na primeira frase da resposta: vejam quais fontes ela cita e confiram essas fontes. Fazendo isso, vocês vão ver a verdade escancarada na frente de vocês.", "tr": "Bana güvenmeyin. Araştırın. Bunu size kaç kez söyledim? Doğru şekilde araştırmanın size ne zararı var? Sadece Müslüman kanallarını izlemeyi bırakın. Google'da arayın, iki tarafın da sitelerine ve bloglarına bakın, yapay zekâyı kullanın ve cevabı sorunun içine koymadan dürüst sorular sorun. Bu metnin her bölümüne böyle sorular koydum: Sadece olguları, tarihleri ve İslami kaynaklar da dahil olmak üzere kaynakların kendisinin ne dediğini soruyorlar. Cevapların sadece ilk cümlesinde kalmayın: Hangi kaynakları gösterdiklerine bakın ve o kaynakları kontrol edin. Bunu yaptığınızda gerçeği apaçık önünüzde göreceksiniz.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 375, "id": "p375", "pt": "Fatih Bey e senhora Nezahat, como eu já disse, não se aprende o cristianismo em canais muçulmanos, assim como não se aprende o Islã em canais feitos para atacar o Islã. Esse vídeo pega frases de estudiosos, corta o que não serve e mostra só um lado. Mas quando se olha tudo, a verdade aparece: a Bíblia é confiável, Jesus morreu na cruz, ressuscitou, e é Deus.", "tr": "Fatih Bey ve Nezahat Hanım, daha önce de söylediğim gibi, Hristiyanlık Müslüman kanallarından öğrenilmez; tıpkı İslam'ın, İslam'a saldırmak için yapılmış kanallardan öğrenilmeyeceği gibi. Bu video araştırmacıların sözlerini alıyor, işine gelmeyeni kesiyor ve sadece bir tarafı gösteriyor. Ama her şeye bakıldığında gerçek ortaya çıkıyor: Kutsal Kitap güvenilirdir, İsa çarmıhta öldü, dirildi ve Tanrı'dır.", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "para", "n": 376, "id": "p376", "pt": "Leiam, pesquisem e confiram. A verdade não tem medo de ser examinada. 🙏", "tr": "Okuyun, araştırın ve kontrol edin. Gerçek, incelenmekten korkmaz. 🙏", "where": {"pt": "Conclusão", "tr": "Sonuç"}, "newPoint": false}, {"k": "part", "n": 377, "id": "part-r", "pt": "*REFERÊNCIAS BÍBLICAS PARA CONFERIR*", "tr": "*KONTROL ETMEK İÇİN KUTSAL KİTAP KAYNAKLARI*", "where": {"pt": "Referências bíblicas", "tr": "Kutsal Kitap kaynakları"}, "newPoint": false, "lab": {"pt": ["", "Referências bíblicas"], "tr": ["", "Kutsal Kitap kaynakları"]}}, {"k": "para", "n": 378, "id": "p378", "pt": "Para o texto ficar mais fácil de ler, alguns versículos não foram colocados no meio dele. Aqui estão, por parte, para quem quiser conferir:", "tr": "Metnin daha kolay okunması için bazı ayetler metnin içine konmadı. Kontrol etmek isteyenler için bölüm bölüm burada:", "where": {"pt": "Referências bíblicas", "tr": "Kutsal Kitap kaynakları"}, "newPoint": false}, {"k": "para", "n": 379, "id": "p379", "pt": "*Parte 1*\n• Lucas pesquisou com as testemunhas: Lucas 1:1-4\n• O resumo que Paulo recebeu: 1 Coríntios 15:3-8\n• Paulo passou 15 dias com Pedro e encontrou Tiago: Gálatas 1:18-19\n• Paulo apresentou o seu evangelho aos líderes de Jerusalém, que o aprovaram: Gálatas 2:2 e 2:9\n• Paulo chama Marcos e Lucas de seus colaboradores: Filemom 24\n• Pedro vai à casa da mãe de Marcos: Atos 12:12\n• Lucas e Atos são dirigidos ao mesmo Teófilo: Lucas 1:3 e Atos 1:1\n• Os trechos de Atos com \"nós\": Atos 16:10-17\n• Os companheiros de Paulo que \"foram na frente\": Atos 20:4-5\n• O \"nós\" chega com Paulo até Roma: Atos 28:16\n• Lucas está com Paulo na prisão: Filemom 24 e Colossenses 4:14\n• O final de João: João 21:24\n• Mateus, o cobrador de impostos: Mateus 9:9\n• O Sermão da Montanha: Mateus 5 a 7\n• Pedro está no primeiro chamado e é o último dos apóstolos citado em Marcos: Marcos 1:16 e 16:7\n• Jesus manda fazer discípulos de todas as nações: Mateus 28:19\n• Jesus disse que o Pai é maior, e que o Filho não sabia o dia: João 14:28 e Marcos 13:32\n• A Palavra se fez homem: João 1:14\n• O Filho, sendo Deus, se fez servo: Filipenses 2:6-8\n• Pedro e o anjo não aceitam ser adorados: Atos 10:25-26 e Apocalipse 22:8-9\n• Mentir ao Espírito Santo é mentir a Deus: Atos 5:3-4\n• As mulheres de Salomão desviaram o coração dele, e o rei não devia multiplicar mulheres: 1 Reis 11:3-4 e Deuteronômio 17:17", "tr": "*1. Bölüm*\n• Luka tanıklarla araştırdı: Luka 1:1-4\n• Pavlus'un aldığı özet: 1 Korintliler 15:3-8\n• Pavlus Petrus'la 15 gün kaldı ve Yakup'la görüştü: Galatyalılar 1:18-19\n• Pavlus müjdesini Kudüs'teki önderlere sundu ve onlar onu onayladı: Galatyalılar 2:2 ve 2:9\n• Pavlus Markos'a ve Luka'ya emektaşlarım der: Filimon 24\n• Petrus Markos'un annesinin evine gider: Elçilerin İşleri 12:12\n• Luka ve Elçilerin İşleri aynı Teofilos'a hitap eder: Luka 1:3 ve Elçilerin İşleri 1:1\n• Elçilerin İşleri'ndeki \"biz\" bölümleri: Elçilerin İşleri 16:10-17\n• Pavlus'un \"önden giden\" arkadaşları: Elçilerin İşleri 20:4-5\n• \"Biz\" Pavlus'la birlikte Roma'ya kadar gider: Elçilerin İşleri 28:16\n• Luka hapisteki Pavlus'un yanındadır: Filimon 24 ve Koloseliler 4:14\n• Yuhanna'nın sonu: Yuhanna 21:24\n• Vergi görevlisi Matta: Matta 9:9\n• Dağdaki Vaaz: Matta 5-7\n• Markos'ta Petrus ilk çağrıda yer alır ve adı anılan son elçidir: Markos 1:16 ve 16:7\n• İsa bütün ulusları öğrenci olarak yetiştirmeyi emreder: Matta 28:19\n• İsa, Baba'nın daha büyük olduğunu ve Oğul'un günü bilmediğini söyledi: Yuhanna 14:28 ve Markos 13:32\n• Söz insan oldu: Yuhanna 1:14\n• Oğul, Tanrı olduğu halde kul oldu: Filipililer 2:6-8\n• Petrus ve melek kendilerine tapınılmasını kabul etmez: Elçilerin İşleri 10:25-26 ve Vahiy 22:8-9\n• Kutsal Ruh'a yalan söylemek Tanrı'ya yalan söylemektir: Elçilerin İşleri 5:3-4\n• Süleyman'ın kadınları onun yüreğini saptırdı, kral çok sayıda kadın almamalıydı: 1 Krallar 11:3-4 ve Yasa'nın Tekrarı 17:17", "where": {"pt": "Referências bíblicas", "tr": "Kutsal Kitap kaynakları"}, "newPoint": false}, {"k": "para", "n": 380, "id": "p380", "pt": "*Parte 2*\n• O tanque de Betesda e o tanque de Siloé: João 5:2 e 9:7\n• \"Ninguém conhece o Filho senão o Pai\": Mateus 11:27", "tr": "*2. Bölüm*\n• Beytesda havuzu ve Şiloah havuzu: Yuhanna 5:2 ve 9:7\n• \"Baba'dan başka kimse Oğul'u tanımaz\": Matta 11:27", "where": {"pt": "Referências bíblicas", "tr": "Kutsal Kitap kaynakları"}, "newPoint": false}, {"k": "para", "n": 381, "id": "p381", "pt": "*Parte 3*\n• Jesus anuncia três vezes que vai morrer e ressuscitar: Marcos 8:31, 9:31 e 10:34", "tr": "*3. Bölüm*\n• İsa öleceğini ve dirileceğini üç kez bildirir: Markos 8:31, 9:31 ve 10:34", "where": {"pt": "Referências bíblicas", "tr": "Kutsal Kitap kaynakları"}, "newPoint": false}, {"k": "para", "n": 382, "id": "p382", "pt": "*Partes 4 e 7*\n• \"A palavra do nosso Deus permanece para sempre\": Isaías 40:8\n• \"O céu e a terra passarão, mas as minhas palavras jamais passarão\": Mateus 24:35", "tr": "*4. ve 7. Bölümler*\n• \"Tanrımız'ın sözü sonsuza dek kalır\": Yeşaya 40:8\n• \"Yer ve gök ortadan kalkacak, ama benim sözlerim asla ortadan kalkmayacak\": Matta 24:35", "where": {"pt": "Referências bíblicas", "tr": "Kutsal Kitap kaynakları"}, "newPoint": false}, {"k": "para", "n": 383, "id": "p383", "pt": "*Parte 8*\n• Jesus escolhe os doze para enviá-los a pregar: Marcos 3:14\n• \"Assim como o Pai me enviou, eu também envio vocês\": João 20:21\n• \"Ele guiará vocês a toda a verdade\": João 16:13\n• Paulo fala dos \"Doze\": 1 Coríntios 15:5", "tr": "*8. Bölüm*\n• İsa on ikileri müjdeyi duyurmaya göndermek için seçer: Markos 3:14\n• \"Baba beni nasıl gönderdiyse, ben de sizi öyle gönderiyorum\": Yuhanna 20:21\n• \"O sizi bütün gerçeğe yöneltecek\": Yuhanna 16:13\n• Pavlus \"Onikiler\"den bahseder: 1 Korintliler 15:5", "where": {"pt": "Referências bíblicas", "tr": "Kutsal Kitap kaynakları"}, "newPoint": false}], "toc": [{"id": "part-1", "lvl": 1, "pt": "Parte 1: Quem escreveu os Evangelhos", "tr": "1. Bölüm: İncilleri kim yazdı"}, {"id": "p11", "lvl": 2, "pt": "Os Evangelhos são anônimos?", "tr": "İnciller anonim mi?"}, {"id": "p64", "lvl": 2, "pt": "Escritos 40 a 70 anos depois?", "tr": "40 ile 70 yıl sonra mı yazıldı?"}, {"id": "p90", "lvl": 2, "pt": "Aramaico e grego", "tr": "Aramice ve Grekçe"}, {"id": "p100", "lvl": 2, "pt": "Mateus copiou Marcos?", "tr": "Matta, Markos'u mu kopyaladı?"}, {"id": "p122", "lvl": 2, "pt": "Escribas e o “só 7 de 27”", "tr": "Kâtipler ve “27'de sadece 7”"}, {"id": "p139", "lvl": 2, "pt": "Os autores eram testemunhas?", "tr": "Yazarlar tanık mıydı?"}, {"id": "p156", "lvl": 2, "pt": "A Trindade explicada", "tr": "Üçlü Birlik açıklaması"}, {"id": "p164", "lvl": 2, "pt": "Aisha e o “exemplo perfeito”", "tr": "Aişe ve “mükemmel örnek”"}, {"id": "part-2", "lvl": 1, "pt": "Parte 2: O Evangelho de João", "tr": "2. Bölüm: Yuhanna İncili"}, {"id": "p179", "lvl": 2, "pt": "Quem escreveu João?", "tr": "Yuhanna'yı kim yazdı?"}, {"id": "p196", "lvl": 2, "pt": "João é diferente dos outros?", "tr": "Yuhanna diğerlerinden farklı mı?"}, {"id": "part-3", "lvl": 1, "pt": "Parte 3: Manuscritos e variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar"}, {"id": "p205", "lvl": 2, "pt": "Papiros e Niceia", "tr": "Papirüsler ve İznik"}, {"id": "p218", "lvl": 2, "pt": "As 400.000 variações", "tr": "400.000 farklılık"}, {"id": "p232", "lvl": 2, "pt": "Trechos acrescentados", "tr": "Sonradan eklenen bölümler"}, {"id": "part-4", "lvl": 1, "pt": "Parte 4: Como a Bíblia pode ser sagrada?", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir?"}, {"id": "p244", "lvl": 2, "pt": "Cópia e Palavra de Deus", "tr": "Kopya ve Tanrı'nın Sözü"}, {"id": "p249", "lvl": 2, "pt": "O Alcorão manda seguir a Bíblia", "tr": "Kur'an, Kutsal Kitap'a uyulmasını emreder"}, {"id": "part-5", "lvl": 1, "pt": "Parte 5: As “contradições”", "tr": "5. Bölüm: “Çelişkiler”"}, {"id": "part-6", "lvl": 1, "pt": "Parte 6: As “300 Bíblias”", "tr": "6. Bölüm: “300 Kutsal Kitap”"}, {"id": "p291", "lvl": 2, "pt": "300 Bíblias e revisões", "tr": "300 Kutsal Kitap ve revizyonlar"}, {"id": "part-7", "lvl": 1, "pt": "Parte 7: “O Alcorão foi preservado”", "tr": "7. Bölüm: “Kur'an korundu”"}, {"id": "p307", "lvl": 2, "pt": "5:44, 15:9 e as leituras", "tr": "5:44, 15:9 ve kıraatler"}, {"id": "part-8", "lvl": 1, "pt": "Parte 8: “Muhammad aprovou as leituras”", "tr": "8. Bölüm: “Muhammed kıraatleri onayladı”"}, {"id": "p322", "lvl": 2, "pt": "Muhammad aprovou as leituras?", "tr": "Muhammed kıraatleri onayladı mı?"}, {"id": "p335", "lvl": 2, "pt": "“Alcorão” no singular", "tr": "Tekil “Kur'an”"}, {"id": "p343", "lvl": 2, "pt": "Jesus não aprovou os Evangelhos?", "tr": "İsa İncilleri onaylamadı mı?"}, {"id": "part-c", "lvl": 1, "pt": "Conclusão", "tr": "Sonuç"}, {"id": "part-r", "lvl": 1, "pt": "Referências bíblicas", "tr": "Kutsal Kitap kaynakları"}], "topics": [{"pt": "Trindade", "tr": "Üçlü Birlik", "id": "p156", "terms": "trindade|üçlü birlik"}, {"pt": "Jesus é Deus", "tr": "İsa Tanrı'dır", "id": "p196", "terms": "é deus|tanrı olduğunu"}, {"pt": "A cruz", "tr": "Çarmıh", "id": "p48", "terms": "cruz|çarmıh"}, {"pt": "Quem escreveu os Evangelhos", "tr": "İncilleri kim yazdı", "id": "p11", "terms": "autor|yazar"}, {"pt": "Manuscritos", "tr": "El yazmaları", "id": "p205", "terms": "manuscrito|el yazma"}, {"pt": "400 m const NOTES = "Você é o assistente de estudo do site \"Resposta ao vídeo O Jesus Esquecido, episódio 2\", escrito por Samuel para Fatih Bey e a senhora Nezahat (pais da Zeynep). Quem pergunta normalmente é muçulmano, turco, e quer entender ou contestar algum ponto. Responda qualquer pergunta sobre fé cristã, Bíblia, Jesus, Trindade, história da igreja, manuscritos, Islã, Alcorão e hadith.\n\nDE ONDE VEM A RESPOSTA\n- Use todo o conhecimento teológico, bíblico, histórico e acadêmico que você tem (fontes cristãs, judaicas, romanas e islâmicas, estudos acadêmicos). A resposta não fica presa ao documento.\n- O documento e estas notas mostram o estilo de Samuel e os argumentos dele. Responda do jeito que ele responderia: firme, claro, sem rodeios, com lógica e exemplos do dia a dia.\n- Os trechos do documento enviados com a pergunta servem para o estilo, para reaproveitar os argumentos e para saber se o assunto já está explicado no documento.\n- No fim de toda resposta, escreva uma linha separada dizendo se o assunto está no documento:\n  em português: \"📄 No documento: sim, veja a Parte X (nome do ponto).\" ou \"📄 No documento: este assunto não é tratado no documento.\"\n  em turco: \"📄 Belgede: evet, X. Bölüm'e bakın (konu adı).\" ou \"📄 Belgede: bu konu belgede ele alınmıyor.\"\n  Só diga \"sim\" quando os trechos realmente tratarem do assunto.\n\nREGRAS DE RESPOSTA\n- Responda no mesmo idioma da pergunta. Pergunta em turco: turco natural e correto. Em português: português. Outro idioma: esse idioma.\n- Linguagem simples, para leigos, com exemplos do dia a dia. Frases curtas. Vá direto ao ponto.\n- Tom: firme e seguro, mas respeitoso. Nada de concessões que criem dúvida onde não há dúvida. Mas nunca afirme algo falso para ganhar a discussão: se um ponto tem uma nuance real (veja as notas de precisão), explique a nuance e mostre por que a conclusão continua de pé.\n- Primeiro mostre que a Bíblia se sustenta por si mesma. Depois, se fizer sentido, compare com o Islã, mostrando que nesse ponto o Islã \"nem chega aos pés\".\n- Não chame Muhammad de \"profeta\". Escreva \"Muhammad\" (em turco, \"Muhammed\"). Use \"Deus\" (turco: \"Tanrı\") para o Deus da Bíblia e \"Allah\" quando falar do que o Alcorão diz.\n- Responda à objeção de frente. Pode usar fontes islâmicas (Alcorão, Bukhari, Muslim, sábios muçulmanos) contra o argumento islâmico.\n- Nunca invente referências, números de hadith, versículos ou citações. Se não tiver certeza de um número ou de uma citação, não dê o número: descreva a fonte de forma geral e sugira que a pessoa confira.\n- Quando ajudar, termine (antes da linha do documento) com uma pergunta curta de sim ou não que a pessoa possa colar numa IA para conferir, junto com o texto de neutralidade.\n- Não use travessões. Respostas de até umas 400 palavras, a não ser que a pergunta peça mais.\n\nTEXTO DE NEUTRALIDADE (recomende colar antes de cada pergunta de pesquisa)\n\"Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta. Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, e depois apresente a referência.\"\n\nPONTOS DE PRECISÃO (revisados com cuidado; use quando o assunto aparecer)\n1. Títulos dos Evangelhos: o Papiro 75 (por volta de 200) traz \"Evangelho segundo Lucas\" no fim de Lucas e \"Evangelho segundo João\" no começo de João; o Papiro 66 (por volta de 200) começa com \"Evangelho segundo João\"; o Papiro 4 (códice de Lucas, fim do século 2 ou começo do 3) tem uma folha de guarda com \"Evangelho segundo Mateus\". Nenhum manuscrito dá esses quatro textos a outro autor. Hebreus é o único livro do Novo Testamento em que a igreja antiga disse não saber quem escreveu.\n2. Alguns livros (2 Pedro, Tiago, Judas, 2 e 3 João, Apocalipse) demoraram mais para ser aceitos em todas as regiões, mas ninguém propôs um autor com outro nome no lugar (Dionísio de Alexandria achou que o Apocalipse era de \"outro João\"). Fale disso só se perguntarem.\n3. Mateus 28:19 (\"em nome do Pai, do Filho e do Espírito Santo\") está em todos os manuscritos gregos que guardam o fim de Mateus, e a Didaquê (capítulo 7, fim do século 1 ou começo do 2) já usa a mesma fórmula. Algumas citações de Eusébio trazem uma forma curta (\"em meu nome\"), mas ele também cita a forma completa e nenhum manuscrito traz a forma curta.\n4. 1 João 5:7 (a frase \"o Pai, a Palavra e o Espírito Santo\"), João 7:53 a 8:11 e Marcos 16:9-20 não estão nos manuscritos mais antigos; as Bíblias avisam isso em colchetes ou notas. Nenhuma doutrina depende deles. Marcos 16:6-7 (ressurreição) está em todos os manuscritos que guardaram o final de Marcos, inclusive o Sinaítico e o Vaticano.\n5. Variações (cerca de 400.000): o número é alto porque há milhares de manuscritos e cada leitura diferente de cada copista conta, até uma letra. A mesma diferença repetida em mil manuscritos conta como uma variação só, não como mil. Menos de 1% muda o sentido e tem chance de ser original, e nenhuma muda uma crença essencial. Bart Ehrman admitiu isso numa entrevista no apêndice de \"O que Jesus disse? O que Jesus não disse?\" (Misquoting Jesus).\n6. Horas da crucificação (Marcos 15:25, terceira hora; João 19:14, por volta da sexta hora): há duas explicações. João pode contar as horas a partir da meia-noite (sexta hora = 6h). Ou: sem relógio, o dia era dividido em blocos de três horas e João diz \"por volta da\" sexta hora; os dois relatos falam da mesma manhã.\n7. Lucas 10:16 foi dito aos setenta, não aos doze. Para a autoridade dada aos apóstolos use Mateus 10:40, João 20:21, João 14:26 e João 16:13.\n8. Talmude (Sanhedrin 43a): registro tardio (redigido entre os séculos 3 e 6) da tradição judaica contrária a Jesus. Diz que \"Yeshu\" foi \"pendurado\" na véspera da Páscoa por feitiçaria. Serve como eco dos inimigos, não como fonte principal do século 1. As fontes não cristãs principais são Tácito (Anais 15.44, por volta de 116) e Josefo (Antiguidades 18.63, por volta de 93; a maioria dos estudiosos aceita o núcleo, inclusive que Pilatos condenou Jesus à cruz, e reconhece que algumas frases foram acrescentadas depois por copistas cristãos).\n9. Aisha: Bukhari 5134 e Muslim 1422 (casamento aos 6, consumação aos 9). Além de Hisham ibn Urwa, o relato chega por al-Aswad (de Aisha) e por az-Zuhri (de Urwa), em Muslim 1422. Alcorão 33:21 (\"belo exemplo\").\n10. Bukhari 6982: o trecho de que Muhammad ia ao alto das montanhas para se jogar está no Sahih al-Bukhari, mas é um acréscimo de az-Zuhri (\"chegou até nós que...\"), sem corrente completa. Se perguntarem, diga isso com honestidade: o ponto é que o próprio Bukhari incluiu esse relato no seu livro mais respeitado. Bukhari 3: Muhammad volta da caverna com medo; Khadija e Waraqa dizem que vinha de Deus; Waraqa fala do \"Namus\" de Moisés.\n11. Ibn Mas'ud: Bukhari 4977 (Ubayy fala da posição de Ibn Mas'ud sobre as suratas 113 e 114) e Musnad Ahmad 21186 (ele as apagava do seu mushaf). Tirmidhi 3104: mandou o povo do Iraque esconder os seus mushafs. Bukhari 4999: \"aprendam o Alcorão com quatro\", e Ibn Mas'ud é o primeiro.\n12. Abu Khuzayma al-Ansari (final da surata 9, Bukhari 4986) e Khuzayma ibn Thabit (33:23, testemunho valendo dois, Bukhari 2807) são pessoas diferentes.\n13. Uthman fez o mushaf oficial por volta de 650, uns 18 a 20 anos depois da morte de Muhammad (632), e mandou queimar as outras cópias (Bukhari 4987). Manuscrito de Sana'a: texto de baixo diferente, raspado e coberto pelo texto de Uthman. Birmingham: pergaminho datado por carbono entre 568 e 645 (data da pele, não da escrita). Tayyar Altıkulaç: o mushaf de Topkapı não é o original de Uthman.\n14. Leituras: Hafs (morreu por volta de 796), Warsh (por volta de 812); Ibn Mujahid (morreu em 936) escolheu as sete; Ibn al-Jazari (morreu em 1429) fixou as dez. 5:6: arjulakum (lavar os pés) e arjulikum (passar a mão, mesh). 3:146: qatala e qutila. Al-Tabari: o mushaf de Uthman guarda só um dos sete ahruf. Bukhari 4992: Umar e Hisham e os \"sete ahruf\"; os sábios muçulmanos discordam sobre o que são.\n15. Amamentações: Muslim 1452 (dez amamentações, depois substituídas por cinco, que ainda eram recitadas quando Muhammad morreu). Apedrejamento: Bukhari 6829 (Umar).\n16. Trindade: um só Deus (uma natureza, o \"o que\") em três pessoas (o \"quem\"): Pai, Filho e Espírito Santo. Não são três deuses (Marcos 12:29); Maria não faz parte; \"Filho\" não é filho biológico, quer dizer a mesma natureza do Pai, e o Filho existe desde sempre (João 1:1). Jesus é o Filho: é Deus e se fez homem de verdade (João 1:14; Filipenses 2:6-8), sem deixar de ser Deus. Como homem, orava, tinha fome, dormia, disse que \"o Pai é maior\" (João 14:28) e que não sabia o dia (Marcos 13:32). A oração do Filho ao Pai mostra pessoas distintas e confirma a Trindade. Jesus disse \"antes que Abraão existisse, Eu Sou\" (João 8:58) e \"Eu e o Pai somos um\" (João 10:30-33), e os judeus quiseram apedrejá-lo \"porque, sendo homem, te fazes Deus\"; aceitou \"Senhor meu e Deus meu\" (João 20:28); Pedro e o anjo recusaram adoração (Atos 10:25-26; Apocalipse 22:8-9). O Espírito Santo é Deus (Atos 5:3-4) e é distinto de Gabriel (Lucas 1:35). A palavra \"Trindade\" (em grego, trias) já aparece em Teófilo de Antioquia (por volta de 180) e em Tertuliano (por volta de 213); Niceia (325) defendeu contra Ário o que as igrejas já criam. A palavra \"tawhid\" não aparece no Alcorão. Alcorão 5:116 (Jesus e a mãe \"como dois deuses\"), 6:101 (\"como teria um filho sem companheira?\") e 5:73 mostram que o Alcorão critica uma Trindade que os cristãos não ensinam. Evite comparações com água, gelo e vapor ou com ovo, porque descrevem heresias. Use a comparação do rei que se alista de verdade como soldado: não é fantasia, é soldado de verdade, e nunca deixa de ser rei.\n17. Amor antes da criação: Bukhari 3191 (\"Allah existia e não havia nada além d'Ele\"); Alcorão 85:14 (al-Wadud). O Deus da Bíblia sempre amou: o Pai ama o Filho (João 17:24; João 14:31), por isso \"Deus é amor\" (1 João 4:8).\n18. O Alcorão sobre a Bíblia: 5:43, 5:44, 5:46-47, 5:68, 7:157, 10:94, 6:115 e 18:27 (ninguém muda as palavras de Allah), 5:48 (muhaymin). Sobre distorção: 2:75 e 3:78 (\"um grupo\", torciam a língua), 2:79, 5:13-14, 2:42, 3:71, 5:15. Bukhari, Livro do Tawhid: \"yuharrifun\" quer dizer interpretar errado, ninguém pode remover uma palavra dos livros de Allah. A tese de que o texto da Bíblia foi trocado foi sistematizada séculos depois (Ibn Hazm, século 11). Dilema: se o Evangelho que os cristãos tinham era palavra de Allah, o Alcorão o contradiz ao negar a cruz (4:157); se estava corrompido, o Alcorão mandou julgar por um livro falso. Os Códices Sinaítico e Vaticano (século 4) mostram o texto que existia uns 300 anos antes de Muhammad.\n19. Datas úteis: 1 Coríntios por volta de 55; Atos termina por volta de 62; Tiago, irmão de Jesus, morto em 62; Nero 64; Templo destruído em 70; Papiro 52 por volta de 125 a 175; Papiro 45 por volta de 250; Bukhari morreu em 870 (uns 238 anos depois de Muhammad); Ibn Ishaq por volta de 750, só pela versão de Ibn Hisham (morreu em 833); Domo da Rocha 691/692.\n20. Céticos: Bart Ehrman e John Dominic Crossan (um dos fundadores do Jesus Seminar) aceitam que Jesus foi crucificado sob Pôncio Pilatos; Crossan: é \"tão certo quanto qualquer coisa histórica pode ser\".\n21. Fontes apócrifas no Alcorão: pássaros de barro (3:49, 5:110) no Evangelho da Infância de Tomé (século 2); Maria no Templo (3:37) no Protoevangelho de Tiago (século 2); os jovens da caverna (18:9-26), lenda cristã do século 5; 5:32 já estava na Mishná (Sanhedrin 4:5).\n22. Antes do Islã, nenhum grupo ensinava o Jesus do Alcorão (nascido de virgem, só profeta, não crucificado): os gnósticos de Basilides negavam que Jesus tivesse corpo humano de verdade, e os ebionitas (segundo Irineu) negavam o nascimento virginal. Alcorão 3:55 promete vitória aos seguidores de Jesus, que nos 600 anos anteriores eram os cristãos que criam na cruz e na ressurreição.";

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inline=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<strong>$1</strong>');
const norm=s=>s.toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');

const figs=(arr)=>arr.map(i=>`<figure class="fig"><img src="${i.src}" alt="${esc(i.alt)}" loading="lazy" decoding="async" width="1280" height="720"></figure>`).join('');
function renderPara(txt,imgs){
  const lines=txt.split('\n');let out='',list=false,li=0;imgs=imgs||[];
  const close=()=>{if(list){out+='</ul>';list=false}};
  lines.forEach((ln,i)=>{
    if(ln.startsWith('• ')){if(!list){out+='<ul>';list=true}const it=ln.slice(2);li++;out+='<li>'+(it.startsWith('*')?inline(it).replace('<strong>','<strong class="lbl">'):inline(it))+figs(imgs.filter(x=>x.item===li))+'</li>';return}
    close();
    if(ln.startsWith('❌ ')){out+='<div class="claim"><span class="ico">✕</span>'+inline(ln.slice(2)).replace('<strong>','<strong class="cl">')+'</div>';return}
    if(ln.startsWith('✅ ')){
      const rest=ln.slice(2);
      if(/^\*[^*]+\*$/.test(rest.trim())||(i===0&&rest.startsWith('*')&&lines.length>1&&rest.trim().endsWith('*')))
        out+=(/^\*(E o Alcorão|E o Islã|Peki ya Kur|Peki ya İslam)/.test(rest)?'<div class="okh quran"><span class="ico">◆</span><span>':'<div class="okh"><span class="ico">✓</span><span>')+inline(rest)+'</span></div>';
      else out+='<div class="okline"><span class="ico">✓</span><span>'+inline(rest)+'</span></div>';
      return}
    if(ln.startsWith('❓')){out+='<div class="askh"><span class="ico">?</span><span>'+inline(ln.replace(/^❓\s*/,''))+'</span></div>';return}
    out+='<p>'+inline(ln)+'</p>';
  });
  close();return out;
}

function highlight(root,terms){
  root.querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));root.normalize();
  const nt=terms.map(norm).filter(x=>x.length>1);if(!nt.length)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const raw=n.nodeValue;const low=norm(raw);if(low.length!==raw.length)return;
    let idx=-1,len=0;for(const term of nt){const i=low.indexOf(term);if(i>=0&&(idx<0||i<idx)){idx=i;len=term.length}}
    if(idx<0)return;
    const frag=document.createDocumentFragment();let pos=0,guard=0;
    while(idx>=0&&guard++<50){
      frag.append(raw.slice(pos,idx));const m=document.createElement('mark');m.textContent=raw.slice(idx,idx+len);frag.append(m);pos=idx+len;
      idx=-1;for(const term of nt){const i=low.indexOf(term,pos);if(i>=0&&(idx<0||i<idx)){idx=i;len=term.length}}
    }
    frag.append(raw.slice(pos));n.replaceWith(frag);
  });
  setTimeout(()=>{root.querySelectorAll('mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));root.normalize()},9000);
}

/* ---------------- search ---------------- */
const SEARCH=DATA.blocks.map(b=>{
  const pt=b.k==='research'?b.pt.qs.map(q=>q.label+' '+q.text).join(' '):plain(b.pt);
  const tr=b.k==='research'?b.tr.qs.map(q=>q.label+' '+q.text).join(' '):plain(b.tr);
  return {id:b.id,where:b.where,pt,tr,npt:norm(pt),ntr:norm(tr)}});
function openSearch(q){document.body.classList.add('sp-open');const i=$('#q');if(q!==undefined){i.value=q}setTimeout(()=>i.focus(),50);doSearch()}
function closeSearch(){document.body.classList.remove('sp-open')}
function snippet(text,ntext,terms){
  let i=-1;for(const tm of terms){const j=ntext.indexOf(tm);if(j>=0&&(i<0||j<i))i=j}
  const s=Math.max(0,i-90),e=Math.min(text.length,(i<0?0:i)+200);
  let out=esc((s>0?'… ':'')+text.slice(s,e)+(e<text.length?' …':''));
  terms.forEach(tm=>{if(tm.length<2)return;const re=new RegExp('('+tm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');out=out.replace(re,'<mark>$1</mark>')});
  return out;
}
function doSearch(){
  const raw=$('#q').value.trim();const meta=$('#spMeta'),res=$('#spRes');
  if(raw.length<2){meta.textContent=t('typeMore');res.innerHTML='';return}
  const alts=raw.split('|').map(s=>norm(s.trim())).filter(Boolean);
  const hits=[];
  SEARCH.forEach(s=>{
    let score=0;const pref=uiLang()==='tr'?'tr':'pt';
    alts.forEach(a=>{const words=a.split(/\s+/).filter(Boolean);
      const inBoth=(txt)=>words.every(w=>txt.includes(w));
      if(inBoth(s.npt))score+=2;if(inBoth(s.ntr))score+=2;});
    if(score)hits.push({s,score});
  });
  meta.textContent=hits.length?hits.length+' '+t('results'):t('noRes');
  const L=uiLang();
  res.innerHTML=hits.slice(0,80).map(h=>{
    const useTr=(L==='tr'&&alts.some(a=>h.s.ntr.includes(a.split(/\s+/)[0])))||!alts.some(a=>h.s.npt.includes(a.split(/\s+/)[0]));
    const txt=useTr?h.s.tr:h.s.pt,ntxt=useTr?h.s.ntr:h.s.npt;
    const terms=alts.flatMap(a=>a.split(/\s+/));
    return `<button class="res" data-id="${h.s.id}"><div class="where">${esc(h.s.where[useTr?'tr':'pt'])}</div>${snippetN(txt,ntxt,terms)}</button>`}).join('');
}
function snippetN(text,ntext,terms){
  /* norm() keeps length for most chars, so positions match */
  if(ntext.length!==text.length)return snippet(text,ntext,terms);
  let i=-1;for(const tm of terms){const j=ntext.indexOf(tm);if(j>=0&&(i<0||j<i))i=j}
  const s=Math.max(0,i-90),e=Math.min(text.length,Math.max(i,0)+210);
  let out='';let pos=s;const seg=ntext.slice(s,e);
  const marks=[];terms.forEach(tm=>{if(tm.length<2)return;let k=seg.indexOf(tm);while(k>=0){marks.push([k,k+tm.length]);k=seg.indexOf(tm,k+tm.length)}});
  marks.sort((a,b)=>a[0]-b[0]);let cur=0;const piece=text.slice(s,e);
  marks.forEach(([a,b])=>{if(a<cur)return;out+=esc(piece.slice(cur,a))+'<mark>'+esc(piece.slice(a,b))+'</mark>';cur=b});
  out+=esc(piece.slice(cur));
  return (s>0?'… ':'')+out+(e<text.length?' …':'');
}
