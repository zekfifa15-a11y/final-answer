Yuhanna 1:1 ne diyor?"}, {"label": "Tanrı'nın yetkisi", "text": "Bir video, Yeni Antlaşma yazarlarının hiçbir zaman Tanrı'nın yetkisiyle yazdıklarını söylemediğini iddia ediyor. Bu doğru mu? Şüpheci araştırmacıların bile Pavlus'a ait kabul ettiği 1 Korintliler 14:37 ve 1 Selanikliler 2:13 ne diyor?"}, {"label": "\"Sen orada değildin\"", "text": "Kur'an'ın 3:44, 12:102, 28:44 ve 11:49 ayetleri, Muhammed'e anlatılan olaylarda bulunmadığını söylüyor mu?"}, {"label": "Mağara", "text": "Buhari 3'e göre Muhammed Hira mağarasından titreyerek ve korkarak döndü mü, ve bunun Tanrı'dan geldiğini ona Hatice ile Varaka mı söyledi?"}, {"label": "Onun lehine vahiyler", "text": "Kur'an 33:50, Muhammed'e diğer Müslümanların sahip olmadığı, 'sadece ona mahsus' bir evlilik izni veriyor mu? Buhari 4788'de Aişe ona ne dedi?"}, {"label": "Eski hikâyeler", "text": "Mağarada uyuyan gençlerin hikâyesi (Kur'an 18:9-26) İslam'dan önce bir Hristiyan efsanesi olarak var mıydı? Kur'an 5:32'deki bir insanı öldürmekle ilgili cümle Mişna'da, Sanhedrin 4:5'te zaten var mıydı?"}, {"label": "Kılık değiştiren Şeytan", "text": "2 Korintliler 11:14 ve Galatyalılar 1:8'de Kutsal Kitap, Şeytan'ın ışık meleği kılığına girdiği ve gökten bir meleğin bile başka bir müjde duyuramayacağı konusunda uyarıyor mu?"}, {"label": "Yaratılıştan önce sevgi", "text": "Buhari 3191'e göre yaratılıştan önce Allah vardı ve O'ndan başka hiçbir şey yok muydu? Kur'an 85:14 Allah'a 'seven' anlamında el-Vedud diyor mu?"}, {"label": "Üçlü Birlik", "text": "Hristiyanların Üçlü Birlik öğretisi üç tanrı olduğunu mu, yoksa üç kişide tek bir Tanrı olduğunu mu öğretir?"}, {"label": "Meryem", "text": "Herhangi bir Hristiyan kilisesi, Meryem'in Üçlü Birlik'in parçası olduğunu resmî olarak öğretiyor mu?"}, {"label": "Kur'an neyi eleştiriyor", "text": "Kur'an 5:116'da Allah, İsa'ya kendisini ve annesini Allah'tan başka iki ilah edinmelerini söyleyip söylemediğini soruyor mu? 6:101'de ise Allah'ın eşi olmadan nasıl çocuğu olabileceği soruluyor mu?"}, {"label": "Tevhid", "text": "'Tevhid' kelimesi Kur'an'da geçiyor mu?"}, {"label": "Üçlü Birlik kelimesi", "text": "'Üçlü Birlik' kelimesi İznik Konsili'nden önce Antakyalı Theophilus ve Tertullianus gibi Hristiyan yazarlar tarafından kullanılıyor muydu?"}, {"label": "Cebrail", "text": "Bir Müslüman, Kutsal Ruh'un melek Cebrail olduğunu söylüyor. Luka 1:35'te melek Cebrail, Kutsal Ruh'tan kendisinden farklı biri olarak mı söz ediyor?"}, {"label": "Aişe", "text": "Buhari 5134 ve Müslim 1422'ye göre Aişe Muhammed'le kaç yaşında evlendi ve evlilik kaç yaşında tamamlandı?"}, {"label": "Başka zincirler", "text": "Müslim 1422'ye göre Aişe'nin yaşıyla ilgili rivayet sadece Hişam bin Urve'den değil, Aişe'nin kendisinden duyan Esved ve Urve'den duyan Zühri yoluyla da mı geldi?"}, {"label": "Her zaman için örnek", "text": "Kur'an 33:21, Muhammed'i Müslümanlar için güzel bir örnek olarak sunuyor mu ve Müslüman alimler onun günahtan korunmuş olduğunu (ismet) öğretiyor mu?"}, {"label": "Süleyman", "text": "1 Krallar 11:3-4 ve Yasa'nın Tekrarı 17:17'de Kutsal Kitap, Süleyman gibi çok sayıda kadın alan kralı kınıyor mu?"}]}}, {"k": "para", "n": 176, "id": "p176", "pt": "Aqui encerramos a primeira parte. Só com o que já foi mostrado até aqui, o vídeo já está desmentido. Mas como vocês fingem que não ouvem, vamos continuar. Pelo menos fingem, né? Porque, depois de todos os fatos que foram expostos aqui, continuar mentindo vai ficar feio demais. Acho que vocês já estão percebendo o erro de vocês.", "tr": "Burada birinci bölümü bitiriyoruz. Sadece şimdiye kadar gösterilenlerle bile video çoktan yalanlanmış durumda. Ama siz duymamış gibi yaptığınız için devam edelim. En azından duymamış gibi yapıyorsunuz, değil mi? Çünkü burada ortaya konan bütün gerçeklerden sonra yalan söylemeye devam etmek fazlasıyla çirkin olur. Sanırım yanıldığınızı artık siz de fark etmeye başladınız.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": false}, {"k": "trans", "n": 177, "id": "p177", "pt": "Então vamos para a segunda parte, já que o vídeo é cheio de mentiras.", "tr": "O halde ikinci bölüme geçelim, çünkü video yalanlarla dolu.", "where": {"pt": "Parte 1: Quem escreveu os Evangelhos › Aisha e o “exemplo perfeito”", "tr": "1. Bölüm: İncilleri kim yazdı › Aişe ve “mükemmel örnek”"}, "newPoint": false}, {"k": "part", "n": 178, "id": "part-2", "pt": "*PARTE 2: O EVANGELHO DE JOÃO*", "tr": "*2. BÖLÜM: YUHANNA İNCİLİ*", "where": {"pt": "Parte 2: O Evangelho de João", "tr": "2. Bölüm: Yuhanna İncili"}, "newPoint": false, "lab": {"pt": ["PARTE 2", "O Evangelho de João"], "tr": ["2. BÖLÜM", "Yuhanna İncili"]}}, {"k": "para", "n": 179, "id": "p179", "pt": "❌ *O que o vídeo diz:* que no final de João está escrito \"sabemos que o seu testemunho é verdadeiro\" (João 21:24), e que esse \"nós\" misterioso mostra que João não escreveu; e que João chama a si mesmo de \"o discípulo a quem Jesus amava\", na terceira pessoa.", "tr": "❌ *Videonun söylediği:* Yuhanna'nın sonunda \"Onun tanıklığının doğru olduğunu biliyoruz\" (Yuhanna 21:24) yazdığı ve bu gizemli \"biz\"in Yuhanna'nın yazmadığını gösterdiği; Yuhanna'nın kendisinden üçüncü şahıs olarak, \"İsa'nın sevdiği öğrenci\" diye bahsettiği.", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": true}, {"k": "para", "n": 180, "id": "p180", "pt": "Aqui o autor do vídeo cortou o versículo pela metade para enganar quem não vai conferir. Vamos às provas:", "tr": "Burada videonun sahibi, kontrol etmeyecek olanları kandırmak için ayeti ortadan kesti. Delillere geçelim:", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 181, "id": "p181", "pt": "✅ *Prova 1: o próprio versículo diz quem escreveu.*\nO versículo inteiro diz: \"Este é o discípulo que dá testemunho destas coisas e as escreveu; e sabemos que o seu testemunho é verdadeiro\" (João 21:24). O vídeo mostra só o \"sabemos\" e esconde a primeira parte, que diz com todas as letras que *quem escreveu foi o discípulo que viu tudo*.", "tr": "✅ *1. delil: Ayetin kendisi kimin yazdığını söylüyor.*\nAyetin tamamı şöyledir: \"Bu olaylara tanıklık eden ve bunları yazan öğrenci budur; onun tanıklığının doğru olduğunu biliyoruz\" (Yuhanna 21:24). Video sadece \"biliyoruz\" kısmını gösteriyor ve *yazanın her şeyi gören öğrenci olduğunu* açık açık söyleyen ilk kısmı saklıyor.", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 182, "id": "p182", "pt": "E o autor não aparece só no final. Logo no começo ele já se coloca entre as testemunhas: \"o Verbo se fez carne e habitou entre nós, e vimos a sua glória\" (João 1:14). E aos pés da cruz ele afirma: \"Aquele que viu isto deu testemunho, e o seu testemunho é verdadeiro; e ele sabe que diz a verdade, para que também vocês creiam\" (João 19:35).", "tr": "Yazar sadece sonda da görünmez. Daha başta kendini tanıkların arasına koyar: \"Söz insan oldu, aramızda yaşadı. Onun yüceliğini gördük\" (Yuhanna 1:14). Çarmıhın dibinde de şöyle der: \"Bunu gören tanıklık ediyor, onun tanıklığı gerçektir. Doğruyu söylediğini biliyor, siz de iman edesiniz diye\" (Yuhanna 19:35).", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 183, "id": "p183", "pt": "O livro inteiro é o testemunho de quem viu. O \"nós\" do final não toma o lugar do autor: ele vem depois, para confirmar o que o autor escreveu. Como já mostrei no começo, são as pessoas que conheciam esse discípulo assinando embaixo, e esse versículo está em todos os manuscritos que guardaram o final de João.", "tr": "Bütün kitap, görenin tanıklığıdır. Sondaki \"biz\" yazarın yerini almıyor: Yazarın yazdığını doğrulamak için sonra geliyor. Başta gösterdiğim gibi, bunlar bu öğrenciyi tanıyan ve altına imza atan kişilerdir ve bu ayet Yuhanna'nın sonunu koruyan bütün el yazmalarında vardır.", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 184, "id": "p184", "pt": "✅ *Prova 2: o \"nós\" segue a regra das duas testemunhas.*\nNa lei judaica, um fato só valia se fosse confirmado por duas ou três testemunhas (Deuteronômio 19:15). O próprio Evangelho de João lembra essa regra: \"o testemunho de duas pessoas é verdadeiro\" (João 8:17). Então o livro termina exatamente como um judeu daquela época terminaria um testemunho importante: o discípulo dá o seu testemunho, e outros que o conheciam confirmam.", "tr": "✅ *2. delil: \"Biz\", iki tanık kuralına uyar.*\nYahudi yasasında bir olay ancak iki ya da üç tanıkla doğrulanırsa geçerliydi (Yasa'nın Tekrarı 19:15). Yuhanna İncili'nin kendisi bu kuralı hatırlatır: \"İki kişinin tanıklığı geçerlidir\" (Yuhanna 8:17). Yani kitap, o dönemin bir Yahudisinin önemli bir tanıklığı bitireceği şekilde biter: Öğrenci tanıklığını verir, onu tanıyan başkaları da doğrular.", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 185, "id": "p185", "pt": "Pense: um falsificador não colocaria no próprio livro um \"nós sabemos\" de pessoas que podiam ser procuradas e perguntadas.", "tr": "Düşünün: Bir sahtekâr kendi kitabına, bulunup sorulabilecek kişilerin \"biliyoruz\" demesini koymaz.", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 186, "id": "p186", "pt": "✅ *Prova 3: dá para saber quem é \"o discípulo a quem Jesus amava\".*\nO próprio Evangelho dá as pistas. Siga passo a passo:\n• Ele estava na Última Ceia, ao lado de Jesus (João 13:23). Na Última Ceia só estavam os doze apóstolos. Então ele é um dos doze.\n• Ele está sempre junto de Pedro (João 13:24, 20:2 e 21:7). Então não é Pedro.\n• Na pesca depois da ressurreição, ele está num grupo de sete: Pedro, Tomé, Natanael, os dois filhos de Zebedeu (que os outros Evangelhos mostram que eram Tiago e João) e mais dois (João 21:2 e 21:7). Pedro, Tomé e Natanael são chamados pelo nome, então não é nenhum deles.\n• Dos que sobram, os mais próximos de Jesus eram os dois filhos de Zebedeu, Tiago e João, que estavam com Pedro nos momentos mais importantes. Mas Tiago foi morto muito cedo, por volta do ano 44, antes de qualquer Evangelho ser escrito (Atos 12:2). Então não foi ele quem escreveu.\n• E nos outros Evangelhos e em Atos, quem anda sempre junto de Pedro é justamente João (Lucas 22:8; Atos 3:1).\n*Sobra um só: João.*", "tr": "✅ *3. delil: \"İsa'nın sevdiği öğrenci\"nin kim olduğu bilinebilir.*\nİncil'in kendisi ipuçlarını verir. Adım adım takip edin:\n• Son Akşam Yemeği'nde İsa'nın yanındaydı (Yuhanna 13:23). Son Akşam Yemeği'nde sadece on iki elçi vardı. Yani o, on ikiden biridir.\n• Her zaman Petrus'la birliktedir (Yuhanna 13:24, 20:2 ve 21:7). Yani Petrus değildir.\n• Diriliş sonrasındaki balık avında yedi kişilik bir grubun içindedir: Petrus, Tomas, Natanael, Zebedi'nin iki oğlu (diğer İncillere göre Yakup ve Yuhanna) ve iki kişi daha (Yuhanna 21:2 ve 21:7). Petrus, Tomas ve Natanael adlarıyla anılır, yani hiçbiri değildir.\n• Geriye kalanlar içinde İsa'ya en yakın olanlar, en önemli anlarda Petrus'la birlikte bulunan Zebedi'nin iki oğlu Yakup ve Yuhanna'ydı. Ama Yakup çok erken, yaklaşık 44 yılında, hiçbir İncil yazılmadan önce öldürüldü (Elçilerin İşleri 12:2). Yani yazan o değildi.\n• Diğer İncillerde ve Elçilerin İşleri'nde de Petrus'la hep birlikte dolaşan kişi tam olarak Yuhanna'dır (Luka 22:8; Elçilerin İşleri 3:1).\n*Geriye tek kişi kalıyor: Yuhanna.*", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 187, "id": "p187", "pt": "✅ *Prova 4: o autor nunca escreve o próprio nome, e isso é a marca de João.*\nRepare em algo que quase ninguém percebe: o nome do apóstolo João não aparece nenhuma vez no Evangelho de João. Pedro, André, Filipe, Natanael, Tomé e Judas aparecem pelo nome, mas João não. E o outro João da história, João Batista, é chamado só de \"João\", sem precisar de \"Batista\", porque para o autor não havia outro João com quem confundir.", "tr": "✅ *4. delil: Yazar kendi adını hiç yazmaz ve bu Yuhanna'nın izidir.*\nNeredeyse kimsenin fark etmediği bir şeye dikkat edin: Elçi Yuhanna'nın adı Yuhanna İncili'nde bir kez bile geçmez. Petrus, Andreas, Filipus, Natanael, Tomas ve Yahuda adlarıyla geçer, ama Yuhanna geçmez. Hikâyedeki diğer Yuhanna, yani Vaftizci Yahya, sadece \"Yuhanna\" diye anılır, \"Vaftizci\" demeye gerek görülmez; çünkü yazar için karıştırılacak başka bir Yuhanna yoktu.", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 188, "id": "p188", "pt": "Pense: um falsificador que quisesse fazer o livro passar por obra de João colocaria o nome de João em todo lugar. O verdadeiro João fez o contrário: escondeu o próprio nome e se apresentou só como \"o discípulo a quem Jesus amava\". Ele não se apresenta pelo que ele fez, mas pelo amor que recebeu de Jesus. E falar de si mesmo assim, na terceira pessoa, era um costume comum naquela época, como já mostrei com César, Xenofonte e Josefo.", "tr": "Düşünün: Kitabı Yuhanna'nın eseri gibi göstermek isteyen bir sahtekâr, Yuhanna'nın adını her yere koyardı. Gerçek Yuhanna tam tersini yaptı: Kendi adını gizledi ve kendini sadece \"İsa'nın sevdiği öğrenci\" olarak tanıttı. Kendini yaptıklarıyla değil, İsa'dan aldığı sevgiyle tanıtır. Ve kendinden böyle, üçüncü şahıs olarak bahsetmek o dönemde yaygın bir alışkanlıktı; Sezar'da, Ksenophon'da ve Josephus'ta gösterdiğim gibi.", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 189, "id": "p189", "pt": "✅ *Prova 5: a cadeia de provas continua fora do livro.*\n• O autor conhecia nos detalhes a Jerusalém de antes da destruição do ano 70, como quem tinha andado por lá: o tanque de Betesda, com seus cinco pórticos, e o tanque de Siloé foram encontrados pelos arqueólogos.\n• Irineu, na Gália, diz que João, o discípulo do Senhor, escreveu esse Evangelho em Éfeso.\n• Tertuliano, no norte da África, coloca João entre os apóstolos que escreveram Evangelhos.\nLugares diferentes, fontes diferentes, o mesmo nome.", "tr": "✅ *5. delil: Delil zinciri kitabın dışında da devam eder.*\n• Yazar, 70 yılındaki yıkımdan önceki Kudüs'ü, orada dolaşmış biri gibi ayrıntılarıyla biliyordu: Beş eyvanlı Beytesda havuzu ve Şiloah havuzu arkeologlar tarafından bulundu.\n• Galya'da İreneus, Rab'bin öğrencisi Yuhanna'nın bu İncil'i Efes'te yazdığını söyler.\n• Kuzey Afrika'da Tertullianus, Yuhanna'yı İncil yazan elçiler arasında sayar.\nFarklı yerler, farklı kaynaklar, aynı isim.", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 190, "id": "p190", "pt": "✅ *E o Alcorão?*\nEm João, um grupo inteiro confirma o testemunho de quem viu tudo. Já o próprio Bukhari conta que, quando o Alcorão foi reunido, Zayd procurou nos escritos e na memória dos homens, e mesmo assim só encontrou os últimos versículos da surata at-Tawba com um homem, Abu Khuzayma al-Ansari, e com mais ninguém (Bukhari 4986). Se um \"nós\" que confirma o testemunho enfraquece João, o que dizer de versículos que só um homem tinha?", "tr": "✅ *Peki ya Kur'an?*\nYuhanna'da bütün bir grup, her şeyi görenin tanıklığını doğruluyor. Buhari'nin kendisi ise, Kur'an toplanırken Zeyd'in yazılı olanlarda ve insanların hafızasında aradığını, buna rağmen Tevbe suresinin son ayetlerini sadece bir kişide, Ebu Huzeyme el-Ensarî'de bulduğunu ve başka hiç kimsede bulmadığını anlatır (Buhari 4986). Tanıklığı doğrulayan bir \"biz\" Yuhanna'yı zayıflatıyorsa, sadece bir kişide bulunan ayetler için ne diyeceğiz?", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "research", "n": 191, "id": "p191", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "João 21:24", "text": "Um vídeo diz que o 'nós' de João 21:24 mostra que João não escreveu o Evangelho. O que diz o versículo inteiro, e quem ele diz que escreveu? Esse versículo está em todos os manuscritos que guardaram o final de João?"}, {"label": "Duas testemunhas", "text": "Na lei judaica, um fato precisava ser confirmado por duas ou três testemunhas (Deuteronômio 19:15)? E João 8:17 lembra essa regra?"}, {"label": "O discípulo amado", "text": "Pelas pistas do próprio Evangelho (João 13:23, 21:2 e 21:7) e pelos outros textos (Lucas 22:8, Atos 3:1 e Atos 12:2), por que 'o discípulo a quem Jesus amava' é identificado como o apóstolo João?"}, {"label": "O nome de João", "text": "O nome do apóstolo João aparece alguma vez no Evangelho de João? E João Batista é chamado de 'Batista' nesse Evangelho?"}, {"label": "Arqueologia", "text": "Os arqueólogos encontraram o tanque de Betesda (João 5:2) e o tanque de Siloé (João 9:7)? O que isso mostra sobre o conhecimento que o autor tinha de Jerusalém antes do ano 70?"}, {"label": "Alcorão", "text": "Segundo Bukhari 4986, com quantas pessoas Zayd ibn Thabit encontrou os últimos versículos da surata at-Tawba?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Yuhanna 21:24", "text": "Bir video, Yuhanna 21:24'teki 'biz'in Yuhanna'nın bu İncil'i yazmadığını gösterdiğini söylüyor. Ayetin tamamı ne diyor ve kimin yazdığını söylüyor? Bu ayet, Yuhanna'nın sonunu koruyan bütün el yazmalarında var mı?"}, {"label": "İki tanık", "text": "Yahudi yasasında bir olayın iki ya da üç tanıkla doğrulanması gerekiyor muydu (Yasa'nın Tekrarı 19:15)? Yuhanna 8:17 bu kuralı hatırlatıyor mu?"}, {"label": "Sevilen öğrenci", "text": "İncil'in kendi ipuçlarına (Yuhanna 13:23, 21:2 ve 21:7) ve diğer metinlere (Luka 22:8, Elçilerin İşleri 3:1 ve 12:2) göre 'İsa'nın sevdiği öğrenci' neden elçi Yuhanna olarak tanımlanır?"}, {"label": "Yuhanna'nın adı", "text": "Elçi Yuhanna'nın adı Yuhanna İncili'nde hiç geçiyor mu? Vaftizci Yahya bu İncil'de 'Vaftizci' diye anılıyor mu?"}, {"label": "Arkeoloji", "text": "Arkeologlar Beytesda havuzunu (Yuhanna 5:2) ve Şiloah havuzunu (Yuhanna 9:7) buldu mu? Bu, yazarın 70 yılından önceki Kudüs hakkındaki bilgisi hakkında ne gösteriyor?"}, {"label": "Kur'an", "text": "Buhari 4986'ya göre Zeyd ibn Sabit, Tevbe suresinin son ayetlerini kaç kişide buldu?"}]}}, {"k": "trans", "n": 195, "id": "p195", "pt": "Agora vamos para mais um erro do vídeo sobre João.", "tr": "Şimdi videonun Yuhanna hakkındaki bir başka hatasına geçelim.", "where": {"pt": "Parte 2: O Evangelho de João › Quem escreveu João?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna'yı kim yazdı?"}, "newPoint": false}, {"k": "para", "n": 196, "id": "p196", "pt": "❌ *O que o vídeo diz:* que João é muito diferente dos outros Evangelhos, que só em João Jesus fala como Deus, que nos outros Jesus é só um profeta humano, e que no século 2 um grupo, os álogos, dizia que João não escreveu esse Evangelho.", "tr": "❌ *Videonun söylediği:* Yuhanna'nın diğer İncillerden çok farklı olduğu, İsa'nın sadece Yuhanna'da Tanrı gibi konuştuğu, diğerlerinde sadece insan bir peygamber olduğu ve 2. yüzyılda Alogoi adlı bir grubun bu İncil'i Yuhanna'nın yazmadığını söylediği.", "where": {"pt": "Parte 2: O Evangelho de João › João é diferente dos outros?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna diğerlerinden farklı mı?"}, "newPoint": true}, {"k": "para", "n": 197, "id": "p197", "pt": "✅ *Isso é falso: nos Evangelhos mais antigos Jesus também age e fala como Deus.*\nNa Parte 1 eu já expliquei a Trindade e mostrei que Jesus é Deus. E isso não está só em João. Em Marcos, o mais antigo de todos:\n• Jesus perdoa pecados, e os escribas dizem: \"Quem pode perdoar pecados, senão Deus?\" (Marcos 2:5-7).\n• O sumo sacerdote pergunta: \"És tu o Cristo, o Filho do Deus Bendito?\" E Jesus responde: \"Eu sou, e vereis o Filho do Homem assentado à direita do Poder e vindo com as nuvens do céu\". Por isso o condenam por blasfêmia (Marcos 14:61-64).\n• Em Mateus, Jesus manda batizar \"em nome do Pai, do Filho e do Espírito Santo\" (Mateus 28:19), e diz: \"ninguém conhece o Filho senão o Pai\".\nEntão não foi João que \"inventou\" um Jesus divino. Ele já está em Marcos, em Mateus e nas cartas de Paulo, que são ainda mais antigas.", "tr": "✅ *Bu yanlıştır: En eski İncillerde de İsa Tanrı gibi davranır ve konuşur.*\nBirinci bölümde Üçlü Birlik'i zaten açıkladım ve İsa'nın Tanrı olduğunu gösterdim. Ve bu yalnızca Yuhanna'da değildir. Hepsinin en eskisi olan Markos'ta:\n• İsa günahları bağışlar ve din bilginleri şöyle der: \"Tanrı'dan başka kim günahları bağışlayabilir?\" (Markos 2:5-7).\n• Başkâhin sorar: \"Sen, Yüce Olan'ın Oğlu Mesih misin?\" İsa cevap verir: \"Benim. İnsanoğlu'nun Kudretli Olan'ın sağında oturduğunu ve göğün bulutlarıyla geldiğini göreceksiniz.\" Bu yüzden O'nu Tanrı'ya küfretmekle suçlayıp mahkûm ederler (Markos 14:61-64).\n• Matta'da İsa, \"Baba, Oğul ve Kutsal Ruh'un adıyla\" vaftiz etmeyi emreder (Matta 28:19) ve \"Baba'dan başka kimse Oğul'u tanımaz\" der.\nYani Tanrı olan bir İsa'yı Yuhanna \"uydurmadı\". O zaten Markos'ta, Matta'da ve daha da eski olan Pavlus'un mektuplarında var.", "where": {"pt": "Parte 2: O Evangelho de João › João é diferente dos outros?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna diğerlerinden farklı mı?"}, "newPoint": false}, {"k": "para", "n": 198, "id": "p198", "pt": "✅ *Estilos diferentes não são contradição.*\nJoão escreveu depois e quis completar os outros, contando coisas que eles não contaram. Quatro testemunhas que contam a mesma vida de jeitos diferentes é algo normal. E o próprio Alcorão tem estilos muito diferentes entre as suratas de Meca e as de Medina, e o senhor não diz que por isso elas vêm de pessoas diferentes.", "tr": "✅ *Farklı üsluplar çelişki değildir.*\nYuhanna daha sonra yazdı ve diğerlerinin anlatmadığı şeyleri anlatarak onları tamamlamak istedi. Dört tanığın aynı hayatı farklı şekillerde anlatması normaldir. Kur'an'ın kendisinde de Mekke ve Medine sureleri arasında çok farklı üsluplar vardır ve siz bu yüzden onların farklı kişilerden geldiğini söylemiyorsunuz.", "where": {"pt": "Parte 2: O Evangelho de João › João é diferente dos outros?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna diğerlerinden farklı mı?"}, "newPoint": false}, {"k": "para", "n": 199, "id": "p199", "pt": "✅ *Os álogos eram um grupo pequeno,*\nque rejeitava João por causa de uma briga teológica da época e, segundo os relatos antigos, dizia que ele tinha sido escrito por Cerinto, um herege do fim do século 1. Não apresentaram nenhuma prova, e as igrejas, do Egito até a Gália, continuaram aceitando João como obra do apóstolo.", "tr": "✅ *Alogoi küçük bir gruptu.*\nYuhanna'yı o dönemin teolojik bir tartışması yüzünden reddediyor ve eski kaynaklara göre onun, 1. yüzyılın sonunda yaşamış sapkın Kerintos tarafından yazıldığını söylüyorlardı. Hiçbir delil göstermediler ve Mısır'dan Galya'ya kadar kiliseler Yuhanna'yı elçinin eseri olarak kabul etmeye devam etti.", "where": {"pt": "Parte 2: O Evangelho de João › João é diferente dos outros?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna diğerlerinden farklı mı?"}, "newPoint": false}, {"k": "research", "n": 200, "id": "p200", "where": {"pt": "Parte 2: O Evangelho de João › João é diferente dos outros?", "tr": "2. Bölüm: Yuhanna İncili › Yuhanna diğerlerinden farklı mı?"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Marcos 2", "text": "Em Marcos 2:5-7, por que os escribas dizem que Jesus blasfemou ao perdoar pecados?"}, {"label": "Marcos 14", "text": "Em Marcos 14:61-64, o que Jesus responde ao sumo sacerdote, e por que ele é condenado?"}, {"label": "Mateus", "text": "O que Jesus diz em Mateus 28:19 e em Mateus 11:27?"}, {"label": "Antes de Niceia", "text": "Os cristãos já adoravam Jesus como Deus antes do Concílio de Niceia?"}, {"label": "Alcorão", "text": "As suratas de Meca e as de Medina têm estilos diferentes, segundo os próprios estudiosos muçulmanos?"}, {"label": "Álogos", "text": "Segundo os relatos antigos, a quem os álogos atribuíam o Evangelho de João, e eles apresentaram alguma prova? As igrejas aceitaram o que eles diziam?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Markos 2", "text": "Markos 2:5-7'de din bilginleri, İsa günahları bağışladığında neden O'nun Tanrı'ya küfrettiğini söylüyor?"}, {"label": "Markos 14", "text": "Markos 14:61-64'te İsa başkâhine ne cevap veriyor ve neden mahkûm ediliyor?"}, {"label": "Matta", "text": "İsa, Matta 28:19'da ve Matta 11:27'de ne diyor?"}, {"label": "İznik'ten önce", "text": "Hristiyanlar İznik Konsili'nden önce de İsa'ya Tanrı olarak tapıyor muydu?"}, {"label": "Kur'an", "text": "Müslüman alimlerin kendilerine göre Mekke ve Medine surelerinin üslupları farklı mı?"}, {"label": "Alogoi", "text": "Eski kaynaklara göre Alogoi, Yuhanna İncili'ni kime atfediyordu ve herhangi bir delil gösterdiler mi? Kiliseler onların söylediğini kabul etti mi?"}]}}, {"k": "part", "n": 204, "id": "part-3", "pt": "*PARTE 3: MANUSCRITOS E VARIAÇÕES*", "tr": "*3. BÖLÜM: EL YAZMALARI VE FARKLILIKLAR*", "where": {"pt": "Parte 3: Manuscritos e variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar"}, "newPoint": false, "lab": {"pt": ["PARTE 3", "Manuscritos e variações"], "tr": ["3. BÖLÜM", "El yazmaları ve farklılıklar"]}}, {"k": "para", "n": 205, "id": "p205", "pt": "❌ *O que o vídeo diz:* que o Papiro 52 é só um pedacinho, que 90% dos papiros antigos são fragmentos, que os manuscritos completos só aparecem por volta do ano 325 a 350, depois de Niceia, e que os primeiros escritores cristãos citam pouco os Evangelhos.", "tr": "❌ *Videonun söylediği:* Papirüs 52'nin sadece küçük bir parça olduğu, eski papirüslerin %90'ının parça olduğu, tam el yazmalarının ancak yaklaşık 325 ile 350 yıllarında, İznik'ten sonra ortaya çıktığı ve ilk Hristiyan yazarların İncillerden az alıntı yaptığı.", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "newPoint": true}, {"k": "para", "n": 206, "id": "p206", "pt": "✅ *O valor do Papiro 52 não é o tamanho, é a data.*\nPela data que o próprio vídeo dá, ele prova que o Evangelho de João já era copiado e lido no Egito no século 2. E além dele temos o Papiro 66 (por volta do ano 200), com quase todo o Evangelho de João, o Papiro 75 (por volta do ano 200), com grande parte de Lucas e de João, e o Papiro 45 (por volta do ano 250), com partes dos quatro Evangelhos e de Atos. Todos de antes de Niceia. E as Bíblias de hoje são traduzidas justamente a partir desses manuscritos antigos, como já mostrei no documento sobre João.", "tr": "✅ *Papirüs 52'nin değeri boyutunda değil, tarihindedir.*\nVideonun kendisinin verdiği tarihe göre bile, Yuhanna İncili'nin 2. yüzyılda Mısır'da zaten kopyalanıp okunduğunu kanıtlar. Ayrıca elimizde Yuhanna İncili'nin neredeyse tamamını içeren Papirüs 66 (yaklaşık 200 yılı), Luka'nın ve Yuhanna'nın büyük kısmını içeren Papirüs 75 (yaklaşık 200 yılı) ve dört İncil'den ve Elçilerin İşleri'nden bölümler içeren Papirüs 45 (yaklaşık 250 yılı) var. Hepsi İznik'ten önceye ait. Ve Yuhanna hakkındaki belgede gösterdiğim gibi, bugünkü Kutsal Kitaplar tam da bu eski el yazmalarından tercüme ediliyor.", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "newPoint": false}, {"k": "para", "n": 207, "id": "p207", "pt": "✅ *Niceia não mexeu no texto da Bíblia, nem escolheu os livros.*\nO Concílio de Niceia, no ano 325, discutiu se Jesus é Deus, contra Ário, e a data da Páscoa. Como já mostrei na Parte 1, Niceia não inventou a Trindade: só defendeu o que as igrejas já criam. E os papiros de antes de Niceia dizem a mesma coisa que os códices de depois: o mesmo Jesus que é Deus, a mesma cruz, a mesma ressurreição. Se alguém tivesse mudado algo em Niceia, a diferença apareceria. Não aparece.", "tr": "✅ *İznik, Kutsal Kitap'ın metnine dokunmadı, kitaplarını da seçmedi.*\n325 yılındaki İznik Konsili, Arius'a karşı İsa'nın Tanrı olup olmadığını ve Paskalya'nın tarihini tartıştı. 1. bölümde gösterdiğim gibi, İznik Üçlü Birlik'i uydurmadı; sadece kiliselerin zaten inandığı şeyi savundu. İznik'ten önceki papirüsler de sonraki kodekslerle aynı şeyi söyler: Tanrı olan aynı İsa, aynı çarmıh, aynı diriliş. İznik'te biri bir şey değiştirmiş olsaydı, fark ortaya çıkardı. Çıkmıyor.", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "newPoint": false}, {"k": "para", "n": 208, "id": "p208", "pt": "✅ *Compare com outros livros antigos.*\nDa \"Guerra das Gálias\", de Júlio César, o manuscrito mais antigo é de uns 900 anos depois dele. Dos \"Anais\" de Tácito, de uns 700 a 900 anos depois. Ninguém diz que esses livros foram inventados. Do Novo Testamento, que foi escrito poucas décadas depois de Jesus, temos manuscritos de 100 a 300 anos depois dele. Nenhum outro livro antigo chega perto disso.", "tr": "✅ *Diğer eski kitaplarla karşılaştırın.*\nJül Sezar'ın \"Galya Savaşları\"nın en eski el yazması, ondan yaklaşık 900 yıl sonraya aittir. Tacitus'un \"Yıllıklar\"ınınki ise yaklaşık 700 ile 900 yıl sonraya. Kimse bu kitapların uydurma olduğunu söylemez. İsa'dan birkaç on yıl sonra yazılan Yeni Antlaşma'nın ise O'ndan 100 ile 300 yıl sonraya ait el yazmaları var. Başka hiçbir eski kitap buna yaklaşamaz bile.", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "newPoint": false}, {"k": "para", "n": 209, "id": "p209", "pt": "✅ *Sobre os escritores antigos:*\nos escritores dos primeiros anos já usam os Evangelhos e as cartas, e o que citam é igual ao que temos. E a partir do ano 180, Irineu, Clemente de Alexandria, Tertuliano e Orígenes citam o Novo Testamento milhares de vezes. E não precisamos reconstruir a Bíblia com citações, porque temos os próprios manuscritos.", "tr": "✅ *Eski yazarlar konusunda:*\nİlk yılların yazarları da İncilleri ve mektupları zaten kullanır ve alıntı yaptıkları metin bizdekiyle aynıdır. 180 yılından itibaren de İreneus, İskenderiyeli Klemens, Tertullianus ve Origenes Yeni Antlaşma'dan binlerce kez alıntı yapar. Kaldı ki Kutsal Kitap'ı alıntılarla yeniden kurmaya ihtiyacımız yok, çünkü el yazmalarının kendisi elimizde.", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "newPoint": false}, {"k": "para", "n": 210, "id": "p210", "pt": "✅ *E o Alcorão?*\nO vídeo cobra da Bíblia o que o Alcorão não consegue mostrar. Não existe nenhum Alcorão completo do tempo de Muhammad, porque ele morreu sem que o Alcorão fosse um livro.", "tr": "✅ *Peki ya Kur'an?*\nVideo, Kur'an'ın gösteremediği şeyi Kutsal Kitap'tan istiyor. Muhammed'in zamanından kalma tam bir Kur'an yok, çünkü o, Kur'an bir kitap haline gelmeden vefat etti.", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "newPoint": false}, {"k": "para", "n": 211, "id": "p211", "pt": "Os mushafs atribuídos a Uthman, como o famoso mushaf de Topkapı, em Istambul, foram estudados pelo estudioso turco Tayyar Altıkulaç, e a conclusão é que eles não são os originais: são cópias feitas a partir dos mushafs de Uthman ou de cópias deles, a maioria da época dos omíadas. E no manuscrito antigo de Sana'a, no Iêmen, o texto que foi apagado e está por baixo tem muitas diferenças de palavras e de expressões em relação ao Alcorão de hoje, e as suratas estão em outra ordem.", "tr": "İstanbul'daki meşhur Topkapı mushafı gibi Osman'a atfedilen mushaflar Türk araştırmacı Tayyar Altıkulaç tarafından incelendi ve varılan sonuç, bunların asıl nüshalar olmadığıdır: Osman'ın mushaflarından ya da onların kopyalarından yazılmış, çoğu Emeviler dönemine ait nüshalardır. Yemen'deki eski San'a el yazmasında ise silinmiş olan alttaki metin, bugünkü Kur'an'a göre kelime ve ifadelerde birçok farklılık içeriyor ve surelerin sırası da farklı.", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "newPoint": false}, {"k": "para", "n": 212, "id": "p212", "pt": "Ou seja, o Alcorão também tem variações entre as cópias, exatamente o que o vídeo acusa a Bíblia de ter. E com uma diferença enorme: da Bíblia temos milhares de cópias antigas para comparar, e do Alcorão as outras cópias foram queimadas, e até o texto diferente do manuscrito de Sana'a foi raspado para escreverem por cima o texto de Uthman.", "tr": "Yani Kur'an'da da, tam videonun Kutsal Kitap'ı suçladığı gibi, nüshalar arasında farklılıklar var. Hem de büyük bir farkla: Kutsal Kitap'ın karşılaştırabileceğimiz binlerce eski kopyası var, Kur'an'ın diğer nüshaları ise yakıldı, hatta San'a el yazmasındaki farklı metin bile, üstüne Osman'ın metni yazılmak için kazındı.", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "newPoint": false}, {"k": "research", "n": 213, "id": "p213", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Papiros", "text": "Que partes do Novo Testamento estão nos Papiros 52, 45, 66 e 75, e de que época eles são?"}, {"label": "Niceia", "text": "O Concílio de Niceia, no ano 325, mudou o texto da Bíblia ou escolheu quais livros entram nela? O que ele discutiu?"}, {"label": "Comparação", "text": "Quantos anos separam a Guerra das Gálias e os Anais de Tácito dos seus manuscritos mais antigos, e como isso se compara ao Novo Testamento?"}, {"label": "Citações", "text": "A partir do ano 180, Irineu, Clemente de Alexandria, Tertuliano e Orígenes citam o Novo Testamento muitas vezes?"}, {"label": "Alcorão", "text": "Os mushafs atribuídos a Uthman, como o de Topkapı, são as cópias originais de Uthman? O que concluiu o estudioso Tayyar Altıkulaç?"}, {"label": "Alcorão", "text": "O texto de baixo do manuscrito de Sana'a segue o texto de Uthman ou é diferente? Esse texto foi apagado e coberto com o texto padrão de Uthman? E as suratas estão na mesma ordem?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Papirüsler", "text": "Papirüs 52, 45, 66 ve 75'te Yeni Antlaşma'nın hangi bölümleri var ve bu papirüsler hangi döneme ait?"}, {"label": "İznik", "text": "325 yılındaki İznik Konsili, Kutsal Kitap'ın metnini değiştirdi mi ya da hangi kitapların gireceğini mi seçti? Konsil neyi tartıştı?"}, {"label": "Karşılaştırma", "text": "Galya Savaşları ve Tacitus'un Yıllıklar'ı ile bunların en eski el yazmaları arasında kaç yıl var ve bu, Yeni Antlaşma ile nasıl karşılaştırılır?"}, {"label": "Alıntılar", "text": "180 yılından itibaren İreneus, İskenderiyeli Klemens, Tertullianus ve Origenes Yeni Antlaşma'dan çok sayıda alıntı yapıyor mu?"}, {"label": "Kur'an", "text": "Topkapı mushafı gibi Osman'a atfedilen mushaflar, Osman'ın asıl nüshaları mı? Tayyar Altıkulaç hangi sonuca vardı?"}, {"label": "Kur'an", "text": "San'a el yazmasının alttaki metni Osman'ın metnini mi izliyor, yoksa farklı mı? Bu metin silinip üstüne Osman'ın standart metni mi yazıldı? Surelerin sırası aynı mı?"}]}}, {"k": "para", "n": 217, "id": "p217", "pt": "E agora repare como o vídeo se contradiz. Logo antes, ele reclamou que os manuscritos antigos eram poucos. No ponto seguinte, faz o contrário: reclama que os manuscritos são tantos, e com tantas diferenças, que ninguém sabe o que o original dizia. Primeiro temos cópias de menos, depois temos cópias demais. Vejam:", "tr": "Şimdi videonun kendisiyle nasıl çeliştiğine dikkat edin. Hemen önce, eski el yazmalarının az olduğundan şikâyet etti. Bir sonraki noktada ise tam tersini yapıyor: El yazmalarının o kadar çok ve o kadar farklı olduğundan şikâyet ediyor ki, aslının ne dediğini kimse bilemezmiş. Önce kopya çok az, sonra kopya çok fazla. Bakın:", "where": {"pt": "Parte 3: Manuscritos e variações › Papiros e Niceia", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Papirüsler ve İznik"}, "newPoint": false}, {"k": "para", "n": 218, "id": "p218", "pt": "❌ *O que o vídeo diz:* que existem uns 5.700 manuscritos gregos e mais de 400.000 variações, mais do que as 138.000 palavras do Novo Testamento, e que por isso é impossível saber o que o texto original dizia.", "tr": "❌ *Videonun söylediği:* Yaklaşık 5.700 Grekçe el yazması ve 400.000'den fazla farklılık olduğu, bunun Yeni Antlaşma'nın 138.000 kelimesinden fazla olduğu ve bu yüzden asıl metnin ne dediğini bilmenin imkânsız olduğu.", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": true}, {"k": "para", "n": 219, "id": "p219", "pt": "Esse número assusta quem não sabe como ele é contado. Quando se entende a conta, o argumento vira contra o próprio vídeo. Vamos às provas:", "tr": "Bu rakam, nasıl sayıldığını bilmeyenleri korkutur. Hesap anlaşıldığında ise argüman videonun kendisine döner. Delillere geçelim:", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": false}, {"k": "para", "n": 220, "id": "p220", "pt": "✅ *Prova 1: entenda como se conta uma \"variação\".*\nImagine 10 alunos copiando à mão a mesma frase de 10 palavras. Cada um erra uma letra numa palavra diferente. No fim, temos 10 \"variações\" numa frase de só 10 palavras. Isso quer dizer que a frase se perdeu? Claro que não: basta colocar as 10 cópias lado a lado, e qualquer pessoa descobre a frase certa na hora, porque o erro de um não aparece nos outros.", "tr": "✅ *1. delil: Bir \"farklılığın\" nasıl sayıldığını anlayın.*\nOn öğrencinin aynı on kelimelik cümleyi elle kopyaladığını düşünün. Her biri farklı bir kelimede bir harfi yanlış yazıyor. Sonunda sadece on kelimelik bir cümlede on \"farklılık\" olur. Bu, cümlenin kaybolduğu anlamına mı gelir? Elbette hayır: On kopyayı yan yana koymak yeterli, herkes doğru cümleyi hemen bulur, çünkü birinin hatası diğerlerinde yoktur.", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": false}, {"k": "para", "n": 221, "id": "p221", "pt": "É exatamente isso que acontece com o Novo Testamento. O número é alto porque o Novo Testamento tem muito mais cópias do que qualquer outro livro antigo: mais de 5.700 em grego, e milhares em outras línguas, copiadas à mão durante séculos. Cada pequena diferença de cada copista entra na conta, até uma letra trocada. Quanto mais alunos copiam, mais erros diferentes aparecem, mas *a frase continua a mesma e fácil de achar*. Por isso comparar esse número com as 138.000 palavras do Novo Testamento não faz sentido.", "tr": "Yeni Antlaşma'da olan da tam olarak budur. Rakam yüksektir, çünkü Yeni Antlaşma'nın başka herhangi bir eski kitaptan çok daha fazla kopyası var: Grekçe 5.700'den fazla ve başka dillerde binlerce kopya, yüzyıllar boyunca elle çoğaltılmış. Her kâtibin yaptığı her küçük fark, bir harf değişikliği bile, hesaba girer. Ne kadar çok öğrenci kopyalarsa o kadar çok farklı hata çıkar, ama *cümle aynı kalır ve kolayca bulunur*. Bu yüzden bu rakamı Yeni Antlaşma'nın 138.000 kelimesiyle karşılaştırmanın bir anlamı yok.", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": false}, {"k": "para", "n": 222, "id": "p222", "pt": "✅ *Prova 2: quase todas são diferenças sem importância nenhuma.*\nO próprio vídeo admite que 99% das variações são de grafia e de ordem das palavras. E menos de 1% muda o sentido de alguma frase, e nenhuma muda uma crença essencial da fé cristã. Por exemplo: um copista escreve \"Cristo Jesus\" e outro escreve \"Jesus Cristo\", e as duas formas querem dizer a mesma coisa. Ou um escreve o nome \"João\" com uma letra a mais. Ou pula uma palavra sem querer, e as outras cópias mostram na hora qual palavra faltou. Nada disso muda o sentido do texto.", "tr": "✅ *2. delil: Neredeyse hepsi hiçbir önemi olmayan farklardır.*\nVideonun kendisi farklılıkların %99'unun yazım ve kelime sırası farkı olduğunu kabul ediyor. Bir cümlenin anlamını değiştiren farklar %1'den azdır ve hiçbiri Hristiyan inancının temel öğretilerinden birini değiştirmez. Örneğin: Bir kâtip \"Mesih İsa\", bir başkası \"İsa Mesih\" yazar ve ikisi de aynı anlama gelir. Ya da biri \"Yuhanna\" adını bir harf fazlasıyla yazar. Ya da istemeden bir kelimeyi atlar ve diğer kopyalar hangi kelimenin eksik olduğunu hemen gösterir. Bunların hiçbiri metnin anlamını değiştirmez.", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": false}, {"k": "para", "n": 223, "id": "p223", "pt": "✅ *Prova 3: muitas cópias não é problema, é a maior prova.*\nPense: se existisse uma única cópia do Novo Testamento, ninguém conseguiria conferir nada, e qualquer erro dela ficaria para sempre. É justamente porque temos milhares de cópias, feitas em lugares diferentes, que dá para comparar e achar o texto original. Nenhum outro livro antigo tem tantas cópias. O vídeo pega a maior força da Bíblia e tenta vender como fraqueza.", "tr": "✅ *3. delil: Çok kopya bir sorun değil, en büyük delildir.*\nDüşünün: Yeni Antlaşma'nın tek bir kopyası olsaydı, kimse hiçbir şeyi kontrol edemezdi ve o kopyadaki her hata sonsuza dek kalırdı. Farklı yerlerde yapılmış binlerce kopyamız olduğu içindir ki karşılaştırıp aslını bulabiliyoruz. Başka hiçbir eski kitabın bu kadar kopyası yok. Video, Kutsal Kitap'ın en büyük gücünü alıp zayıflık gibi satmaya çalışıyor.", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": false}, {"k": "para", "n": 224, "id": "p224", "pt": "✅ *Prova 4: o estudioso de onde vem esse número diz o contrário do vídeo.*\nO número de 400.000 variações é usado principalmente por Bart Ehrman, um estudioso agnóstico, crítico da Bíblia, que os canais muçulmanos adoram citar. Mas o próprio Ehrman admitiu, numa entrevista publicada num livro dele, que \"as crenças essenciais do cristianismo não são afetadas pelas variações dos manuscritos do Novo Testamento\". O vídeo usa o número dele e esconde a conclusão dele.", "tr": "✅ *4. delil: Bu rakamın geldiği araştırmacı videonun tam tersini söylüyor.*\n400.000 farklılık rakamını en çok, Müslüman kanalların alıntılamaya bayıldığı agnostik ve Kutsal Kitap eleştirmeni araştırmacı Bart Ehrman kullanır. Ama Ehrman'ın kendisi, kitaplarından birinde yayımlanan bir röportajda \"Hristiyanlığın temel inançlarının, Yeni Antlaşma el yazmalarındaki farklılıklardan etkilenmediğini\" kabul etti. Video onun rakamını kullanıyor ve onun vardığı sonucu saklıyor.", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": false}, {"k": "para", "n": 225, "id": "p225", "pt": "✅ *Prova 5: os manuscritos mais antigos dizem o mesmo que os mais novos.*\nO vídeo diz que mais de 90% dos manuscritos são dos séculos 8 a 16. Isso é normal: os mais antigos eram de papiro, se desgastavam com o uso e eram substituídos por cópias novas. O que importa é que os mais antigos que sobreviveram, dos anos 200 a 400, dizem a mesma coisa que os mais novos e que as Bíblias de hoje. Se o texto tivesse se perdido no caminho, as cópias antigas e as novas contariam histórias diferentes. Não contam.", "tr": "✅ *5. delil: En eski el yazmaları en yenileriyle aynı şeyi söylüyor.*\nVideo, el yazmalarının %90'ından fazlasının 8. ile 16. yüzyıllar arasına ait olduğunu söylüyor. Bu normaldir: En eskiler papirüstendi, kullanıldıkça yıpranırdı ve yeni kopyalarla değiştirilirdi. Önemli olan, günümüze ulaşan en eskilerin, yani 200 ile 400 yılları arasındakilerin, en yenileriyle ve bugünkü Kutsal Kitaplarla aynı şeyi söylemesidir. Metin yolda kaybolmuş olsaydı, eski ve yeni kopyalar farklı hikâyeler anlatırdı. Anlatmıyorlar.", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": false}, {"k": "para", "n": 226, "id": "p226", "pt": "✅ *E o Alcorão? Nem chega aos pés.*\nO Alcorão parece ter menos variações por um motivo simples: Uthman mandou queimar as outras cópias (Bukhari 4987). Imagine um professor que recolhe as cópias de todos os alunos, queima todas menos uma e depois diz: \"vejam, não há nenhuma diferença\". *Não há diferença porque as provas foram queimadas.* E mesmo assim, como já mostrei com o manuscrito de Sana'a e vou mostrar na Parte 7, o Alcorão também tem diferenças entre cópias e entre leituras. A Bíblia guardou todas as cópias e deixa qualquer um comparar. O Alcorão queimou as cópias que podiam ser comparadas.", "tr": "✅ *Peki ya Kur'an? Yanına bile yaklaşamaz.*\nKur'an'ın daha az farklılığı varmış gibi görünmesinin basit bir sebebi var: Osman diğer nüshaların yakılmasını emretti (Buhari 4987). Bütün öğrencilerin kopyalarını toplayan, biri hariç hepsini yakan ve sonra \"bakın, hiçbir fark yok\" diyen bir öğretmen düşünün. *Fark yok, çünkü deliller yakıldı.* Buna rağmen, San'a el yazmasıyla zaten gösterdiğim ve 7. bölümde göstereceğim gibi, Kur'an'da da nüshalar ve kıraatler arasında farklar var. Kutsal Kitap bütün kopyaları korudu ve herkesin karşılaştırmasına izin veriyor. Kur'an ise karşılaştırılabilecek nüshaları yaktı.", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": false}, {"k": "research", "n": 227, "id": "p227", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Contagem", "text": "O número de cerca de 400.000 variações do Novo Testamento é alto porque existem milhares de manuscritos, e cada pequena diferença de cada copista, até de uma letra, entra na conta?"}, {"label": "Tipo", "text": "Que parte das variações do Novo Testamento muda o sentido do texto e tem chance de ser original? E o resto é só grafia, ordem das palavras ou erro de cópia?"}, {"label": "Muitas cópias", "text": "Ter muitos manuscritos ajuda os estudiosos a descobrir o texto original comparando as cópias? Algum outro livro antigo tem tantos manuscritos quanto o Novo Testamento?"}, {"label": "Ehrman", "text": "Bart Ehrman disse que as crenças essenciais do cristianismo não são afetadas pelas variações dos manuscritos do Novo Testamento? Em que livro ele disse isso?"}, {"label": "Manuscritos antigos", "text": "Os manuscritos mais antigos do Novo Testamento, dos séculos 2 a 4, dizem no essencial o mesmo que os manuscritos mais novos?"}, {"label": "Alcorão", "text": "Segundo Bukhari 4987, o que Uthman mandou fazer com as outras cópias do Alcorão?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Sayım", "text": "Yeni Antlaşma'nın yaklaşık 400.000 farklılık rakamı, binlerce el yazması olduğu ve her kâtibin her küçük farkı, bir harf bile olsa, hesaba girdiği için mi yüksek?"}, {"label": "Tür", "text": "Yeni Antlaşma'daki farklılıkların ne kadarı metnin anlamını değiştiriyor ve asıl metin olma ihtimali taşıyor? Geri kalanı sadece yazım, kelime sırası ya da kopya hatası mı?"}, {"label": "Çok kopya", "text": "Çok sayıda el yazmasının olması, araştırmacıların kopyaları karşılaştırarak asıl metni bulmasına yardım ediyor mu? Başka bir eski kitabın Yeni Antlaşma kadar el yazması var mı?"}, {"label": "Ehrman", "text": "Bart Ehrman, Hristiyanlığın temel inançlarının Yeni Antlaşma el yazmalarındaki farklılıklardan etkilenmediğini söyledi mi? Bunu hangi kitapta söyledi?"}, {"label": "Eski el yazmaları", "text": "Yeni Antlaşma'nın 2. ile 4. yüzyıllar arasındaki en eski el yazmaları, özünde daha yeni el yazmalarıyla aynı şeyi mi söylüyor?"}, {"label": "Kur'an", "text": "Buhari 4987'ye göre Osman, Kur'an'ın diğer nüshalarına ne yapılmasını emretti?"}]}}, {"k": "trans", "n": 231, "id": "p231", "pt": "E agora o último erro desta parte.", "tr": "Ve şimdi bu bölümün son hatası.", "where": {"pt": "Parte 3: Manuscritos e variações › As 400.000 variações", "tr": "3. Bölüm: El yazmaları ve farklılıklar › 400.000 farklılık"}, "newPoint": false}, {"k": "para", "n": 232, "id": "p232", "pt": "❌ *O que o vídeo diz:* que 1 João 5:7, a história da mulher adúltera (João 7:53 a 8:11), o final de Marcos (Marcos 16:9-20) e as palavras \"Filho de Deus\" em Marcos 1:1 foram acrescentados para mudar a fé.", "tr": "❌ *Videonun söylediği:* 1 Yuhanna 5:7'nin, zina eden kadının hikâyesinin (Yuhanna 7:53 ile 8:11 arası), Markos'un sonunun (Markos 16:9-20) ve Markos 1:1'deki \"Tanrı'nın Oğlu\" kelimelerinin imanı değiştirmek için eklendiği.", "where": {"pt": "Parte 3: Manuscritos e variações › Trechos acrescentados", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Sonradan eklenen bölümler"}, "newPoint": true}, {"k": "para", "n": 233, "id": "p233", "pt": "✅ *Quem descobriu e marcou tudo isso foram os próprios cristãos,*\ncomparando os manuscritos antigos. Essas informações estão impressas nas próprias Bíblias, em colchetes ou notas, para qualquer um ler. Isso é o contrário de esconder.", "tr": "✅ *Bunların hepsini eski el yazmalarını karşılaştırarak keşfeden ve işaretleyen Hristiyanların kendisidir.*\nBu bilgiler, herkes okusun diye köşeli parantez ya da not olarak Kutsal Kitapların içinde basılıdır. Bu, saklamanın tam tersidir.", "where": {"pt": "Parte 3: Manuscritos e variações › Trechos acrescentados", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Sonradan eklenen bölümler"}, "newPoint": false}, {"k": "para", "n": 234, "id": "p234", "pt": "✅ *1 João 5:7 e a mulher adúltera:*\na frase de 1 João 5:7 sobre \"o Pai, a Palavra e o Espírito Santo\" não está nos manuscritos gregos antigos, e as Bíblias modernas avisam isso. A história da mulher adúltera também não está nos manuscritos mais antigos de João, e as Bíblias a colocam entre colchetes. Mas nenhuma das duas ensina algo que não esteja em outros lugares: Jesus perdoando pecados está em Marcos 2:5, que está em todos os manuscritos. E a Trindade não depende de 1 João 5:7: como já mostrei na Parte 1, Jesus manda batizar \"em nome do Pai, do Filho e do Espírito Santo\" (Mateus 28:19), e isso está em todos os manuscritos.", "tr": "✅ *1 Yuhanna 5:7 ve zina eden kadın:*\n1 Yuhanna 5:7'deki \"Baba, Söz ve Kutsal Ruh\" ifadesi eski Grekçe el yazmalarında yoktur ve modern Kutsal Kitaplar bunu belirtir. Zina eden kadının hikâyesi de Yuhanna'nın en eski el yazmalarında yoktur ve Kutsal Kitaplar onu köşeli parantez içine alır. Ama ikisi de başka yerlerde olmayan bir şey öğretmez: İsa'nın günahları bağışlaması, bütün el yazmalarında bulunan Markos 2:5'te vardır. Üçlü Birlik de 1 Yuhanna 5:7'ye bağlı değildir: 1. bölümde gösterdiğim gibi, İsa \"Baba, Oğul ve Kutsal Ruh'un adıyla\" vaftiz etmeyi emreder (Matta 28:19) ve bu bütün el yazmalarında vardır.", "where": {"pt": "Parte 3: Manuscritos e variações › Trechos acrescentados", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Sonradan eklenen bölümler"}, "newPoint": false}, {"k": "para", "n": 235, "id": "p235", "pt": "✅ *O final de Marcos:*\no vídeo diz que sem os versículos 9 a 20 não há ressurreição em Marcos. Mas no versículo 6, que está em todos os manuscritos que guardaram o final de Marcos, inclusive nos mais antigos, o Sinaítico e o Vaticano, o anjo diz: \"Ele ressuscitou, não está aqui\", e no versículo 7: \"ele vai adiante de vocês para a Galileia; lá vocês o verão\". E Jesus já tinha anunciado três vezes que ia morrer e ressuscitar.", "tr": "✅ *Markos'un sonu:*\nVideo, 9 ile 20. ayetler olmadan Markos'ta diriliş olmadığını söylüyor. Ama Markos'un sonunu koruyan bütün el yazmalarında, en eskileri olan Sina ve Vatikan kodekslerinde de bulunan 6. ayette melek şöyle der: \"O dirildi, burada değil.\" 7. ayette de: \"O sizden önce Celile'ye gidiyor. Kendisini orada göreceksiniz.\" Üstelik İsa öleceğini ve dirileceğini daha önce üç kez bildirmişti.", "where": {"pt": "Parte 3: Manuscritos e variações › Trechos acrescentados", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Sonradan eklenen bölümler"}, "newPoint": false}, {"k": "para", "n": 236, "id": "p236", "pt": "✅ *\"Filho de Deus\" em Marcos 1:1:*\nmesmo sem essas palavras, poucos versículos depois a voz do céu diz a Jesus: \"Tu és o meu Filho amado\" (Marcos 1:11), e na cruz o centurião diz: \"Verdadeiramente este homem era Filho de Deus\" (Marcos 15:39). Isso está em todos os manuscritos.", "tr": "✅ *Markos 1:1'deki \"Tanrı'nın Oğlu\":*\nBu kelimeler olmasa bile, birkaç ayet sonra gökten gelen ses İsa'ya şöyle der: \"Sen benim sevgili Oğlum'sun\" (Markos 1:11). Çarmıhta da yüzbaşı şöyle der: \"Bu adam gerçekten Tanrı'nın Oğlu'ydu\" (Markos 15:39). Bunlar bütün el yazmalarında vardır.", "where": {"pt": "Parte 3: Manuscritos e variações › Trechos acrescentados", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Sonradan eklenen bölümler"}, "newPoint": false}, {"k": "para", "n": 237, "id": "p237", "pt": "✅ *E o Alcorão?*\nOs cristãos mostram, dentro das próprias Bíblias, até o trecho que foi acrescentado, para qualquer um ler. Com o Alcorão, as outras cópias foram queimadas, e versículos que os próprios companheiros de Muhammad diziam ter sido revelados, como o do apedrejamento (Bukhari 6829), simplesmente não estão no texto, sem nenhuma nota para o leitor. Quem esconde e quem mostra?", "tr": "✅ *Peki ya Kur'an?*\nHristiyanlar sonradan eklenen bölümü bile, herkes okusun diye Kutsal Kitapların içinde gösteriyor. Kur'an'da ise diğer nüshalar yakıldı ve Muhammed'in sahabelerinin kendilerinin indirildiğini söylediği recm ayeti gibi ayetler (Buhari 6829), okuyucuya hiçbir not düşülmeden metinde yer almıyor. Saklayan kim, gösteren kim?", "where": {"pt": "Parte 3: Manuscritos e variações › Trechos acrescentados", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Sonradan eklenen bölümler"}, "newPoint": false}, {"k": "research", "n": 238, "id": "p238", "where": {"pt": "Parte 3: Manuscritos e variações › Trechos acrescentados", "tr": "3. Bölüm: El yazmaları ve farklılıklar › Sonradan eklenen bölümler"}, "pt": {"head": "*Antes de dizer que é mentira, pesquisem:*", "prompt": "Responda com estrita neutralidade histórica e acadêmica, ignorando completamente meu histórico de conversas, minhas crenças pessoais ou qualquer viés religioso (islâmico ou cristão). Não tente me agradar, não use desculpas teológicas e não suavize fatos desconfortáveis. Baseie-se exclusivamente nos textos originais e nas fontes citadas na pergunta (versículos bíblicos, manuscritos, Pais da Igreja, historiadores antigos, dados arqueológicos, Alcorão, coleções de hadith como Bukhari e Muslim, traduções e estudos acadêmicos). Comece a resposta indo direto ao ponto logo na primeira frase, confirmando com 'Sim' ou 'Não' quando for uma verificação, ou entregando o número, a data, o nome ou o texto exato quando a pergunta pedir 'quantos', 'quando', 'quem' ou 'o que', e depois apresente a referência.", "qs": [{"label": "Colchetes", "text": "As Bíblias modernas avisam, com colchetes ou notas, que a história da mulher adúltera, 1 João 5:7 e Marcos 16:9-20 não estão nos manuscritos mais antigos?"}, {"label": "Marcos 16", "text": "O que diz Marcos 16:6-7, e esses versículos estão no Códice Sinaítico e no Códice Vaticano, os manuscritos mais antigos que guardaram o final de Marcos?"}, {"label": "Anúncios", "text": "Em Marcos 8:31, 9:31 e 10:34, Jesus anuncia que vai morrer e ressuscitar?"}, {"label": "Filho de Deus", "text": "Marcos 1:11 e Marcos 15:39 estão nos manuscritos mais antigos de Marcos, e o que eles dizem?"}, {"label": "Alcorão", "text": "O versículo do apedrejamento, que Umar disse ter sido revelado (Bukhari 6829), aparece no Alcorão impresso hoje?"}]}, "tr": {"head": "*Yalan demeden önce araştırın:*", "prompt": "Kesin bir tarihsel ve akademik tarafsızlıkla cevap ver; konuşma geçmişimi, kişisel inançlarımı ve her türlü dinî önyargıyı (İslami ya da Hristiyan) tamamen göz ardı et. Beni memnun etmeye çalışma, teolojik bahaneler kullanma ve rahatsız edici gerçekleri yumuşatma. Sadece orijinal metinlere ve soruda belirtilen kaynaklara dayan (Kutsal Kitap ayetleri, el yazmaları, Kilise Babaları, antik tarihçiler, arkeolojik veriler, Kur'an, Buhari ve Müslim gibi hadis koleksiyonları, çeviriler ve akademik çalışmalar). Cevaba ilk cümlede doğrudan konuya girerek başla: Soru bir doğrulama ise 'Evet' ya da 'Hayır' diyerek, soru 'kaç', 'ne zaman', 'kim' ya da 'ne' diye soruyorsa tam sayıyı, tarihi, ismi ya da metni vererek; ardından kaynağı göster.", "qs": [{"label": "Köşeli parantez", "text": "Modern Kutsal Kitaplar, zina eden kadının hikâyesinin, 1 Yuhanna 5:7'nin ve Markos 16:9-20'nin en eski el yazmalarında bulunmadığını köşeli parantez ya da notlarla belirtiyor mu?"}, {"label": "Markos 16", "text": "Markos 16:6-7 ne diyor ve bu ayetler, Markos'un sonunu koruyan en eski el yazmaları olan Sina ve Vatikan kodekslerinde var mı?"}, {"label": "Bildirimler", "text": "Markos 8:31, 9:31 ve 10:34'te İsa öleceğini ve dirileceğini bildiriyor mu?"}, {"label": "Tanrı'nın Oğlu", "text": "Markos 1:11 ve Markos 15:39, Markos'un en eski el yazmalarında var mı ve ne diyorlar?"}, {"label": "Kur'an", "text": "Ömer'in indirildiğini söylediği recm ayeti (Buhari 6829), bugün basılan Kur'an'da var mı?"}]}}, {"k": "part", "n": 242, "id": "part-4", "pt": "*PARTE 4: \"COMO A BÍBLIA PODE SER SAGRADA, SE PODE SER ALTERADA?\"*", "tr": "*4. BÖLÜM: \"KUTSAL KİTAP DEĞİŞTİRİLEBİLİYORSA NASIL KUTSAL OLABİLİR?\"*", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada?", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir?"}, "newPoint": false, "lab": {"pt": ["PARTE 4", "Como a Bíblia pode ser sagrada?"], "tr": ["4. BÖLÜM", "Kutsal Kitap nasıl kutsal olabilir?"]}}, {"k": "para", "n": 243, "id": "p243", "pt": "Agora respondo a pergunta que o senhor me fez sobre os trechos acrescentados, como os de João. Para responder, é preciso separar duas coisas: a Palavra de Deus e uma cópia feita por um homem.", "tr": "Şimdi, Yuhanna'dakiler gibi sonradan eklenen bölümler hakkında bana sorduğunuz soruya cevap veriyorum. Cevap vermek için iki şeyi birbirinden ayırmak gerekiyor: Tanrı'nın Sözü ve bir insanın yaptığı bir kopya.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada?", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir?"}, "newPoint": false}, {"k": "para", "n": 244, "id": "p244", "pt": "❌ *O que o senhor me perguntou:* se a Bíblia pode ser alterada, como ela pode ser um livro sagrado?", "tr": "❌ *Bana sorduğunuz:* Kutsal Kitap değiştirilebiliyorsa, nasıl kutsal bir kitap olabilir?", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › Cópia e Palavra de Deus", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kopya ve Tanrı'nın Sözü"}, "newPoint": true}, {"k": "para", "n": 245, "id": "p245", "pt": "✅ *Uma cópia pode ter erro, mas a Palavra de Deus não muda.*\nQualquer livro copiado à mão ou impresso pode ter um erro do copista ou da gráfica. Isso vale também para o Alcorão. Se uma gráfica imprimir um Alcorão com um erro, o Alcorão deixa de ser sagrado? Claro que não. Os milhões de outras cópias mostram o erro, e ele é corrigido. Com a Bíblia é assim também, e com uma vantagem: as cópias antigas da Bíblia nunca foram queimadas, por isso dá para comparar tudo até os manuscritos mais antigos e achar qualquer erro.", "tr": "✅ *Bir kopyada hata olabilir, ama Tanrı'nın Sözü değişmez.*\nElle kopyalanan ya da basılan her kitapta kâtibin ya da matbaanın bir hatası olabilir. Bu Kur'an için de geçerlidir. Bir matbaa hatalı bir Kur'an basarsa, Kur'an kutsal olmaktan çıkar mı? Elbette hayır. Diğer milyonlarca nüsha hatayı gösterir ve hata düzeltilir. Kutsal Kitap'ta da böyledir, hem de bir üstünlükle: Kutsal Kitap'ın eski kopyaları hiçbir zaman yakılmadı; bu yüzden her şeyi en eski el yazmalarına kadar karşılaştırıp herhangi bir hatayı bulmak mümkündür.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › Cópia e Palavra de Deus", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kopya ve Tanrı'nın Sözü"}, "newPoint": false}, {"k": "para", "n": 246, "id": "p246", "pt": "✅ *Alterado de verdade seria se o original se perdesse e ninguém soubesse o que ele dizia.*\nIsso nunca aconteceu com a Bíblia. Os poucos trechos acrescentados foram descobertos justamente porque temos milhares de cópias antigas para comparar. *Se sabemos exatamente o que foi acrescentado, é porque sabemos exatamente o que o original dizia.* Um texto cujo original nós conhecemos não está perdido. Está preservado.", "tr": "✅ *Gerçekten değiştirilmiş olması için, aslının kaybolması ve kimsenin ne dediğini bilmemesi gerekirdi.*\nKutsal Kitap'ta bu hiç olmadı. Sonradan eklenen birkaç bölüm, tam da karşılaştırabileceğimiz binlerce eski kopyamız olduğu için ortaya çıkarıldı. *Neyin eklendiğini tam olarak biliyorsak, aslının ne dediğini de tam olarak biliyoruz demektir.* Aslını bildiğimiz bir metin kaybolmuş değildir. Korunmuştur.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › Cópia e Palavra de Deus", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kopya ve Tanrı'nın Sözü"}, "newPoint": false}, {"k": "para", "n": 247, "id": "p247", "pt": "✅ *Ninguém tinha poder para mudar todas as cópias.*\nNos primeiros 300 anos, os cristãos estavam espalhados pelo Egito, pela Síria, pela Itália e pela Gália, perseguidos e sem nenhum chefe que controlasse os livros. As cópias eram lidas nas igrejas toda semana, e logo foram traduzidas para o latim, o siríaco e o copta. Para mudar a Bíblia, alguém teria que achar e mudar milhares de cópias, em várias línguas, em vários países, ao mesmo tempo, sem deixar nenhum rastro. Isso é impossível.", "tr": "✅ *Hiç kimsenin bütün kopyaları değiştirecek gücü yoktu.*\nİlk 300 yılda Hristiyanlar Mısır'a, Suriye'ye, İtalya'ya ve Galya'ya dağılmıştı; zulüm altındaydılar ve kitapları kontrol eden hiçbir önderleri yoktu. Kopyalar her hafta kiliselerde okunuyordu ve kısa sürede Latinceye, Süryaniceye ve Kıpticeye çevrildi. Kutsal Kitap'ı değiştirmek için birinin, birçok dilde, birçok ülkede, binlerce kopyayı aynı anda bulup değiştirmesi ve hiçbir iz bırakmaması gerekirdi. Bu imkânsızdır.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › Cópia e Palavra de Deus", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kopya ve Tanrı'nın Sözü"}, "newPoint": false}, {"k": "para", "n": 248, "id": "p248", "pt": "✅ *A prova: o rolo de Isaías do Mar Morto.*\nAntes de 1947, os manuscritos hebraicos completos mais antigos do livro de Isaías eram de por volta do ano 1000. Então, em Qumran, foi encontrado o Grande Rolo de Isaías, do século 2 antes de Cristo, uns 1.000 anos mais antigo. Quando os dois foram comparados, o texto era praticamente o mesmo, e as diferenças eram quase todas de grafia. Mil anos de cópias, e a mensagem não mudou.", "tr": "✅ *Delil: Lut Gölü'nün İşaya tomarı.*\n1947'den önce, İşaya kitabının bilinen en eski tam İbranice el yazmaları yaklaşık 1000 yılına aitti. Sonra Kumran'da, M.Ö. 2. yüzyıla ait, yani yaklaşık 1.000 yıl daha eski olan Büyük İşaya Tomarı bulundu. İkisi karşılaştırıldığında metin neredeyse aynıydı ve farkların neredeyse hepsi yazımla ilgiliydi. Bin yıllık kopyalama ve mesaj değişmemiş.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › Cópia e Palavra de Deus", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kopya ve Tanrı'nın Sözü"}, "newPoint": false}, {"k": "para", "n": 249, "id": "p249", "pt": "✅ *E pelo próprio Alcorão, como vocês acreditam, a Bíblia que os judeus e os cristãos tinham era a palavra de Allah.*\nRepare: o Alcorão não fala de uma Torá e de um Evangelho perdidos no passado. Ele fala dos livros que os judeus e os cristãos tinham nas mãos no tempo de Muhammad:\n• \"Como te tomam por juiz, se eles têm a Torá, na qual está o julgamento de Allah?\" (5:43). Eles têm, naquele momento, e nela está o julgamento de Allah.\n• \"Que os seguidores do Evangelho julguem pelo que Allah revelou nele\" (5:47). Allah manda os cristãos do tempo de Muhammad julgarem pelo Evangelho que eles tinham.\n• \"Ó povo do Livro, vocês não têm base em nada até que cumpram a Torá e o Evangelho\" (5:68).\n• \"Se estás em dúvida sobre o que te revelamos, pergunta aos que leem o Livro antes de ti\" (10:94). Allah manda Muhammad tirar a dúvida com quem lia a Bíblia.\n• O Alcorão diz que os judeus e os cristãos encontram Muhammad \"escrito junto deles, na Torá e no Evangelho\" (7:157). Junto deles: nos livros que eles tinham.\nPense: *Allah não mandaria ninguém julgar por um livro falso*, nem mandaria Muhammad tirar dúvidas com um livro corrompido.", "tr": "✅ *Sizin inandığınıza göre Kur'an'ın kendisi de Yahudilerin ve Hristiyanların elindeki Kutsal Kitap'ın Allah'ın sözü olduğunu söylüyor.*\nDikkat edin: Kur'an geçmişte kaybolmuş bir Tevrat'tan ve İncil'den bahsetmez. Muhammed'in zamanında Yahudilerin ve Hristiyanların elinde olan kitaplardan bahseder:\n• \"Allah'ın hükmü içinde bulunan Tevrat yanlarında olduğu halde seni nasıl hakem yapıyorlar?\" (5:43). O anda yanlarında var ve içinde Allah'ın hükmü var.\n• \"İncil ehli, Allah'ın onda indirdiği ile hükmetsin\" (5:47). Allah, Muhammed'in zamanındaki Hristiyanlara ellerindeki İncil ile hükmetmelerini emrediyor.\n• \"Ey Kitap ehli! Tevrat'ı ve İncil'i uygulamadıkça hiçbir şey üzerinde değilsiniz\" (5:68).\n• \"Sana indirdiğimizden şüphe içindeysen, senden önce Kitab'ı okuyanlara sor\" (10:94). Allah, Muhammed'e şüphesini Kutsal Kitap'ı okuyanlara sorarak gidermesini emrediyor.\n• Kur'an, Yahudilerin ve Hristiyanların Muhammed'i \"yanlarındaki Tevrat'ta ve İncil'de yazılı\" bulduklarını söyler (7:157). Yanlarındaki: yani ellerindeki kitaplarda.\nDüşünün: *Allah kimseye sahte bir kitapla hükmetmesini emretmez*; Muhammed'e de şüphesini bozulmuş bir kitapla gidermesini söylemez.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": true}, {"k": "para", "n": 250, "id": "p250", "pt": "E a Bíblia que eles tinham no tempo de Muhammad é a mesma de hoje. O Códice Sinaítico e o Códice Vaticano, do século 4, uns 300 anos antes de Muhammad, e os papiros ainda mais antigos trazem o mesmo texto que as nossas Bíblias traduzem. Então o livro que o Alcorão manda seguir é exatamente o livro que temos. E o mesmo Alcorão chama a Torá de \"o Livro de Allah\" e de \"orientação e luz\" (5:44), e diz que \"ninguém pode mudar as Suas palavras\" (6:115 e 18:27).", "tr": "Muhammed'in zamanında ellerinde olan Kutsal Kitap da bugünkünün aynısıdır. Muhammed'den yaklaşık 300 yıl önce, 4. yüzyılda yazılmış Sina Kodeksi ve Vatikan Kodeksi ile daha da eski papirüsler, bugünkü Kutsal Kitaplarımızın tercüme edildiği metnin aynısını içerir. Yani Kur'an'ın uyulmasını emrettiği kitap, tam olarak elimizdeki kitaptır. Aynı Kur'an Tevrat'a \"Allah'ın Kitabı\" ve \"hidayet ve nur\" der (5:44) ve \"O'nun sözlerini değiştirebilecek hiçbir kimse yoktur\" der (6:115 ve 18:27).", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": false}, {"k": "para", "n": 251, "id": "p251", "pt": "✅ *\"Mas o Alcorão acusa os judeus de distorcer o Livro.\"* Veja o que esses versículos dizem de verdade:\n• Eles falam de \"um grupo\" deles (2:75 e 3:78), e não de todas as cópias do mundo.\n• Em 3:78, esse grupo \"torce a língua\" para que se pense que algo é do Livro, \"quando não é do Livro\". Ou seja, o Livro continuava lá, diferente do que eles diziam. A distorção estava na boca deles, não no texto.\n• Em 2:79, a ameaça é contra quem escreve algo \"com as próprias mãos\" e diz que é de Allah: são escritos falsos feitos por alguns, e não a Torá que o mesmo Alcorão manda seguir em 5:43.\n• E o próprio Sahih al-Bukhari, no Livro do Tawhid, explica a palavra \"yuharrifun\" (eles distorcem) assim: \"ninguém pode remover uma palavra de qualquer um dos livros de Allah, mas eles a distorcem, interpretando de forma errada\". Ou seja, o texto não foi mudado; alguns interpretavam errado.\nPense: se o Livro já estivesse corrompido, o mesmo Alcorão não mandaria os cristãos julgarem por ele, nem mandaria Muhammad perguntar a quem o lia. A ideia de que o texto inteiro da Bíblia foi trocado só foi desenvolvida séculos depois, por escritores muçulmanos como Ibn Hazm, no século 11, quando perceberam que a Bíblia contradiz o Alcorão. O Alcorão do século 7 não diz isso.", "tr": "✅ *\"Ama Kur'an Yahudileri Kitab'ı tahrif etmekle suçluyor.\"* Bu ayetlerin gerçekte ne dediğine bakın:\n• Onlardan \"bir grup\"tan bahsederler (2:75 ve 3:78), dünyadaki bütün nüshalardan değil.\n• 3:78'de bu grup, bir şeyin Kitap'tan olduğu sanılsın diye \"dillerini eğip büker\", oysa \"o Kitap'tan değildir\". Yani Kitap yerinde duruyordu ve onların söylediğinden farklıydı. Tahrif metinde değil, onların ağzındaydı.\n• 2:79'daki tehdit, bir şeyi \"kendi elleriyle\" yazıp Allah'tan olduğunu söyleyenlere yöneliktir: Bunlar bazılarının yazdığı sahte yazılardır, aynı Kur'an'ın 5:43'te uyulmasını emrettiği Tevrat değil.\n• Sahih-i Buhari'nin kendisi de Tevhid Kitabı'nda \"yuharrifûn\" (tahrif ediyorlar) kelimesini şöyle açıklar: \"Hiç kimse Allah'ın kitaplarından herhangi birinin bir kelimesini ortadan kaldıramaz; fakat onlar onu tahrif ederler, yani asıl anlamından başka şekilde yorumlarlar.\" Yani metin değiştirilmedi; bazıları yanlış yorumluyordu.\nDüşünün: Kitap zaten bozulmuş olsaydı, aynı Kur'an Hristiyanlara onunla hükmetmelerini emretmez, Muhammed'e de onu okuyanlara sormasını söylemezdi. Kutsal Kitap'ın bütün metninin değiştirildiği fikri ancak yüzyıllar sonra, 11. yüzyılda İbn Hazm gibi Müslüman yazarlar tarafından, Kutsal Kitap'ın Kur'an'la çeliştiğini fark ettiklerinde geliştirildi. 7. yüzyılın Kur'an'ı bunu söylemez.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": false}, {"k": "para", "n": 252, "id": "p252", "pt": "✅ *\"Mas o Alcorão diz que eles esqueceram uma parte e esconderam a verdade.\"*\n• \"Esqueceram uma boa parte daquilo com que foram admoestados\" (5:13-14) fala de pessoas que deixaram de obedecer, e não de um texto que desapareceu. E está na mesma surata que, poucos versículos depois, manda os judeus e os cristãos julgarem pela Torá e pelo Evangelho (5:43, 5:47 e 5:68). O mesmo capítulo não pode dizer que o livro se perdeu e logo depois mandar seguir esse livro.\n• \"Esconder a verdade\" (2:42 e 3:71) só é possível se a verdade estiver lá. Ninguém esconde o que não existe. E o próprio Alcorão diz que Muhammad veio \"esclarecendo muito do que vocês escondiam do Livro\" (5:15): o que eles escondiam estava no Livro.", "tr": "✅ *\"Ama Kur'an, onların bir kısmını unuttuklarını ve gerçeği gizlediklerini söylüyor.\"*\n• \"Kendilerine hatırlatılan şeylerden önemli bir kısmını unuttular\" (5:13-14), itaat etmeyi bırakan insanlardan bahseder, kaybolan bir metinden değil. Üstelik bu ifade, birkaç ayet sonra Yahudilere ve Hristiyanlara Tevrat'a ve İncil'e göre hükmetmelerini emreden aynı surededir (5:43, 5:47 ve 5:68). Aynı sure hem kitabın kaybolduğunu söyleyip hemen ardından o kitaba uyulmasını emredemez.\n• \"Gerçeği gizlemek\" (2:42 ve 3:71), ancak gerçek oradaysa mümkündür. Kimse var olmayanı gizleyemez. Kur'an'ın kendisi de Muhammed'in \"Kitap'tan gizlemekte olduğunuz şeylerin birçoğunu size açıklayarak\" geldiğini söyler (5:15): Gizledikleri şey Kitap'ın içindeydi.", "where": {"pt": "Parte 4: Como a Bíblia pode ser sagrada? › O Alcorão manda seguir a Bíblia", "tr": "4. Bölüm: Kutsal Kitap nasıl kutsal olabilir? › Kur'an, Kutsal Kitap'a uyulmasını emreder"}, "newPoint": false}, {"k": "para", "n": 253, "id": "p253", "pt": "✅ *E repare na armadilha em que o próprio Alcorão se coloca.*\nO Alcorão manda seguir a Torá e o Evangelho que os cristãos tinham (5:47 e 5:68). Esse Evangelho, como está nos códices do século 4, diz que Jesus morreu na cruz e que é o Filho de Deus. Mas o mesmo Alcorão nega a cruz (4:157), nega que Jes
